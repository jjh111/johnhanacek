    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@200;300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ── Palette: ALIASES ONLY, never restated values ─────────────────
           This page owns no colors. Every name below points at a token in
           jh-chrome.css, so a palette change reaches this page for free and
           cannot leave a frozen copy behind.

           It used to restate all 22 of them, plus a parallel warm-paper light
           theme — which never actually applied. jh-chrome's `:root[data-theme=
           "light"]` (0,2,0) outranks a bare `[data-theme="light"]` (0,1,0), so
           the site's cool ground and cyan won while this page's own gold and
           glass survived: a half-applied mongrel theme. The type scale was
           restated too, without the `* var(--type-scale)` multiplier, which
           rendered this page's body text 13% smaller than every other page and
           collapsed its small-label hierarchy. All of it is gone; the ladders
           in jh-chrome.css are now the only ones. */
        :root {
            --glass:         var(--surface-glass);
            --glass-light:   rgba(var(--surface-rgb), 0.55);
            --border-subtle: var(--rule-soft);

            /* The two real collections' accents; everything borrows site
               tokens. (The old six-pathway system — start here, cheatsheets,
               going deeper, templates, sessions, news, and the one hue this
               page added for it — died with that IA.) */
            --p1-color: var(--cyan);         /* EduOS      */
            --p1-bg:    rgba(var(--cyan-dim-rgb), 0.12);
            --p2-color: var(--gold);         /* MetaMedium */
            --p2-bg:    rgba(var(--gold-rgb), 0.12);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        body {
            font-family: var(--font-mono);
            font-size: var(--text-base);
            font-weight: 500;
            line-height: 1.7;
            color: var(--text-primary);
            background: var(--sea-deep);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: var(--space-md);
        }

        /* shared.css turns `main` click-transparent (the fixed canvases under
           the standard pages) and re-arms only its direct section/card
           children. This page's list lives deeper than that whitelist
           reaches — re-arm the reading surface whole. */
        #writing-main { pointer-events: auto; }


        .header-count {
            font-size: var(--text-2xs);
            color: var(--muted);
            letter-spacing: 0.04em;
        }


        .category-section {
            margin-bottom: var(--space-xl);
            /* These are the TOC's jump targets, and the nav is fixed over the
               top 40px. shared.css gives every <section> a 4rem scroll margin
               for exactly this; these are divs, so they have to ask. Without
               it #cat-eduos landed with its heading behind the nav band. */
            scroll-margin-top: 4rem;
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: var(--space-xs);
            margin-bottom: var(--space-xs);
            padding-bottom: var(--space-xs);
            border-bottom: 1px solid var(--border-subtle);
        }

        .category-icon {
            font-size: var(--text-xs);
            opacity: 0.5;
        }

        .category-title {
            font-family: var(--font-mono);
            font-size: var(--text-xs);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--muted-light);
        }

        .category-count {
            font-size: var(--text-2xs);
            color: var(--muted);
            margin-left: auto;
        }

        .category-desc {
            font-size: var(--text-2xs);
            color: var(--muted);
            font-style: italic;
            margin-bottom: var(--space-sm);
        }

        .file-grid {
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
        }

        .file-card {
            position: relative;
            background: rgba(var(--surface-rgb), 0.25);
            border: none;
            padding: var(--space-md) var(--space-md);
            padding-left: calc(var(--space-md) + 3px);
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 4px;
        }

        .file-card::after {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 2px;
            border-radius: 1px;
            transition: width 0.2s ease, background 0.2s ease;
        }

        .file-card:hover {
            background: rgba(var(--surface-rgb), 0.6);
        }

        .file-card:hover::after { width: 3px; }

        .file-card.cat-eduos::after    { background: linear-gradient(to bottom, var(--p1-color), rgba(var(--cyan-dim-rgb),0.1)); }
        .file-card.cat-metamedium::after { background: linear-gradient(to bottom, var(--p2-color), rgba(var(--gold-rgb),0.1)); }

        .file-name {
            font-size: var(--text-sm);
            font-weight: 600;
            color: var(--text-subhead);
            margin-bottom: 2px;
        }

        .file-desc {
            font-size: var(--text-sm);
            color: var(--text-primary);
            line-height: 1.7;
        }

        .file-tags {
            display: flex;
            gap: var(--space-xs);
            margin-top: var(--space-xs);
            flex-wrap: wrap;
        }

        .file-tag {
            padding: 0.1rem 0.4rem;
            border-radius: 3px;
            font-size: var(--text-2xs);
            font-weight: 500;
            letter-spacing: 0.04em;
        }

        .file-tag.tag-cyan   { background: rgba(var(--cyan-dim-rgb),0.1); color: var(--cyan); }

        /* The reader is a modal, so it sits ABOVE the site chrome — the same
           ruling playground.html's focus mode needed, for the same reason. At
           the old z-99/100 the fixed #nav (z-1000) painted its 40px band across
           the panel's control row: elementFromPoint over the × returned
           .nav-inner, so the close button was not merely clipped, it was
           unclickable, and Esc was the only way out. Below the search overlay's
           2000, which must still open over the reader. */
        .panel-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(var(--surface-rgb), 0.6);
            z-index: 1099;
        }

        .panel-overlay.open { display: block; }

        .content-panel {
            display: none;
            position: fixed;
            top: 0;
            right: 0;
            width: 60%;
            max-width: 780px;
            height: 100vh;
            background: var(--sea-deep);
            border-left: 1px solid var(--border);
            z-index: 1100;
            overflow: hidden;
        }

        .content-panel.open { display: flex; flex-direction: column; }

        @media (max-width: 768px) {
            .content-panel { width: 92%; max-width: none; }
        }

        .panel-header {
            padding: var(--space-sm) var(--space-md);
            border-bottom: 1px solid var(--border-subtle);
            background: var(--glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .panel-nav-row {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }

        /* ONE control grammar for the reader's header, borrowed from the site's
           button (services' .cta-btn): cyan-dim tint, cyan-dim border, radius
           4, and an ink TOKEN rather than an alpha for the label. Three bespoke
           recipes used to live here — 4px / 2rem / 4px radii, muted /
           text-bright / muted inks — on buttons sitting in one row 8px apart,
           which is the kind of difference that reads as assembled rather than
           designed. Sizes stay per-button; only the grammar is shared. */
        .nav-btn,
        .download-btn,
        .panel-close {
            font-family: var(--font-mono);
            background: rgba(var(--cyan-dim-rgb), 0.08);
            border: 1px solid rgba(var(--cyan-dim-rgb), 0.3);
            border-radius: 4px;
            color: var(--ink-quiet);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }
        .nav-btn:hover:not(:disabled),
        .download-btn:hover,
        .panel-close:hover {
            background: rgba(var(--cyan-dim-rgb), 0.16);
            border-color: rgba(var(--cyan-dim-rgb), 0.5);
            color: var(--cyan);
        }

        .nav-btn { width: 28px; height: 28px; font-size: var(--text-xs); }
        .download-btn { padding: 0.3rem 0.75rem; font-size: var(--text-2xs); gap: 0.35rem; }
        .panel-close { font-size: var(--text-base); padding: 2px 8px; }

        .nav-btn:disabled { opacity: 0.25; cursor: default; }

        .breadcrumbs {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: var(--text-xs);
            min-width: 0;
            overflow: hidden;
        }

        .crumb { color: var(--muted); white-space: nowrap; }
        .crumb-root { cursor: pointer; transition: color 0.15s; }
        .crumb-root:hover { color: var(--cyan); }
        .crumb-sep { color: var(--muted); font-size: var(--text-2xs); }
        .crumb-category { color: var(--muted-light); }
        .crumb-file { color: var(--text-subhead); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }


        .panel-body {
            flex: 1;
            overflow-y: auto;
            padding: var(--space-lg) var(--space-md);
        }

        .panel-footer {
            display: flex;
            border-top: 1px solid var(--border-subtle);
            background: var(--glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .footer-nav {
            flex: 1;
            padding: var(--space-sm) var(--space-md);
            cursor: pointer;
            font-size: var(--text-xs);
            color: var(--muted);
            transition: all 0.15s;
            display: flex;
            flex-direction: column;
            background: none;
            border: none;
            font-family: inherit;
            text-align: left;
        }

        .footer-nav:hover { background: rgba(var(--cyan-dim-rgb), 0.04); color: var(--text-bright); }
        .footer-nav:disabled, .footer-nav[disabled] { opacity: 0.3; cursor: default; pointer-events: none; }
        .footer-nav.next { text-align: right; align-items: flex-end; border-left: 1px solid var(--border-subtle); }

        .footer-dir { font-size: var(--text-2xs); color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
        .footer-name { color: var(--text-bright); font-weight: 500; }

        .md {
            font-size: var(--text-sm);
            line-height: 1.8;
            color: var(--text-primary);
        }

        .md h1 {
            font-family: var(--font-display);
            font-size: var(--text-2xl);
            font-weight: 300;
            letter-spacing: 0.06em;
            color: var(--text-heading);
            border-bottom: 1px solid var(--border);
            padding-bottom: var(--space-sm);
            margin-bottom: var(--space-md);
        }

        .md h2 {
            font-family: var(--font-mono);
            font-size: var(--text-base);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-heading);
            margin: var(--space-lg) 0 var(--space-sm);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .md h2::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, rgba(var(--cyan-dim-rgb), 0.4), rgba(var(--cyan-dim-rgb), 0.05));
        }

        .md h3 {
            font-family: var(--font-mono);
            font-size: var(--text-sm);
            font-weight: 500;
            color: var(--text-subhead);
            margin: var(--space-md) 0 var(--space-xs);
        }

        .md h4 {
            font-size: var(--text-sm);
            font-weight: 500;
            color: var(--gold);
            margin: var(--space-sm) 0 var(--space-xs);
        }

        .md p { margin-bottom: var(--space-sm); }

        .md strong {
            font-weight: 500;
            color: var(--cyan);
        }

        .md em {
            font-style: italic;
            color: var(--text-bright);
        }

        .md a {
            color: var(--cyan);
            text-decoration: underline;
            text-underline-offset: 3px;
            text-decoration-color: rgba(var(--gold-rgb), 0.5);
        }

        .md a:hover {
            color: var(--gold);
            text-decoration-color: var(--gold);
        }

        .md code {
            display: inline-block;
            font-family: var(--font-mono);
            font-size: var(--text-xs);
            color: var(--green);
            background: rgba(var(--surface-rgb), 0.6);
            border: 1px solid rgba(var(--green-rgb), 0.15);
            border-radius: 3px;
            padding: 0.1rem 0.4rem;
        }

        .md pre {
            display: block;
            padding: var(--space-sm) var(--space-md);
            background: rgba(var(--surface-rgb), 0.6);
            border: 1px solid rgba(var(--green-rgb), 0.15);
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: var(--text-xs);
            line-height: 1.6;
            color: var(--green);
            white-space: pre;
            overflow-x: auto;
            margin: var(--space-sm) 0;
        }

        .md pre code {
            background: none;
            border: none;
            padding: 0;
            color: inherit;
            font-size: inherit;
        }

        .md ul, .md ol {
            margin-left: var(--space-md);
            margin-bottom: var(--space-sm);
        }

        .md li {
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .md li::marker {
            color: var(--cyan-dim);
        }

        .md table {
            width: 100%;
            border-collapse: collapse;
            margin: var(--space-sm) 0;
            font-size: var(--text-xs);
        }

        .md th {
            text-align: left;
            padding: 0.4rem var(--space-sm);
            font-size: var(--text-xs);
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border-bottom: 1px solid rgba(var(--gold-rgb), 0.2);
            font-weight: 500;
        }

        .md td {
            padding: 0.4rem var(--space-sm);
            color: var(--text-primary);
            border-bottom: 1px solid var(--border-subtle);
            vertical-align: top;
        }

        .md hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: var(--space-lg) 0;
        }

        .md blockquote {
            border-left: 2px solid var(--cyan);
            padding-left: var(--space-md);
            margin: var(--space-sm) 0;
            font-style: italic;
            color: var(--text-bright);
            opacity: 0.9;
        }

        .fallback-notice {
            background: rgba(var(--gold-rgb), 0.08);
            border: 1px solid rgba(var(--gold-rgb), 0.2);
            border-radius: 4px;
            padding: var(--space-sm) var(--space-md);
            margin-bottom: var(--space-lg);
            font-size: var(--text-xs);
            color: var(--gold);
            display: none;
        }

        .fallback-notice code {
            color: var(--green);
        }

        .refresh-banner {
            display: none;
            background: rgba(var(--cyan-dim-rgb), 0.08);
            border: 1px solid rgba(var(--cyan-dim-rgb), 0.2);
            border-radius: 4px;
            padding: var(--space-sm) var(--space-md);
            margin-bottom: var(--space-lg);
            font-size: var(--text-xs);
            color: var(--cyan);
            cursor: pointer;
            transition: background 0.15s;
        }

        .refresh-banner:hover {
            background: rgba(var(--cyan-dim-rgb), 0.14);
        }


        [data-theme="light"] .file-card { background: rgba(var(--ink-rgb), 0.03); }
        [data-theme="light"] .file-card:hover { background: rgba(var(--ink-rgb), 0.08); }


        [data-theme="light"] .md pre { background: rgba(var(--ink-rgb), 0.05); border-color: rgba(var(--ink-rgb), 0.1); }
        [data-theme="light"] .md code { background: rgba(var(--ink-rgb), 0.06); border-color: rgba(var(--ink-rgb), 0.1); color: var(--green); }
        [data-theme="light"] .md pre code { color: var(--green); }

        [data-theme="light"] .md h2::after { background: linear-gradient(to right, rgba(var(--ink-rgb), 0.25), rgba(var(--ink-rgb), 0.03)); }

        [data-theme="light"] .panel-header { backdrop-filter: none; -webkit-backdrop-filter: none; }
        [data-theme="light"] .panel-footer { backdrop-filter: none; -webkit-backdrop-filter: none; }
        [data-theme="light"] .footer-nav:hover { background: rgba(var(--ink-rgb), 0.04); }
        [data-theme="light"] .panel-overlay { background: rgba(var(--ink-rgb), 0.15); }

        [data-theme="light"] .file-tag.tag-cyan { background: rgba(var(--ink-rgb), 0.08); }

        @media (max-width: 600px) {
            .container { padding: var(--space-sm); }
        }
    </style>
</head>

<!-- The site's standard entry: signature + page name (same grammar as
     index/services/art). The fixed nav overlays its top band; the count line
     sits under the h1. -->
<header class="page-header" id="top">
    <h1><span class="jh-sig"><span class="sr-only">JH</span><img src="./Assets/JHsig.svg" alt="" aria-hidden="true"></span> <span class="meta">Writing</span></h1>
    <div class="header-count" id="headerCount"></div>
</header>

<div class="container">

    <main id="writing-main">
    <div id="fileList"></div>
    </main>

</div>


<!-- Direct child of <body> on purpose: the chrome's footer rules are all
     `body > footer …` (layout, centering, and the .version type step). Nested
     inside .container they did not match, so the oval sat left-aligned and the
     version line rendered at inherited 19px with the oval's white-space:nowrap
     still applied — 396px of text in a 298px oval, which was the 19px of
     horizontal scroll at 390. -->
<footer>
    <jh-footer></jh-footer>
</footer>

<nav id="nav" role="navigation" aria-label="Main navigation">
    <div class="nav-inner">
        <jh-nav current=""></jh-nav>
        <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <ul class="nav-right">
            <li><a href="#cat-eduos">EduOS</a></li>
            <li><a href="#cat-metamedium">MetaMedium</a></li>
        </ul>
    </div>
</nav>

<div class="panel-overlay" id="panelOverlay" onclick="closePanel()"></div>

<div class="content-panel" id="contentPanel" role="dialog" aria-modal="true" aria-label="Reading panel" aria-hidden="true">
    <div class="panel-header">
        <div class="panel-nav-row">
            <button class="nav-btn" id="btnBack" onclick="navBack()" disabled title="Back (Alt+Left)">&#8592;</button>
            <button class="nav-btn" id="btnForward" onclick="navForward()" disabled title="Forward (Alt+Right)">&#8594;</button>
            <button class="nav-btn" id="btnPrev" onclick="navPrev()" disabled title="Previous file (Alt+Up)">&#8593;</button>
            <button class="nav-btn" id="btnNext" onclick="navNext()" disabled title="Next file (Alt+Down)">&#8595;</button>
            <div class="breadcrumbs" id="breadcrumbs">
                <button class="crumb crumb-root" onclick="closePanel()" style="background:none;border:none;color:inherit;font:inherit;cursor:pointer;padding:0;">Writing</button>
            </div>
            <button class="download-btn" id="btnDownload" onclick="downloadCurrent()" title="Download as .md">&#8595; <span id="downloadLabel">Download</span></button>
            <button class="panel-close" onclick="closePanel()" title="Close (Esc)">&times;</button>
        </div>
    </div>
    <div class="panel-body" id="panelBody"></div>
    <div class="panel-footer" id="panelFooter">
        <button class="footer-nav prev" id="footerPrev" onclick="navPrev()" aria-label="Previous file">
            <span class="footer-dir">&#8592; Previous</span>
            <span class="footer-name" id="prevName"></span>
        </button>
        <button class="footer-nav next" id="footerNext" onclick="navNext()" aria-label="Next file">
            <span class="footer-dir">Next &#8594;</span>
            <span class="footer-name" id="nextName"></span>
        </button>
    </div>
</div>

<script>
const fileIndex = [
    { path: 'writing/eduos-plea.md', name: 'Students as Sovereign Participants or Peasant Users?', desc: 'Whichever vendor controls the AI in classrooms controls the world', cat: 'eduos', tags: ['education', 'sovereignty'], slug: 'eduos-plea' },
    { path: 'writing/eduos-classroom.md', name: 'The Classroom That Owns Itself', desc: 'Why schools need open source AI — from Engelbart to the present', cat: 'eduos', tags: ['education', 'ai', 'open-source'], slug: 'eduos-classroom' },
    { path: 'writing/eduos-quickstart.md', name: 'Sovereign Stack Pilot Guide', desc: 'How school districts can experiment with owning their infrastructure', cat: 'eduos', tags: ['education', 'technical', 'pilot'], slug: 'eduos-quickstart' },
    { path: 'writing/eduos-implementation.md', name: 'Building the Public Stack', desc: 'Full implementation guide for educational technology sovereignty — policy, governance, and infrastructure', cat: 'eduos', tags: ['education', 'policy', 'governance'], slug: 'eduos-implementation' },

    { path: 'writing/metamedium-overview.md', name: 'MetaMedium: Drawing as the Next Programming Language', desc: 'What if every mark you made could think?', cat: 'metamedium', tags: ['metamedium', 'interface', 'ai'], slug: 'metamedium-overview' },
    { path: 'writing/metamedium-lineage.md', name: 'The Lineage of MetaMedium', desc: 'From Memex to living canvas — a history of the idea that computers should amplify human thought', cat: 'metamedium', tags: ['metamedium', 'history', 'research'], slug: 'metamedium-lineage' },
];

const categories = {
    eduos: { title: 'EduOS', icon: '&#x203A;', desc: 'Open source AI infrastructure for schools — sovereign computing in education' },
    metamedium: { title: 'MetaMedium', icon: '&#x203A;', desc: 'Drawing as computation — a canvas where marks become meaning and meaning becomes executable' },
};
const catOrder = ['eduos', 'metamedium'];

let navHistory = [];
let navHistoryIndex = -1;
let currentPath = null;
let panelReturnFocus = null;   // element to refocus when the reader panel closes

function renderFiles() {
    const container = document.getElementById('fileList');

    const grouped = {};
    catOrder.forEach(c => { grouped[c] = []; });
    fileIndex.forEach(f => {
        if (grouped[f.cat]) grouped[f.cat].push(f);
    });

    let html = '';
    catOrder.forEach(cat => {
        const files = grouped[cat];
        if (!files || files.length === 0) return;
        const info = categories[cat];

        html += `<div class="category-section" id="cat-${cat}">
            <div class="category-header">
                <span class="category-icon">${info.icon}</span>
                <span class="category-title">${info.title}</span>
                <span class="category-count">${files.length} article${files.length !== 1 ? 's' : ''}</span>
            </div>
            <div class="category-desc">${info.desc}</div>
            <div class="file-grid">`;

        files.forEach(f => {
            const tags = f.tags.map(t => `<span class="file-tag tag-cyan">${t}</span>`).join('');

            html += `<div class="file-card cat-${cat}" onclick="openFile('${f.path}')">
                <div class="file-name">${f.name}</div>
                <div class="file-desc">${f.desc}</div>
                <div class="file-tags">${tags}</div>
            </div>`;
        });

        html += `</div></div>`;
    });

    container.innerHTML = html;
}

function renderMarkdown(text) {
    let html = '';
    const lines = text.split('\n');
    let inCode = false, codeLang = '', codeLines = [];
    let inTable = false, tableLines = [];

    function flushTable() {
        if (!tableLines.length) return '';
        let t = '<table>';
        tableLines.forEach((row, i) => {
            const cells = row.split('|').filter(c => c.trim() !== '');
            if (i === 1 && cells.every(c => /^[\s-:]+$/.test(c))) return;
            const tag = i === 0 ? 'th' : 'td';
            t += '<tr>' + cells.map(c => `<${tag}>${inlineFormat(c.trim())}</${tag}>`).join('') + '</tr>';
        });
        t += '</table>';
        tableLines = [];
        inTable = false;
        return t;
    }

    function inlineFormat(s) {
        s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
        s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
        s = s.replace(/\[\[([^\]]+)\]\]/g, '<strong>$1</strong>');
        s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
        return s;
    }

    for (let i = 0; i < lines.length; i++) {
        const line = lines[i];

        if (line.startsWith('```')) {
            if (inCode) {
                html += `<pre><code>${codeLines.join('\n').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</code></pre>`;
                codeLines = []; inCode = false;
            } else {
                if (inTable) html += flushTable();
                codeLang = line.slice(3).trim();
                inCode = true;
            }
            continue;
        }

        if (inCode) { codeLines.push(line); continue; }

        if (line.includes('|') && line.trim().startsWith('|')) {
            if (!inTable) inTable = true;
            tableLines.push(line.trim());
            continue;
        } else if (inTable) {
            html += flushTable();
        }

        if (/^#{1,4}\s/.test(line)) {
            const lvl = line.match(/^(#+)/)[1].length;
            const text = line.replace(/^#+\s*/, '');
            html += `<h${lvl}>${inlineFormat(text)}</h${lvl}>`;
        } else if (line.startsWith('---') || line.startsWith('***') || line.startsWith('___')) {
            html += '<hr>';
        } else if (line.startsWith('> ')) {
            html += `<blockquote>${inlineFormat(line.slice(2))}</blockquote>`;
        } else if (/^\s*[-*]\s/.test(line)) {
            if (!html.endsWith('</ul>')) html += '<ul>';
            else html = html.replace(/<\/ul>$/, '');
            html += `<li>${inlineFormat(line.replace(/^\s*[-*]\s/, ''))}</li></ul>`;
        } else if (/^\s*\d+\.\s/.test(line)) {
            if (!html.endsWith('</ol>')) html += '<ol>';
            else html = html.replace(/<\/ol>$/, '');
            html += `<li>${inlineFormat(line.replace(/^\s*\d+\.\s/, ''))}</li></ol>`;
        } else if (line.trim() === '') {
        } else {
            html += `<p>${inlineFormat(line)}</p>`;
        }
    }

    if (inTable) html += flushTable();
    if (inCode) html += `<pre><code>${codeLines.join('\n').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</code></pre>`;

    return html;
}

function openFile(path, skipHistory) {
    currentPath = path;

    const entry = fileIndex.find(f => f.path === path);
    if (entry && entry.slug) {
        window.location.hash = entry.slug;
    }

    if (!skipHistory) {
        if (navHistoryIndex < navHistory.length - 1) {
            navHistory = navHistory.slice(0, navHistoryIndex + 1);
        }
        navHistory.push(path);
        navHistoryIndex = navHistory.length - 1;
    }

    updateNavState();
    updateBreadcrumbs(path);
    updateFooterNav(path);
    document.getElementById('downloadLabel').textContent = 'Download';

    const body = document.getElementById('panelBody');
    body.innerHTML = `<p style="color:var(--muted);font-style:italic;">Loading...</p>`;

    document.getElementById('contentPanel').classList.add('open');
    document.getElementById('panelOverlay').classList.add('open');
    document.body.style.overflow = 'hidden';
    // Dialog semantics: focus moves in, Esc/Tab handled, focus returns on close.
    panelReturnFocus = document.activeElement;
    const panel = document.getElementById('contentPanel');
    panel.setAttribute('aria-hidden', 'false');
    panel.querySelector('.panel-close').focus();

    fetch(path)
        .then(r => {
            if (!r.ok) throw new Error('Not found');
            return r.text();
        })
        .then(text => {
            body.innerHTML = `<div class="md">${renderMarkdown(text)}</div>`;
            body.scrollTop = 0;
        })
        .catch(() => {
            body.innerHTML = `<div class="md">
                <h2>File not found</h2>
                <p>The file <code>${path}</code> could not be loaded.</p>
                <p>Make sure you are serving this page from a local server or web host, and that the file exists in the <code>writing/</code> subfolder.</p>
            </div>`;
        });
}

function closePanel() {
    document.getElementById('contentPanel').classList.remove('open');
    document.getElementById('panelOverlay').classList.remove('open');
    document.getElementById('contentPanel').setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    if (panelReturnFocus && document.contains(panelReturnFocus)) {
        try { panelReturnFocus.focus(); } catch (e) {}
    }
    panelReturnFocus = null;
    currentPath = null;
    // Clear hash. window.history spelled out on purpose: a bare `history`
    // here silently resolved to the nav-history ARRAY declared at the top of
    // this script, so every panel close threw TypeError and the #slug was
    // never removed. The close still looked fine only because this is the
    // last statement in the function.
    window.history.replaceState('', document.title, window.location.pathname + window.location.search);
}

function navBack() {
    if (navHistoryIndex > 0) {
        navHistoryIndex--;
        openFile(navHistory[navHistoryIndex], true);
    }
}

function navForward() {
    if (navHistoryIndex < navHistory.length - 1) {
        navHistoryIndex++;
        openFile(navHistory[navHistoryIndex], true);
    }
}

function navPrev() {
    const idx = getFileIndexPos(currentPath);
    if (idx > 0) {
        const prev = fileIndex[idx - 1];
        if (!prev.path.endsWith('/')) openFile(prev.path);
    }
}

function navNext() {
    const idx = getFileIndexPos(currentPath);
    if (idx >= 0 && idx < fileIndex.length - 1) {
        const next = fileIndex[idx + 1];
        if (!next.path.endsWith('/')) openFile(next.path);
    }
}

function downloadCurrent() {
    if (!currentPath) return;
    const entry = fileIndex.find(f => f.path === currentPath);
    const filename = entry ? (entry.slug + '.md') : currentPath.split('/').pop();
    fetch(currentPath)
        .then(r => r.text())
        .then(text => {
            const blob = new Blob([text], { type: 'text/markdown' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            a.click();
            URL.revokeObjectURL(a.href);
        });
}

function getFileIndexPos(path) {
    return fileIndex.findIndex(f => f.path === path);
}

function updateNavState() {
    document.getElementById('btnBack').disabled = navHistoryIndex <= 0;
    document.getElementById('btnForward').disabled = navHistoryIndex >= navHistory.length - 1;

    const idx = getFileIndexPos(currentPath);
    document.getElementById('btnPrev').disabled = idx <= 0;
    document.getElementById('btnNext').disabled = idx < 0 || idx >= fileIndex.length - 1 || fileIndex[idx + 1].path.endsWith('/');
}

function updateBreadcrumbs(path) {
    const file = fileIndex.find(f => f.path === path);
    const catInfo = file ? categories[file.cat] : null;

    let html = `<button class="crumb crumb-root" onclick="closePanel()" style="background:none;border:none;color:inherit;font:inherit;cursor:pointer;padding:0;">Writing</button>`;
    if (catInfo) {
        html += `<span class="crumb-sep">/</span><span class="crumb crumb-category">${catInfo.title}</span>`;
    }
    const filename = file ? (file.slug + '.md') : path.split('/').pop();
    html += `<span class="crumb-sep">/</span><span class="crumb crumb-file">${filename}</span>`;

    document.getElementById('breadcrumbs').innerHTML = html;
}

function updateFooterNav(path) {
    const idx = getFileIndexPos(path);
    const prev = idx > 0 ? fileIndex[idx - 1] : null;
    const next = idx >= 0 && idx < fileIndex.length - 1 ? fileIndex[idx + 1] : null;

    const prevEl = document.getElementById('footerPrev');
    const nextEl = document.getElementById('footerNext');
    const prevName = document.getElementById('prevName');
    const nextName = document.getElementById('nextName');

    if (prev && !prev.path.endsWith('/')) {
        prevEl.removeAttribute('disabled');
        prevEl.style.pointerEvents = 'auto';
        prevEl.style.opacity = '1';
        prevName.textContent = prev.name;
    } else {
        prevEl.setAttribute('disabled', '');
        prevEl.style.pointerEvents = 'none';
        prevEl.style.opacity = '0.3';
        prevName.textContent = '';
    }

    if (next && !next.path.endsWith('/')) {
        nextEl.removeAttribute('disabled');
        nextEl.style.pointerEvents = 'auto';
        nextEl.style.opacity = '1';
        nextName.textContent = next.name;
    } else {
        nextEl.setAttribute('disabled', '');
        nextEl.style.pointerEvents = 'none';
        nextEl.style.opacity = '0.3';
        nextName.textContent = '';
    }
}

document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closePanel(); return; }
    if (!currentPath) return;

    if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); navBack(); }
    if (e.altKey && e.key === 'ArrowRight') { e.preventDefault(); navForward(); }
    if (e.altKey && e.key === 'ArrowUp') { e.preventDefault(); navPrev(); }
    if (e.altKey && e.key === 'ArrowDown') { e.preventDefault(); navNext(); }
});

function checkHash() {
    const hash = window.location.hash.replace('#', '');
    if (!hash) return;
    const entry = fileIndex.find(f => f.slug === hash);
    if (entry) openFile(entry.path);
}

renderFiles();
document.getElementById('headerCount').textContent = fileIndex.length + ' article' + (fileIndex.length !== 1 ? 's' : '');
checkHash();
    </script>
