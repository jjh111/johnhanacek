<style>
/* Self-contained shell — no external fonts or stylesheets, so the blob works
   anywhere it is dropped. Palette mirrors brand/_tokens.css light-warm-teal. */
/* The tool's own token names, bound to the site palette. Keeping the names
   means the ~1100 lines of canvas CSS below are untouched — only what the
   names MEAN changes, so this reads as johnhanacek.com rather than as the
   OpenProse warm-paper deliverable it was cut from. */
:root {
  --paper: #020a12; --paper-warm: #051018; --ink: #b8dced; --ink2: #8cb8cc;
  --ink3: #7a9aaa; --rule: rgba(77, 201, 246, 0.2); --teal: #7dd8f7; --amber: #d4af37;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--paper); color: var(--ink); font-family: var(--mono); }
body { font-size: 13px; line-height: 1.55; }

header {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 12px;
  padding: 10px 18px;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--rule);
}
header .mark-sig { height: 22px; width: auto; flex: none; }
:root[data-mode="dark"] header .mark-sig { filter: invert(1); }
@media (prefers-color-scheme: dark) {
  :root:not([data-mode="light"]) header .mark-sig { filter: invert(1); }
}
header h1 { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; }
header h1 span { color: var(--ink3); font-weight: 400; }
header .modes { display: flex; gap: 4px; margin-left: auto; }
header .modes button.active { border-color: var(--teal); color: var(--teal); }
/* Mode buttons read as a picture of what they do: a 4x3 plane, a 2x2 grid,
   one whole page. The icon carries the meaning, so the word is the part
   that yields when the bar gets narrow. */
header .modes button { display: inline-flex; align-items: center; gap: 6px; }
header .modes .mico { display: block; width: 14px; height: 10px; flex: none; }
header .tb-group { display: none; align-items: center; gap: 4px; }
header .tb-group.visible { display: flex; }
header .tb-group .zoom-display {
  min-width: 42px; text-align: center;
  color: var(--ink3); font-size: 11px; font-variant-numeric: tabular-nums;
}
header .count { color: var(--ink3); font-size: 11px; }
header button {
  font: inherit; font-size: 11px; color: var(--ink2);
  background: none; border: 1px solid var(--rule); border-radius: 5px;
  padding: 3px 10px; cursor: pointer;
}
header button:hover { border-color: var(--ink3); }

#plane {
  display: grid; gap: 16px; padding: 4px;
  /* auto-fit (not auto-fill): empty tracks collapse, so few cards stretch
     to fill the available width instead of parking beside phantom columns. */
  grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
  max-width: 1720px; margin: 0 auto;
}
/* Embeds sit flush: the host page frames the panel, so the 4px inset would
   read as a hairline of dead paper inside the border. */
body.embedded #plane { padding: 0; }
#plane[data-cols="1"] { grid-template-columns: 1fr; }
#plane[data-cols="2"] { grid-template-columns: repeat(2, 1fr); }
#plane[data-cols="3"] { grid-template-columns: repeat(3, 1fr); }
#plane[data-cols="4"] { grid-template-columns: repeat(4, 1fr); }
#plane[data-cols="5"] { grid-template-columns: repeat(5, 1fr); }
/* Narrow shells (phone embeds and phone standalone): 3+ columns become
   postage stamps, so cap at two. The height handshake re-sizes the host
   panel to whatever this wraps to. */
@media (max-width: 640px) {
  #plane[data-cols="3"], #plane[data-cols="4"], #plane[data-cols="5"] {
    grid-template-columns: repeat(2, 1fr);
  }
  /* Narrow shells: words out, controls in. The title goes entirely (the
     host page already says what this is), the signet shrinks to a badge,
     and paddings/gaps tighten so the mode buttons and toggles hold one
     line without wrapping. */
  header h1, header .count, header .modes .mlabel { display: none; }
  /* Controls fill the bar: space-between spreads each wrapped row so the
     first and last control sit flush at the edges. */
  header { gap: 5px; padding: 6px 8px; flex-wrap: wrap; row-gap: 4px; justify-content: space-between; }
  header .mark-sig { height: 16px; }
  header .modes { gap: 3px; margin-left: 0; }
  header button { padding: 3px 6px; font-size: 10px; }
  header .tb-group { gap: 3px; }
  header .tb-group label { display: none; }
  header .tb-group select { font-size: 10px !important; padding: 2px 3px !important; }
}
/* Canvas mode — free pan/zoom surface, the tool's signature view */
body.mode-canvas #stage {
  position: fixed; inset: 47px 0 0 0;
  overflow: hidden; cursor: grab;
  touch-action: none;
}
body.mode-canvas #stage.dragging { cursor: grabbing; }
/* Touch counterpart to the embedded wheel rule (see the stage wheel handler).
   touch-action:none hands every finger to the pan logic, which standalone is
   right and embedded means a swipe over the panel freezes the article. pan-y
   gives vertical drags back to the page; horizontal still pans the canvas,
   and taps still open cards. */
body.embedded.mode-canvas #stage { touch-action: pan-y; }
body.mode-canvas #plane {
  display: block; max-width: none; padding: 0; margin: 0;
  transform-origin: 0 0; will-change: transform;
}
body.mode-canvas .card { position: absolute; width: 420px; }
.card {
  border: 1px solid var(--rule); border-radius: 8px; overflow: hidden;
  background: var(--paper-warm);
  display: flex; flex-direction: column;
  contain: content;
}
.card .bar {
  display: flex; align-items: baseline; gap: 8px;
  padding: 7px 10px; border-bottom: 1px solid var(--rule);
}
.card .bar .name {
  font-size: 11px; font-weight: 600; color: var(--ink);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.card .bar .stars, #focus .fbar .stars {
  color: var(--amber); flex: none;
  font-size: 10px; letter-spacing: 0.06em;
}
body.no-ratings .stars { display: none; }
/* Corner control: the ⛶ that opens this card fullscreen. Was the words
   "open ↗", which read as "leave for another page" — it does the opposite,
   it brings the page here. An icon in the corner of every card also stays
   legible when canvas mode shrinks the type past reading size. */
.card .bar a {
  margin-left: auto; flex: none;
  font-size: 13px; line-height: 1;
  color: var(--teal); text-decoration: none;
  padding: 2px 4px; border-radius: 3px;
  transition: background 0.12s ease, color 0.12s ease;
}
.card .bar a:hover, .card .bar a:focus-visible {
  background: var(--teal-tint, rgba(58,122,106,0.14)); color: var(--teal-deep, var(--teal));
  text-decoration: none;
}
.card .well {
  position: relative; aspect-ratio: 16 / 10; cursor: zoom-in;
  background: var(--paper);
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
/* Canvas mode: the well is not clickable — the stage captures the pointer for
   panning, so a click on a card never reaches it. The cursor said otherwise.
   Here the card body is something you drag, double-click to zoom, or open via
   the corner ⛶; grid mode keeps zoom-in, where a click really does focus. */
body.mode-canvas .card .well { cursor: inherit; }
.card .well iframe {
  /* paper, not white — no flash against dark pages/mode */
  position: absolute; inset: 0; border: 0;
  width: 400%; height: 400%;
  transform: scale(0.25); transform-origin: top left;
  pointer-events: none; background: var(--paper);
  /* Invisible until the page paints (.ready on load) — heavy pages boot
     pure white; the well + "loading" hint hold the fort instead. */
  opacity: 0; transition: opacity 0.35s ease;
}
.card .well iframe.ready { opacity: 1; }
/* Physical touch shield over every preview: iOS Safari does not honor
   pointer-events:none on iframes, so touch-drags scrolled the SUBPAGES
   instead of the page. A real element above the frame catches the gesture
   (it belongs to the well, so tap-to-focus still works) and scroll chains
   up like everywhere else. Interaction with a page happens in focus mode,
   same as desktop: gated by the zoom click. */
.card .well::after { content: ''; position: absolute; inset: 0; z-index: 2; }
.card .well .ph {
  position: absolute; inset: 0; display: flex; align-items: center;
  justify-content: center; color: var(--ink3); font-size: 11px;
}
.card .desc {
  padding: 7px 10px; font-size: 10.5px; color: var(--ink3);
  border-top: 1px solid var(--rule);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; min-height: 2.4em;
}

/* Focus overlay */
#focus {
  position: fixed; inset: 0; z-index: 50; display: none;
  flex-direction: column; background: var(--paper);
}
#focus.open { display: flex; }
#focus .fbar {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 14px; border-bottom: 1px solid var(--rule);
  background: var(--paper-warm);
}
#focus .fbar .name { font-size: 12px; font-weight: 600; }
#focus .fbar .counter {
  color: var(--ink3); font-size: 11px; flex: none;
  min-width: 48px; text-align: center; font-variant-numeric: tabular-nums;
}
#focus .fbar .fdesc {
  font-size: 10.5px; color: var(--ink3);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#focus .fbar a { font-size: 11px; color: var(--teal); text-decoration: none; flex: none; margin-left: auto; }
#focus .fbar button {
  font: inherit; font-size: 12px; color: var(--ink2); background: none;
  border: 1px solid var(--rule); border-radius: 5px; padding: 2px 10px;
  cursor: pointer; flex: none;
}
#focus .fbar button:hover { border-color: var(--ink3); }
#focus iframe {
  flex: 1; border: 0; width: 100%; background: var(--paper);
  opacity: 0; transition: opacity 0.35s ease;
}
#focus iframe.ready { opacity: 1; }
#focus .keys { font-size: 10px; color: var(--ink3); flex: none; }

/* Config-hidden chrome — for inline/iframe embeds (?header=0 etc.) */
body.no-header header { display: none; }
body.no-header.mode-canvas #stage { inset: 0; }
body.no-nav #navigator { display: none; }
body.no-descs .card .desc, body.no-descs #focus .fdesc { display: none; }
#ratings-toggle.on { border-color: var(--amber); color: var(--amber); }
#descs-toggle.on { border-color: var(--teal); color: var(--teal); }

/* Navigator — the minimap, ported from the working canvas. Active in every
   mode: click/drag jumps, wheel zooms (canvas) / scrolls (grid) / steps
   (focus). Collapsible via its header. */
#navigator {
  position: fixed; bottom: 12px; right: 12px; z-index: 60;
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  border: 1px solid var(--rule); border-radius: 6px;
  backdrop-filter: blur(10px);
  display: flex; flex-direction: column; overflow: hidden;
  box-shadow: 0 8px 32px rgba(0,0,0,0.25);
}
#navigator .nav-header {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; padding: 4px 8px;
  border-bottom: 1px solid var(--rule);
  cursor: pointer; user-select: none;
  font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--ink3);
}
#navigator .nav-header span:first-child {
  /* The panel width follows the drawn map (set by navDraw) — the label must
     yield, never hold the panel wider than the map. */
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
}
#navigator.collapsed { width: auto !important; }
#navigator.collapsed .nav-body { display: none; }
#navigator .nav-body { position: relative; cursor: crosshair; }
#navigator canvas { display: block; }
@media (max-width: 720px) { #navigator { display: none; } }

#focus .fbar .fdesc { flex: 1; min-width: 0; }
@media (max-width: 720px) { #focus .keys { display: none; } }
.card .bar .name { min-width: 0; }

/* ---- type filter ------------------------------------------------------
   The vocabulary is not hardcoded: it is whatever `cat` values the manifest
   actually uses, collected at boot. Adding a type = adding it to an item. */
#filter-group { flex-wrap: wrap; gap: 3px; }
#filter-group button {
  font: inherit; font-size: 10.5px; letter-spacing: 0.04em;
  color: var(--ink3); background: none;
  border: 1px solid var(--rule); border-radius: 999px;
  padding: 1px 8px; cursor: pointer;
  transition: color 0.15s ease, border-color 0.15s ease;
}
#filter-group button:hover { color: var(--ink2); border-color: var(--ink3); }
#filter-group button.on { color: var(--teal); border-color: var(--teal); }
#filter-group .fcount { color: var(--ink3); font-size: 10.5px; padding-left: 4px; }

/* An external link is a card that can never be woken — most sites refuse to
   be framed, so a live attempt shows a silent blank rather than a page. */
.card.is-external .well { cursor: pointer; }
.card.is-external .ph { color: var(--teal); text-align: center; padding: 0 1.5rem; line-height: 1.6; }

/* ---- JHCOM CHROME -------------------------------------------------------
   The tool was built to own the viewport. The site nav is fixed at 40px, so
   the stage and header sit below it once the nav becomes visible. */
/* Focus mode is role="dialog" aria-modal="true" — a modal belongs ABOVE the
   page chrome, not under it. The site nav is z-index 1000 and the tool, built
   to own the viewport, only asked for 50: the "← back" button landed inside
   the nav's 40px band, where elementFromPoint returned a nav icon. It was not
   merely hidden, it was unclickable, which is why fully-zoomed had no way out. */
#focus { z-index: 1100; }

#nav.visible ~ header { top: calc(40px + env(safe-area-inset-top)); }
#nav.visible ~ main#stage { top: calc(40px + env(safe-area-inset-top)); }
body.mode-canvas #nav.visible ~ main#stage { inset: calc(40px + env(safe-area-inset-top)) 0 0 0; }
header, main#stage { transition: top 0.25s ease; }

/* An item flagged `nested` is never woken — it embeds this same tool, and a
   canvas inside a canvas runs two budgets against one device. The card says
   so and sends you out to the page instead. */
.card.is-nested .well { cursor: pointer; }
.card.is-nested .ph { color: var(--amber); text-align: center; padding: 0 1.5rem; line-height: 1.6; }
</style>
</head>

<script>
(function () {
  'use strict';
  // ---- CONFIG — one component, three uses ---------------------------------
  // Full page (defaults) · iframe embed (?ratings=0&header=0&nav=0&mode=grid
  // &items=a,b&budget=4&cols=3) · inline code block (set window.CANVAS_CONFIG
  // = {...} before this script). Query params win over CANVAS_CONFIG.
  var EMBEDDED = (function () { try { return window.self !== window.top; } catch (e) { return true; } })();
  var CONFIG = (function () {
    var c = Object.assign(
      // Embeds start quiet: ratings off unless the host page opts in
      // (?ratings=1). Full-page visits keep stars on.
      { ratings: !EMBEDDED, header: true, nav: true, descs: false,
        mode: null, items: null, budget: 8, cols: null, sort: null, cats: null },
      window.CANVAS_CONFIG || {});
    var q = new URLSearchParams(location.search);
    ['ratings', 'header', 'nav', 'descs'].forEach(function (k) {
      if (q.has(k)) c[k] = !/^(0|false|off)$/i.test(q.get(k));
    });
    if (q.has('mode')) c.mode = q.get('mode');
    if (q.has('items')) c.items = q.get('items').split(',').map(function (s) { return s.trim(); });
    if (q.has('budget')) c.budget = Math.max(1, parseInt(q.get('budget'), 10) || c.budget);
    // Phones: fewer live iframes per embed unless the host asked explicitly —
    // several panels × 8 subframes is real memory and battery on mobile.
    else if (EMBEDDED && window.matchMedia && matchMedia('(pointer: coarse)').matches) c.budget = Math.min(c.budget, 4);
    if (q.has('cols')) c.cols = q.get('cols');

      applyCols('auto');
      if (typeof navDraw === 'function') navDraw();
    }, 200);
  });
  if (!EMBEDDED) try {
    var st = JSON.parse(localStorage.getItem(STATE_KEY) || 'null');
    if (st && typeof st.s === 'number') {
      view = { x: st.x, y: st.y, s: st.s };
      hasSavedCanvasView = true;
    }
    if (st && st.live && !new URLSearchParams(location.search).has('budget')) {
      maxLive = st.live;
    }
    if (st && st.cols && st.cols !== 'auto') {
      document.getElementById('grid-cols').value = st.cols;
      document.getElementById('plane').setAttribute('data-cols', st.cols);
    }
    if (st && st.sort === 'date' && !CONFIG.sort) {
      document.getElementById('grid-sort').value = 'date';
      applySort('date');
      buildCards();
    }
  } catch (e) {}
  function applyView() {
    grid.style.transform = viewMode === 'canvas'
      ? 'translate(' + view.x + 'px,' + view.y + 'px) scale(' + view.s + ')'
      : '';
  }
  function layoutCanvas() {
    // Uniform aligned columns, like the original review canvas: adaptive
    // column count for the viewport aspect, fixed slot pitch, no jitter.
    var CARD_W = 420, GAP = 8; // frames read as touching; 8px breathing room
    var aspect = Math.max(0.5, stage.clientWidth / Math.max(1, stage.clientHeight));
    var cols = Math.max(2, Math.min(8, Math.round(Math.sqrt(cells.length * aspect))));
    var rowH = 0;
    cells.forEach(function (c) {
      var card = c.well.closest('.card');
      rowH = Math.max(rowH, card.offsetHeight || 330);
    });
    cells.forEach(function (c, i) {
      var col = i % cols, row = Math.floor(i / cols);
      var card = c.well.closest('.card');
      card.style.left = (col * (CARD_W + GAP)) + 'px';
      card.style.top  = (row * (rowH + GAP)) + 'px';
    });
  }
  function syncModeButtons() {
    var effective = focusEl.classList.contains('open') ? 'focus' : viewMode;
    document.querySelectorAll('[data-mode-btn]').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-mode-btn') === effective);
    });
  }
  function planeBounds() {
    var maxX = 0, maxY = 0;
    cells.forEach(function (c) {
      var card = c.well.closest('.card');
      maxX = Math.max(maxX, (parseFloat(card.style.left) || 0) + 420);
      maxY = Math.max(maxY, (parseFloat(card.style.top) || 0) + (card.offsetHeight || 330));
    });
    return { maxX: maxX, maxY: maxY };
  }
  function clampCanvasPan() {
    var b = planeBounds();
    if (!b.maxX) return;
    var pad = 40;
    var xA = pad, xB = stage.clientWidth - b.maxX * view.s - pad;
    var yA = pad, yB = stage.clientHeight - b.maxY * view.s - pad;
    view.x = Math.max(Math.min(xA, xB), Math.min(Math.max(xA, xB), view.x));
    view.y = Math.max(Math.min(yA, yB), Math.min(Math.max(yA, yB), view.y));
  }
  function zoomDisplay() {
    var el = document.getElementById('zoom-display');
    if (el) el.textContent = Math.round(view.s * 100) + '%';
  }
  function afterViewChange() {
    clampCanvasPan();
    applyView();
    zoomDisplay();
    saveState();
    if (typeof navDraw === 'function') navDraw();
  }
  function zoomTo(s2, cx, cy) {
    s2 = Math.min(1.6, Math.max(0.22, s2));
    cx = cx === undefined ? stage.clientWidth / 2 : cx;
    cy = cy === undefined ? stage.clientHeight / 2 : cy;
    view.x = cx - (cx - view.x) * (s2 / view.s);
    view.y = cy - (cy - view.y) * (s2 / view.s);
    view.s = s2;
    afterViewChange();
  }
  function fitAll() {
    var b = planeBounds();
    if (!b.maxX) return;
    var pad = 60;
    view.s = Math.min(1, Math.min(stage.clientWidth / (b.maxX + pad), stage.clientHeight / (b.maxY + pad)));
    view.x = (stage.clientWidth - b.maxX * view.s) / 2;
    view.y = (stage.clientHeight - b.maxY * view.s) / 2;
    applyView(); zoomDisplay(); saveState();
    if (typeof navDraw === 'function') navDraw();
  }
  function fitTopLeft() {
    // First entry: 0th card pinned upper-left at 1:1, same as the big canvas.
    var first = cells[0] && cells[0].well.closest('.card');
    view.s = 1;
    view.x = 24 - (first ? parseFloat(first.style.left) || 0 : 0);
    view.y = 12 - (first ? parseFloat(first.style.top) || 0 : 0);
    afterViewChange();
  }
  function setMode(m) {
    if (m === 'focus') { openFocus(lastFocusIdx); syncModeButtons(); return; }
    if (focusEl.classList.contains('open')) closeFocus();
    var entering = viewMode !== m;
    viewMode = m;
    if (!EMBEDDED) try { localStorage.setItem(MODE_KEY, m); } catch (e) {}
    document.body.classList.toggle('mode-canvas', m === 'canvas');
    document.getElementById('zoom-group').classList.toggle('visible', m === 'canvas');
    document.getElementById('cols-group').classList.toggle('visible', m === 'grid');
    if (m === 'canvas') {
      layoutCanvas();
      if (entering && !hasSavedCanvasView) fitTopLeft();
      else afterViewChange();
      hasSavedCanvasView = true;
    } else {
      applyView();
    }
    syncModeButtons();
    saveState();
    if (typeof navDraw === 'function') navDraw();
  }
  document.getElementById('zoom-in').addEventListener('click', function () { zoomTo(view.s * 1.2); });
  document.getElementById('zoom-out').addEventListener('click', function () { zoomTo(view.s / 1.2); });
  document.getElementById('zoom-fit').addEventListener('click', fitAll);
  document.getElementById('grid-cols').addEventListener('change', function (ev) {
    applyCols(ev.target.value);
    saveState();
    if (typeof navDraw === 'function') navDraw();
  });
  document.getElementById('grid-sort').addEventListener('change', function (ev) {
    applySort(ev.target.value);
    buildCards(); // sleeps everything; the IO re-observes and re-wakes nearby
    if (viewMode === 'canvas') layoutCanvas();
    drainCells();
    saveState();
    if (typeof navDraw === 'function') navDraw();
  });
  document.querySelectorAll('[data-mode-btn]').forEach(function (b) {
    b.addEventListener('click', function () { setMode(b.getAttribute('data-mode-btn')); });
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === '1') setMode('canvas');
    else if (ev.key === '2') setMode('grid');
    else if (ev.key === '3') setMode('focus');
  });

  // Pan (pointer drag) + zoom (wheel, toward cursor) for canvas mode.
  var panning = false, px = 0, py = 0;
  window.__panDist = 0;
  stage.addEventListener('pointerdown', function (ev) {
    if (viewMode !== 'canvas') return;
    if (ev.target.closest('.bar')) return; // links/buttons in card bars stay clickable
    panning = true; px = ev.clientX; py = ev.clientY;
    window.__panDist = 0;
    stage.classList.add('dragging');
    stage.setPointerCapture(ev.pointerId);
  });
  stage.addEventListener('pointermove', function (ev) {
    if (!panning) return;
    var dx = ev.clientX - px, dy = ev.clientY - py;
    px = ev.clientX; py = ev.clientY;
    window.__panDist += Math.abs(dx) + Math.abs(dy);
    view.x += dx; view.y += dy;
    afterViewChange();
  });
  stage.addEventListener('pointerup', function () {
    panning = false;
    stage.classList.remove('dragging');
    setTimeout(function () { window.__panDist = 0; }, 0);
  });
  // Double-click zooms toward the cursor; with a modifier, away from it. The
  // wheel is no longer the zoom when embedded (see below) and a single click
  // cannot be one either — the pan capture eats it — so the gesture that is
  // left, and that nothing else claims, is the double-click.
  var DBL_STEP = 1.6;
  stage.addEventListener('dblclick', function (ev) {
    if (viewMode !== 'canvas') return;
    if (ev.target.closest('.bar')) return; // the corner ⛶ is not a zoom target
    ev.preventDefault();
    var r = stage.getBoundingClientRect();
    var out = ev.altKey || ev.shiftKey || ev.metaKey;
    zoomTo(view.s * (out ? 1 / DBL_STEP : DBL_STEP), ev.clientX - r.left, ev.clientY - r.top);
  });

  stage.addEventListener('wheel', function (ev) {
    if (viewMode !== 'canvas') return;
    // Embedded, a plain wheel belongs to the host page. Standalone this is a
    // canvas tool and the wheel is its zoom; inside an article it is a reader
    // scrolling past, and swallowing that traps them wherever the cursor
    // happens to cross the panel. Pinch-zoom still reaches us — browsers
    // deliver it as a wheel with ctrlKey — so the gesture that MEANS zoom
    // keeps working, and drag-to-pan and clicking cards are untouched.
    if (EMBEDDED && !ev.ctrlKey && !ev.metaKey) return;
    ev.preventDefault();
    var r = stage.getBoundingClientRect();
    zoomTo(view.s * Math.exp(-ev.deltaY * 0.0012), ev.clientX - r.left, ev.clientY - r.top);
  }, { passive: false });

  // Restore last mode (focus restores as grid — a fullscreen page on arrival
  // would hide that this is a canvas of many).
  if (CONFIG.mode === 'canvas' || CONFIG.mode === 'grid') {
    setMode(CONFIG.mode);
    if (CONFIG.mode === 'canvas' && CONFIG.zoom) {
      if (CONFIG.zoom === 'fit') {
        fitAll();
      } else {
        var bootZ = parseFloat(CONFIG.zoom);
        if (bootZ > 0) {
          view.s = Math.min(1.6, Math.max(0.22, bootZ));
          view.x = 24; view.y = 12; // top-left anchor, like first entry
          afterViewChange();
        }
      }
    }
  } else if (CONFIG.mode === 'focus') {
    setMode('grid');
    openFocus(0);
  } else if (EMBEDDED) {
    setMode('grid'); // embeds always start predictable; params override above
  } else {
    try {
      var savedMode = localStorage.getItem(MODE_KEY);
      if (savedMode === 'canvas') setMode('canvas');
      else setMode('grid');
    } catch (e) { setMode('grid'); }
  }

  // ---- navigator — minimap active in every mode ---------------------------
  var navCanvas = document.getElementById('nav-canvas');
  var navCtx = navCanvas.getContext('2d');
  var navW = 200, navH = 150, navScale = 1, navOX = 0, navOY = 0;
  function navGeometry(contentW, contentH) {
    // Big-canvas convention: wide panel in canvas mode; narrow tall panel in
    // grid/focus whose height follows the content's aspect (clamped).
    if (viewMode === 'canvas') { navW = 200; navH = 130; return; }
    navW = 110;
    navH = Math.max(70, Math.min(170, Math.round(navW * (contentH / Math.max(1, contentW)))));
  }
  function cardRects() {
    if (focusEl.classList.contains('open') || viewMode === 'focus') {
      // Focus map = the deck itself: uniform tiles stacked in wrapped rows,
      // independent of the (hidden) grid layout and scroll behind the overlay.
      var n = cells.length;
      var cols = Math.max(1, Math.round(Math.sqrt(n * 0.46)));
      return cells.map(function (c, i) {
        return { x: (i % cols) * 18, y: Math.floor(i / cols) * 12, w: 16, h: 10, c: c, i: i };
      });
    }
    // Document-space (grid) or plane-space (canvas) rects per card.
    return cells.map(function (c, i) {
      var card = c.well.closest('.card');
      if (viewMode === 'canvas') {
        return { x: parseFloat(card.style.left) || 0, y: parseFloat(card.style.top) || 0,
                 w: 420, h: card.offsetHeight || 330, c: c, i: i };
      }
      var r = card.getBoundingClientRect();
      return { x: r.left + window.scrollX, y: r.top + window.scrollY,
               w: r.width, h: r.height, c: c, i: i };
    });
  }
  function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  var navRaf = null;
  function navDraw() {
    if (navRaf) return;
    navRaf = requestAnimationFrame(function () {
      navRaf = null;
      var focusMap = focusEl.classList.contains('open') || viewMode === 'focus';
      var rects = cardRects();
      if (!rects.length) return;
      var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      rects.forEach(function (r) {
        minX = Math.min(minX, r.x); minY = Math.min(minY, r.y);
        maxX = Math.max(maxX, r.x + r.w); maxY = Math.max(maxY, r.y + r.h);
      });
      // Focus rects are in abstract tile units — a document-scale pad would
      // shrink them to specks.
      var pad = focusMap ? 2 : 40;
      minX -= pad; minY -= pad; maxX += pad; maxY += pad;
      navGeometry(maxX - minX, maxY - minY);
      navScale = Math.min(navW / (maxX - minX), navH / (maxY - minY));
      // Tighten the panel to the drawn content — the geometry box is a MAX;
      // without this, content with a different aspect leaves dead grey space
      // beside (or under) the map.
      navW = Math.max(48, Math.round((maxX - minX) * navScale));
      navH = Math.max(36, Math.round((maxY - minY) * navScale));
      navOX = minX; navOY = minY;
      var dpr = window.devicePixelRatio || 1;
      if (navCanvas.width !== navW * dpr || navCanvas.height !== navH * dpr) {
        navCanvas.width = navW * dpr; navCanvas.height = navH * dpr;
      }
      navCanvas.style.width = navW + 'px'; navCanvas.style.height = navH + 'px';
      // Panel hugs the map: without an explicit width the header's label can
      // hold the panel open wider than the canvas — dead grey space beside
      // the map (+2 = the panel's own borders under border-box).
      document.getElementById('navigator').style.width = (navW + 2) + 'px';
      navCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      navCtx.clearRect(0, 0, navW, navH);
      var teal = css('--teal') || '#3a7a6a', rule = css('--rule') || '#d8cfc2', ink = css('--ink') || '#2a2520';
      rects.forEach(function (r) {
        navCtx.fillStyle = r.c.live ? teal : rule;
        navCtx.globalAlpha = (fIdx >= 0 && r.i === fIdx) ? 1 : (r.c.live ? 0.85 : 0.55);
        navCtx.fillRect((r.x - navOX) * navScale, (r.y - navOY) * navScale,
                        Math.max(2, r.w * navScale), Math.max(2, r.h * navScale));
        if (fIdx >= 0 && r.i === fIdx) {
          navCtx.strokeStyle = teal; navCtx.lineWidth = 1.5; navCtx.globalAlpha = 1;
          navCtx.strokeRect((r.x - navOX) * navScale - 1, (r.y - navOY) * navScale - 1,
                            r.w * navScale + 2, r.h * navScale + 2);
        }
      });
      navCtx.globalAlpha = 1;
      // viewport rectangle — meaningless over the focus deck (the overlay is
      // fullscreen; the teal ring on the current tile is the position cue)
      if (focusMap) return;
      var vx, vy, vw, vh;
      if (viewMode === 'canvas') {
        vx = -view.x / view.s; vy = -view.y / view.s;
        vw = stage.clientWidth / view.s; vh = stage.clientHeight / view.s;
      } else {
        vx = window.scrollX; vy = window.scrollY;
        vw = window.innerWidth; vh = window.innerHeight;
      }
      navCtx.strokeStyle = ink; navCtx.lineWidth = 1;
      navCtx.strokeRect((vx - navOX) * navScale, (vy - navOY) * navScale, vw * navScale, vh * navScale);
    });
  }
  function navPoint(ev) {
    var r = navCanvas.getBoundingClientRect();
    return { x: (ev.clientX - r.left) / navScale + navOX,
             y: (ev.clientY - r.top) / navScale + navOY };
  }
  function navJump(ev) {
    var pt = navPoint(ev);
    if (focusEl.classList.contains('open') || viewMode === 'focus') {
      // snap focus to the card under/nearest the point
      var rects = cardRects(); var best = null, bd = Infinity;
      rects.forEach(function (r) {
        var d = Math.abs(r.x + r.w / 2 - pt.x) + Math.abs(r.y + r.h / 2 - pt.y);
        if (d < bd) { bd = d; best = r; }
      });
      if (best) openFocus(best.i);
    } else if (viewMode === 'canvas') {
      view.x = stage.clientWidth / 2 - pt.x * view.s;
      view.y = stage.clientHeight / 2 - pt.y * view.s;
      afterViewChange();
    } else {
      window.scrollTo({ top: Math.max(0, pt.y - window.innerHeight / 2) });
    }
  }
  var navDragging = false;
  navCanvas.addEventListener('pointerdown', function (ev) { navDragging = true; navJump(ev); navCanvas.setPointerCapture(ev.pointerId); });
  navCanvas.addEventListener('pointermove', function (ev) { if (navDragging) navJump(ev); });
  navCanvas.addEventListener('pointerup', function () { navDragging = false; });
  navCanvas.addEventListener('wheel', function (ev) {
    // The navigator keeps its wheel even when embedded, unlike the stage. The
    // stage is most of the panel and you cross it by accident while reading;
    // this is a small map in the corner you have to aim at, so a wheel here is
    // already a deliberate act. Stepping the deck from the minimap is the nice
    // part of the tool and there is nothing to protect the reader from.
    ev.preventDefault(); ev.stopPropagation();
    if (focusEl.classList.contains('open')) {
      openFocus((fIdx < 0 ? 0 : fIdx) + (ev.deltaY > 0 ? 1 : -1));
    } else if (viewMode === 'canvas') {
      zoomTo(view.s * (ev.deltaY > 0 ? 0.9 : 1.1));
    } else {
      window.scrollBy({ top: ev.deltaY });
    }
  }, { passive: false });
  document.getElementById('nav-header').addEventListener('click', function () {
    document.getElementById('navigator').classList.toggle('collapsed');
    var t = document.getElementById('nav-toggle');
    t.textContent = document.getElementById('navigator').classList.contains('collapsed') ? '▴' : '▾';
  });
  window.addEventListener('scroll', navDraw, { passive: true });
  window.addEventListener('resize', navDraw, { passive: true });
  navDraw();

  // Deep link: #<name> opens focus on load.
  var h = decodeURIComponent((location.hash || '').slice(1));
  if (h) {
    var idx = items.findIndex(function (it) { return it.name === h; });
    if (idx >= 0) openFocus(idx);
  }
})();
</script>
