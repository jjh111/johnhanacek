        col = new THREE.Color(v != null ? (ac.colorFor(v) ?? PALETTE.inkFaded) : PALETTE.inkFaded);
      } else {
        const u = scaleU(ac, domains.color || aspectDomain(ac, RUNS), ac.get(run));
        col = gradientColor(u);
      }
    } else {
      col = new THREE.Color(PROGRAM_PALETTE[run.program] ?? PALETTE.inkFaded);
    }

    // ── MODULAR strata: slab encodings driven by state.slabAxes ──
    // The cube interior is no longer a fixed-Y stack.  Phases A + B + C
    // make the slab volume reflect the run's real shape:
    //   PHASE A — stack axis follows the run-level WHEN binding.  If
    //     x/y/z is bound to time-start (or another `group:'when'`
    //     aspect), the slabs stack along THAT world axis, so time at
    //     the fleet scale matches time at the cube scale.
    //   PHASE B — slab thickness along the stack axis is driven by
    //     slab:thickness (default step:share).  The compiler / verdict
    //     emerge as thick caps; inputs become thin layers.  The cube
    //     is now a flame-graph inside.
    //   PHASE C — parallel-block siblings share a band along the stack
    //     axis and spread side-by-side along the perp-depth axis.  The
    //     cube's silhouette literally shows the run's fan-out.
    const tree = nodeTreeFor(run);
    const stackAxis = getStackAxis();
    const stackLen = cubeStackExtent(w, h, d, stackAxis);
    const widthLen = cubeWidthExtent(w, h, d, stackAxis);
    const depthLen = cubeDepthExtent(w, h, d, stackAxis);

    // Group steps by phase number so parallel siblings collapse into
    // one band.  Walk the tree in order (phase ascending, sub a..f
    // within a phase) and build the phases array.
    const phases = [];
    const phaseMap = new Map();
    tree.forEach((nd, i) => {
      const p = nd.phase ?? (i + 1);
      let band = phaseMap.get(p);
      if (!band) {
        band = { phase: p, steps: [], idxs: [] };
        phaseMap.set(p, band);
        phases.push(band);
      }
      band.steps.push(nd);
      band.idxs.push(i);   // original step index in tree (for userData.nodeIndex)
    });

    // Resolve the four bindings — width, color, edge, thickness.
    const widthAsp     = stepAspectFor('slab:width',     state.slabAxes);
    const colorAsp     = stepAspectFor('slab:color',     state.slabAxes);
    const edgeAsp      = stepAspectFor('slab:edge',      state.slabAxes);
    const thicknessAsp = stepAspectFor('slab:thickness', state.slabAxes);

    // ── PHASE B: phase thickness allocation ──
    // For each phase, "phase weight" along the stack axis is the MAX
    // of its siblings' thickness-binding values (wall-clock dominator —
    // parallel siblings ran in the same time slot).  When the binding
    // is null, every phase gets weight 1 (uniform stacking, matches
    // the prior strata behaviour).
    const phaseWeights = phases.map(band => {
      if (!thicknessAsp) return 1;
      const vals = band.steps.map(nd => {
        const v = thicknessAsp.get(nd, run);
        return (v != null && Number.isFinite(v)) ? v : 0;
      });
      const m = Math.max(0, ...vals);
      return m > 0 ? m : 0.001;   // never zero — keep band visible
    });
    const totalPhaseWeight = phaseWeights.reduce((s, v) => s + v, 0) || 1;
    // Small gap between phases so layers read as discrete; clamped to
    // keep very-many-phase runs legible.
    const STACK_GAP = Math.min(0.045, stackLen / (phases.length * 8));

    // ── slab:width normalisation (per-cube) ──
    const widthValues = tree.map(nd => widthAsp ? widthAsp.get(nd, run) : nd.share);
    const cleanWVals  = widthValues.filter(v => v != null && Number.isFinite(v));
    const maxW = cleanWVals.length ? Math.max(...cleanWVals) : 1;
    // For continuous colour aspects, normalise the same way so the
    // gradient covers the cube's range, not the absolute domain.
    let colorMin = 0, colorMax = 1;
    if (colorAsp && colorAsp.type === 'continuous') {
      const cleanC = tree.map(nd => colorAsp.get(nd, run)).filter(v => v != null && Number.isFinite(v));
      if (cleanC.length) {
        colorMin = Math.min(...cleanC); colorMax = Math.max(...cleanC);
        if (colorMin === colorMax) colorMax = colorMin + 1;
      }
    }

    const group = new THREE.Group();
    group.position.set(cx, cy, cz);
    group.userData = { runId: run.id };

    const slabMats = [];
    const slabEdgeMats = [];
    const slabBaseTints = [];
    const baseCol = col.clone();

    // ── PHASE A + B + C unified slab build ──
    // Walk phases in order; for each phase compute its stack thickness
    // from the per-band weight; place siblings within the band along
    // the perp-depth axis.
    let stackCursor = -stackLen / 2;   // local coord along stackAxis
    const N = tree.length;
    phases.forEach((band, bandIdx) => {
      const phaseThickness = Math.max(
        0.025,
        (phaseWeights[bandIdx] / totalPhaseWeight) * stackLen - STACK_GAP
      );
      const stackCenter = stackCursor + phaseThickness / 2;
      const sibN = band.steps.length;
      const perSibDepth = depthLen / sibN;
      band.steps.forEach((nd, sibIdx) => {
      // Re-derive the per-slab "i" used by the prior code so the
      // userData / lookups stay consistent with the tree order.
      const i = band.idxs[sibIdx];
      // ---- WIDTH (slab:width) ----
      let widthRatio = 0.6;
      if (cleanWVals.length && maxW > 0) {
        const wv = widthValues[i];
        widthRatio = (wv != null && Number.isFinite(wv)) ? (wv / maxW) : 0.28;
      }
      widthRatio = Math.max(0.22, Math.min(1, widthRatio));
      const slabW = widthLen * widthRatio;

      // ---- COLOR (slab:color) ----
      // Default lift ramp (bottom darker → top lighter) is the BASE,
      // then the colour-aspect binding multiplies / overrides per
      // aspect type.  If no binding, fall back to the prior behaviour.
      const t = N === 1 ? 0.5 : i / (N - 1);
      const lift = 0.74 + t * 0.30;
      const tint = baseCol.clone().multiplyScalar(lift);

      let isFailFromBinding = false;
      let warmShift = 0;
      if (colorAsp) {
        if (colorAsp.type === 'categorical') {
          const v = colorAsp.get(nd, run);
          const hex = colorAsp.colorFor ? colorAsp.colorFor(v) : null;
          if (hex != null) {
            tint.copy(new THREE.Color(hex));
            // Apply the same gentle lift ramp on top so the stack reads
            // as a stratified gradient rather than flat blocks.
            tint.multiplyScalar(0.86 + t * 0.22);
          }
          // Recognise the status-binding fail value so the tick-loop can
          // hold colour against the global colour channel.
          if (colorAsp.id === 'step:status' && v === 'fail') isFailFromBinding = true;
        } else {
          // Continuous → gradient from fail-tone to accent-tone across
          // the cube's local domain.  Read as "more = warmer" for
          // outcome-y aspects like artifact-bytes.
          const cv = colorAsp.get(nd, run);
          const u = cv != null && Number.isFinite(cv)
            ? (cv - colorMin) / (colorMax - colorMin || 1)
            : 0.5;
          const cold = new THREE.Color(0x4a8a7a); // accent-soft-c teal
          const warm = new THREE.Color(0xc49a5c); // amber
          tint.copy(cold.clone().lerp(warm, u));
          tint.multiplyScalar(0.92);
        }
      }
      // Compiler / verdict still get a small amber lift unless the
      // colour binding already explicitly handles it (e.g. step:role).
      if (!colorAsp || colorAsp.id !== 'step:role') {
        if (nd.role === 'compiler' || nd.role === 'verdict') {
          tint.lerp(new THREE.Color(0xd4aa6c), 0.14);
          warmShift = 0.14;
        }
      }

      // ---- EDGE (slab:edge) ----
      // Categorical aspect drives edge colour + opacity.  Special-cases:
      // step:status with status='fail' draws a heavy fail-red edge
      // (and the slab itself stays its assigned colour so the operator
      // can still read whatever colour-binding is active).
      let edgeColor = PALETTE.inkDark || 0x2a2520;
      let edgeOpacity = 0.28;
      let isFailFromEdge = false;
      if (edgeAsp) {
        const v = edgeAsp.get(nd, run);
        if (edgeAsp.colorFor) {
          const hex = edgeAsp.colorFor(v);
          if (hex != null) edgeColor = hex;
        }
        if (edgeAsp.id === 'step:status' && v === 'fail') {
          edgeOpacity = 0.95;
          isFailFromEdge = true;
        } else if (v != null) {
          edgeOpacity = 0.58;
        }
      }

      const isFail = nd.status === 'fail';   // for tick-loop colour-hold

      const slabMat = new THREE.MeshBasicMaterial({
        color: tint,
        transparent: true,
        opacity: (isFailFromBinding || isFail) ? 0.96 : 0.86,
        polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1,
      });
      slabMats.push(slabMat);
      slabBaseTints.push({
        lift,
        warmShift,
        isFail,
        // Capture the resolved per-slab colour from bindings so the
        // animation tick can lerp toward it (and not toward the run's
        // global colour channel) — keeps colour-bindings stable.
        baseTint: tint.clone(),
        // Remember if the colour binding itself encodes fail (status)
        // so we hold red against incoming aspect-channel changes.
        boundFail: isFailFromBinding,
      });

      // PHASE A + C — build slab geometry along the chosen stack axis.
      // Thickness is the phase band thickness (PHASE B), depth is the
      // cube's perp-depth divided by sibling count (PHASE C).  Width
      // is the slab:width binding (existing behaviour, unchanged).
      const slabDepth = Math.max(0.02, perSibDepth * 0.92);   // small gap between siblings
      const slabGeo = slabBoxGeometry(phaseThickness, slabW, slabDepth, stackAxis);
      const slabMesh = new THREE.Mesh(slabGeo, slabMat);
      // PHASE C: siblings spread along perp-depth centered on the cube.
      const sibOffset = sibN === 1
        ? 0
        : -depthLen / 2 + (sibIdx + 0.5) * perSibDepth;
      slabMesh.position.copy(slabLocalPosition(stackCenter, sibOffset, stackAxis));
      // userData carries every per-step field so the tooltip can describe
      // what the slice IS (name + kind + status + phase + parallel info).
      slabMesh.userData = {
        runId:     run.id,
        nodeIndex: i,
        nodeName:  nd.name || nd.label,
        nodeLabel: nd.label,
        nodeRole:  nd.role,
        nodeKind:  nd.kind,
        nodeStatus:nd.status,
        nodePhase: nd.phase,
        nodeSub:   nd.sub || '',
        nodeShare: nd.share,
        nodeDur:   nd.durationMin,
        nodeParallel: !!nd.parallel,
        nodeSiblings: nd.siblings || [],
        nodeSource: nd.source,
      };
      group.add(slabMesh);

      // Edge — colour + opacity driven by slab:edge binding (above).
      // Fail-status edges become heavy red lines so the bad slab pops
      // even when the colour binding is something else.
      const edgesGeo = new THREE.EdgesGeometry(slabGeo);
      const edgesMat = new THREE.LineBasicMaterial({
        color: new THREE.Color(edgeColor),
        transparent: true, opacity: edgeOpacity, depthWrite: false,
        linewidth: isFailFromEdge ? 2 : 1,
      });
      slabEdgeMats.push(edgesMat);
      const edgeLines = new THREE.LineSegments(edgesGeo, edgesMat);
      edgeLines.position.copy(slabMesh.position);
      edgeLines.userData = { runId: run.id, isEdge: true };
      group.add(edgeLines);
      });   // end siblings forEach
      stackCursor += phaseThickness;
    });    // end phases forEach

    booksGroup.add(group);
    bookMeshes.push({
      mesh: group, run,
      basePos: group.position.clone(),
      missingX: px.missing, missingY: py.missing, missingZ: pz.missing,
      size: { w, h, d },
      slabMats,
      slabEdgeMats,    // MODULAR: array of edge materials so tick can refresh
      slabBaseTints,
      stackAxis,       // PHASE A: surfaced so debug + lens can read it
      isStrata: true,
      tree,
    });
  });

  // ---- Collision deconfliction (accurate, bounded) ----
  // PRINCIPLE: a cube sits at the exact world position its aspect values
  // dictate.  When two or more cubes legitimately share the same position
  // (e.g. several runs in the same program lane with near-identical
  // timestamps), we separate them ONLY along axes that carry no meaning
  // for the current encoding — the "free" axes (channels without a bound
  // aspect).  This preserves the truth on mapped axes.
  //
  // If all three position channels are mapped, fall back to the axis where
  // the colliding cluster shows the lowest aspect-value variance — that
  // axis is effectively flat for this cluster, so nudging along it
  // distorts the data the least.
  //
  // Replaces the previous golden-spiral beeswarm whose radial offsets
  // could exceed AXIS_HALF and push cubes outside the world cube.
  (function deconflict() {
    let maxEdge = SIZE_DEFAULT;
    bookMeshes.forEach(b => {
      const s = b.size || { w: SIZE_DEFAULT, h: SIZE_DEFAULT, d: SIZE_DEFAULT };
      maxEdge = Math.max(maxEdge, s.w, s.h, s.d);
    });
    const PROXIMITY = Math.max(0.85, maxEdge * 1.10);
    const STEP      = Math.max(0.95, maxEdge * 1.15);

    const hasX = !!currentDomains.x;
    const hasY = !!currentDomains.y;
    const hasZ = !!currentDomains.z;

    // Single-linkage clustering by proximity.
    const seen = new Set();
    const clusters = [];
    for (let i = 0; i < bookMeshes.length; i++) {
      if (seen.has(i)) continue;
      const grp = [i];
      seen.add(i);
      // Expand cluster by walking newly added members so chains of close
      // cubes merge into a single group (proper single-linkage).
      const queue = [i];
      while (queue.length) {
        const k = queue.shift();
        for (let j = 0; j < bookMeshes.length; j++) {
          if (seen.has(j)) continue;
          if (bookMeshes[j].basePos.distanceTo(bookMeshes[k].basePos) < PROXIMITY) {
            grp.push(j);
            queue.push(j);
            seen.add(j);
          }
        }
      }
      if (grp.length > 1) clusters.push(grp);
    }

    clusters.forEach(cluster => {
      // Deterministic ordering — same input always produces same layout.
      cluster.sort((a, b) => (bookMeshes[a].run.id < bookMeshes[b].run.id ? -1 : 1));

      // Pick deconflict axes: free axes first, then lowest-variance ones.
      const freeAxes = [];
      if (!hasX) freeAxes.push('x');
      if (!hasY) freeAxes.push('y');
      if (!hasZ) freeAxes.push('z');

      const axisVariance = (ax) => {
        const vals = cluster.map(idx => bookMeshes[idx].basePos[ax]);
        const mean = vals.reduce((s, v) => s + v, 0) / vals.length;
        return vals.reduce((s, v) => s + (v - mean) ** 2, 0) / vals.length;
      };

      let primary, secondary;
      if (freeAxes.length >= 2) {
        primary = freeAxes[0];
        secondary = freeAxes[1];
      } else if (freeAxes.length === 1) {
        primary = freeAxes[0];
        // Use the lowest-variance mapped axis as secondary if we need a 2D grid
        const mapped = ['x', 'y', 'z'].filter(ax => ax !== primary);
        secondary = mapped.sort((a, b) => axisVariance(a) - axisVariance(b))[0];
      } else {
        // All mapped — perturb along the two lowest-variance axes.
        const ordered = ['x', 'y', 'z'].sort((a, b) => axisVariance(a) - axisVariance(b));
        primary = ordered[0];
        secondary = ordered[1];
      }

      // Cluster centroid (read each book's CURRENT position, post-clamp).
      const cx = cluster.reduce((s, idx) => s + bookMeshes[idx].basePos.x, 0) / cluster.length;
      const cy = cluster.reduce((s, idx) => s + bookMeshes[idx].basePos.y, 0) / cluster.length;
      const cz = cluster.reduce((s, idx) => s + bookMeshes[idx].basePos.z, 0) / cluster.length;

      // 1D row if cluster is small (≤3), otherwise a near-square 2D grid.
      const K = cluster.length;
      const use2D = K > 3;
      const cols = use2D ? Math.ceil(Math.sqrt(K)) : K;
      const rows = use2D ? Math.ceil(K / cols) : 1;

      cluster.forEach((idx, n) => {
        const col = n % cols;
        const row = Math.floor(n / cols);
        const offP = (col - (cols - 1) / 2) * STEP;
        const offS = use2D ? (row - (rows - 1) / 2) * STEP : 0;

        let nx = cx, ny = cy, nz = cz;
        if (primary === 'x') nx += offP;
        else if (primary === 'y') ny += offP;
        else                       nz += offP;
        if (use2D) {
          if (secondary === 'x') nx += offS;
          else if (secondary === 'y') ny += offS;
          else                         nz += offS;
        }

        // Clamp into the world cube accounting for THIS cube's half-size.
        const s = bookMeshes[idx].size || { w: SIZE_DEFAULT, h: SIZE_DEFAULT, d: SIZE_DEFAULT };
        nx = Math.max(-AXIS_HALF + s.w / 2, Math.min(AXIS_HALF - s.w / 2, nx));
        ny = Math.max(-AXIS_HALF + s.h / 2, Math.min(AXIS_HALF - s.h / 2, ny));
        nz = Math.max(-AXIS_HALF + s.d / 2, Math.min(AXIS_HALF - s.d / 2, nz));

        bookMeshes[idx].mesh.position.set(nx, ny, nz);
        bookMeshes[idx].basePos.set(nx, ny, nz);
        bookMeshes[idx].fanned = true;
      });
    });
  })();

  // ---- Final defensive clamp ----
  // Belt-and-braces: every book must sit fully inside the world cube,
  // regardless of any earlier displacement (deconflict, lineage tweak,
  // future passes).  Pulling positions in by half-size here means the
  // axis frame always contains the geometry.
  bookMeshes.forEach(b => {
    const s = b.size || { w: SIZE_DEFAULT, h: SIZE_DEFAULT, d: SIZE_DEFAULT };
    const p = b.mesh.position;
    p.x = Math.max(-AXIS_HALF + s.w / 2, Math.min(AXIS_HALF - s.w / 2, p.x));
    p.y = Math.max(-AXIS_HALF + s.h / 2, Math.min(AXIS_HALF - s.h / 2, p.y));
    p.z = Math.max(-AXIS_HALF + s.d / 2, Math.min(AXIS_HALF - s.d / 2, p.z));
    b.basePos.copy(p);
  });

  // Lineage arcs — parent → eval child, regardless of layout. Drawn as
  // smooth quadratic bezier bulging slightly away from the midpoint.
  RUNS.forEach(run => {
    if (!run.evalChild) return;
    const parent = bookMeshes.find(b => b.run.id === run.id);
    const child = bookMeshes.find(b => b.run.id === run.evalChild.id);
    if (!parent || !child) return;

    const a = parent.basePos, b = child.basePos;
    const mid = new THREE.Vector3().addVectors(a, b).multiplyScalar(0.5);
    // Push midpoint outward (direction perpendicular to a-b, biased toward camera)
    const ab = new THREE.Vector3().subVectors(b, a);
    const up = new THREE.Vector3(0, 1, 0);
    const perp = new THREE.Vector3().crossVectors(ab, up).normalize();
    if (perp.length() < 0.01) perp.set(0, 0, 1);
    mid.addScaledVector(perp, 1.2);
    mid.y += 0.8;   // slight lift

    const curve = new THREE.QuadraticBezierCurve3(a, mid, b);
    const geo = new THREE.BufferGeometry().setFromPoints(curve.getPoints(28));
    const mat = new THREE.LineBasicMaterial({ color: PALETTE.accent, transparent: true, opacity: 0.5 });
    const line = new THREE.Line(geo, mat);
    arcsGroup.add(line);
    child.lineage = line;
    child.lineageParentId = run.id;
  });

  // MODULAR — CLUSTER LAYER · drawn on the floor (y = -AXIS_HALF).
  // The choice of algorithm comes from state.cluster: 'program' draws
  // per-program convex hulls, 'day' draws ground-stripes per UTC day,
  // 'none' leaves the floor clean.  Adding a new cluster type = one
  // case below + one entry in CLUSTERS.
  if (state.cluster === 'program') {
    buildProgramHulls();
  } else if (state.cluster === 'day') {
    buildDayStripes();
  }
}

/* ---- 2D convex hull (Andrew's monotone chain) — used for the
   floor program hulls.  Operates on (x, z) pairs (the floor plane). */
function _hull2D(points) {
  if (points.length < 3) return points.slice();
  const pts = points.slice().sort((a, b) => a.x - b.x || a.z - b.z);
  const cross = (O, A, B) => (A.x - O.x) * (B.z - O.z) - (A.z - O.z) * (B.x - O.x);
  const lower = [];
  for (const p of pts) {
    while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();
    lower.push(p);
  }
  const upper = [];
  for (let i = pts.length - 1; i >= 0; i--) {
    const p = pts[i];
    while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop();
    upper.push(p);
  }
  upper.pop(); lower.pop();
  return lower.concat(upper);
}

function buildProgramHulls() {
  // Group book positions by program; build a hull per program.
  const byProgram = {};
  bookMeshes.forEach(b => {
    if (b.run.isEval) return;            // evals are tied to parents via arcs
    const p = b.run.program;
    if (!byProgram[p]) byProgram[p] = [];
    byProgram[p].push({ x: b.basePos.x, z: b.basePos.z });
  });
  const floorY = -AXIS_HALF + 0.02;       // sit just above the floor grid
  // Floor edge inset so hull strokes never run off the world cube floor.
  const FLOOR_MIN = -AXIS_HALF + 0.15;
  const FLOOR_MAX =  AXIS_HALF - 0.15;
  const clampFloor = (v) => Math.max(FLOOR_MIN, Math.min(FLOOR_MAX, v));
  Object.entries(byProgram).forEach(([prog, pts]) => {
    if (pts.length < 2) return;
    // Expand hull outward a touch so it doesn't clip the cube edges, but
    // never past the floor edge — otherwise the program ring would draw
    // beyond the axis frame.
    const PAD = 0.85;
    const cx = pts.reduce((s, p) => s + p.x, 0) / pts.length;
    const cz = pts.reduce((s, p) => s + p.z, 0) / pts.length;
    const padded = pts.map(p => ({
      x: clampFloor(p.x + Math.sign(p.x - cx || 1) * PAD),
      z: clampFloor(p.z + Math.sign(p.z - cz || 1) * PAD),
    }));
    let ring = _hull2D(padded);
    if (ring.length < 3) {
      // Two-point program — synthesize a small rectangle so it still
      // reads as a region rather than a thin line.
      const dx = padded[1].x - padded[0].x, dz = padded[1].z - padded[0].z;
      const len = Math.hypot(dx, dz) || 1;
      const px = -dz / len * 0.5, pz = dx / len * 0.5;
      ring = [
        { x: padded[0].x + px, z: padded[0].z + pz },
        { x: padded[1].x + px, z: padded[1].z + pz },
        { x: padded[1].x - px, z: padded[1].z - pz },
        { x: padded[0].x - px, z: padded[0].z - pz },
      ];
    }
    // Close the loop
    const verts = [];
    ring.forEach(p => verts.push(new THREE.Vector3(p.x, floorY, p.z)));
    verts.push(verts[0].clone());
    const geo = new THREE.BufferGeometry().setFromPoints(verts);
    const col = new THREE.Color(PROGRAM_PALETTE[prog] ?? PALETTE.inkFaded);
    const mat = new THREE.LineBasicMaterial({
      color: col, transparent: true, opacity: 0.35, depthWrite: false,
    });
    const line = new THREE.LineLoop(geo, mat);
    line.userData = { program: prog };
    hullsGroup.add(line);
  });
}

/* MODULAR — day cluster: ground-stripe per UTC day.  Maps each run's
   day-of-month to a horizontal band on the floor, painted as a faint
   filled quad in alternating warm-paper / paper-aged tones.  The
   stripe extends across the full floor width but only as far in Z as
   the day's cubes reach (with a small pad), so the operator gets a
   visible time-bracket without obscuring positional context. */
function buildDayStripes() {
  const byDay = {};
  bookMeshes.forEach(b => {
    const t = new Date(b.run.startedAt);
    const day = `${t.getUTCFullYear()}-${String(t.getUTCMonth()+1).padStart(2,'0')}-${String(t.getUTCDate()).padStart(2,'0')}`;
    if (!byDay[day]) byDay[day] = [];
    byDay[day].push(b);
  });
  const floorY = -AXIS_HALF + 0.015;
  const days = Object.keys(byDay).sort();
  // Two tones rotated through the day list so adjacent days
  // contrast subtly.
  const TONES = [
    new THREE.Color(0xf0e8d8),  // paper-warm
    new THREE.Color(0xe8e0d0),  // paper-aged
  ];
  days.forEach((day, dayIdx) => {
    const books = byDay[day];
    if (!books.length) return;
    // Day stripe spans the full X range of the cube; Z range is the
    // bbox of the day's cubes + a small pad so the stripe reads as a
    // band rather than a thin line.
    let zMin = +Infinity, zMax = -Infinity;
    books.forEach(b => {
      zMin = Math.min(zMin, b.basePos.z);
      zMax = Math.max(zMax, b.basePos.z);
    });
    const PAD = 1.4;
    // Pad outward, then clamp so the day stripe stays inside the floor
    // frame.  Previously a day whose cubes sat near a Z edge would draw
    // a stripe that extended past the axis box.
    zMin = Math.max(-AXIS_HALF + 0.2, zMin - PAD);
    zMax = Math.min( AXIS_HALF - 0.2, zMax + PAD);
    const xMin = -AXIS_HALF + 0.2, xMax = AXIS_HALF - 0.2;

    // Filled quad — uses MeshBasicMaterial with very low opacity so the
    // grid still reads through.
    const w = xMax - xMin, d = zMax - zMin;
    const geo = new THREE.PlaneGeometry(w, d);
    geo.rotateX(-Math.PI / 2);
    const mat = new THREE.MeshBasicMaterial({
      color: TONES[dayIdx % TONES.length],
      transparent: true,
      opacity: 0.32,
      depthWrite: false,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set((xMin + xMax) / 2, floorY, (zMin + zMax) / 2);
    mesh.userData = { dayStripe: day };
    hullsGroup.add(mesh);

    // Hairline accent at the leading edge of the stripe, in teal,
    // with a tiny label-style tick to anchor "this is a day boundary".
    const edgeGeo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(xMin, floorY + 0.01, zMin),
      new THREE.Vector3(xMax, floorY + 0.01, zMin),
    ]);
    const edgeMat = new THREE.LineBasicMaterial({
      color: new THREE.Color(PALETTE.accent || 0x3a7a6a),
      transparent: true, opacity: 0.40, depthWrite: false,
    });
    const edge = new THREE.Line(edgeGeo, edgeMat);
    edge.userData = { dayStripeEdge: day };
    hullsGroup.add(edge);
  });
}

/* PHASE E — split the layout pipeline.  rebuildClusterLayer() can be
   called without re-doing the expensive cube/slab build when only the
   cluster channel changes.  Disposes the existing hullsGroup contents
   in place, then re-runs the chosen algorithm.  setCluster() routes
   through this instead of triggering the full layoutBooks rebuild. */
function rebuildClusterLayer() {
  while (hullsGroup.children.length) {
    const c = hullsGroup.children.pop();
    if (c.material) c.material.dispose();
    if (c.geometry) c.geometry.dispose();
  }
  if (state.cluster === 'program') buildProgramHulls();
  else if (state.cluster === 'day') buildDayStripes();
}

/* ---- Camera presets + auto-frame ----
   The default view is the 45°-edge-on "corner" — positioned so the
   cube's front-right-top corner points at the camera, the far edge
   of the cube runs perpendicular to the viewing direction (reads
   as a vertical edge in the back), and there's padding around the
   whole volume so the reader sees the frame.

   The face presets orbit so each pair of axes shows flat:
     xy — look down -Z, see X across × Y up (cost-complexity's plane)
     yz — look down -X, see Y up × Z across (eval vs program)
     xz — look down -Y, see X across × Z up (time vs eval)
*/
const CUBE_HALF = AXIS_HALF;        // 10 world units
/* CAMERA TUNING — v3 retune per JH "better fit graf to viewport".
   The cube is a 20×20×20 box.  At FOV 36° the half-angle is 18°.  To
   make the cube's height fill ~85% of the stage with breathing room
   for tick labels, we want camera distance ≈ (CUBE_HALF + 1.5) /
   tan(18°) ≈ 35.4.  Pull a touch farther on the corner so the rotation
   doesn't clip far edges.  Face-on cameras can sit closer because they
   only see a flat 20×20 face.

   These constants are exposed via the Scene Controls panel as live
   inputs — JH can dial in the right framing and read back the values
   to bake into the spec.  rebuildPresets() recomputes CAMERA_PRESETS
   from the current sceneTune values, then applyPreset() snaps to it. */
const sceneTune = {
  fov: 36,
  cornerDist: 38,
  faceDist:   34,
  cornerPitch: 0.22,    // y/dist ratio — slight downward pitch (≈ 12° below horizon)
  labelRef:  52,
  labelMin:  0.45,
  labelMax:  2.40,
};
let CAMERA_PRESETS;
function rebuildPresets() {
  const D = sceneTune.cornerDist;
  const F = sceneTune.faceDist;
  const P = sceneTune.cornerPitch;
  CAMERA_PRESETS = {
    corner: { pos: new THREE.Vector3(D * 0.707, D * P, D * 0.707), look: new THREE.Vector3(0, 0, 0) },
    xy:     { pos: new THREE.Vector3(0, 0, F),                     look: new THREE.Vector3(0, 0, 0) },
    yz:     { pos: new THREE.Vector3(-F, 0, 0),                    look: new THREE.Vector3(0, 0, 0) },
    xz:     { pos: new THREE.Vector3(0, F, 0.001),                 look: new THREE.Vector3(0, 0, 0) },
    // Legacy aliases retained so older INSIGHT.camera fields still resolve.
    pitched: { pos: new THREE.Vector3(D * 0.707, D * P, D * 0.707), look: new THREE.Vector3(0, 0, 0) },
    topdown: { pos: new THREE.Vector3(0, F, 0.001),                 look: new THREE.Vector3(0, 0, 0) },
    side:    { pos: new THREE.Vector3(-F, 0, 0),                    look: new THREE.Vector3(0, 0, 0) },
    front:   { pos: new THREE.Vector3(0, 0, F),                     look: new THREE.Vector3(0, 0, 0) },
  };
}
rebuildPresets();
const CAMERA_ALIAS = { pitched: 'corner', topdown: 'xz', side: 'yz', front: 'xy' };
let camPreset = 'corner';
function applyPreset(name) {
  // Normalise legacy insight camera names to the new face-on preset keys
  const key = CAMERA_ALIAS[name] || name;
  if (key === 'frame') {
    frameAll();
    camPreset = 'frame';
    document.querySelectorAll('[data-preset]').forEach(b => b.classList.toggle('active', b.dataset.preset === 'frame'));
    return;
  }
  const p = CAMERA_PRESETS[key];
  if (!p) return;
  camPreset = key;
  camera.position.copy(p.pos);
  camera.up.set(0, 1, 0);
  controls.target.copy(p.look);
  controls.update();
  document.querySelectorAll('[data-preset]').forEach(b => b.classList.toggle('active', b.dataset.preset === key));
}
function frameAll() {
  // Compute bounding sphere of all books, position camera to just fit.
  if (!bookMeshes.length) return;
  const bbox = new THREE.Box3();
  bookMeshes.forEach(b => bbox.expandByObject(b.mesh));
  const center = bbox.getCenter(new THREE.Vector3());
  const size = bbox.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z, 4);
  const fov = camera.fov * Math.PI / 180;
  const distance = (maxDim / 2) / Math.tan(fov / 2) * 2.0;

  // Keep camera on the pitched diagonal; just push it out enough
  const dir = new THREE.Vector3(0.5, 0.5, 1).normalize();
  camera.position.copy(center).addScaledVector(dir, distance);
  controls.target.copy(center);
  controls.update();
}
document.querySelectorAll('[data-preset]').forEach(b =>
  b.addEventListener('click', () => applyPreset(b.dataset.preset)));

// Raycaster — hover + click on books
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const $tooltip = document.getElementById('tooltip');

function hit(cx, cy) {
  const r = renderer.domElement.getBoundingClientRect();
  mouse.x = ((cx - r.left) / r.width) * 2 - 1;
  mouse.y = -((cy - r.top) / r.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  // STRATA: each book is now a Group of slab meshes, so recurse into
  // children. Filter out the hairline edge LineSegments (no surface area;
  // would never be the first hit anyway, but be explicit).
  const hits = raycaster.intersectObjects(bookMeshes.map(b => b.mesh), true)
    .filter(h => !h.object.userData || !h.object.userData.isEdge);
  return hits.length ? hits[0] : null;
}
// Helper — eval pass-rate from run (own eval if eval; else child's eval; null)
function evalRate(run) {
  if (run.isEval && run.evalTotal) return run.evalPass / run.evalTotal;
  if (run.evalChild && run.evalChild.evalTotal) return run.evalChild.evalPass / run.evalChild.evalTotal;
  return null;
}
// Build a readable breakdown of which aspect each channel is showing for a run
function aspectBreakdown(run) {
  const rows = [];
  CHANNEL_ORDER.forEach(ch => {
    const asp = currentAspects[ch];
    if (!asp) return;
    const v = asp.get(run);
    const formatted = v == null
      ? '<span style="color:var(--ink-faded)">—</span>'
      : (asp.type === 'continuous' ? asp.format(v) : (asp.labelFor ? asp.labelFor(v) : String(v)));
    rows.push(`<span style="color:var(--accent)">${CHANNELS[ch].key.toLowerCase()}</span>&nbsp;${formatted}`);
  });
  return rows.join(' &middot; ');
}

/* STRATA — shared step-card renderer.
   Used by BOTH the floating hover tooltip and the sidebar's Selected
   lens so the two surfaces speak the same visual language.

   `slabData` carries the per-slab fields stuffed into userData by the
   slab builder (or, for the sidebar, looked up from the run's tree).

   `variant` is 'tooltip' (compact) or 'sidebar' (adds an EMITS panel
   that lists the REAL binding artifact from BINDINGS_INDEX with byte
   size, plus an ENSURES gist line).  Both variants share the same
   chip palette + the same plain-English synopsis. */
function renderStepCardHTML(run, slabData, variant) {
  const u = slabData || {};
  if (!u.nodeName) return '';

  const phaseTag   = u.nodePhase ? `${u.nodePhase}${u.nodeSub || ''}` : '';
  const kindClass  = u.nodeKind || 'agent';
  const kindLabel  = u.nodeKind === 'input' ? '[input]'
                   : u.nodeKind === 'eval'  ? '[eval]'
                   : u.nodeKind === 'agent' ? 'agent'
                   : (u.nodeKind || '');
  const statusClass = u.nodeStatus === 'fail' ? 'fail' : 'pass';
  const statusLabel = u.nodeStatus === 'fail' ? '✗ FAIL' : '✓ pass';

  let synopsis = '';
  if (u.nodeKind === 'agent' && SERVICE_SYNOPSES[u.nodeName]) {
    synopsis = SERVICE_SYNOPSES[u.nodeName];
  } else if (u.nodeKind === 'eval' && EVAL_PREDICATES[u.nodeName]) {
    synopsis = EVAL_PREDICATES[u.nodeName];
  } else if (u.nodeKind === 'input') {
    // elaborated [input] synopsis
    // with INPUT_GLOSS so each input slab reads as more than just
    // "Supplied input. Bound + verified."
    const gloss = INPUT_GLOSS[u.nodeName];
    synopsis = gloss
      ? `<strong>${u.nodeName}</strong> — ${gloss}`
      : `Supplied input: <strong>${u.nodeName}</strong>. Bound + verified before the program runs.`;
  }

  // phase-role gloss. Choose the
  // PHASE_GLOSS bucket from the slab's kind + position so each
  // slab tells the reader what STAGE of the run it belongs to.
  let phaseGloss = '';
  if (u.nodeKind === 'input')      phaseGloss = PHASE_GLOSS.input;
  else if (u.nodeKind === 'eval')  phaseGloss = PHASE_GLOSS.eval;
  else if (u.nodeKind === 'agent') {
    // Agents fall into three buckets: profile (single), scout (parallel
    // fan-out), synthesis (single after scouts). Heuristic: parallel ⇒
    // scout, name ending in -compiler (or a composite step named after
    // its program) ⇒ synthesis, else profile.
    if (u.nodeParallel)                   phaseGloss = PHASE_GLOSS.scout;
    else if (/-compiler$/.test(u.nodeName) || (run && u.nodeName === run.program))
                                          phaseGloss = PHASE_GLOSS.synthesis;
    else                                  phaseGloss = PHASE_GLOSS.profile;
  }

  const sharePct = u.nodeShare != null ? (u.nodeShare * 100).toFixed(1) + '%' : '—';
  const durMin   = u.nodeDur != null
    ? (u.nodeDur.toFixed(u.nodeDur < 1 ? 2 : 1)) + ' min'
    : '—';

  let siblingsHTML = '';
  if (u.nodeParallel && Array.isArray(u.nodeSiblings) && u.nodeSiblings.length > 1) {
    const me = u.nodeName;
    siblingsHTML = `<div class="tt-step-siblings">‖ ${u.nodeSiblings.map(s => s === me ? `<span class="me">${s}</span>` : s).join(' · ')}</div>`;
  }

  // EMITS / RECEIVES section — sidebar variant only.  Pulls REAL
  // artifact names + byte sizes from BINDINGS_INDEX.  Inputs read the
  // `caller` pseudo-step's matching file; agents read their own dir.
  let emitsHTML = '';
  if (variant === 'sidebar') {
    const runBindings = (run && BINDINGS_INDEX[run.id]) || null;
    let artifacts = null;
    let emitsLabel = 'EMITS';
    if (u.nodeKind === 'input' && runBindings && runBindings.caller) {
      const match = runBindings.caller.find(b => b.name.replace(/\.md$/, '') === u.nodeName);
      if (match) { artifacts = [match]; emitsLabel = 'RECEIVES'; }
    } else if (u.nodeKind === 'agent' && runBindings && runBindings[u.nodeName]) {
      artifacts = runBindings[u.nodeName];
    } else if (u.nodeKind === 'eval' && runBindings && runBindings.evaluator) {
      artifacts = runBindings.evaluator;
      emitsLabel = 'CHECK RESULT';
    }
    let artifactsHTML = '';
    if (artifacts && artifacts.length) {
      artifactsHTML = `<ul class="atm-step-artifacts">${
        artifacts.map(a => `<li><span class="art-name">${a.name}</span><span class="art-bytes">${a.bytes.toLocaleString()} bytes</span></li>`).join('')
      }</ul>`;
    } else {
      artifactsHTML = `<div class="atm-step-empty">no artifact recorded</div>`;
    }
    // ENSURES gist — what the contract says this step guarantees.
    let ensuresLine = '';
    if (u.nodeKind === 'agent' && ENSURES_GIST[u.nodeName]) {
      ensuresLine = `<div class="atm-step-ensures"><span class="ens-k">ensures</span> ${ENSURES_GIST[u.nodeName]}</div>`;
    }
    emitsHTML = `
      <div class="atm-step-emits">
        <div class="atm-step-emits-eyebrow">${emitsLabel}</div>
        ${artifactsHTML}
        ${ensuresLine}
      </div>`;
  }

  const wrapClass = variant === 'sidebar' ? 'atm-step-card' : 'tt-step';
  return `
    <div class="${wrapClass}">
      <div class="tt-step-head">
        ${phaseTag ? `<span class="tt-step-phase">${phaseTag}</span>` : ''}
        <span class="tt-step-name">${u.nodeName}</span>
      </div>
      ${phaseGloss ? `<div class="tt-step-phase-gloss">${phaseGloss}</div>` : ''}
      <div class="tt-step-chips">
        <span class="tt-step-chip ${kindClass}">${kindLabel}</span>
        <span class="tt-step-chip ${statusClass}">${statusLabel}</span>
        ${u.nodeParallel ? `<span class="tt-step-chip parallel">‖ parallel</span>` : ''}
      </div>
      ${synopsis ? `<div class="tt-step-synopsis">${synopsis}</div>` : ''}
      <div class="tt-step-meta">share ${sharePct} · est. ${durMin}${u.nodeSource ? ' · ' + u.nodeSource : ''}</div>
      ${siblingsHTML}
      ${emitsHTML}
    </div>`;
}

/* STRATA — stable-hover cache.  As the cursor crosses between slabs
   inside the same cube, the raycaster fires a hit on each frame and
   the previous tooltip code re-built innerHTML EVERY frame.  That
   produced a visible flash whenever the cursor crossed a gap or
   transitioned from one slab to another inside the same run-cube.

   Two changes solve it:
     - `lastHoverKey` records "<runId>|<nodeIndex>".  When the new hit
       has the same key, the tooltip is repositioned but innerHTML is
       NOT re-written — no flash.
     - On a raycaster MISS we no longer hide the tooltip.  We keep the
       last shown content visible and let the cursor coast through the
       between-slab gaps without the tooltip blinking out.  The tooltip
       only hides on pointerleave (cursor exits the canvas entirely).
*/
let lastHoverKey = null;

renderer.domElement.addEventListener('pointermove', e => {
  const h = hit(e.clientX, e.clientY);
  if (h) {
    const id = h.object.userData.runId;
    state.hoveredId = id;
    const r = RUNS.find(x => x.id === id);
    if (!r) return;
    const u = h.object.userData || {};
    const key = `${id}|${u.nodeIndex != null ? u.nodeIndex : ''}`;

    // Position update is cheap — always reposition the tooltip even
    // when the slab key is unchanged so it tracks the cursor smoothly.
    $tooltip.style.display = 'block';
    $tooltip.style.left = Math.min(e.clientX + 14, window.innerWidth - 400) + 'px';
    $tooltip.style.top  = Math.min(e.clientY + 14, window.innerHeight - 320) + 'px';

    // Only rebuild innerHTML when the slab (or run) changes.
    if (key === lastHoverKey) return;
    lastHoverKey = key;

    const ec = r.evalChild;
    let cls = 'pass';
    let label = '—';
    if (r.isEval) {
      cls = r.evalPass === r.evalTotal ? 'pass' : (r.evalPass / r.evalTotal >= 0.8 ? 'partial' : 'fail');
      label = `eval ${r.evalPass} / ${r.evalTotal}`;
    } else if (ec) {
      cls = ec.evalPass === ec.evalTotal ? 'pass' : 'partial';
      label = `eval ${ec.evalPass} / ${ec.evalTotal}`;
    } else {
      label = `no eval`;
      cls = '';
    }
    const shape = aspectBreakdown(r) ||
      '<span style="color:var(--ink-faded)">no aspects assigned</span>';
    const stepHTML = renderStepCardHTML(r, u, 'tooltip');

    // surface a one-line program-flow
    // gloss under the run identity so the reader knows what shape of
    // run this cube represents BEFORE drilling into any slab.
    const programLabel = PROGRAMS[r.program].label;
    const programFlow  = RUN_PROGRAM_FLOW[programLabel] || '';
    $tooltip.innerHTML = `
      <div class="tt-kind">${programLabel}${r.isEval ? ' · eval' : ''}</div>
      <div class="tt-subject">${r.subject}</div>
      <div class="tt-meta">${r.id}</div>
      ${programFlow ? `<div class="tt-program-flow">${programFlow}</div>` : ''}
      <div class="tt-meta" style="margin-top:0.25rem;line-height:1.5">${shape}</div>
      ${label !== '—' ? `<div class="tt-eval ${cls}">${label}</div>` : ''}
      ${stepHTML}`;
  }
  // STRATA: raycaster miss — do NOT hide the tooltip.  Let it keep
  // showing the last hit so crossing slab gaps inside a cube reads as
  // continuous.  pointerleave clears it for real.
});
renderer.domElement.addEventListener('pointerleave', () => {
  state.hoveredId = null;
  lastHoverKey = null;
  $tooltip.style.display = 'none';
});
renderer.domElement.addEventListener('click', e => {
  const h = hit(e.clientX, e.clientY);
  if (h) {
    // STRATA: pass the clicked slab's nodeIndex so the sidebar's
    // Selected lens locks the same step the cursor was on.
    const u = h.object.userData || {};
    setSelected(u.runId, u.nodeIndex);
  } else {
    // Empty-space click anywhere on the canvas deselects and steps the
    // right rail back to the Summary lens. Reads as "I'm done with that
    // run, give me the fleet view" — a more natural escape than chasing
    // the Summary tab on the right edge.
    if (state.selectedId) {
      setSelected(null);
      setLens('summary');
    }
  }
});

/* Legend reads the ACTIVE colour channel — whatever aspect is bound to
   `color`, whatever mode we're in.  Categorical aspects surface each
   value's palette swatch; continuous aspects surface the fail→pass
   gradient with min/max labels.  If nothing is assigned, the mode
   fallback applies (gate state in Reading, eval band in Operations). */
const $legend = document.getElementById('legend');
function hexFromColorInt(n) {
  return '#' + (n >>> 0).toString(16).padStart(6, '0');
}
function renderLegend() {
  const ac = currentAspects?.color;
  if (ac) {
    if (ac.type === 'categorical') {
      $legend.innerHTML = (ac.values || []).map(v => {
        const col = hexFromColorInt(ac.colorFor(v) ?? PALETTE.inkFaded);
        const label = ac.labelFor ? ac.labelFor(v) : String(v);
        return `<span><span class="sw" style="background:${col}"></span>${label}</span>`;
      }).join('');
    } else {
      // Continuous — gradient swatch + min / max labels from the live domain
      const dom = currentDomains?.color;
      const lo = dom ? ac.format(dom.min) : 'low';
      const hi = dom ? ac.format(dom.max) : 'high';
      $legend.innerHTML = `
        <span><span class="sw" style="background:var(--fail)"></span>${lo}</span>
        <span><span class="sw" style="background:var(--partial)"></span>\u2192</span>
        <span><span class="sw" style="background:var(--pass)"></span>${hi}</span>`;
    }
    return;
  }
  // No colour channel → mode-default (runtime tick() paints these)
  if (state.mode === 'reading') {
    $legend.innerHTML = `
      <span><span class="sw" style="background:var(--pass)"></span>delivered</span>
      <span><span class="sw" style="background:var(--partial)"></span>awaiting</span>
      <span><span class="sw" style="background:var(--pending)"></span>scheduled</span>`;
  } else {
    $legend.innerHTML = `
      <span><span class="sw" style="background:var(--pass)"></span>eval 90+</span>
      <span><span class="sw" style="background:var(--partial)"></span>70&ndash;89</span>
      <span><span class="sw" style="background:var(--fail)"></span>&lt; 70</span>`;
  }
}
renderLegend();

// Animation loop
const clock = new THREE.Clock();
// Reference distance for inverse-zoom — when the camera sits at sceneTune.labelRef
// units from the cube center, sprites render at their natural baseScale; closer
// shrinks them, farther grows them, so screen size stays constant.  The clamp
// floors prevent sprites from disappearing at close zoom and from blowing up
// at far zoom.  All three values are live-tunable via the Scene Controls panel.

function tick() {
  requestAnimationFrame(tick);
  const t = clock.getElapsedTime();
  controls.update();

  // ---- Inverse-zoom on axis labels ----
  // Walk every sprite tagged as an axis label, scale it by camera distance
  // so the on-screen size stays roughly constant. Cheap — there are only
  // ~3 titles + ~15 tick labels + ~10 lane labels at most.
  axesGroup.traverse(node => {
    if (!node.isSprite || !node.userData.isAxisLabel) return;
    const dist = camera.position.distanceTo(node.position);
    let k = dist / sceneTune.labelRef;
    if (k < sceneTune.labelMin) k = sceneTune.labelMin;
    if (k > sceneTune.labelMax) k = sceneTune.labelMax;
    const [bx, by] = node.userData.baseScale;
    node.scale.set(bx * k, by * k, 1);
  });

  // ---- Scene controls live readouts (cheap, throttled to ~12 Hz) ----
  if ((sceneReadoutTick = (sceneReadoutTick + 1) % 5) === 0) updateSceneReadouts();

  // ---- Filter-active frame fade ----
  // Lerp the warm-amber outline opacity toward 0.55 when a filter is
  // narrowing the view, 0 otherwise.  Same warm hue as the filter chip
  // inside the pill — both UI surfaces tell the same story.
  const filterActive = (state.runFilter && state.runFilter !== 'all') || state.laneFilter;
  const targetFrameOp = filterActive ? 0.55 : 0;
  filterFrame.material.opacity += (targetFrameOp - filterFrame.material.opacity) * 0.12;

  // ---- Per-book spine colour, opacity, pulse ----
  //
  // Colour selection priority:
  //   1. User-assigned colour channel (from the axis controller) — wins.
  //   2. Else mode-driven: Reading colours by gate state; Operations
  //      colours by eval pass-rate (fail/partial/pass gradient).
  //
  // This keeps the axis controller honest: if the user says "colour by
  // program", we don't secretly override it based on mode.
  bookMeshes.forEach(b => {
    const r = b.run;
    const isSel = state.selectedId === r.id;
    const isHov = state.hoveredId === r.id;
    const visible = runVisible(r);

    let target;
    const ac = currentAspects.color;
    if (ac) {
      if (ac.type === 'categorical') {
        const v = ac.get(r);
        target = new THREE.Color(v != null ? (ac.colorFor(v) ?? 0xa8a29e) : 0xa8a29e);
      } else {
        const dom = currentDomains.color || aspectDomain(ac, RUNS);
        const u = scaleU(ac, dom, ac.get(r));
        target = gradientColor(u);
      }
    } else if (state.mode === 'reading') {
      if (r.gate === 'delivered') target = new THREE.Color(PALETTE.pass);
      else if (r.gate === 'awaiting') target = new THREE.Color(PALETTE.partial);
      else target = new THREE.Color(PALETTE.pending);
    } else {
      const ratio = evalRate(r);
      if (ratio !== null) {
        target = ratio >= 0.99 ? new THREE.Color(PALETTE.pass)
               : ratio >= 0.8  ? new THREE.Color(PALETTE.partial)
                               : new THREE.Color(PALETTE.fail);
      } else {
        target = new THREE.Color(PALETTE.inkFaded);
      }
    }

    // MODULAR: lerp every slab's material toward its baseTint (set by
    // the slab builder from the slab:color binding).  When NO colour
    // binding is active (state.slabAxes['slab:color'] === null) we fall
    // back to the prior behaviour — lerp toward the run's colour
    // channel with the per-slab lift ramp.  Failed slabs continue to
    // HOLD fail-red against any incoming colour change.
    if (b.slabMats && b.slabBaseTints) {
      const warmCol = new THREE.Color(0xd4aa6c);
      const failCol = new THREE.Color(PALETTE.fail || 0xb34a3e);
      const colorBound = !!state.slabAxes['slab:color'];
      for (let i = 0; i < b.slabMats.length; i++) {
        const t = b.slabBaseTints[i] || {};
        const { lift = 1, warmShift = 0, isFail = false, baseTint, boundFail = false } = t;
        if (isFail || boundFail) {
          // Status-bound or true ✗ slabs: hold red.
          b.slabMats[i].color.lerp(failCol, 0.15);
          continue;
        }
        if (colorBound && baseTint) {
          // Slab:color binding is authoritative — lerp toward its
          // resolved value, not toward the run-level colour channel.
          b.slabMats[i].color.lerp(baseTint, 0.15);
          continue;
        }
        // No slab:color binding → original behaviour.
        const slabTarget = target.clone().multiplyScalar(lift);
        if (warmShift) slabTarget.lerp(warmCol, warmShift);
        b.slabMats[i].color.lerp(slabTarget, 0.15);
      }
    } else {
      b.mesh.material.color.lerp(target, 0.15);
    }

    // Opacity layers:
    //   filtered-out  →  0.22  (still visible — the cube's shape is preserved
    //                          across filter toggles, geometry stays stable)
    //   missing-value →  0.55  (approximate placement, ghosted)
    //   in-fleet      →  0.92  (default — whole fleet is legible)
    //   non-selected when selection exists → 0.80 (slight de-emphasis)
    //   hovered / selected  →  1.0
    const anyMissing = b.missingX || b.missingY || b.missingZ;
    let targetOp = anyMissing ? 0.55 : 0.92;
    if (!visible) targetOp = 0.22;
    else if (state.selectedId && !isSel) targetOp = anyMissing ? 0.5 : 0.8;
    if (isHov || isSel) targetOp = 1.0;
    // MODULAR: slab opacity respects step-level filters too.  When a
    // step filter is active and a slab doesn't match, dim it to 0.18 —
    // the cube's GEOMETRY stays intact (positional context preserved)
    // but the operator instantly sees which cubes have a matching slab.
    // Step-filter dim is multiplicative with the run-level opacity so a
    // filtered-out RUN is still dimmer than a filtered-out STEP.
    if (b.slabMats) {
      const slabOp = targetOp * 0.93;
      const sf = state.stepFilters;
      const anyStepFilterActive = sf.status || sf.kind || sf.role || sf.parallel;
      for (let i = 0; i < b.slabMats.length; i++) {
        const m = b.slabMats[i];
        let op = slabOp;
        if (anyStepFilterActive && b.tree && b.tree[i]) {
          const nd = b.tree[i];
          let match = true;
          if (sf.status   && nd.status   !== sf.status)   match = false;
          if (sf.kind     && nd.kind     !== sf.kind)     match = false;
          if (sf.role     && nd.role     !== sf.role)     match = false;
          if (sf.parallel === 'parallel' && !nd.parallel) match = false;
          if (sf.parallel === 'serial'   &&  nd.parallel) match = false;
          if (!match) op = Math.min(op, 0.18);
        }
        m.opacity += (op - m.opacity) * 0.15;
        // Edges fade in parallel with their slab so a dimmed slab
        // doesn't keep a stark ink edge floating around.
        if (b.slabEdgeMats && b.slabEdgeMats[i]) {
          const em = b.slabEdgeMats[i];
          // Preserve relative edge prominence (fail edges stay loud).
          const baseEdgeOp = em.userData?.baseOpacity != null ? em.userData.baseOpacity : 0.4;
          const targetEdgeOp = (op < 0.3) ? op * 0.4 : baseEdgeOp * (op / 0.93);
          em.opacity += (targetEdgeOp - em.opacity) * 0.15;
        }
      }
    } else {
      b.mesh.material.opacity += (targetOp - b.mesh.material.opacity) * 0.15;
    }

    // Selection is signalled by the static outline (see selectionOutline
    // sync below), not by motion.  All books lerp back to their base
    // position regardless of selection state — no float, no pulse.
    b.mesh.position.x += (b.basePos.x - b.mesh.position.x) * 0.18;
    b.mesh.position.y += (b.basePos.y - b.mesh.position.y) * 0.18;
    b.mesh.position.z += (b.basePos.z - b.mesh.position.z) * 0.18;

    // Lineage arc visibility + colour
    if (b.lineage) {
      let lop = 0.4;
      if (!visible) lop = 0.05;
      if (state.selectedId && (isSel || state.selectedId === b.lineageParentId)) lop = 0.95;
      b.lineage.material.opacity += (lop - b.lineage.material.opacity) * 0.15;
    }
  });

  // ---- Selection outline sync ----
  // Wrap whichever book is selected with the teal outline, sized just
  // larger than the book so the lines sit clear of the surface.  Hide
  // the outline when nothing is selected.
  if (state.selectedId) {
    const sb = bookMeshes.find(b => b.run.id === state.selectedId);
    if (sb) {
      selectionOutline.position.copy(sb.mesh.position);
      const PAD = 0.18;
      selectionOutline.scale.set(sb.size.w + PAD, sb.size.h + PAD, sb.size.d + PAD);
      selectionOutline.visible = true;
    } else {
      selectionOutline.visible = false;
    }
  } else {
    selectionOutline.visible = false;
  }

  renderer.render(scene, camera);
}

/* ============================================
   SCENE CONTROLS — live readouts + dial-in inputs
   --------------------------------------------
   The right-edge panel shows current camera state and lets the user
   tune the framing constants live.  Inputs are bound to sceneTune;
   readouts are updated from the tick loop (throttled to ~12 Hz so we
   don't thrash the DOM).  The snap button prints the current pose as a JS preset
   block; Reapply re-snaps the active preset using current frame
   constants — useful after dragging an input slider so the camera
   responds without manually clicking a preset.
   ============================================ */
let sceneReadoutTick = 0;
const $sc = {
  fov:      document.getElementById('sc-fov'),
  dist:     document.getElementById('sc-dist'),
  pos:      document.getElementById('sc-pos'),
  look:     document.getElementById('sc-look'),
  preset:   document.getElementById('sc-preset'),
  inFov:    document.getElementById('sc-in-fov'),
  inCorner: document.getElementById('sc-in-corner'),
  inFace:   document.getElementById('sc-in-face'),
  inPitch:  document.getElementById('sc-in-pitch'),
  inRef:    document.getElementById('sc-in-ref'),
  inMin:    document.getElementById('sc-in-min'),
  inMax:    document.getElementById('sc-in-max'),
  snap:     document.getElementById('sc-snap'),
  reset:    document.getElementById('sc-reset'),
  snippet:  document.getElementById('sc-snippet'),
  toggle:   document.getElementById('scene-toggle'),
  panel:    document.getElementById('scene-controls'),
};

const _f = (n, p = 1) => Number(n).toFixed(p);
function updateSceneReadouts() {
  if (!$sc.pos || !document.body.contains($sc.panel) || $sc.panel.classList.contains('collapsed')) return;
  const p = camera.position;
  const t = controls.target;
  const d = p.distanceTo(t);
  // Skip the FOV readout — the FOV input itself shows the live value
  // (its scrub handler keeps it in sync with camera.fov).
  $sc.dist.textContent = _f(d, 1);
  $sc.preset.textContent = camPreset;
  $sc.pos.querySelectorAll('[data-k]').forEach(el => {
    el.textContent = _f(p[el.dataset.k], 1);
  });
  $sc.look.querySelectorAll('[data-k]').forEach(el => {
    el.textContent = _f(t[el.dataset.k], 1);
  });
}

// Collapse / expand
$sc.toggle.addEventListener('click', () => {
  $sc.panel.classList.toggle('collapsed');
  const open = !$sc.panel.classList.contains('collapsed');
  $sc.toggle.setAttribute('aria-expanded', String(open));
  if (open) updateSceneReadouts();
});
$sc.toggle.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $sc.toggle.click(); }
});

// Live binding: input → sceneTune → re-apply preset (so camera responds).
function _bindInput(el, key, post) {
  el.addEventListener('input', () => {
    const v = parseFloat(el.value);
    if (Number.isNaN(v)) return;
    sceneTune[key] = v;
    if (post) post();
  });
}
_bindInput($sc.inFov, 'fov', () => {
  camera.fov = sceneTune.fov;
  camera.updateProjectionMatrix();
});
_bindInput($sc.inCorner, 'cornerDist', () => { rebuildPresets(); applyPreset(camPreset); });
_bindInput($sc.inFace,   'faceDist',   () => { rebuildPresets(); applyPreset(camPreset); });
_bindInput($sc.inPitch,  'cornerPitch',() => { rebuildPresets(); applyPreset(camPreset); });
_bindInput($sc.inRef,    'labelRef');         // tick loop reads sceneTune.labelRef directly
_bindInput($sc.inMin,    'labelMin');
_bindInput($sc.inMax,    'labelMax');

// snap: print current camera as a copy-pasteable preset block.
$sc.snap.addEventListener('click', () => {
  const p = camera.position, t = controls.target;
  const block = `${camPreset}: { pos: new THREE.Vector3(${_f(p.x, 2)}, ${_f(p.y, 2)}, ${_f(p.z, 2)}), look: new THREE.Vector3(${_f(t.x, 2)}, ${_f(t.y, 2)}, ${_f(t.z, 2)}) },\n` +
    `// fov ${_f(camera.fov, 1)}°  ·  distance ${_f(p.distanceTo(t), 1)}`;
  $sc.snippet.innerHTML = '<span class="c">// snapped</span>\n' +
    block.replace(/^([a-z]+):/, '<span class="k">$1</span>:')
         .replace(/(new THREE\.Vector3\([^)]+\))/g, '<span class="v">$1</span>')
         .replace(/(\/\/.*)$/m, '<span class="c">$1</span>');
  $sc.snippet.hidden = false;
});

// Reapply: re-snap to active preset using current frame constants.
$sc.reset.addEventListener('click', () => {
  rebuildPresets();
  applyPreset(camPreset);
});

// Sync inputs back to sceneTune in case defaults differ.
$sc.inFov.value    = sceneTune.fov;
$sc.inCorner.value = sceneTune.cornerDist;
$sc.inFace.value   = sceneTune.faceDist;
$sc.inPitch.value  = sceneTune.cornerPitch;
$sc.inRef.value    = sceneTune.labelRef;
$sc.inMin.value    = sceneTune.labelMin;
$sc.inMax.value    = sceneTune.labelMax;
updateSceneReadouts();

/* ============================================
   FIGMA-STYLE SCRUB — generalized for every value in the panel
   --------------------------------------------
   `makeScrub(label, opts)` wires Figma-style horizontal-drag
   to ANY value source.  `opts.get` reads the current value;
   `opts.set` writes a new value; `opts.post` runs after each
   commit so the scene can react.  Input-bound scrubs use
   bindInputScrub() which routes through the input's value +
   `input` event so the existing _bindInput handlers still fire.
   Live-value scrubs (camera position, target, distance, preset)
   skip the input layer and write directly to camera/controls.
   Shift = fine (0.1× step), Cmd / Ctrl / Alt = coarse (10×).
   3px dead-zone preserves click-to-edit on adjacent inputs.
   Double-click resets to the value at first attach.
   ============================================ */
const SCRUB_PX_PER_STEP = 4;
const SCRUB_DEAD_ZONE   = 3;

function makeScrub(label, opts) {
  const { get, set, step = 1, min = -Infinity, max = Infinity, decimals = 1, post, defaultVal, snap = true } = opts;
  const initialDefault = (defaultVal !== undefined) ? defaultVal : get();
  let active = null;

  label.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    label.setPointerCapture(e.pointerId);
    const startVal = get();
    active = { startX: e.clientX, startVal: Number.isFinite(startVal) ? startVal : 0, pointerId: e.pointerId, moved: false };
  });

  label.addEventListener('pointermove', (e) => {
    if (!active || e.pointerId !== active.pointerId) return;
    const dx = e.clientX - active.startX;
    if (!active.moved && Math.abs(dx) < SCRUB_DEAD_ZONE) return;
    if (!active.moved) {
      active.moved = true;
      label.classList.add('scrubbing');
      document.body.classList.add('atm-scrubbing');
    }
    let mult = 1;
    if (e.shiftKey) mult = 0.1;
    else if (e.metaKey || e.ctrlKey || e.altKey) mult = 10;
    let v = active.startVal + (dx / SCRUB_PX_PER_STEP) * step * mult;
    if (v < min) v = min;
    if (v > max) v = max;
    if (snap) {
      v = Math.round(v / (step * mult || step)) * (step * mult || step);
      v = parseFloat(v.toFixed(Math.max(decimals, 4)));
    }
    set(v);
    if (post) post(v);
  });

  const release = (e) => {
    if (!active || e.pointerId !== active.pointerId) return;
    try { label.releasePointerCapture(e.pointerId); } catch (_) {}
    label.classList.remove('scrubbing');
    document.body.classList.remove('atm-scrubbing');
    active = null;
  };
  label.addEventListener('pointerup', release);
  label.addEventListener('pointercancel', release);

  label.addEventListener('dblclick', () => {
    if (Number.isFinite(initialDefault)) { set(initialDefault); if (post) post(initialDefault); }
  });
}

// Bind the seven input-backed scrubs (fov, corner d, face d, pitch,
// ref dist, min k, max k).  Each label drag writes to its <input>
// and fires a synthetic input event so _bindInput's handler runs.
document.querySelectorAll('.atm-scene .lab.scrub[data-scrub]').forEach(label => {
  const input = document.getElementById(label.dataset.scrub);
  if (!input) return;
  const step = parseFloat(input.step) || 1;
  const min  = input.min !== '' ? parseFloat(input.min) : -Infinity;
  const max  = input.max !== '' ? parseFloat(input.max) :  Infinity;
  const decimals = (step.toString().split('.')[1] || '').length;
  const def = parseFloat(input.getAttribute('value'));

  makeScrub(label, {
    get:  () => parseFloat(input.value) || 0,
    set:  v => { input.value = v.toFixed(decimals); input.dispatchEvent(new Event('input', { bubbles: true })); },
    step, min, max, decimals,
    defaultVal: Number.isFinite(def) ? def : undefined,
  });
});

// Live-value scrubs — distance, position xyz, target xyz, preset.
// These write directly to camera/controls instead of a sceneTune entry.
const PRESET_CYCLE = ['corner', 'xy', 'yz', 'xz'];
function _scrubLive(selector, opts) {
  const el = document.querySelector(selector);
  if (el) makeScrub(el, opts);
}
// Distance — drag scales camera offset along the current view direction.
_scrubLive('.atm-scene [data-live="dist"]', {
  get: () => camera.position.distanceTo(controls.target),
  set: v => {
    const safe = Math.max(0.5, v);
    const dir = camera.position.clone().sub(controls.target);
    if (dir.lengthSq() < 1e-6) dir.set(0, 0, 1);
    dir.normalize();
    camera.position.copy(controls.target).addScaledVector(dir, safe);
    controls.update();
  },
  step: 0.5, min: 0.5, max: 200, decimals: 1,
  defaultVal: undefined,    // double-click is a no-op for distance — Reapply handles reset
});
// Pos x / y / z
['x','y','z'].forEach(axis => {
  _scrubLive(`.atm-scene [data-live="pos-${axis}"]`, {
    get: () => camera.position[axis],
    set: v => { camera.position[axis] = v; controls.update(); },
    step: 0.5, decimals: 1,
  });
});
// Target x / y / z — moving the look-at point pans the orbit center.
['x','y','z'].forEach(axis => {
  _scrubLive(`.atm-scene [data-live="tgt-${axis}"]`, {
    get: () => controls.target[axis],
    set: v => { controls.target[axis] = v; controls.update(); },
    step: 0.5, decimals: 1,
    defaultVal: 0,            // dbl-click on a target axis snaps it back to origin
  });
});
// Preset — drag cycles forward/back through PRESET_CYCLE.
_scrubLive('.atm-scene [data-live="preset"]', {
  get: () => PRESET_CYCLE.indexOf(camPreset),
  set: v => {
    const n = PRESET_CYCLE.length;
    const idx = ((Math.round(v) % n) + n) % n;
    if (PRESET_CYCLE[idx] !== camPreset) applyPreset(PRESET_CYCLE[idx]);
  },
  step: 1, min: -100, max: 100, decimals: 0,
  defaultVal: 0,             // dbl-click → corner
});

tick();

/* ============================================
   6b. AXIS CONTROLLER UI
   ------------------------------------------
   The chip strip at the top of the stage. Each chip
   represents one visual channel. Clicking a chip opens
   a popover with:
     - a search input (autocomplete over aspect labels)
     - the aspect list, sectioned by type
     - a hint line that changes based on the channel's
       role (position / size / colour)

   The popover closes on Escape, outside click, or
   selection. Clear button (×) on assigned chips wipes
   the channel. Preset buttons overwrite every channel
   to a known-good config.
   ============================================ */
const $axisChips = document.getElementById('axis-chips');
const $axisBar = document.getElementById('axis-bar');
// Stage-hint was the bottom-left axis readout; consolidated into the
// insight caption + story matrix (single source of truth for the mapping).
const $stageHint = null;

/* MODULAR — slab chip strip.  Mirrors renderAxisChips but populates
   the #slab-chips container with chips for state.slabAxes. */
const $slabChips      = document.getElementById('slab-chips');
const $stepFilterChips = document.getElementById('stepfilter-chips');
const $narration      = document.getElementById('narration');
let slabOpenChip = null;     // module-local: which slab chip's popover is open

function renderSlabChips() {
  if (!$slabChips) return;
  const html = SLAB_CHANNEL_ORDER.map(ch => {
    const cfg = SLAB_CHANNELS[ch];
    const aId = state.slabAxes[ch];
    const asp = aId ? STEP_ASPECTS[aId] : null;
    const isActive = slabOpenChip === ch;
    if (!asp) {
      const cls = `atm-slab-chip empty${isActive ? ' active' : ''}`;
      return `<div class="${cls}" data-slab-ch="${ch}" title="${cfg.label} — click to bind a step aspect">
        <span class="sc-key">+ ${cfg.key}</span>
        <span class="sc-label">${cfg.label.toLowerCase()}</span>
      </div>`;
    }
    const cls = `atm-slab-chip${isActive ? ' active' : ''}`;
    return `<div class="${cls}" data-slab-ch="${ch}">
      <span class="sc-key">${cfg.key}</span>
      <span class="sc-reg">${asp.register}</span>
      <span class="sc-label">${asp.label}</span>
      <button class="sc-clear" data-slab-clear="${ch}" title="Clear this slab channel">&times;</button>
    </div>`;
  }).join('');
  $slabChips.innerHTML = html;
}

function openSlabPopover(chipEl, channel) {
  document.querySelectorAll('.atm-slab-pop').forEach(n => n.remove());
  document.querySelectorAll('.atm-slab-chip.active').forEach(n => {
    if (n !== chipEl) n.classList.remove('active');
  });
  slabOpenChip = channel;
  chipEl.classList.add('active');

  const cfg = SLAB_CHANNELS[channel];
  // Group step aspects by register so the picker reads as a tagged menu
  const REG_ORDER = ['what', 'state', 'when', 'effort', 'outcome', 'quality'];
  const grouped = REG_ORDER.map(r => ({
    reg: r,
    opts: Object.values(STEP_ASPECTS).filter(a => a.register === r && cfg.accepts.includes(a.type)),
  })).filter(s => s.opts.length);

  const pop = document.createElement('div');
  pop.className = 'atm-slab-pop';
  let html = `<div class="pop-search"><input type="text" placeholder="${cfg.label} — search step aspects…" autofocus></div><ul class="pop-list">`;
  grouped.forEach(section => {
    html += `<li class="pop-group">${section.reg}</li>`;
    section.opts.forEach(a => {
      const selected = state.slabAxes[channel] === a.id;
      html += `<li class="pop-opt${selected ? ' selected' : ''}" data-opt="${a.id}">
        <span class="opt-label">${a.label}</span>
        <span class="opt-tag">${a.type === 'continuous' ? 'cont' : 'cat'}</span>
      </li>`;
    });
  });
  html += `</ul>`;
  pop.innerHTML = html;
  chipEl.appendChild(pop);

  const $input = pop.querySelector('input');
  const $list = pop.querySelector('.pop-list');
  $input.focus();
  $input.addEventListener('input', () => {
    const q = $input.value.trim().toLowerCase();
    $list.querySelectorAll('.pop-opt').forEach(o => {
      const lbl = o.querySelector('.opt-label').textContent.toLowerCase();
      o.style.display = (!q || lbl.includes(q)) ? '' : 'none';
    });
  });
  $list.querySelectorAll('.pop-opt').forEach(opt => {
    opt.addEventListener('click', () => {
      setSlabAxis(channel, opt.dataset.opt);
      slabOpenChip = null;
      pop.remove();
      renderSlabChips();
      renderNarration();
    });
  });
  $input.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeSlabPopover(); }
  });
}

function closeSlabPopover() {
  document.querySelectorAll('.atm-slab-pop').forEach(n => n.remove());
  document.querySelectorAll('.atm-slab-chip.active').forEach(n => n.classList.remove('active'));
  slabOpenChip = null;
}

/* MODULAR — step filter row.  Four pre-baked toggles + a small swatch
   per chip.  Active chip writes to state.stepFilters; the slab opacity
   loop reads from state.stepFilters and dims non-matching slabs. */
const STEP_FILTER_DEFS = [
  { key: 'status',   value: 'fail',     label: '✗ fail only',     swatch: 'var(--fail)', fail: true },
  { key: 'kind',     value: 'eval',     label: '[eval] only',     swatch: 'var(--amber)' },
  { key: 'kind',     value: 'input',    label: '[input] only',    swatch: 'var(--ink-light)' },
  { key: 'role',     value: 'compiler', label: 'compiler only',   swatch: 'var(--amber-deep)' },
  { key: 'parallel', value: 'parallel', label: '‖ parallel only', swatch: 'var(--prog-2)' },
];
function renderStepFilterChips() {
  if (!$stepFilterChips) return;
  const html = STEP_FILTER_DEFS.map(def => {
    const active = state.stepFilters[def.key] === def.value;
    return `<button class="atm-stepfilter-chip${active ? ' active' : ''}${def.fail ? ' fail-chip' : ''}" data-stepfilter="${def.key}|${def.value}">
      <span class="sw" style="background:${def.swatch}"></span>${def.label}
    </button>`;
  }).join('');
  $stepFilterChips.innerHTML = html;
}

const $clusterChips = document.getElementById('cluster-chips');
function renderClusterChips() {
  if (!$clusterChips) return;
  const html = CLUSTER_ORDER.map(c => {
    const cfg = CLUSTERS[c];
    const active = state.cluster === c;
    return `<button class="atm-cluster-chip${active ? ' active' : ''}" data-cluster="${c}" title="${cfg.description}">${cfg.label}</button>`;
  }).join('');
  $clusterChips.innerHTML = html;
}

/* MODULAR — narration strip.  Reads back the current encoding as a
   live sentence.  Updates on every axis re-binding, slab re-binding,
   filter toggle, or insight switch. */
function renderNarration() {
  if (!$narration) return;
  // MODULAR — produce clickable navigation tokens.  Each token carries
  // a `data-narrate` payload that the document click handler resolves
  // to the matching chip + popover.
  const aspName = (id, cat, narrateTarget) => {
    if (!id) return '<span class="nr-val" style="color:var(--ink-faded)">—</span>';
    const a = (cat === 'step') ? STEP_ASPECTS[id] : ASPECTS[id];
    const label = a ? a.label : id;
    return `<button class="nr-val accent nr-clickable" data-narrate="${narrateTarget}" title="Click to rebind">${label}</button>`;
  };
  const parts = [];
  parts.push(`<span class="nr-key">cubes</span><span class="nr-val">runs</span>`);
  CHANNEL_ORDER.forEach(ch => {
    const aId = state.axes[ch];
    if (!aId) return;
    parts.push(`<span class="nr-key">${ch}</span>${aspName(aId, 'run', 'axis:' + ch)}`);
  });
  SLAB_CHANNEL_ORDER.forEach(ch => {
    const aId = state.slabAxes[ch];
    if (!aId) return;
    const key = ch.replace('slab:', 'slab ');
    parts.push(`<span class="nr-key">${key}</span>${aspName(aId, 'step', ch)}`);
  });
  // PHASE A — surface the resolved stack axis so the operator sees which
  // world axis the slabs are flowing along.  If a WHEN aspect is bound,
  // name the binding inline; otherwise fall back to the literal axis.
  try {
    const axis = getStackAxis();
    const whenId = state.axes[axis];
    const whenAsp = whenId && ASPECTS[whenId] && ASPECTS[whenId].group === 'when' ? ASPECTS[whenId] : null;
    const label = whenAsp ? `${axis} (${whenAsp.label})` : `${axis} (default)`;
    parts.push(`<span class="nr-key">stack</span><span class="nr-val accent">${label}</span>`);
  } catch (_) { /* getStackAxis only available after init */ }
  // Active step filters — also clickable to clear.
  const activeFilters = Object.entries(state.stepFilters).filter(([k, v]) => v != null);
  if (activeFilters.length) {
    parts.push(`<span class="nr-key">filter</span>` +
      activeFilters.map(([k, v]) => `<button class="nr-val ${v === 'fail' ? 'fail' : 'accent'} nr-clickable" data-narrate="filter:${k}|${v}" title="Click to clear filter">${k}=${v}</button>`).join(' · '));
  }
  // MODULAR — cluster layer + relation arcs are part of the encoding too.
  // Tokens are clickable: clicking the cluster value cycles to the next
  // cluster algorithm; clicking a binding value opens its chip.
  const clusterCfg = CLUSTERS[state.cluster] || CLUSTERS.none;
  parts.push(`<span class="nr-key">cluster</span><button class="nr-val accent nr-clickable" data-narrate="cluster" title="Click to cycle cluster layer">${clusterCfg.label}</button>`);
  parts.push(`<span class="nr-key">arcs</span><span class="nr-val">eval-of</span>`);
  $narration.innerHTML = parts.join(' ');
}

/* MODULAR — clickable narration tokens.  Every <button class="nr-clickable">
   in the narration carries a data-narrate attribute that resolves to a
   chip + popover (or a state cycle).  Closes the loop: the sentence is
   the navigation. */
function wireNarrationClicks() {
  if (!$narration) return;
  $narration.addEventListener('click', (e) => {
    const btn = e.target.closest('.nr-clickable');
    if (!btn) return;
    e.stopPropagation();
    const target = btn.dataset.narrate;
    if (target === 'cluster') {
      // Cycle to next cluster
      const idx = CLUSTER_ORDER.indexOf(state.cluster);
      const next = CLUSTER_ORDER[(idx + 1) % CLUSTER_ORDER.length];
      setCluster(next);
      renderClusterChips();
      renderNarration();
      return;
    }
    if (target.startsWith('axis:')) {
      const ch = target.slice('axis:'.length);
      const chipEl = $axisChips?.querySelector(`[data-ch="${ch}"]`);
      if (chipEl) {
        if (state.openChip === ch) closePopover();
        else openPopover(chipEl, ch);
      }
      return;
    }
    if (target.startsWith('slab:')) {
      // Open the slab chip popover for this binding.
      const chipEl = $slabChips?.querySelector(`[data-slab-ch="${target}"]`);
      if (chipEl) {
        if (slabOpenChip === target) closeSlabPopover();
        else openSlabPopover(chipEl, target);
      }
      return;
    }
    if (target.startsWith('filter:')) {
      // Clicking a filter token in the narration clears that filter.
      const [k, v] = target.slice('filter:'.length).split('|');
      toggleStepFilter(k, v);
      renderStepFilterChips();
      renderNarration();
      return;
    }
  });
}

function renderAxisChips() {
  // Filled chips wrap the value with their register (left-border accent +
  // small register tag). Empty chips collapse to a small "+ Z" placeholder
  // so the strip stays scannable when channels aren't bound \u2014 they read
  // as "this channel is open, click to add" rather than fighting filled
  // chips for visual weight.
  const html = CHANNEL_ORDER.map(ch => {
    const cfg = CHANNELS[ch];
    const aId = state.axes[ch];
    const asp = aId ? ASPECTS[aId] : null;
    const reg = asp && asp.group ? REGISTERS[asp.group] : null;
    const isActive = state.openChip === ch;

    if (!asp) {
      // Compact empty placeholder \u2014 small "+", channel key, no value.
      const cls = `atm-axis-chip empty${isActive ? ' active' : ''}`;
      return `<div class="${cls}" data-ch="${ch}" title="${cfg.label} \u2014 click to bind an aspect">
        <span class="ch-plus">+</span>
        <span class="ch-key ch-key-empty">${cfg.key}</span>
      </div>`;
    }

    const cls = `atm-axis-chip${isActive ? ' active' : ''}`;
    const label = asp.label.replace(/\s*\([^)]*\)/, '');
    const styleVars = reg ? `--reg-accent:${reg.accent};--reg-bg:${reg.chipBg}` : '';
    const regTag = reg ? `<span class="ch-reg" title="${reg.question}">${reg.label}</span>` : '';
    const typeBadge = `<span class="ch-type">${asp.type === 'continuous' ? 'cont' : 'cat'}</span>`;
    return `<div class="${cls}" data-ch="${ch}" style="${styleVars}">
      <span class="ch-key">${cfg.key}</span>
      ${regTag}
      <span class="ch-val">${label}</span>
      ${typeBadge}
      <button class="ch-clear" data-clear="${ch}" title="Clear this channel">&times;</button>
    </div>`;
  }).join('');
  $axisChips.innerHTML = html;

  // Re-open popover if one was active before the re-render
  if (state.openChip) {
    const chip = $axisChips.querySelector(`[data-ch="${state.openChip}"]`);
    if (chip) openPopover(chip, state.openChip);
  }
}

function openPopover(chipEl, channel) {
  // Remove any existing popover
  document.querySelectorAll('.atm-axis-pop').forEach(n => n.remove());
  document.querySelectorAll('.atm-axis-chip.active').forEach(n => {
    if (n !== chipEl) n.classList.remove('active');
  });
  state.openChip = channel;
  chipEl.classList.add('active');

  const cfg = CHANNELS[channel];
  const allOptions = Object.entries(ASPECTS).map(([id, a]) => ({
    id, aspect: a,
    eligible: cfg.accepts.includes(a.type),
  }));

  const pop = document.createElement('div');
  pop.className = 'atm-axis-pop';
  pop.innerHTML = `
    <div class="pop-search"><input type="text" placeholder="${cfg.label} \u2014 search aspects\u2026" autofocus></div>
    <div class="pop-hint">${cfg.role === 'position'
      ? 'position \u00b7 continuous \u2192 scatter, categorical \u2192 lanes'
      : cfg.role === 'size'
        ? 'size \u00b7 continuous only'
        : 'colour \u00b7 categorical \u2192 palette, continuous \u2192 gradient'}</div>
    <ul class="pop-list"></ul>
    <div class="pop-foot" data-foot></div>`;
  chipEl.appendChild(pop);

  const $input = pop.querySelector('input');
  const $list = pop.querySelector('.pop-list');
  const $foot = pop.querySelector('[data-foot]');

  function renderList(query) {
    const q = (query || '').trim().toLowerCase();
    const eligible = allOptions.filter(o => cfg.accepts.includes(o.aspect.type));
    const matched = eligible.filter(o =>
      !q ||
      o.aspect.label.toLowerCase().includes(q) ||
      (o.aspect.description || '').toLowerCase().includes(q) ||
      o.id.includes(q)
    );
    if (!matched.length) {
      $list.innerHTML = `<div class="no-match">no matching aspect</div>`;
      $foot.innerHTML = '';
      return;
    }

    // Group matches by register, in canonical order.
    const grouped = REGISTER_ORDER.map(g => ({
      g, reg: REGISTERS[g],
      opts: matched.filter(o => o.aspect.group === g),
    })).filter(s => s.opts.length);

    let html = '';
    let firstHighlighted = false;
    grouped.forEach(section => {
      const reg = section.reg;
      html += `<li class="pop-group" style="--reg-accent:${reg.accent};background:${reg.chipBg}">
        <span class="pop-group-label" style="color:${reg.accent}">${reg.label}</span>
        <span class="pop-group-q">${reg.question}</span>
      </li>`;
      section.opts.forEach((o) => {
        const tagCls = o.aspect.type === 'continuous' ? 'cont' : 'cat';
        const selected = state.axes[channel] === o.id;
        const hi = !firstHighlighted ? ' hi' : '';
        if (!firstHighlighted) firstHighlighted = true;
        html += `<li class="pop-opt${hi}${selected ? ' selected' : ''}" data-opt="${o.id}"${selected ? ` style="background:var(--paper-warm)"` : ''}>
          <div class="opt-line">
            <span class="opt-label">${o.aspect.label}</span>
