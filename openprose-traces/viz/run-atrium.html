            <span class="opt-tag ${tagCls}">${o.aspect.type}</span>
          </div>
          ${o.aspect.description ? `<div class="opt-desc">${o.aspect.description}</div>` : ''}
        </li>`;
      });
    });
    $list.innerHTML = html;

    $list.querySelectorAll('.pop-opt').forEach(opt => {
      opt.addEventListener('click', () => {
        setAxis(channel, opt.dataset.opt);
        state.openChip = null;
        pop.remove();
        renderAxisChips();
      });
    });

    // Footer: range/values for the first highlighted option
    const first = matched[0];
    if (first) {
      const dom = aspectDomain(first.aspect, RUNS);
      if (!dom) {
        $foot.innerHTML = `<em>${first.aspect.label}</em> &mdash; no data for current runs.`;
      } else if (dom.type === 'continuous') {
        $foot.innerHTML = `<em>${first.aspect.label}</em> &mdash; range <span class="fig">${first.aspect.format(dom.min)}</span> \u2192 <span class="fig">${first.aspect.format(dom.max)}</span>${dom.scale === 'sqrt' ? ' \u00b7 \u221a-scaled' : ''}`;
      } else {
        $foot.innerHTML = `<em>${first.aspect.label}</em> &mdash; <span class="fig">${dom.values.length}</span> distinct value${dom.values.length === 1 ? '' : 's'}.`;
      }
    }
  }
  renderList('');
  $input.focus();
  $input.addEventListener('input', () => renderList($input.value));
  $input.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closePopover(); }
    else if (e.key === 'Enter') {
      const hi = $list.querySelector('.pop-opt.hi, .pop-opt');
      if (hi) {
        setAxis(channel, hi.dataset.opt);
        state.openChip = null;
        pop.remove();
        renderAxisChips();
      }
    } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      const all = [...$list.querySelectorAll('.pop-opt')];
      if (!all.length) return;
      const cur = $list.querySelector('.pop-opt.hi');
      let idx = cur ? all.indexOf(cur) : -1;
      idx = e.key === 'ArrowDown' ? Math.min(all.length - 1, idx + 1) : Math.max(0, idx - 1);
      all.forEach(n => n.classList.remove('hi'));
      all[idx].classList.add('hi');
      all[idx].scrollIntoView({ block: 'nearest' });
    }
  });
}

function closePopover() {
  document.querySelectorAll('.atm-axis-pop').forEach(n => n.remove());
  document.querySelectorAll('.atm-axis-chip.active').forEach(n => n.classList.remove('active'));
  state.openChip = null;
}

document.addEventListener('click', (e) => {
  const chipEl = e.target.closest('.atm-axis-chip');
  const clearBtn = e.target.closest('.ch-clear');
  // MODULAR — slab chip + step filter handlers (added inline so they
  // share the same outside-click-to-close behaviour as the run-axis
  // chips below).
  const slabChip   = e.target.closest('.atm-slab-chip');
  const slabClear  = e.target.closest('.sc-clear');
  const stepFilter = e.target.closest('.atm-stepfilter-chip');
  if (slabClear) {
    e.stopPropagation();
    slabOpenChip = null;
    setSlabAxis(slabClear.dataset.slabClear, null);
    renderSlabChips();
    renderNarration();
    return;
  }
  if (slabChip) {
    const ch = slabChip.dataset.slabCh;
    if (slabOpenChip === ch) closeSlabPopover();
    else openSlabPopover(slabChip, ch);
    return;
  }
  if (stepFilter) {
    const [k, v] = stepFilter.dataset.stepfilter.split('|');
    toggleStepFilter(k, v);
    renderStepFilterChips();
    renderNarration();
    return;
  }
  // MODULAR — cluster chip group: switch the active cluster layer.
  const clusterChip = e.target.closest('.atm-cluster-chip');
  if (clusterChip) {
    setCluster(clusterChip.dataset.cluster);
    renderClusterChips();
    renderNarration();
    return;
  }
  // MODULAR — save current view as a custom insight.
  const saveBtn = e.target.closest('#save-view-btn');
  if (saveBtn) {
    e.stopPropagation();
    saveCurrentViewAsInsight();
    return;
  }
  if (clearBtn) {
    e.stopPropagation();
    state.openChip = null;
    setAxis(clearBtn.dataset.clear, null);
    renderAxisChips();
    return;
  }
  if (chipEl) {
    const ch = chipEl.dataset.ch;
    if (state.openChip === ch) {
      closePopover();
    } else {
      openPopover(chipEl, ch);
    }
    return;
  }
  // Click outside → close
  if (!e.target.closest('.atm-axis-bar')) {
    closePopover();
    closeSlabPopover();
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (state.openChip) closePopover();
    if (slabOpenChip) closeSlabPopover();
  }
});

// Insight pill — single selector in the header that opens a searchable
// picker. Holds the active insight title + register fingerprint dots,
// and a secondary line with the active question + any narrowing
// filter chips. The old separate `#insight-caption` is gone — one
// component, one source of truth.
const $insightPill = document.getElementById('insight-pill');

/* Which registers does an insight touch? Walk every channel; collect
   the register of each mapped aspect into a Set. The fingerprint is a
   six-dot strip — one dot per register, lit if the insight touches it,
   empty if it doesn't. Reads as a tiny barcode of "what story this
   view tells". */
function insightRegisters(insight) {
  const set = new Set();
  CHANNEL_ORDER.forEach(ch => {
    const aId = insight.axes[ch];
    if (!aId) return;
    const a = ASPECTS[aId];
    if (a && a.group) set.add(a.group);
  });
  return set;
}

/* Mode metadata for the picker — labels + colours used to tag each
   insight inside the picker list. Mode is no longer a top-level
   toggle; it's a property of an insight, surfaced for context. */
const INSIGHT_MODES = {
  reading:    { label: 'Reading',    accent: 'var(--prog-3)' },
  operations: { label: 'Operations', accent: 'var(--accent)' },
};

function renderInsightPill() {
  const v = INSIGHT_BY_ID[state.currentInsight];
  if (!v) { $insightPill.innerHTML = ''; return; }
  const list = INSIGHTS;
  const localNum = String(list.indexOf(v) + 1).padStart(2, '0');
  const regs = insightRegisters(v);
  const dots = REGISTER_ORDER.map(g => {
    const lit = regs.has(g);
    const accent = REGISTERS[g].accent;
    return `<span class="reg-dot${lit ? ' lit' : ''}" style="${lit ? `background:${accent}` : ''}" title="${REGISTERS[g].label}"></span>`;
  }).join('');
  const modeTag = v.modes.length === 2
    ? '<span class="pill-mode">both</span>'
    : `<span class="pill-mode">${INSIGHT_MODES[v.modes[0]].label}</span>`;

  // Filter status chips — only render when something is narrowing the view.
  const status = [];
  if (state.insightModified) status.push(`<span class="pill-tuned">· tuned</span>`);
  if (state.runFilter && state.runFilter !== 'all') {
    const f = FILTERS[state.runFilter];
    if (f) status.push(`<span class="pill-filter" title="${f.description}"><span class="filter-sw" style="background:${f.swatch}"></span>${f.label.toLowerCase()}</span>`);
  }
  if (state.laneFilter) {
    const info = PROGRAMS[state.laneFilter];
    if (info) status.push(`<span class="pill-filter" title="Program filter"><span class="filter-sw" style="background:${info.cssColor}"></span>${info.label.toLowerCase()}</span>`);
  }
  const filtersLine = status.length
    ? `<span class="pill-filters">${status.join(' ')}</span>`
    : '';

  $insightPill.innerHTML = `
    <span class="pill-row pill-row-primary">
      <span class="pill-num">${localNum}</span>
      <span class="pill-title">${v.title}</span>
      <span class="reg-strip" aria-hidden="true">${dots}</span>
      ${modeTag}
      <span class="pill-chev">▾</span>
    </span>
    <span class="pill-row pill-row-secondary">
      <span class="pill-q">${v.question}</span>
      ${filtersLine}
    </span>`;
}

/* Picker for the insight pill — search input + list grouped by mode.
   Same shape as the axis-chip picker so the muscle memory transfers. */
let insightPickerOpen = false;
function openInsightPicker() {
  document.querySelectorAll('.atm-insight-pop').forEach(n => n.remove());
  insightPickerOpen = true;
  $insightPill.setAttribute('aria-expanded', 'true');

  const pop = document.createElement('div');
  pop.className = 'atm-insight-pop';
  pop.innerHTML = `
    <div class="pop-search"><input type="text" placeholder="Search insights…" autofocus></div>
    <div class="pop-hint">Pick the question this view should answer</div>
    <ul class="pop-list"></ul>`;
  $insightPill.parentElement.appendChild(pop);

  const $input = pop.querySelector('input');
  const $list  = pop.querySelector('.pop-list');

  function renderList(query) {
    const q = (query || '').trim().toLowerCase();
    const matched = INSIGHTS.filter(v =>
      !q ||
      v.title.toLowerCase().includes(q) ||
      v.question.toLowerCase().includes(q) ||
      v.id.includes(q)
    );
    if (!matched.length) {
      $list.innerHTML = `<div class="no-match">no matching insight</div>`;
      return;
    }
    // Group by mode (reading / operations / both)
    const groups = [
      { key: 'reading',    label: 'Reading',    items: matched.filter(v => v.modes.length === 1 && v.modes[0] === 'reading') },
      { key: 'both',       label: 'Both',       items: matched.filter(v => v.modes.length === 2) },
      { key: 'operations', label: 'Operations', items: matched.filter(v => v.modes.length === 1 && v.modes[0] === 'operations') },
    ].filter(g => g.items.length);

    $list.innerHTML = groups.map(g => {
      const rows = g.items.map(v => {
        const idx = String(INSIGHTS.indexOf(v) + 1).padStart(2, '0');
        const active = v.id === state.currentInsight ? ' selected' : '';
        // Per-row story-shape preview — one 12×8 block per channel,
        // coloured by the register of the aspect mapped to that channel
        // (or hatched-empty if no aspect).  Replaces the standalone story
        // matrix in a more contextual place — reader scans the picker
        // and sees insight shape at a glance.
        const channels = CHANNEL_ORDER.map(ch => {
          const aId = v.axes[ch];
          const a = aId ? ASPECTS[aId] : null;
          if (!a) {
            return `<span class="story-cell empty" title="${CHANNELS[ch].key} — empty"></span>`;
          }
          const reg = REGISTERS[a.group];
          return `<span class="story-cell" style="background:${reg.accent}" title="${CHANNELS[ch].key}: ${a.label} · ${reg.label}"></span>`;
        }).join('');
        return `<li class="pop-opt${active}" data-opt="${v.id}">
          <div class="opt-line">
            <span class="opt-num">${idx}</span>
            <span class="opt-label">${v.title}</span>
            <span class="story-shape" aria-hidden="true">${channels}</span>
          </div>
          <div class="opt-desc">${v.question}</div>
        </li>`;
      }).join('');
      return `<li class="pop-group"><span class="pop-group-label">${g.label}</span></li>${rows}`;
    }).join('');

    $list.querySelectorAll('.pop-opt').forEach(opt => {
      opt.addEventListener('click', () => {
        applyInsight(opt.dataset.opt);
        closeInsightPicker();
      });
    });
  }
  renderList('');
  $input.focus();
  $input.addEventListener('input', () => renderList($input.value));
  $input.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeInsightPicker();
    else if (e.key === 'Enter') {
      const first = $list.querySelector('.pop-opt');
      if (first) { applyInsight(first.dataset.opt); closeInsightPicker(); }
    }
  });
}
function closeInsightPicker() {
  document.querySelectorAll('.atm-insight-pop').forEach(n => n.remove());
  insightPickerOpen = false;
  $insightPill.setAttribute('aria-expanded', 'false');
}
$insightPill.addEventListener('click', (e) => {
  e.stopPropagation();
  if (insightPickerOpen) closeInsightPicker();
  else openInsightPicker();
});
document.addEventListener('click', (e) => {
  if (insightPickerOpen && !e.target.closest('.atm-insight-pop, .atm-insight-pill')) {
    closeInsightPicker();
  }
});

/* Story matrix: one row per insight (filtered by current mode), one
   column per channel. Each cell shows the register of the aspect
   mapped to that channel — coloured by register, empty if no mapping.
   The matrix lives in the Tune-axes drawer so it's available whenever
   the reader is shopping for a different view. Click a row to apply
   that insight; the row of the active insight stays highlighted. */
// Story matrix removed — register info now lives inline on each axis chip
// (see renderAxisChips). The chip strip alone tells the full story for
// the active insight, and the per-button register fingerprint dots cover
// at-a-glance comparison across insights.

/* Caption = channel/mapping readout, one line.  No prose narrative here;
   the stage's axis titles, lane labels, and book morphology are already
   doing that work.  This line just confirms "here is what each channel
   is mapped to right now" — the interface carries the poetry, not the
   caption. */
// renderInsightCaption removed — the insight pill renders both the
// question and the active filter chips inline now.

// Tune-axes toggle removed — channels are visible by default, baked
// into the .atm-axis-bar.tuning state on page load.

// Rebuild 3D whenever axes change; update chips + caption + book visibility.
function refreshEverything() {
  layoutBooks();
  renderAxisChips();
  // MODULAR — also re-render slab chip strip + step filter row +
  // cluster chips + narration whenever bindings change.  layoutBooks()
  // picks up the slab encoding from state.slabAxes so the cube
  // interior updates; the cluster layer rebuilds for state.cluster.
  renderSlabChips();
  renderStepFilterChips();
  renderClusterChips();
  renderNarration();
  renderInsightPill();
  renderPretext();
  renderLegend();
}
onAxes(refreshEverything);
onFilter(() => {
  renderInsightPill();
  renderStepFilterChips();
  renderNarration();
  // MODULAR — step filter changes don't rebuild geometry but DO change
  // slab opacities through the tick loop reading state.stepFilters.
});
// MODULAR — wire clickable narration tokens once at init.
wireNarrationClicks();

function onResize() {
  renderer.setSize(stage.clientWidth, stage.clientHeight);
  camera.aspect = stage.clientWidth / stage.clientHeight;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);
// Observe the stage so canvas re-sizes when siblings (pretext, ledger, lanes)
// change height after initial layout — otherwise the canvas can be taller
// than its container and overflow into the pretext row.
if (typeof ResizeObserver !== 'undefined') {
  new ResizeObserver(onResize).observe(stage);
}

/* ============================================
   7. INIT
   ============================================ */
onSelect(() => { renderLedger(); });
// applyInsight() also keeps state.mode in sync with the active
// insight's primary mode, so the ledger summary view (per-program
// health vs run list) still adapts to context without a user toggle.
onMode(() => {
  refreshEverything();
  renderLedger();
  renderPretext();
  renderLegend();
});
onFilter(() => { renderLedger(); });

// Resolve the mathematical palette (reads OKLCH→sRGB via getComputedStyle)
initPalette();

// Header: organization, window and counts, all read from the data.
function renderHeader() {
  const org = TRACE_DATA.ORG || {};
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.innerHTML = v; };
  set('brand-org', org.name || 'Organization');
  let win = org.windowLabel;
  if (!win && RUN_DAYS.length) {
    const fmt = (d, o) => new Date(d).toLocaleDateString('en-US', { ...o, timeZone: 'UTC' });
    const a = RUN_DAYS[0], b = RUN_DAYS[RUN_DAYS.length - 1];
    win = a === b ? fmt(a, { month: 'short', day: 'numeric' })
      : a.slice(0, 7) === b.slice(0, 7)
        ? fmt(a, { month: 'short', day: 'numeric' }) + ' &rarr; ' + fmt(b, { day: 'numeric' })
        : fmt(a, { month: 'short', day: 'numeric' }) + ' &rarr; ' + fmt(b, { month: 'short', day: 'numeric' });
  }
  set('brand-window', win || '');
  const evals = RUNS.filter(r => r.isEval);
  const pass = evals.reduce((s, r) => s + (r.evalPass || 0), 0);
  const total = evals.reduce((s, r) => s + (r.evalTotal || 0), 0);
  set('info-programs', PROGRAM_ORDER.length);
  set('info-runs', RUNS.length);
  set('info-evals', evals.length);
  set('info-pass', pass + ' / ' + total);
}
renderHeader();

renderLanes();
renderLedger();
renderPretext();

// Build the initial 3D volume + UI with the Ship-log insight (default).
// applyInsight() also sets the right camera pose for the story.
refreshEverything();
applyInsight(INSIGHTS[0].id);

// Auto-select the reference run: DEFAULT_RUN_ID when the dataset names
// one, otherwise the first producing run.
const DEFAULT_RUN_ID = TRACE_DATA.DEFAULT_RUN_ID
  || (RUNS.find(r => !r.isEval) || RUNS[0] || {}).id;
if (DEFAULT_RUN_ID) setTimeout(() => setSelected(DEFAULT_RUN_ID), 60);

// Post-layout camera frame: after the grid + pretext + ledger have
// finished settling, nudge the camera to the insight's intended pose
// in the final stage size. This avoids the opening view landing mis-framed.
// // feedback: "start the zoom more out on the graph
// // using this Pos 40.6 9.6 40.5 Target 0.5 -2.8 0.4"
// After applyPreset snaps to the insight's nominal angle, we override
// position + target with the requested zoomed-out opening pose. Users
// can still click any preset button to leave this view.
const START_POS    = new THREE.Vector3(40.6,  9.6, 40.5);
const START_TARGET = new THREE.Vector3( 0.5, -2.8,  0.4);
function applyStartView() {
  camera.position.copy(START_POS);
  camera.up.set(0, 1, 0);
  controls.target.copy(START_TARGET);
  controls.update();
}
setTimeout(() => {
  onResize();
  const v = INSIGHT_BY_ID[state.currentInsight];
  applyPreset(v?.camera || 'pitched');
  applyStartView();   // override preset with requested opening pose
}, 140);
setTimeout(onResize, 260);
requestAnimationFrame(onResize);
</script>
</body>
</html>
