<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Run Atrium · Strata · Modular · Tufte · Kecal · Teal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
/* ============================================
   RUN ATRIUM · STRATA · MODULAR · TUFTE/KECAL/TEAL
   ----------------------------------------------------------
   A modular 3D trace viewer.  Every run is a cube placed in a
   20³ volume by a user-defined aspect → channel mapping, and
   every cube is built from slabs: one slab per logged step in
   the run's step tree.  Step-level data is first-class.

   RUN-LEVEL aspects (the lego bricks) bind to channels through
   the chip strip: run.duration → x, run.program → color, etc.
   STEP-LEVEL aspects bind to the slab channels:

       slab:color  ← any step-level aspect
       slab:width  ← any step-level continuous aspect
       slab:edge   ← any step-level categorical aspect

   Defaults: slab:color = step:kind, slab:width =
   step:artifact-bytes, slab:edge = step:status.  Re-binding any
   of these reshapes the cube live.  ✗ failed steps pop in
   fail-red because step:status is bound to slab:edge by default,
   not because of a hard-code.

   Surfaces:
     - SLAB chip row in the channels strip, one chip per slab
       channel, same picker UI as the axis chips.
     - Cluster layer on the floor: program hulls or day stripes;
       eval-of arcs tie each eval run to its parent.
     - Step-level filter row: "only ✗", "only [eval]",
       "only compiler", "only ‖ parallel"; narrows without
       losing positional context.
     - Insight pill: curated question-driven views, each with a
       live one-paragraph read-back computed from the data.

   The point: every visual encoding emerges from a binding the
   reader can see, change, and reason about.  Adding a new
   aspect or a new channel becomes one entry in a catalogue,
   not a rewrite.

   Visual style:
     * Paper: fog cream #f5f0e8
     * Ink:   warm brown-black #2a2520
     * Accent: editorial TEAL #3a7a6a; carries italic emphasis,
                selected state, cube outlines
     * Amber:  #c49a5c, the rare warm complement, reserved for the
                narrowed-view outline frame + the highlighter wash
     * Type:   Kecal (FungiType) for prose + headings
                IBM Plex Mono for code/figures
                Cormorant Garamond available for long-form italic
                Italic emphasis: Kecal 800 italic at 1em.
     * Corners: sharp (border-radius: 0 throughout). Data dots
                that encode meaning (legend swatches, status dots)
                keep their geometry.

   Metaphor: shelves at low zoom, a codex of codices at high
   zoom.  Each program is a lane; each run is a book stamped onto
   the lane; eval runs fork off as satellite books tied to their
   parent by an arc.

   Data: none ships with this page.  Programs, runs, step trees
   and binding artifacts arrive through window.TRACE_DATA from
   data/run-atrium.js; shapes in data/run-atrium.schema.md.
   ============================================ */

/* ---- §0.1 FONT FACES — Kecal (FungiType) on jsDelivr ---- */
@font-face { font-family: 'Kecal'; font-weight: 200; font-style: normal; font-display: swap;
  src: url('https://cdn.jsdelivr.net/gh/FungiType/Kecal@main/export/Web/Kecal-Extralight-web.woff2') format('woff2'); }
@font-face { font-family: 'Kecal'; font-weight: 300; font-style: normal; font-display: swap;
  src: url('https://cdn.jsdelivr.net/gh/FungiType/Kecal@main/export/Web/Kecal-Light-web.woff2') format('woff2'); }
@font-face { font-family: 'Kecal'; font-weight: 400; font-style: normal; font-display: swap;
  src: url('https://cdn.jsdelivr.net/gh/FungiType/Kecal@main/export/Web/Kecal-Regular-web.woff2') format('woff2'); }
@font-face { font-family: 'Kecal'; font-weight: 500; font-style: normal; font-display: swap;
  src: url('https://cdn.jsdelivr.net/gh/FungiType/Kecal@main/export/Web/Kecal-Medium-web.woff2') format('woff2'); }
@font-face { font-family: 'Kecal'; font-weight: 600; font-style: normal; font-display: swap;
  src: url('https://cdn.jsdelivr.net/gh/FungiType/Kecal@main/export/Web/Kecal-Semibold-web.woff2') format('woff2'); }
@font-face { font-family: 'Kecal'; font-weight: 700; font-style: normal; font-display: swap;
  src: url('https://cdn.jsdelivr.net/gh/FungiType/Kecal@main/export/Web/Kecal-Bold-web.woff2') format('woff2'); }
@font-face { font-family: 'Kecal'; font-weight: 800; font-style: normal; font-display: swap;
  src: url('https://cdn.jsdelivr.net/gh/FungiType/Kecal@main/export/Web/Kecal-Extrabold-web.woff2') format('woff2'); }

@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* =========== PALETTE · TUFTE / KECAL / TEAL ===========
     The atrium needs the same data colour bands (programs, status,
     mode) — those are preserved exactly. What changes is the
     chrome: paper warms, ink shifts brown-black, editorial RED
     becomes editorial TEAL, and the highlighter recolours from
     yellow to amber.

     Three independent layers, never mixed:
       1. Paper + ink    — page chrome, labels, prose
       2. Editorial teal — italic author voice + selected state
       3. Highlighter    — amber skim mark, hotter amber for the
                            one urgent claim per surface
       4. Amber (rare)   — narrowed-view outline frame, the
                            "look up" highlight on the cube
     Below those: program identity, status (pass/fail/partial),
     register accents — all kept from v2 since they encode data
     not chrome.
  */

  /* ---- paper surfaces (fog cream) ---- */
  --paper-cream:  #f5f0e8;  /* the page */
  --paper-warm:   #f0e8d8;  /* secondary surface, panels (warmer than v3) */
  --paper-aged:   #e8e0d0;  /* deeper warm, used sparingly */
  --paper-lt:     #fbf7ef;  /* lifted surface, popovers, chips */
  --rule:         rgba(42,37,32,0.14);  /* hairline keyed to warm ink */
  --rule-mid:     rgba(42,37,32,0.06);  /* dotted dividers */

  /* ---- ink (warm brown-black four-step) ----
         Solid hex values (premultiplied over paper) — keeps the ladder
         visible to both CSS (where text colour wants to sit ON paper)
         and JS (where Three.js LineBasicMaterial needs an explicit
         RGB; alpha-over-paper is not available to a 3D scene). */
  --ink-dark:     #2a2520;  /* primary copy, headlines */
  --ink-medium:   #4c4742;  /* body */
  --ink-light:    #847d75;  /* secondary text */
  --ink-faded:    #b4ada4;  /* tertiary, dim labels */

  /* ---- programs: four identity slots, assigned in PROGRAM_ORDER ---- */
  --prog-1:  #c8664e;  /* warm terra */
  --prog-3:  #339c6d;  /* mid teal-green */
  --prog-2:  #4587b3;  /* slate-blue */
  --prog-4:  #a45b9f;  /* muted magenta */

  /* ---- run mode + kind (kept from v2 — data identity) ---- */
  --mode-on-demand: #d29155;
  --mode-scheduled: #6f9bbf;
  --mode-eval:      #9286bf;
  --kind-run:       #5a5a5a;
  --kind-eval:      #9286bf;

  /* ---- status (slight rebalance to teal aesthetic) ---- */
  --pass:     #14803e;  /* verified green — unchanged */
  --partial:  #a87f44;  /* warm ochre, aligned with amber-deep */
  --pending:  #c2b5a7;  /* paper-grey */
  --fail:     #b34a3e;  /* softened brick-red so it doesn't fight warm paper */

  /* ---- accent (TEAL — the big swap, replaces editorial red) ---- */
  --red:           #3a7a6a;             /* legacy alias — kept name for compat */
  --red-muted:     #4a8a7a;
  --red-deep:      #2e6456;
  --accent:        #3a7a6a;             /* editorial teal — italic + selected */
  --accent-deep:   #2e6456;
  --accent-soft-c: #4a8a7a;             /* solid soft teal for borders/swatches */
  --accent-soft:   rgba(58,122,106,0.20);
  --accent-wash:   rgba(58,122,106,0.06);
  --accent-dotted: rgba(58,122,106,0.40);
  --accent-tint:   rgba(58,122,106,0.14);
  --hover:         rgba(58,122,106,0.05);

  /* ---- AMBER · the rare warm complement ----
         Used sparingly: narrowed-view outline frame around the
         cube, one or two "look up" highlights, and as the
         highlighter wash colour (recoloured from yellow). */
  --amber:       #c49a5c;
  --amber-deep:  #a87f44;
  --amber-soft:  #d4aa6c;
  --amber-tint:  rgba(196,154,92,0.18);

  /* ---- HIGHLIGHTER ----
         // feedback: "clean up all the hilighter noise
         // and use the tufte underscore style from the ref."
         Highlighter tokens now silenced to transparent so every
         `linear-gradient(transparent 58%, var(--hl) 58%)` rule across
         the surface paints nothing.  The `.hl, .hl-hot` base rule
         below restyles legacy markup as a Tufte dotted/dashed
         underline in the Tufte mono style. */
  --hl:        transparent;
  --hl-hot:    transparent;
  --hl-edge:   transparent;   /* was 1px tint under highlighter; muted in Tufte mode */

  /* ---- axis tones — three steps of warm grey, kept neutral so they
         don't compete with data colour.  Solid hex (not alpha) so the
         Three.js axis-line materials get three visually distinct
         greys, mirroring the v3 spread. ---- */
  --axis-x:  #4c4742;  /* warm dark — foreground identity */
  --axis-y:  #847d75;  /* warm mid */
  --axis-z:  #b4ada4;  /* warm light — recedes */

  /* ---- line / border helpers (ink-keyed alphas) ---- */
  --line-soft:    rgba(42,37,32,0.18);
  --line-dotted:  rgba(42,37,32,0.24);
  --line-muted:   rgba(42,37,32,0.32);
  --pending-wash: rgba(194,181,167,0.30);

  /* ---- glass & fonts ---- */
  --glass-bg-deep:  rgba(245,240,232,0.94);
  --glass-border:   1px solid rgba(58,122,106,0.18);
  --glass-shadow:   0 4px 22px rgba(42,37,32,0.07),
                    inset 0 1px 0 rgba(255,255,255,0.45);
  --glass-blur:     blur(14px) saturate(1.10);

  /* Type faces — Kecal carries both prose and sans roles. Kecal italic
     800 is the universal italic. IBM Plex Mono is the monospace voice
     for figures + code + uppercase labels. Cormorant Garamond is
     available as a long-form italic alternate. */
  --font-prose: 'Kecal', system-ui, -apple-system, sans-serif;
  --font-sans:  'Kecal', system-ui, -apple-system, sans-serif;
  --font-code:  'IBM Plex Mono', 'SF Mono', 'JetBrains Mono', Consolas, monospace;
}

/* ===== HIGHLIGHTER MARK — TUFTE UNDERSCORE =====
   // feedback: "clean up all the hilighter noise and
   // use the tufte underscore style from the ref."
   The amber wash is gone; legacy `.hl` markup now renders as a thin
   dotted underline, `.hl-hot` as a dashed one.  Same markup, quieter
   gesture, in the Tufte mono style. All nested `background: linear-gradient(..., var(--hl) ...)`
   declarations elsewhere in this file now paint transparent because
   --hl and --hl-hot are transparent — so no override sweep needed. */
.hl, .hl-hot {
  background: transparent;
  padding: 0;
  border-bottom: 1px dotted var(--ink-light);
  text-underline-offset: 3px;
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
  font-style: inherit; color: inherit;
}
.hl-hot {
  border-bottom-color: var(--ink-medium);
  border-bottom-style: dashed;
}

/* The brand-wide italic rule. Every <em> renders in Kecal italic 800
   at 1em (cap-height matched). Italic is teal — the editorial accent. */
em {
  font-family: 'Kecal', system-ui, sans-serif;
  font-style: italic;
  font-weight: 800;
  font-size: 1em;
  color: var(--accent);
}

html, body { overflow: hidden; height: 100%; font-size: 16px; }
body {
  font-family: var(--font-prose);
  font-weight: 300;
  color: var(--ink-dark);
  -webkit-font-smoothing: antialiased;
  background: var(--paper-cream);
  background-attachment: fixed;
  position: relative;
}
/* Fog-cream ambient — barely-there teal radials in the corners. */
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse 60% 40% at 8% 4%, rgba(58,122,106,0.030), transparent 60%),
    radial-gradient(ellipse 60% 40% at 96% 96%, rgba(58,122,106,0.020), transparent 60%);
}
body > * { position: relative; z-index: 1; }

/* ===== LAYOUT GRID =====
   v3.1: Single column.  Stage uses the full viewport width below the
   header band; lanes (top-left), camera strip (bottom-left), ledger
   (top-right) and scene controls (bottom-right) all FLOAT over the
   3D scene as glass panels.  This removes the 400px reserved column
   that was offsetting the cube — now the graph uses full screenspace.

   Header rows (top, ptxt, chans) are full-width; stage takes whatever
   height remains.  The four corners of the stage carry the four
   floating panels, mirrored about the centre. */
.atrium {
  display: grid;
  grid-template-columns: 1fr;
  grid-template-rows: auto auto auto 1fr;
  grid-template-areas:
    "top"
    "ptxt"
    "chans"
    "stage";
  height: 100vh; width: 100vw;
}
.atm-top { grid-area: top; }
.atm-pretext { grid-area: ptxt; }
.atm-axis-bar { grid-area: chans; }
.atm-stage { grid-area: stage; position: relative; overflow: hidden; }

/* Floating panels inside the stage — four corners, glass-cast, never
   take grid space.  Each clamps its max-height so it can't expand to
   collide with the panel diagonally across the stage. */
.atm-lanes   { position: absolute; top: 0.75rem;    left: 0.75rem;  z-index: 9; max-height: calc(100% - 6rem); overflow-y: auto; }
.atm-ledger  { position: absolute; top: 0.75rem;    right: 0.75rem; z-index: 9; }
.atm-camleg  { position: absolute; bottom: 0.75rem; left: 0.75rem;  z-index: 9; }
.atm-scene   { position: absolute; bottom: 0.75rem; right: 0.75rem; z-index: 9; }
/* Pretext was previously bottom: 0; now it lives in its own grid row
   (above the channels strip) per the new layout. */
/* Pretext lives above the channels strip and below the header — one
   paper-cream sentence that anchors the active insight's narrative.
   z-index intentionally low so the channels-strip "II · Channels"
   kicker tab can paint on top of it. */
.atm-pretext {
  position: relative;
  left: 0; right: 0;
  z-index: 1;
}

/* ===== TOP BAR =====
   Three slots: stacked brand on the left, insight pill in the middle
   (right after the stack), counts pinned to the far right. */
.atm-top {
  display: flex; align-items: center; gap: 1.5rem;
  padding: 0.8rem 1.4rem;
  background: var(--paper-cream);
  position: relative; z-index: 20;
  border-bottom: 1px solid var(--red);
}
/* Tiny "I · MASTHEAD" eyebrow above the brand — roman-numeral
   section markers, applied very lightly in chrome. */
.atm-top::before {
  content: ''; position: absolute; left: 1.4rem; right: 1.4rem; bottom: -3px;
  height: 1px; background: var(--rule);
}
.atm-brand { line-height: 1.1; flex-shrink: 0; }
/* Stacked brand element: OpenProse on top (product), the organization
   underneath (name + window). Two-line block that anchors the
   header's left edge. */
.atm-brand-stack {
  display: flex; flex-direction: column; gap: 0.18rem;
}
.atm-brand-stack .brand-product {
  /* "Open" roman, "Prose" teal italic — the editorial mark on every surface. */
  font-family: var(--font-prose); font-size: 1.45rem;
  font-weight: 400; letter-spacing: -0.018em; line-height: 1;
  color: var(--ink-dark);
  display: inline-flex; align-items: center; gap: 0.5rem;
}
.atm-brand-stack .brand-product em { font-style: italic; color: var(--red); }
.atm-brand-stack .brand-customer {
  font-family: var(--font-sans);
  font-size: 0.66rem; font-weight: 600; font-style: normal;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--ink-light);
  display: inline-flex; align-items: baseline; gap: 0.55rem;
}
.atm-brand-stack .brand-window {
  font-family: var(--font-code); font-style: normal;
  font-size: 0.7rem; font-weight: 500; color: var(--ink-medium);
  letter-spacing: 0.02em; text-transform: none;
}
/* The amber highlight inside the date window — pulls the operator's eye
   to the data slice they're inspecting (the "what window am I looking
   at" answer).  This is the reader-pen rule applied. */
.atm-brand-stack .brand-window .hl {
  background: linear-gradient(transparent 58%, var(--hl) 58%);
  padding: 0 0.18em;
}
.atm-brand .brand-rev {
  font-family: var(--font-sans); font-size: 0.56rem; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--paper-cream); background: var(--red);
  padding: 0.18rem 0.48rem 0.16rem; border-radius: 0;
  line-height: 1; align-self: center;
}

/* Counts row — pinned to the far right of the header.  Kecal caps for
   the labels, IBM Plex Mono for the numerals, with the headline
   figures highlit so a skimmer pulls "32 / 33" out at a glance. */
.atm-info {
  margin-left: auto;
  display: inline-flex; align-items: baseline; gap: 0.7rem;
  font-family: var(--font-sans); font-size: 0.72rem; font-weight: 600;
  color: var(--ink-light); letter-spacing: 0.14em; text-transform: uppercase;
  flex-shrink: 0;
  flex-wrap: wrap;
}
.atm-info .info-fig {
  color: var(--ink-dark); font-family: var(--font-code);
  font-variant-numeric: tabular-nums; font-weight: 600;
  font-size: 0.95rem; letter-spacing: 0;
  text-transform: none;
  margin-right: 0.18em;
}
.atm-info .info-fig.hl {
  background: linear-gradient(transparent 58%, var(--hl) 58%);
  padding: 0 0.18em;
}
.atm-info .info-dot { color: var(--ink-faded); margin: 0 0.2rem; }
.atm-info .info-customer-name {
  font-family: var(--font-prose); font-style: italic; font-size: 0.95rem;
  color: var(--accent); letter-spacing: 0; text-transform: none;
}
.atm-info .info-customer-window {
  font-family: var(--font-code); font-style: normal;
  font-size: 0.65rem; color: var(--ink-light);
  letter-spacing: 0.04em;
  margin-left: 0.35rem;
}
/* Insight selector pill — sits right after the brand stack in the
   header.  No more margin-left:auto (counts are anchored to the far
   right via flex on the info row). */
.atm-header-insight {
  display: flex; align-items: center; gap: 0.85rem;
  position: relative;
  flex: 1 1 auto;
  min-width: 0;
}
/* Insight pill — two-row component carrying both the active insight
   identity (top row: 01 SHIP LOG · register dots · mode tag) and its
   contextual question + active filter chips (bottom row, italic). One
   click anywhere opens the picker. */
.atm-insight-pill {
  display: flex; flex-direction: column; align-items: stretch; gap: 0.22rem;
  font-family: var(--font-sans);
  background: var(--paper-lt); color: var(--ink-dark);
  border: 1px solid var(--ink-dark);
  /* removed: coloured 3px left sidebar accent — uniform border instead */
  border-radius: 0;
  padding: 0.48rem 0.95rem 0.52rem;
  cursor: pointer;
  transition: all 0.14s;
  text-align: left;
  flex: 1 1 auto;
  min-width: 0;
  max-width: 100%;
}
.atm-insight-pill:hover {
  background: var(--paper-warm);
  border-color: var(--red);
  box-shadow: 0 0 0 3px rgba(58,122,106,0.08);
}
.atm-insight-pill .pill-row {
  display: flex; align-items: center; gap: 0.6rem;
  white-space: nowrap;
  min-width: 0;
}
.atm-insight-pill .pill-row-primary {
  font-family: var(--font-sans);
  font-size: 0.72rem; font-weight: 600;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--red);
}
.atm-insight-pill .pill-row-secondary {
  /* Voice: italic Kecal 800 is authorial.  The pill's question is the
     author asking the reader to pay attention.  Highlighter is added per-
     insight (see renderInsightPill in the JS) on the data noun a skimmer
     should pull from the question. */
  font-family: var(--font-prose);
  font-size: 0.95rem; font-style: italic;
  color: var(--ink-dark);
  letter-spacing: -0.005em;
  text-transform: none; font-weight: 400;
  flex-wrap: wrap;
  gap: 0.45rem;
  line-height: 1.32;
}
.atm-insight-pill .pill-num {
  color: var(--red); font-family: var(--font-sans);
  font-weight: 700;
  flex-shrink: 0;
}
.atm-insight-pill .pill-title {
  flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
}
.atm-insight-pill .pill-mode {
  font-family: var(--font-sans); font-size: 0.58rem; font-weight: 600;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--ink-faded);
  flex-shrink: 0;
}
.atm-insight-pill .pill-chev { opacity: 0.5; font-size: 0.62rem; margin-left: auto; flex-shrink: 0; color: var(--red); }
.atm-insight-pill .reg-strip { gap: 2px; flex-shrink: 0; }
.atm-insight-pill .pill-q {
  flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis;
}
.atm-insight-pill .pill-q::before { content: '\201C\2009'; color: var(--red); font-style: normal; }
.atm-insight-pill .pill-q::after  { content: '\2009\201D'; color: var(--red); font-style: normal; }
.atm-insight-pill .pill-tuned {
  font-family: var(--font-sans); font-style: normal; font-weight: 600;
  font-size: 0.58rem; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--red);
  flex-shrink: 0;
}
.atm-insight-pill .pill-filter {
  display: inline-flex; align-items: center; gap: 0.3rem;
  font-family: var(--font-sans); font-style: normal; font-weight: 600;
  font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--ink-dark);
  background: var(--accent-wash);
  border: 1px solid var(--accent-soft);
  border-radius: 0;
  padding: 0.12rem 0.5rem;
  flex-shrink: 0;
}
.atm-insight-pill .pill-filter .filter-sw {
  width: 8px; height: 8px; border-radius: 0;
  flex-shrink: 0;
}

/* Insight picker pop-over — anchored to the LEFT edge of the pill so
   the list aligns with where the user clicked, and widened so each
   row's description fits on a single line without wrapping. */
.atm-insight-pop {
  position: absolute; top: calc(100% + 4px); left: 0;
  width: 720px; max-width: calc(100vw - 3rem);
  background: var(--paper-cream);
  border: 1px solid var(--ink-dark);
  border-radius: 0;
  box-shadow: 0 8px 32px rgba(28,25,23,0.18), inset 0 1px 0 rgba(255,255,255,0.4);
  z-index: 30;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.atm-insight-pop .pop-search {
  padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--rule); background: white;
}
.atm-insight-pop .pop-search input {
  width: 100%; font-family: var(--font-prose); font-size: 0.88rem;
  color: var(--ink-dark); border: none; outline: none; background: transparent; padding: 0.1rem 0.2rem;
}
.atm-insight-pop .pop-search input::placeholder { color: var(--ink-faded); font-style: italic; }
.atm-insight-pop .pop-hint {
  padding: 0.25rem 0.6rem;
  font-family: var(--font-code); font-size: 0.54rem;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--ink-faded);
  border-bottom: 1px dotted var(--rule);
}
.atm-insight-pop .pop-list { max-height: 420px; overflow-y: auto; list-style: none; padding: 0.2rem 0; }
.atm-insight-pop .pop-list::-webkit-scrollbar { width: 5px; }
.atm-insight-pop .pop-list::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 0; }
.atm-insight-pop .pop-group {
  padding: 0.45rem 0.6rem 0.2rem;
  font-family: var(--font-code); font-size: 0.55rem;
  font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--accent);
  background: var(--paper-warm);
  border-top: 1px dotted var(--rule);
  list-style: none;
}
.atm-insight-pop .pop-group:first-child { border-top: none; }
.atm-insight-pop .pop-opt {
  /* dropped the 2px teal left sidebar — selection now
     reads as a paper-warm fill alone, no coloured strip. */
  padding: 0.5rem 0.6rem;
  cursor: pointer;
  transition: all 0.1s;
  list-style: none;
}
.atm-insight-pop .pop-opt:hover, .atm-insight-pop .pop-opt.hi { background: var(--paper-warm); }
.atm-insight-pop .pop-opt.selected { background: var(--paper-warm); }
.atm-insight-pop .pop-opt .opt-line {
  display: flex; align-items: center; gap: 0.5rem;
}
.atm-insight-pop .pop-opt .opt-num {
  font-family: var(--font-code); font-size: 0.55rem; font-weight: 700;
  letter-spacing: 0.1em; color: var(--accent);
}
.atm-insight-pop .pop-opt .opt-label {
  font-family: var(--font-prose); font-size: 0.92rem;
  color: var(--ink-dark); font-weight: 500; letter-spacing: -0.005em;
  flex: 1;
}
.atm-insight-pop .pop-opt .reg-strip { display: inline-flex; gap: 2px; }
.atm-insight-pop .pop-opt .reg-strip .reg-dot {
  width: 6px; height: 6px; border-radius: 50%;
  border: 1px solid var(--ink-faded);
}
.atm-insight-pop .pop-opt .reg-strip .reg-dot.lit { border-color: transparent; }

/* Per-row story-shape preview — 7 thin coloured blocks (one per
   channel) coloured by the register of the aspect mapped there.
   Empty channels render hatched.  Acts as the "story matrix" baked
   into each picker row. */
.atm-insight-pop .pop-opt .story-shape {
  display: inline-flex; gap: 2px;
  flex-shrink: 0;
}
.atm-insight-pop .pop-opt .story-cell {
  width: 12px; height: 8px;
  border-radius: 0;
  display: inline-block;
  cursor: help;
}
.atm-insight-pop .pop-opt .story-cell.empty {
  background: repeating-linear-gradient(
    45deg,
    var(--rule) 0, var(--rule) 1.5px,
    transparent 1.5px, transparent 3px
  );
  border: 1px solid var(--rule);
  box-sizing: border-box;
}
.atm-insight-pop .pop-opt .opt-desc {
  font-family: var(--font-prose); font-style: italic;
  font-size: 0.78rem; color: var(--ink-light);
  letter-spacing: -0.005em;
  margin-top: 0.2rem;
  /* Wider popover allows descriptions to breathe — no wrapping mid-line. */
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.atm-insight-pop .no-match {
  padding: 0.6rem; font-family: var(--font-prose); font-style: italic;
  color: var(--ink-faded); font-size: 0.82rem;
}

.atm-counts {
  display: flex; gap: 0.9rem; align-items: center;
  font-family: var(--font-code); font-size: 0.72rem;
  color: var(--ink-light); letter-spacing: 0.04em;
}
.atm-counts .fig {
  color: var(--ink-dark); font-variant-numeric: tabular-nums; font-weight: 500;
}

/* ===== FLOATING · PROGRAM LANES (glass panel over stage) ===== */
.atm-lanes {
  display: flex; flex-direction: column;
  background: var(--glass-bg-deep);
  border: var(--glass-border); border-radius: 0;
  box-shadow: var(--glass-shadow);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  padding: 0.85rem 0.85rem 0.75rem;
  min-width: 200px;
}
.lane-eyebrow {
  font-family: var(--font-sans); font-size: 0.7rem;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--red); font-weight: 700; margin-bottom: 0.65rem;
  display: inline-flex; align-items: center; gap: 0.65rem;
}
.lane-eyebrow::before { content: ''; width: 24px; height: 1px; background: var(--red); }
.lane-list { list-style: none; display: flex; flex-direction: column; gap: 5px; }
.lane-item {
  display: flex; flex-direction: column; gap: 0;
  padding: 0.32rem 0.55rem;
  border: 1px solid var(--rule); border-radius: 0;
  background: white; cursor: pointer; transition: all 0.12s;
}
.lane-item:hover { border-color: var(--accent); background: var(--hover); }
.lane-item.active { border-color: var(--ink-dark); background: var(--paper-warm); }
.lane-item[title] { cursor: help; }
.lane-head {
  display: flex; align-items: center; gap: 0.45rem;
}
.lane-swatch {
  width: 10px; height: 10px; border-radius: 0; flex-shrink: 0;
}
.lane-name {
  font-family: var(--font-prose); font-size: 0.95rem; font-weight: 500;
  color: var(--ink-dark); letter-spacing: -0.003em;
}
.lane-count {
  margin-left: auto;
  font-family: var(--font-code); font-size: 0.78rem;
  color: var(--ink-medium); font-variant-numeric: tabular-nums;
  font-weight: 500;
}
.lane-meta {
  font-family: var(--font-code); font-size: 0.66rem;
  color: var(--ink-light); letter-spacing: 0.04em;
  margin-top: 0.12rem;
}
.lane-meta .score { color: var(--pass); font-weight: 600; }
.lane-meta .score.partial { color: var(--partial); }
.lane-meta .score.fail { color: var(--fail); }

.lane-divider {
  border-top: 1px solid var(--rule); margin: 0.75rem 0 0.6rem;
}
.lane-filter {
  font-family: var(--font-code); font-size: 0.6rem;
  letter-spacing: 0.12em; text-transform: uppercase;
  padding: 0.32rem 0.55rem; margin-bottom: 4px;
  border: 1px solid var(--rule); border-radius: 0;
  background: white; color: var(--ink-medium); cursor: pointer;
  transition: all 0.12s; font-weight: 600;
  text-align: left;
}
.lane-filter:hover { border-color: var(--accent); color: var(--accent); }
.lane-filter.active { background: var(--ink-dark); color: var(--paper-cream); border-color: var(--ink-dark); }
.lane-filter[title] { cursor: help; }
/* Vertically stacked filter buttons — keeps the panel narrow.  Each
   row is full-width with a coloured swatch (its own legend) + label +
   live count of matching runs at the right edge. */
.lane-filter-row {
  display: flex; flex-direction: column; gap: 0.25rem;
  margin: 0.05rem 0 0.1rem;
}
.lane-filter {
  display: flex; align-items: center; gap: 0.5rem;
  padding: 0.32rem 0.55rem;
  font-family: var(--font-code); font-size: 0.6rem; font-weight: 600;
  letter-spacing: 0.06em; text-transform: uppercase;
  border-radius: 0;
  width: 100%;
}
.lane-filter .filter-sw {
  width: 9px; height: 9px; border-radius: 0;
  flex-shrink: 0;
  box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.18);
}
.lane-filter .filter-label { white-space: nowrap; flex: 1; text-align: left; }
.lane-filter .filter-count {
  font-family: var(--font-code); font-size: 0.6rem;
  font-weight: 700; letter-spacing: 0.06em;
  color: var(--ink-faded);
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}
.lane-filter.active .filter-count { color: var(--paper-warm); }
/* "All programs" pseudo-row swatch — neutral hatched (not an identity) */
.lane-swatch-all {
  background: repeating-linear-gradient(
    45deg,
    var(--ink-faded) 0, var(--ink-faded) 2px,
    transparent 2px, transparent 4px
  ) !important;
}

/* ===== STAGE · 3D ATRIUM =====
   The canvas is absolutely positioned inside the stage so its explicit
   pixel size never feeds back into the grid (Three.js sets style.width
   and style.height — if those pushed the stage open, the grid would
   inflate and the canvas would lock at an overlarge size). */
.atm-stage canvas {
  display: block; cursor: grab;
  position: absolute; top: 0; left: 0;
}
.atm-stage canvas:active { cursor: grabbing; }

/* ===== FLOATING · CAMERA / LEGEND / AXIS READOUT (glass panel) ===== */
/* Camera presets — flat icon strip flush at bottom-left of the stage.
   No eyebrow, no panel chrome, no glass blur — just the buttons.  Reads
   as a tertiary control surface, not a permanent panel. */
.atm-camleg {
  display: flex; flex-direction: column; gap: 0;
  padding: 0; background: transparent; border: none; box-shadow: none;
}
.atm-camleg-section { display: contents; }
.atm-camleg-section .eyebrow { display: none; }
/* Camera presets — flat icon strip with frosted button surface so they
   sit cleanly over the 3D scene without panel chrome.  Five buttons in
   a single horizontal row, full names on hover. */
.atm-camleg-cams {
  display: inline-flex; gap: 3px;
  background: var(--glass-bg-deep);
  border: 1px solid rgba(0,0,0,0.06);
  border-radius: 0;
  padding: 3px;
  box-shadow: 0 2px 12px rgba(28,25,23,0.08);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
}
.atm-camleg-cams button {
  /* Kecal label, bumped from 0.58 → 0.72rem so it's legible at a
     glance — directly addresses JH's "need bigger clearer labels" mark. */
  font-family: var(--font-sans); font-size: 0.72rem; font-weight: 600;
  letter-spacing: 0.16em; text-transform: uppercase;
  padding: 0.36rem 0.7rem;
  border: 1px solid transparent;
  background: transparent; color: var(--ink-medium);
  border-radius: 0; cursor: pointer; transition: all 0.12s;
  display: inline-flex; align-items: center; gap: 0.4rem;
  white-space: nowrap;
  min-width: 0;
  justify-content: center;
}
.atm-camleg-cams button:hover {
  border-color: var(--red); color: var(--red);
}
.atm-camleg-cams button.active {
  background: var(--ink-dark); color: var(--paper-cream);
  border-color: var(--ink-dark);
}
.atm-camleg-cams button .g {
  font-family: var(--font-prose); font-size: 0.95rem;
  color: var(--red); letter-spacing: 0;
}
.atm-camleg-cams button.active .g { color: var(--paper-cream); }

.atm-camleg-legend {
  font-family: var(--font-code); font-size: 0.6rem;
  color: var(--ink-light); letter-spacing: 0.04em;
  display: flex; gap: 0.7rem; flex-wrap: wrap;
  padding-top: 0.1rem;
}
.atm-camleg-legend span { display: inline-flex; align-items: center; gap: 4px; }
.atm-camleg-legend .sw { width: 12px; height: 6px; border-radius: 0; }

.atm-camleg-hint {
  font-family: var(--font-code); font-size: 0.58rem;
  color: var(--ink-medium); letter-spacing: 0.02em;
  line-height: 1.65;
  padding-top: 0.25rem;
  border-top: 1px dotted var(--rule);
}
.atm-camleg-hint em { font-style: italic; color: var(--accent); }
.atm-camleg-hint strong { color: var(--ink-dark); font-weight: 600; }
.atm-camleg-hint .range { color: var(--ink-faded); }

/* ===== INSIGHT BAR (top of stage) ============
   Five curated views, each answering a question.
   This is the primary UX — click a view, get an
   intentional 3D pose + caption. The full lego
   axis controller is tucked behind "Tune axes".
   ============================================ */
/* Channels strip — its own grid row, paper-cream surface, sits between
   the pretext sentence and the stage.  Both stage + ledger start at
   the bottom edge of this strip. */
.atm-axis-bar {
  background: var(--paper-warm);
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  padding: 0.45rem 1.4rem 0.45rem;
  font-family: var(--font-prose);
  position: relative;
  /* overflow:visible so the kicker tab can protrude upward into the
     pretext row without being clipped.  z-index lifts the bar's
     stacking context above the pretext (z=1) so the kicker tab
     renders ON TOP of the pretext's paper-cream background. */
  overflow: visible;
  z-index: 5;
}
/* "Channels" kicker — sits as a notebook-tab that overlaps up into the
   pretext row above.  The tab's bottom edge merges into the strip's top
   border so the chips below are visually flush with the top of the
   strip's content area.  Red border + red text make the tab read as a
   section marker, not chrome.  (Earlier drafts prefixed "II ·" implying
   numbered sections — dropped since nothing else on the page uses the
   same numbering system.) */
.atm-axis-bar::before {
  content: 'Channels';
  position: absolute;
  bottom: 100%;
  left: 1.4rem;
  margin-bottom: -1px;
  background: var(--paper-warm);
  color: var(--red);
  font-family: var(--font-sans); font-size: 0.62rem; font-weight: 700;
  letter-spacing: 0.22em; text-transform: uppercase;
  padding: 0.28rem 0.7rem 0.22rem;
  border: 1px solid var(--red);
  border-bottom: none;
  border-top-left-radius: 0;
  border-top-right-radius: 0;
  line-height: 1;
  white-space: nowrap;
  z-index: 2;
}
.atm-insights-row {
  display: flex; align-items: center; gap: 0.7rem; flex-wrap: wrap;
}
.atm-insights {
  display: inline-flex; gap: 0.35rem; flex-wrap: wrap; align-items: center;
}
.atm-insight-btn {
  display: inline-flex; align-items: center; gap: 0.45rem;
  font-family: var(--font-code); font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-medium);
  background: transparent;
  border: 1px solid var(--line-soft);
  border-radius: 0; padding: 0.32rem 0.7rem;
  cursor: pointer; transition: all 0.14s;
  white-space: nowrap;
}
.atm-insight-btn:hover {
  border-color: var(--accent); color: var(--accent);
  background: var(--accent-wash);
}
.atm-insight-btn.active {
  background: var(--ink-dark); color: var(--paper-cream);
  border-color: var(--ink-dark);
}
.atm-insight-btn.active:hover { background: var(--accent); border-color: var(--accent); color: var(--paper-cream); }
.atm-insight-btn .num {
  font-family: var(--font-code); font-style: normal;
  font-size: 0.58rem; font-weight: 600;
  letter-spacing: 0.08em;
  color: var(--accent);
  opacity: 0.7;
}
.atm-insight-btn.active .num { color: var(--paper-cream); opacity: 0.9; }
.atm-insight-btn.modified::after {
  content: ' \u00b7 tuned'; font-size: 0.72rem; color: var(--accent); font-family: var(--font-code); font-style: normal;
}
.atm-insight-btn.active.modified::after { color: var(--paper-cream); }

/* Register fingerprint \u2014 six dots beneath the title showing which
   registers an insight touches (When / What / State / Effort / Outcome /
   Quality). Filled = touches it, empty = doesn't. Reads as a tiny
   barcode of "what story does this view tell". */
.atm-insight-btn .reg-strip {
  display: inline-flex; gap: 2px; margin-left: 0.3rem;
  align-items: center;
}
.atm-insight-btn .reg-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: transparent;
  border: 1px solid var(--ink-faded);
  transition: all 0.14s;
}
.atm-insight-btn .reg-dot.lit { border-color: transparent; }
.atm-insight-btn.active .reg-dot { border-color: rgba(245,240,225,0.5); }
.atm-insight-btn.active .reg-dot.lit { border-color: transparent; }

/* Story-matrix drawer styles removed — register info now lives inline
   on each axis chip; the matrix table is no longer rendered. */

.atm-tune {
  display: inline-flex; align-items: center; gap: 0.35rem;
  font-family: var(--font-code); font-size: 0.62rem; font-weight: 600;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--ink-medium);
  background: transparent;
  border: 1px dotted var(--line-muted);
  border-radius: 0; padding: 0.3rem 0.7rem;
  cursor: pointer; transition: all 0.14s;
  flex-shrink: 0;
}
.atm-tune:hover { border-color: var(--accent); color: var(--accent); }
.atm-tune.active {
  background: var(--paper-warm); border-color: var(--ink-dark); color: var(--ink-dark);
  border-style: solid;
}
.atm-tune .glyph { font-size: 0.9rem; line-height: 1; }

/* Caption pinned to the right of the chip row — the active insight's
   question + mapping read-out, balanced against the left-packed chips */
.atm-insight-caption {
  margin-left: auto;
  display: flex; flex-direction: column; align-items: flex-end; gap: 0.2rem;
  font-family: var(--font-prose);
  font-size: 0.82rem; line-height: 1.4;
  color: var(--ink-medium);
  font-style: italic;
  max-width: 46%;
  text-align: right;
}
.atm-insight-caption .q {
  font-family: var(--font-prose);
  font-size: 0.95rem; color: var(--ink-dark);
  font-weight: 500; font-style: italic;
  letter-spacing: -0.005em;
  white-space: normal;
}
.atm-insight-caption .q::before { content: '\201C\2009'; color: var(--accent); font-style: normal; }
.atm-insight-caption .q::after  { content: '\2009\201D'; color: var(--accent); font-style: normal; }
.atm-insight-caption .reads {
  color: var(--ink-medium);
  font-family: var(--font-code); font-size: 0.62rem;
  font-style: normal; letter-spacing: 0.04em;
  display: inline-flex; gap: 0.4rem; align-items: baseline; flex-wrap: wrap;
  justify-content: flex-end;
}
.atm-insight-caption .cap-ch {
  display: inline-flex; align-items: baseline; gap: 0.25rem;
  color: var(--ink-medium); white-space: nowrap;
}
.atm-insight-caption .cap-k {
  font-weight: 700; letter-spacing: 0.06em;
}
.atm-insight-caption .cap-sep { color: var(--ink-faded); }
.atm-insight-caption .cap-tuned {
  margin-left: 0.35rem;
  color: var(--accent); text-transform: uppercase;
  letter-spacing: 0.14em; font-size: 0.58rem;
}
.atm-insight-caption .cap-filter {
  font-family: var(--font-code); font-size: 0.62rem;
  color: var(--ink-medium);
  background: var(--accent-wash);
  border: 1px solid var(--accent-soft);
  border-radius: 0;
  padding: 0.1rem 0.45rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  cursor: help;
}
.atm-insight-caption .cap-filter strong {
  color: var(--accent); font-weight: 700;
}

/* Advanced: axis chip strip (hidden by default) */
.atm-axis-advanced {
  display: none;
  margin-top: 0.55rem;
  padding-top: 0.55rem;
  border-top: 1px dotted var(--line-soft);
}
.atm-axis-bar.tuning .atm-axis-advanced { display: block; }
.atm-axis-advanced-inner {
  display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
  font-family: var(--font-code);
}
.atm-axis-advanced-eyebrow {
  font-size: 0.52rem; font-weight: 700; letter-spacing: 0.18em;
  color: var(--accent); text-transform: uppercase;
  padding-right: 0.4rem; border-right: 1px dotted var(--line-dotted);
}

.atm-axis-chip {
  /* Axis chip: paper-lt surface, hairline rule, teal left edge for register
     identity.  Sizes bumped across the board (0.56→0.7 keys, 0.52→0.62
     registers, 0.76→0.92 values) per "need bigger clearer labels". */
  display: inline-flex; align-items: center; gap: 0.5rem;
  padding: 0.42rem 0.65rem;
  border: 1px solid var(--rule);
  /* removed: 3px coloured left-edge that encoded register identity */
  background: var(--paper-lt); border-radius: 0;
  cursor: pointer; transition: all 0.12s;
  position: relative;
}
.atm-axis-chip:hover { border-color: var(--red); }
.atm-axis-chip.active { border-color: var(--ink-dark); background: var(--paper-warm); }
.atm-axis-chip.empty {
  background: transparent;
  border-style: dashed;
  padding: 0.34rem 0.55rem;
  gap: 0.4rem;
}
.atm-axis-chip .ch-plus {
  font-family: var(--font-prose); font-size: 1rem; font-weight: 400;
  color: var(--ink-faded); line-height: 1;
}
.atm-axis-chip .ch-key-empty {
  border-right: none; padding-right: 0;
  color: var(--ink-faded);
}
.atm-axis-chip.empty:hover .ch-plus,
.atm-axis-chip.empty:hover .ch-key-empty { color: var(--red); }
.atm-axis-chip .ch-key {
  font-family: var(--font-sans);
  font-size: 0.7rem; font-weight: 700; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--ink-dark);
  padding-right: 0.4rem; border-right: 1px solid var(--line-soft);
}
.atm-axis-chip .ch-reg {
  font-family: var(--font-sans); font-size: 0.62rem;
  font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--reg-accent, var(--ink-medium));
  background: var(--reg-bg, transparent);
  padding: 0.14rem 0.45rem;
  border-radius: 0;
  cursor: help;
}
.atm-axis-chip .ch-val {
  font-family: var(--font-prose); font-size: 0.92rem;
  color: var(--ink-dark); font-style: italic; letter-spacing: -0.005em;
  white-space: nowrap;
}
.atm-axis-chip.empty .ch-val { color: var(--ink-faded); font-style: italic; }
.atm-axis-chip .ch-type {
  font-family: var(--font-sans);
  font-size: 0.56rem; letter-spacing: 0.14em; font-weight: 600;
  color: var(--ink-faded); text-transform: uppercase;
}
.atm-axis-chip .ch-clear {
  display: inline-flex; align-items: center; justify-content: center;
  width: 16px; height: 16px;
  border: none; background: transparent; cursor: pointer;
  font-family: var(--font-code); font-size: 0.8rem; color: var(--ink-faded);
  border-radius: 0; padding: 0;
  transition: all 0.12s;
}
.atm-axis-chip .ch-clear:hover { color: var(--fail); background: rgba(179,74,62,0.08); }
.atm-axis-chip.empty .ch-clear { display: none; }

/* MODULAR — consolidated SLAB row.  Holds slab channel chips +
   step-level filter chips + cluster segmented control + save-view
   button on a single line.  Demoted from the run-axis row visually
   (smaller eyebrow, tighter chips) so the run-axis row stays primary. */
.atm-slab-row {
  display: flex; align-items: center; gap: 0.55rem;
  flex-wrap: wrap;
  margin-top: 0.45rem;
  padding-top: 0.4rem;
  border-top: 1px dotted var(--rule);
}
.atm-slab-eyebrow {
  font-family: var(--font-code); font-size: 0.58rem; font-weight: 700;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--accent);
  flex-shrink: 0;
}
.atm-slab-eyebrow.muted { color: var(--ink-light); }
.atm-slab-chips,
.atm-stepfilter-chips {
  display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center;
}
.atm-slab-chip {
  display: inline-flex; align-items: center; gap: 0.42rem;
  padding: 0.32rem 0.55rem;
  border: 1px solid var(--rule);
  /* removed: 3px teal left sidebar — uniform border now */
  background: var(--paper-lt); border-radius: 0;
  cursor: pointer; transition: all 0.12s;
  position: relative;
  font-family: var(--font-code);
}
.atm-slab-chip:hover { border-color: var(--accent); }
.atm-slab-chip.active { border-color: var(--ink-dark); background: var(--paper-warm); }
.atm-slab-chip.empty {
  background: transparent; border-style: dashed;
  padding: 0.3rem 0.55rem;
}
.atm-slab-chip .sc-key {
  font-size: 0.62rem; font-weight: 700; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--ink-dark);
  padding-right: 0.32rem; border-right: 1px solid var(--line-soft);
}
.atm-slab-chip.empty .sc-key { border-right: none; color: var(--ink-faded); }
.atm-slab-chip .sc-label {
  font-family: var(--font-prose); font-size: 0.84rem;
  color: var(--ink-dark); font-style: italic; letter-spacing: -0.005em;
}
.atm-slab-chip.empty .sc-label { color: var(--ink-faded); font-style: italic; font-size: 0.78rem; }
.atm-slab-chip .sc-reg {
  font-family: var(--font-code); font-size: 0.52rem;
  font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--ink-light);
  padding: 0.04rem 0.34rem;
  border: 1px solid var(--rule);
  border-radius: 0;
}
.atm-slab-chip .sc-clear {
  display: inline-flex; align-items: center; justify-content: center;
  width: 14px; height: 14px;
  border: none; background: transparent; cursor: pointer;
  font-family: var(--font-code); font-size: 0.72rem; color: var(--ink-faded);
  border-radius: 0; padding: 0;
}
.atm-slab-chip .sc-clear:hover { color: var(--fail); }
.atm-slab-chip.empty .sc-clear { display: none; }

/* Slab popover — reuses the axis-pop classes for layout but is opened
   per slab-chip. */
.atm-slab-pop {
  position: absolute; top: calc(100% + 4px); left: 0;
  min-width: 280px; max-width: 340px;
  background: var(--paper-cream);
  border: 1px solid var(--ink-dark);
  border-radius: 0;
  box-shadow: 0 8px 32px rgba(28,25,23,0.18), inset 0 1px 0 rgba(255,255,255,0.4);
  z-index: 30;
  display: none; flex-direction: column;
  overflow: hidden;
}
.atm-slab-chip.active .atm-slab-pop { display: flex; }
.atm-slab-pop .pop-search { padding: 0.45rem 0.55rem; border-bottom: 1px solid var(--rule); background: white; }
.atm-slab-pop .pop-search input { width: 100%; font-family: var(--font-prose); font-size: 0.85rem; color: var(--ink-dark); border: none; outline: none; background: transparent; padding: 0.08rem 0.18rem; }
.atm-slab-pop .pop-search input::placeholder { color: var(--ink-faded); font-style: italic; }
.atm-slab-pop .pop-list { max-height: 320px; overflow-y: auto; list-style: none; padding: 0.2rem 0; }
.atm-slab-pop .pop-group {
  padding: 0.4rem 0.55rem 0.18rem; border-top: 1px dotted var(--rule);
  font-family: var(--font-code); font-size: 0.52rem; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--accent);
}
.atm-slab-pop .pop-group:first-child { border-top: none; }
.atm-slab-pop .pop-opt {
  /* dropped the 2px coloured left sidebar — selection
     reads as a paper-warm fill alone, matching the insight-pop. */
  padding: 0.4rem 0.6rem; cursor: pointer; list-style: none;
  transition: all 0.1s;
  display: flex; align-items: center; gap: 0.5rem;
}
.atm-slab-pop .pop-opt:hover,
.atm-slab-pop .pop-opt.hi { background: var(--paper-warm); }
.atm-slab-pop .pop-opt.selected { background: var(--paper-warm); }
.atm-slab-pop .opt-label { font-family: var(--font-prose); font-size: 0.9rem; color: var(--ink-dark); font-style: italic; flex: 1; }
.atm-slab-pop .opt-tag { font-family: var(--font-code); font-size: 0.54rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-light); }

/* MODULAR — step-filter chips: simple categorical toggles.  Each chip
   is wired to exactly one (filterKey, value) pair in state.stepFilters.
   "bring the filter slabs up to the same level as the
   slab to consolidate those." Padding, background, border-radius, and
   active-state treatment now match .atm-slab-chip so the filter chips
   read as part of the same slab-row register, not a separate UI. */
.atm-stepfilter-chip {
  display: inline-flex; align-items: center; gap: 0.42rem;
  padding: 0.32rem 0.55rem;
  border: 1px solid var(--rule); border-radius: 0;
  background: var(--paper-lt); cursor: pointer;
  font-family: var(--font-code); font-size: 0.62rem; font-weight: 600;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--ink-medium); transition: all 0.12s;
}
.atm-stepfilter-chip:hover { border-color: var(--accent); }
.atm-stepfilter-chip.active {
  border-color: var(--ink-dark); background: var(--paper-warm);
  color: var(--ink-dark);
}
.atm-stepfilter-chip .sw {
  width: 8px; height: 8px; flex-shrink: 0;
  border-radius: 0;
}
.atm-stepfilter-chip.fail-chip.active {
  border-color: var(--fail); background: var(--paper-warm);
  color: var(--fail);
}

/* MODULAR — cluster chip group (segmented control between program /
   day / none).  Same visual register as the step-filter chips; sits
   at the right end of the slab row. */
.atm-cluster-chips {
  display: inline-flex; gap: 2px;
  border: 1px solid var(--rule);
  background: var(--paper-lt);
  border-radius: 0;
  padding: 2px;
}
.atm-cluster-chip {
  font-family: var(--font-code); font-size: 0.6rem; font-weight: 600;
  letter-spacing: 0.14em; text-transform: uppercase;
  padding: 0.26rem 0.55rem;
  background: transparent;
  color: var(--ink-medium);
  border: 1px solid transparent;
  cursor: pointer; transition: all 0.12s;
}
.atm-cluster-chip:hover { color: var(--accent); }
.atm-cluster-chip.active {
  background: var(--ink-dark); color: var(--paper-cream);
  border-color: var(--ink-dark);
}

/* MODULAR — "+ save view" chip at the right edge of the slab row. */
.atm-save-view {
  font-family: var(--font-code); font-size: 0.6rem; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  padding: 0.3rem 0.6rem;
  background: transparent;
  border: 1px dashed var(--accent);
  color: var(--accent);
  border-radius: 0; cursor: pointer;
  transition: all 0.12s;
}
.atm-save-view:hover { background: var(--accent); color: var(--paper-cream); border-style: solid; }

/* MODULAR — narration strip CSS removed.  The editorial pretext sentence
   above the channels strip is the single narrative line; the channel chips
   themselves are the encoding read-out.  renderNarration() in JS is left
   in place as a guarded no-op (returns early when $narration is null). */

/* Autocomplete popover */
.atm-axis-pop {
  position: absolute; top: calc(100% + 4px); left: 0;
  min-width: 280px; max-width: 340px;
  background: var(--paper-cream);
  border: 1px solid var(--ink-dark);
  border-radius: 0;
  box-shadow: 0 8px 32px rgba(28,25,23,0.18), inset 0 1px 0 rgba(255,255,255,0.4);
  z-index: 30;
  display: none; flex-direction: column;
  overflow: hidden;
}
.atm-axis-chip.active .atm-axis-pop { display: flex; }
.atm-axis-pop .pop-search {
  padding: 0.5rem 0.6rem;
  border-bottom: 1px solid var(--rule);
  background: white;
}
.atm-axis-pop .pop-search input {
  width: 100%;
  font-family: var(--font-prose); font-size: 0.88rem;
  color: var(--ink-dark);
  border: none; outline: none; background: transparent;
  padding: 0.1rem 0.2rem;
}
.atm-axis-pop .pop-search input::placeholder { color: var(--ink-faded); font-style: italic; }
.atm-axis-pop .pop-hint {
  padding: 0.25rem 0.6rem;
  font-family: var(--font-code); font-size: 0.54rem;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--ink-faded);
  border-bottom: 1px dotted var(--rule);
  background: var(--paper-cream);
}
.atm-axis-pop .pop-list {
  max-height: 360px; overflow-y: auto;
  list-style: none; padding: 0.2rem 0;
}
.atm-axis-pop .pop-list::-webkit-scrollbar { width: 5px; }
.atm-axis-pop .pop-list::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 0; }

/* Register section heading inside the picker — "When", "What", etc. */
.atm-axis-pop .pop-group {
  padding: 0.5rem 0.6rem 0.25rem;
  border-top: 1px dotted var(--rule);
  display: flex; flex-direction: column; gap: 0.05rem;
  background: var(--paper-cream);
}
.atm-axis-pop .pop-group:first-child { border-top: none; }
.atm-axis-pop .pop-group-label {
  font-family: var(--font-code); font-size: 0.55rem;
  font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
  display: inline-flex; align-items: center; gap: 0.4rem;
}
.atm-axis-pop .pop-group-label::before {
  content: ''; display: inline-block;
  width: 8px; height: 8px;
  background: var(--reg-accent, var(--accent));
  border-radius: 50%;
}
.atm-axis-pop .pop-group-q {
  font-family: var(--font-prose); font-style: italic;
  font-size: 0.74rem; color: var(--ink-light);
  letter-spacing: -0.005em;
}

.atm-axis-pop .pop-opt {
  padding: 0.4rem 0.6rem 0.45rem 0.6rem;
  cursor: pointer;
  display: flex; flex-direction: column; gap: 0.2rem;
  /* removed: 2px register-tinted left-edge marker on hover/active */
  transition: all 0.1s;
}
.atm-axis-pop .pop-opt:hover,
.atm-axis-pop .pop-opt.hi {
  background: var(--paper-warm);
}
.atm-axis-pop .pop-opt.disabled { opacity: 0.35; cursor: not-allowed; }
.atm-axis-pop .pop-opt .opt-line {
  display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem;
}
.atm-axis-pop .pop-opt .opt-label {
  font-family: var(--font-prose); font-size: 0.88rem;
  color: var(--ink-dark); font-style: italic; letter-spacing: -0.005em;
}
.atm-axis-pop .pop-opt .opt-tag {
  font-family: var(--font-code); font-size: 0.54rem;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink-faded);
  flex-shrink: 0;
}
.atm-axis-pop .pop-opt .opt-tag.cont { color: var(--accent); }
.atm-axis-pop .pop-opt .opt-tag.cat  { color: var(--prog-3); }
.atm-axis-pop .pop-opt .opt-desc {
  font-family: var(--font-prose);
  font-size: 0.74rem; line-height: 1.45;
  color: var(--ink-light); letter-spacing: -0.003em;
}
.atm-axis-pop .pop-opt.disabled .opt-desc { color: var(--ink-faded); }
.atm-axis-pop .pop-foot {
  padding: 0.4rem 0.6rem;
  font-family: var(--font-prose); font-style: italic; font-size: 0.74rem;
  color: var(--ink-light);
  border-top: 1px dotted var(--rule);
  background: white;
  line-height: 1.4;
}
.atm-axis-pop .pop-foot .fig { font-family: var(--font-code); color: var(--ink-dark); font-style: normal; }
.atm-axis-pop .no-match {
  padding: 0.5rem 0.6rem;
  font-family: var(--font-prose); font-style: italic;
  color: var(--ink-faded); font-size: 0.82rem;
  text-align: center;
}

/* (The old .atm-preset-bar floating bar has moved into .atm-camleg.) */

/* ===== SCENE CONTROLS — dial-in panel (right edge of stage) =====
   Collapsible, default open.  Live readouts of camera position / target /
   FOV / distance, plus nudgeable inputs for the constants we want to tune
   (FOV, CORNER_DIST, FACE_DIST, label scale clamps).  Tufte/teal: paper-cream
   surface, teal eyebrow, Kecal labels, IBM Plex Mono numerals. */
.atm-scene {
  /* The bottom-right placement is handled by the four-corner block
     above.  Sized so all 11 rows + actions fit without internal scroll
     while still leaving room for the ledger in the top-right corner. */
  width: 270px;
  display: flex; flex-direction: column;
  background: var(--glass-bg-deep);
  /* dropped 3px red left sidebar — uniform 1px rule. */
  border: 1px solid var(--rule);
  border-radius: 0;
  box-shadow: 0 4px 22px rgba(42,37,32,0.07), inset 0 1px 0 rgba(255,255,255,0.45);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  font-family: var(--font-prose);
  overflow: visible;        /* let the panel grow to fit content naturally */
}
.atm-scene-head {
  display: flex; align-items: center; gap: 0.55rem;
  padding: 0.32rem 0.6rem 0.3rem;
  cursor: pointer;
  border-bottom: 1px solid var(--rule);
  user-select: none;
}
.atm-scene-eyebrow {
  font-family: var(--font-sans); font-size: 0.62rem;
  font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--red);
}
.atm-scene-num {
  font-family: var(--font-sans); font-size: 0.56rem; font-weight: 700;
  color: var(--ink-faded); letter-spacing: 0.16em;
}
.atm-scene-chev {
  margin-left: auto;
  font-family: var(--font-prose); font-size: 0.85rem;
  color: var(--red); transition: transform 0.18s;
}
.atm-scene.collapsed { max-height: 36px; width: 200px; }
.atm-scene.collapsed .atm-scene-body { display: none; }
.atm-scene.collapsed .atm-scene-chev { transform: rotate(-90deg); }

.atm-scene-body {
  /* Compact tabular density — every row aligned on a 22px baseline so
     the whole panel fits cleanly in the bottom-right corner without
     internal scroll.  Section headers reduced to a single hairline + a
     small caps label to save vertical room. */
  display: flex; flex-direction: column;
  padding: 0.35rem 0.55rem 0.45rem;
  gap: 0.32rem;
  font-size: 0.7rem;
}

.atm-scene-section {
  display: flex; flex-direction: column; gap: 0.1rem;
}
.atm-scene-section-h {
  font-family: var(--font-sans); font-size: 0.52rem;
  font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--ink-medium);
  display: flex; align-items: center; gap: 0.4rem;
  margin-bottom: 0.02rem;
  line-height: 1;
}
.atm-scene-section-h::after { content: ''; flex: 1; height: 1px; background: var(--rule); }
/* Thin dotted divider separates the live readouts above from the
   tunable inputs below — replaces the dropped section headers with
   one minimal visual cue. */
.atm-scene-tunes {
  border-top: 1px dotted var(--rule);
  padding-top: 0.28rem; margin-top: 0.06rem;
}

.atm-scene-row {
  display: grid; grid-template-columns: 72px 1fr;
  align-items: center; gap: 0.4rem;
  min-height: 20px;
}
.atm-scene-row .lab {
  font-family: var(--font-sans); font-size: 0.6rem;
  font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink-light);
}
/* Figma-style scrub: pointer-down on a `.scrub` element captures the
   pointer and drags the value horizontally.  The pointer flips to ew-resize
   on hover.  Shift = fine (0.1×), Cmd/Ctrl = coarse (10×).  Click-to-
   edit on the input still works because we ignore drags shorter than 3px.

   Two visual variants share the behavior:
     `.lab.scrub`  — full row label with a small ↔ arrow indicator
     `.ax-k.scrub` — inline x/y/z mini-label, no arrow (would be too busy
                     with three of them in one row), teal underline on
                     hover so it's clearly draggable. */
.atm-scene .scrub {
  cursor: ew-resize;
  user-select: none;
  -webkit-user-select: none;
  transition: color 0.12s, background 0.12s;
}
.atm-scene .scrub:hover { color: var(--red); }
.atm-scene .scrub.scrubbing { color: var(--red); }

.atm-scene-row .lab.scrub {
  position: relative;
  padding-left: 0.85em;
}
.atm-scene-row .lab.scrub::before {
  content: '\2194';
  position: absolute; left: 0; top: 50%;
  transform: translateY(-50%);
  font-family: var(--font-prose);
  font-size: 0.85em; font-weight: 400;
  color: var(--red); opacity: 0.55;
  letter-spacing: 0;
  transition: opacity 0.12s, transform 0.12s;
}
.atm-scene-row .lab.scrub:hover::before { opacity: 1; }
.atm-scene-row .lab.scrub.scrubbing::before {
  opacity: 1;
  transform: translateY(-50%) scale(1.15);
}

.atm-scene-row .ax-k.scrub {
  border-bottom: 1px dotted transparent;
  padding-bottom: 1px;
}
.atm-scene-row .ax-k.scrub:hover,
.atm-scene-row .ax-k.scrub.scrubbing {
  border-bottom-color: var(--red);
}

body.atm-scrubbing { cursor: ew-resize !important; user-select: none; }
body.atm-scrubbing * { cursor: ew-resize !important; }
.atm-scene-row .val {
  font-family: var(--font-code); font-size: 0.78rem;
  font-variant-numeric: tabular-nums;
  color: var(--ink-dark);
  background: linear-gradient(transparent 58%, var(--hl) 58%);
  padding: 0 0.18em;
  justify-self: end;
  text-align: right;
  letter-spacing: -0.01em;
}
.atm-scene-row .val.tri {
  display: inline-flex; gap: 0.28rem;
  background: transparent; padding: 0;
}
.atm-scene-row .val .ax {
  display: inline-flex; align-items: baseline; gap: 0.18rem;
  background: linear-gradient(transparent 58%, var(--hl) 58%);
  padding: 0 0.18em;
}
.atm-scene-row .val .ax-k {
  font-family: var(--font-sans); font-size: 0.56rem;
  font-weight: 700; color: var(--red);
  letter-spacing: 0.06em; text-transform: uppercase;
}

.atm-scene-row input[type=number] {
  font-family: var(--font-code); font-size: 0.72rem;
  font-variant-numeric: tabular-nums;
  color: var(--ink-dark);
  background: var(--paper-lt);
  border: 1px solid var(--rule);
  border-radius: 0;
  padding: 0.06rem 0.32rem;
  width: 100%;
  height: 18px;
  outline: none;
  transition: border-color 0.12s, box-shadow 0.12s;
}
.atm-scene-row input[type=number]:focus {
  border-color: var(--red);
  box-shadow: 0 0 0 2px rgba(58,122,106,0.1);
}
.atm-scene-row input[type=number]::-webkit-outer-spin-button,
.atm-scene-row input[type=number]::-webkit-inner-spin-button {
  -webkit-appearance: none; margin: 0;
}

.atm-scene-actions {
  display: flex; gap: 0.3rem;
  padding-top: 0.22rem;
  border-top: 1px dotted var(--rule);
  margin-top: 0.05rem;
}
.atm-scene-btn {
  flex: 1;
  font-family: var(--font-sans); font-size: 0.54rem;
  font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink-dark); background: var(--paper-lt);
  border: 1px solid var(--ink-dark);
  border-radius: 0;
  padding: 0.18rem 0.5rem;
  cursor: pointer;
  transition: all 0.12s;
}
.atm-scene-btn:hover { background: var(--ink-dark); color: var(--paper-cream); }
.atm-scene-btn.primary { background: var(--red); color: var(--paper-cream); border-color: var(--red); }
.atm-scene-btn.primary:hover { background: var(--red-deep); border-color: var(--red-deep); }

.atm-scene-snippet {
  font-family: var(--font-code); font-size: 0.62rem;
  background: var(--ink-dark); color: var(--paper-cream);
  border-radius: 0; padding: 0.4rem 0.55rem;
  letter-spacing: 0; line-height: 1.5;
  overflow-x: auto;
  white-space: pre;
  font-variant-numeric: tabular-nums;
}
.atm-scene-snippet .k { color: var(--red-muted); }
.atm-scene-snippet .v { color: var(--paper-cream); }
.atm-scene-snippet .c { color: rgba(245,240,232,0.5); font-style: italic; }


/* Hover tooltip */
.atm-tooltip {
  position: fixed;
  background: var(--glass-bg-deep);
  border: var(--glass-border); border-radius: 0;
  box-shadow: var(--glass-shadow);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  padding: 0.65rem 0.8rem;
  font-family: var(--font-prose); font-size: 0.82rem;
  color: var(--ink-medium);
  /* STRATA: widened from 280 → 360 so the per-slab synopsis line has
     room to read in one or two lines instead of breaking mid-clause. */
  max-width: 360px;
  z-index: 50; display: none; pointer-events: none;
}
.atm-tooltip .tt-kind {
  font-family: var(--font-code); font-size: 0.56rem;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--accent); font-weight: 600; margin-bottom: 0.25rem;
}
.atm-tooltip .tt-subject {
  font-family: var(--font-prose); font-size: 0.95rem;
  color: var(--ink-dark); font-weight: 500; margin-bottom: 0.2rem;
  font-style: italic;
}
.atm-tooltip .tt-meta {
  font-family: var(--font-code); font-size: 0.68rem;
  color: var(--ink-medium); letter-spacing: 0.02em;
  font-variant-numeric: tabular-nums;
}
/* program-flow gloss surfaces the
   run's overall shape (inputs → first agent → scouts → compiler)
   under the run identity rows. Reads as the cube's caption. */
.atm-tooltip .tt-program-flow {
  font-family: var(--font-prose); font-size: 0.74rem;
  color: var(--ink-medium); font-style: italic;
  line-height: 1.5;
  margin-top: 0.35rem;
  padding-top: 0.32rem;
  border-top: 1px dotted var(--rule);
  max-width: 100%;
}
.atm-tooltip .tt-eval {
  margin-top: 0.3rem;
  font-family: var(--font-code); font-size: 0.62rem; font-weight: 600;
  letter-spacing: 0.12em; text-transform: uppercase;
}
.atm-tooltip .tt-eval.pass { color: var(--pass); }
.atm-tooltip .tt-eval.partial { color: var(--partial); }
.atm-tooltip .tt-eval.fail { color: var(--fail); }

/* STRATA — per-slab step section, drawn below the run identity rows
   when the hover hits a specific slab. The section is bracketed by a
   hairline rule and led with metadata chips, then the step's
   plain-English synopsis from services/*.md or evals/*.eval.md. */
.atm-tooltip .tt-step {
  margin-top: 0.55rem;
  padding-top: 0.45rem;
  border-top: 1px dotted var(--rule);
  display: flex; flex-direction: column; gap: 0.32rem;
}
.atm-tooltip .tt-step-head {
  display: flex; flex-wrap: wrap; align-items: center; gap: 0.32rem;
}
.atm-tooltip .tt-step-phase {
  font-family: var(--font-code); font-size: 0.6rem; font-weight: 700;
  letter-spacing: 0.1em;
  color: var(--paper-cream); background: var(--accent);
  padding: 0.1rem 0.4rem 0.08rem;
  border-radius: 0;
}
.atm-tooltip .tt-step-name {
  font-family: var(--font-prose); font-size: 0.92rem;
  color: var(--ink-dark); font-weight: 500; font-style: italic;
  letter-spacing: -0.005em;
}
/* phase-role gloss sits below the
   slab name; tells the reader which STAGE of the run this slab is.
   Single-line, small mono, ink-3 so it reads as metadata. */
.atm-tooltip .tt-step-phase-gloss,
.atm-step-card .tt-step-phase-gloss {
  font-family: var(--font-code); font-size: 0.6rem;
  letter-spacing: 0.08em;
  color: var(--ink-medium);
  line-height: 1.5;
  margin-top: 0.25rem;
  padding: 0.18rem 0.4rem;
  background: var(--paper-warm);
  /* dropped 2px teal left sidebar — paper-warm fill alone. */
  border-radius: 0;
}
.atm-tooltip .tt-step-chips {
  display: inline-flex; flex-wrap: wrap; gap: 0.25rem;
  align-items: center;
}
.atm-tooltip .tt-step-chip {
  font-family: var(--font-code); font-size: 0.54rem; font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase;
  padding: 0.1rem 0.36rem;
  border: 1px solid var(--rule); border-radius: 0;
  color: var(--ink-medium);
  background: var(--paper-lt);
}
.atm-tooltip .tt-step-chip.input    { color: var(--ink-medium); border-color: var(--line-soft); }
.atm-tooltip .tt-step-chip.agent    { color: var(--accent); border-color: var(--accent-soft-c); background: var(--accent-wash); }
.atm-tooltip .tt-step-chip.eval     { color: var(--amber-deep); border-color: var(--amber-soft); background: var(--amber-tint); }
.atm-tooltip .tt-step-chip.pass     { color: var(--pass); border-color: rgba(20,128,62,0.35); background: rgba(20,128,62,0.06); }
.atm-tooltip .tt-step-chip.fail     {
  color: var(--paper-cream); background: var(--fail);
  border-color: var(--fail);
}
.atm-tooltip .tt-step-chip.parallel {
  color: var(--ink-dark); border-color: var(--ink-faded);
  font-style: italic; text-transform: none; letter-spacing: 0.04em;
}
.atm-tooltip .tt-step-synopsis {
  font-family: var(--font-prose); font-size: 0.82rem;
  color: var(--ink-medium); font-style: italic;
  line-height: 1.45; letter-spacing: -0.005em;
}
.atm-tooltip .tt-step-meta {
  font-family: var(--font-code); font-size: 0.62rem;
  color: var(--ink-light); letter-spacing: 0.02em;
  font-variant-numeric: tabular-nums;
}
.atm-tooltip .tt-step-siblings {
  font-family: var(--font-code); font-size: 0.6rem;
  color: var(--ink-light); letter-spacing: 0.02em;
  line-height: 1.45;
}
.atm-tooltip .tt-step-siblings .me {
  color: var(--accent); font-weight: 700;
}

/* STRATA — sidebar variant of the step card.  Shares the chip palette
   + synopsis layout with the hover tooltip via the .tt-step-* classes,
   then adds an EMITS / RECEIVES section listing real binding
   artifacts from BINDINGS_INDEX and the ENSURES gist from the
   contract.  Identity: the card is wrapped in .atm-step-card so the
   sidebar can give it slightly more breathing room than the cramped
   tooltip allows. */
.atm-step-card {
  margin-top: 0.65rem;
  padding: 0.7rem 0.75rem 0.8rem;
  background: var(--paper-warm);
  border: 1px solid var(--rule);
  /* removed: 3px teal left sidebar accent */
  border-radius: 0;
  display: flex; flex-direction: column; gap: 0.45rem;
}
.atm-step-card .tt-step-head { gap: 0.4rem; }
.atm-step-card .tt-step-name { font-size: 1.02rem; }
.atm-step-card .tt-step-synopsis { font-size: 0.86rem; }
.atm-step-card .tt-step-siblings { font-size: 0.64rem; }
/* Bigger contracts → more breathing room around the chip cluster. */
.atm-step-card .tt-step-chips { gap: 0.32rem; }
.atm-step-card .tt-step-chip { font-size: 0.56rem; padding: 0.14rem 0.42rem; }

/* Sidebar eyebrow above the step card — anchors which slab is locked
   ("SLAB · step 4 of 8") and carries the clear-lock button. */
.atm-step-card-eyebrow {
  margin-top: 0.85rem;
  display: flex; align-items: center; justify-content: space-between;
  font-family: var(--font-code); font-size: 0.6rem; font-weight: 700;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--accent);
  padding-top: 0.55rem;
  border-top: 1px dotted var(--rule);
}
.atm-step-card-clear {
  font-family: var(--font-code); font-size: 0.78rem;
  background: transparent; border: 1px solid var(--rule);
  border-radius: 0; color: var(--ink-light);
  padding: 0 0.45rem; line-height: 1.4;
  cursor: pointer; transition: all 0.12s;
}
.atm-step-card-clear:hover { color: var(--fail); border-color: var(--fail); }

/* EMITS / RECEIVES panel — lists real binding artifacts with their
   actual byte size pulled from BINDINGS_INDEX.  ENSURES gist sits
   below as the contract guarantee. */
.atm-step-card .atm-step-emits {
  margin-top: 0.25rem;
  padding-top: 0.45rem;
  border-top: 1px dotted var(--rule);
  display: flex; flex-direction: column; gap: 0.3rem;
}
.atm-step-card .atm-step-emits-eyebrow {
  font-family: var(--font-code); font-size: 0.54rem; font-weight: 700;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--ink-medium);
}
.atm-step-card .atm-step-artifacts {
  list-style: none; padding: 0; margin: 0;
  display: flex; flex-direction: column; gap: 0.2rem;
}
.atm-step-card .atm-step-artifacts li {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 0.5rem;
  font-family: var(--font-code); font-size: 0.74rem;
  padding: 0.22rem 0.4rem;
  background: var(--paper-lt);
  /* dropped 2px accent-soft left sidebar — paper-lt fill alone. */
}
.atm-step-card .atm-step-artifacts .art-name {
  color: var(--ink-dark); font-weight: 500; letter-spacing: 0.01em;
}
.atm-step-card .atm-step-artifacts .art-bytes {
  color: var(--ink-light); font-variant-numeric: tabular-nums;
  font-size: 0.66rem;
}
.atm-step-card .atm-step-empty {
  font-family: var(--font-prose); font-size: 0.78rem;
  color: var(--ink-faded); font-style: italic;
}
.atm-step-card .atm-step-ensures {
  font-family: var(--font-prose); font-size: 0.82rem;
  color: var(--ink-medium); font-style: italic;
  line-height: 1.45;
  padding-top: 0.15rem;
}
.atm-step-card .atm-step-ensures .ens-k {
  font-family: var(--font-code); font-size: 0.55rem;
  font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--accent);
  font-style: normal;
  margin-right: 0.45rem;
}

/* ===== RIGHT RAIL · LEDGER / EVAL ===== */

/* Lens tabs — Summary / Selected. Drives off the LENSES table.
   v3.1: ledger is now a floating glass panel, so the tabs need a
   matching translucent background instead of the old paper-cream. */
.atm-lens-tabs {
  display: flex; gap: 0;
  border-bottom: 1px solid var(--rule);
  position: sticky; top: 0; z-index: 5;
  background: var(--glass-bg-deep);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
}
.atm-lens-tab {
  flex: 1; padding: 0.7rem 0.9rem;
  font-family: var(--font-code); font-size: 0.7rem;
  font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink-light);
  background: transparent; border: none;
  border-bottom: 3px solid transparent;
  cursor: pointer; transition: all 0.14s;
  display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
}
.atm-lens-tab:hover:not(:disabled) { color: var(--accent); background: var(--accent-wash); }
.atm-lens-tab.active {
  color: var(--ink-dark);
  border-bottom-color: var(--accent);
  background: var(--paper-warm);
}
.atm-lens-tab:disabled { color: var(--ink-faded); cursor: default; opacity: 0.55; }
.atm-lens-tab .lens-count {
  font-family: var(--font-code); font-size: 0.62rem;
  font-weight: 600; letter-spacing: 0.05em;
  color: var(--ink-medium);
  background: var(--paper-warm);
  border: 1px solid var(--rule);
  padding: 0.05rem 0.45rem;
  border-radius: 0;
  font-variant-numeric: tabular-nums;
}
.atm-lens-tab.active .lens-count {
  background: var(--ink-dark); color: var(--paper-cream); border-color: var(--ink-dark);
}
.atm-lens-tab .lens-mark-sw {
  width: 10px; height: 10px; border-radius: 0;
  box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.2);
}

/* v3.1: ledger is now a floating glass panel anchored top-right,
   matching the lanes panel's chrome.  Width is fixed; max-height fills
   ~70% of the stage so it can't collide with the Scene Controls panel
   in the bottom-right corner. */
.atm-ledger {
  /* Ledger sits in the top-right corner; the scene-controls panel sits
     below it.  Cap the ledger height so it always leaves ~360px of
     vertical room for the scene-controls panel; the body scrolls
     internally when its content exceeds the cap. */
  display: flex; flex-direction: column;
  width: 380px;
  max-height: calc(100% - 23rem);
  background: var(--glass-bg-deep);
  /* dropped 3px red left sidebar — uniform 1px rule. */
  border: 1px solid var(--rule);
  border-radius: 0;
  box-shadow: 0 4px 22px rgba(42,37,32,0.07), inset 0 1px 0 rgba(255,255,255,0.45);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  overflow: hidden;
}
.atm-ledger-body {
  flex: 1; overflow-y: auto;
  padding: 1rem 1.1rem 1.5rem;
}
.atm-ledger-body::-webkit-scrollbar { width: 6px; }
.atm-ledger-body::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 0; }

.atm-eyebrow {
  font-family: var(--font-sans); font-size: 0.66rem;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--red); font-weight: 700;
  display: inline-flex; align-items: center; gap: 0.65rem;
  margin-bottom: 0.7rem;
}
.atm-eyebrow::before { content: ''; width: 22px; height: 1px; background: var(--red); }

.atm-run-card {
  padding: 0.75rem 0; border-bottom: 1px dotted var(--rule);
}
.atm-run-card:last-child { border-bottom: none; }
.atm-run-head {
  display: flex; align-items: center; gap: 0.5rem;
  font-family: var(--font-code); font-size: 0.6rem;
  color: var(--ink-light); letter-spacing: 0.06em;
  margin-bottom: 0.2rem;
}
.atm-run-head .sw { width: 8px; height: 8px; border-radius: 0; }
.atm-run-head .prog { color: var(--ink-dark); font-weight: 600; text-transform: uppercase; }
.atm-run-head .ts { margin-left: auto; font-variant-numeric: tabular-nums; }
.atm-run-subject {
  font-family: var(--font-prose); font-size: 1rem;
  color: var(--ink-dark); font-weight: 500; letter-spacing: -0.005em;
  margin-bottom: 0.2rem;
}
.atm-run-subject em { font-style: italic; color: var(--accent); }
.atm-run-meta {
  font-family: var(--font-code); font-size: 0.62rem;
  color: var(--ink-light); letter-spacing: 0.02em;
  display: flex; gap: 0.6rem; flex-wrap: wrap;
  margin-bottom: 0.3rem;
}
.atm-run-meta .sep { color: var(--ink-faded); }
.atm-run-meta .gate {
  padding: 1px 6px; border-radius: 0; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.12em; font-size: 0.58rem;
}
.atm-run-meta .gate.delivered { background: rgba(20,128,62,0.1); color: var(--pass); }
.atm-run-meta .gate.awaiting { background: rgba(180,117,31,0.1); color: var(--partial); }
.atm-run-meta .gate.scheduled { background: var(--pending-wash); color: var(--ink-light); }
.atm-run-summary {
  font-family: var(--font-prose); font-size: 0.86rem; line-height: 1.5;
  color: var(--ink-medium); font-style: italic;
  /* dropped 2px teal left sidebar — keep indent via padding-left. */
  padding-left: 0.85rem;
  margin-top: 0.3rem;
}
.atm-run-summary em { color: var(--ink-dark); font-style: italic; font-weight: 500; }
.atm-run-summary code {
  font-family: var(--font-code); font-size: 0.8em; font-style: normal;
  background: var(--paper-aged); color: var(--ink-dark);
  padding: 0.04em 0.3em; border-radius: 0;
}
.atm-run-eval {
  display: inline-flex; align-items: center; gap: 0.35rem;
  margin-top: 0.35rem;
  font-family: var(--font-code); font-size: 0.62rem;
  color: var(--ink-light); letter-spacing: 0.04em;
}
.atm-run-eval .dot {
  width: 7px; height: 7px; border-radius: 50%; background: var(--pass);
}
.atm-run-eval.partial .dot { background: var(--partial); }
.atm-run-eval.fail .dot { background: var(--fail); }
.atm-run-eval .ratio {
  /* Eval pass-rate is THE check value the operator scans for.
     Amber on a clean ratio, hot amber on a fail. */
  font-weight: 600; color: var(--ink-dark);
  background: linear-gradient(transparent 58%, var(--hl) 58%);
  padding: 0 0.18em;
}
.atm-run-eval.fail .ratio,
.atm-run-eval.partial .ratio {
  background: linear-gradient(transparent 58%, var(--hl-hot) 58%);
}

/* Selected-run deep view — subject is the headline, then one dim
   metadata line (program · short-id · stamp · duration · context). */
.atm-selected-wrap {
  padding-bottom: 0.6rem;
  margin-bottom: 1rem;
  border-bottom: 1px solid var(--rule);
}
.atm-selected-name {
  font-family: var(--font-prose); font-size: 1.3rem;
  font-weight: 500; letter-spacing: -0.01em; line-height: 1.2;
  margin-bottom: 0.35rem;
}
.atm-selected-name em { font-style: italic; color: var(--accent); }

.atm-selected-meta {
  display: flex; align-items: center; gap: 0.4rem;
  font-family: var(--font-code); font-size: 0.66rem;
  color: var(--ink-light); letter-spacing: 0.03em;
  margin-bottom: 0.65rem;
  flex-wrap: wrap;
}
.atm-selected-meta .meta-sw {
  width: 9px; height: 9px; border-radius: 0; flex-shrink: 0;
}
.atm-selected-meta .meta-prog {
  color: var(--ink-dark); font-weight: 600;
  letter-spacing: 0.05em; text-transform: uppercase;
}
/* Data the user should KNOW gets the amber pen.  Run ID, the
   exact run timestamp, and the duration are the three "what am I looking
   at right now" facts a skimmer should pull from the metadata row. */
.atm-selected-meta .meta-id {
  color: var(--ink-dark); font-variant-numeric: tabular-nums;
  background: linear-gradient(transparent 58%, var(--hl) 58%);
  padding: 0 0.18em;
}
.atm-selected-meta .meta-time {
  color: var(--ink-dark);
  background: linear-gradient(transparent 58%, var(--hl) 58%);
  padding: 0 0.18em;
}
.atm-selected-meta .meta-dur {
  color: var(--ink-dark); font-variant-numeric: tabular-nums;
  background: linear-gradient(transparent 58%, var(--hl) 58%);
  padding: 0 0.18em;
}
.atm-selected-meta .meta-dot { color: var(--ink-faded); }
.atm-selected-meta .meta-context {
  font-family: var(--font-prose); font-style: italic;
  font-size: 0.78rem; color: var(--ink-light);
  letter-spacing: -0.005em;
}
.atm-selected-steps {
  list-style: none; display: flex; flex-direction: column; gap: 1px;
  margin-top: 0.4rem;
  font-family: var(--font-code); font-size: 0.74rem;
  color: var(--ink-medium); line-height: 1.5;
}
.atm-selected-steps li::before {
  content: attr(data-marker);
  color: var(--accent); font-weight: 600; margin-right: 0.35rem;
}
.atm-selected-steps li.parallel {
  color: var(--ink-dark);
  font-style: italic;
}
.atm-open-codex {
  display: inline-block; margin-top: 0.65rem;
  font-family: var(--font-code); font-size: 0.64rem; font-weight: 600;
  letter-spacing: 0.12em; text-transform: uppercase;
  padding: 0.35rem 0.75rem;
  border: 1px solid var(--ink-dark); color: var(--ink-dark);
  background: transparent; border-radius: 0;
  text-decoration: none; transition: all 0.12s;
}
