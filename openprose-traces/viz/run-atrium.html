.atm-open-codex:hover { background: var(--ink-dark); color: var(--paper-cream); }
.atm-run-eval-checks {
  list-style: none; display: flex; flex-direction: column; gap: 3px;
  margin-top: 0.45rem;
}
.atm-run-eval-checks li {
  display: grid; grid-template-columns: 1rem 1fr auto; gap: 6px;
  align-items: center;
  font-family: var(--font-code); font-size: 0.72rem;
  padding: 3px 6px; border-radius: 0; background: var(--paper-cream);
  border: 1px solid var(--rule);
}
.atm-run-eval-checks li.fail {
  background: rgba(179,74,62,0.06);
  border-color: rgba(179,74,62,0.3);
}
.atm-run-eval-checks li .glyph { color: var(--pass); font-weight: 700; text-align: center; }
.atm-run-eval-checks li.fail .glyph { color: var(--fail); }
.atm-run-eval-checks li .name { color: var(--ink-dark); }
.atm-run-eval-checks li.fail .name { color: var(--fail); }
.atm-run-eval-checks li .st { color: var(--ink-light); font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; }

.atm-empty {
  padding: 2rem 1.25rem; text-align: center;
  font-family: var(--font-prose); font-style: italic;
  color: var(--ink-faded); font-size: 0.88rem;
}

/* Trend sparklines (Operations mode) */
.atm-trend {
  margin-bottom: 1.25rem;
  padding-bottom: 0.85rem; border-bottom: 1px dotted var(--rule);
}
.atm-trend:last-child { border-bottom: none; }
.atm-trend-head {
  display: flex; align-items: center; gap: 0.5rem;
  font-family: var(--font-code); font-size: 0.6rem;
  color: var(--ink-medium); letter-spacing: 0.06em;
  margin-bottom: 0.25rem;
}
.atm-trend-head .sw { width: 8px; height: 8px; border-radius: 0; }
.atm-trend-head .prog { color: var(--ink-dark); font-weight: 600; text-transform: uppercase; }
.atm-trend-head .score { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink-dark); }
.atm-trend-bar {
  height: 10px; width: 100%;
  background: var(--paper-warm); border-radius: 0; overflow: hidden;
  position: relative;
}
.atm-trend-bar .fill {
  position: absolute; left: 0; top: 0; height: 100%;
}
.atm-trend-note {
  font-family: var(--font-prose); font-style: italic;
  font-size: 0.78rem; color: var(--ink-medium); margin-top: 0.3rem;
  line-height: 1.45;
}
.atm-trend-note em { color: var(--ink-dark); font-style: italic; font-weight: 500; }

/* ===== PRETEXT BAND — editorial prose row =====
   The narrative sentence between the masthead and the channels strip.
   Italic teal carries the author's emphasis; amber highlighter pulls
   the reader's eye to the data nouns (counts, IDs, dates).  The two
   never sit on the same phrase.  Extra bottom padding leaves room for
   the channels kicker tab to overlap upward without colliding with
   the prose's last line. */
.atm-pretext {
  /* MODULAR — narration strip removed, so the pretext is now the
     single editorial line above the channels strip.  Extra
     padding-bottom gives the prose a breathing gap above the
     "Channels" kicker tab (which is absolutely positioned over the
     bottom of this row from below).  Was 1.45rem; bumped to 2.1rem
     so the kicker tab + sentence text never crowd each other. */
  padding: 0.85rem 1.4rem 2.1rem;
  background: var(--paper-cream);
  display: flex; align-items: baseline; gap: 1.25rem;
  position: relative;
}
.atm-pretext-inner { flex: 1; min-width: 0; }
.atm-pretext .pre-eyebrow {
  font-family: var(--font-sans); font-size: 0.62rem;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--red); font-weight: 700;
  display: inline-flex; align-items: center; gap: 0.55rem;
  flex-shrink: 0;
  white-space: nowrap;
}
.atm-pretext .pre-eyebrow::before { content: ''; width: 18px; height: 1px; background: var(--red); }
.atm-pretext p {
  font-family: var(--font-prose); font-size: 1.05rem; line-height: 1.5;
  color: var(--ink-medium); text-wrap: pretty;
  margin: 0;
}
.atm-pretext p::first-line { font-variant: small-caps; letter-spacing: 0.04em; }
.atm-pretext p em { font-style: italic; color: var(--red); font-weight: 400; }
/* Reader's pen on counts: <strong> in narrate() output is always a
   numeric count or program tag — exactly the noun the operator should
   pull at a glance.  Amber highlighter under the baseline. */
.atm-pretext p strong {
  color: var(--ink-dark); font-weight: 500;
  font-family: var(--font-code); font-variant-numeric: tabular-nums;
  background: linear-gradient(transparent 58%, var(--hl) 58%);
  padding: 0 0.18em;
}
/* warn — the awaiting-review count, the soft-fail flag.  Hot amber mark,
   one per pretext sentence. */
.atm-pretext p .warn {
  color: var(--ink-dark);
  background: linear-gradient(transparent 58%, var(--hl-hot) 58%);
  padding: 0 0.1em;
}
.atm-pretext p .warn strong {
  background: transparent; padding: 0;
}
.atm-pretext p .fig {
  /* Data figure inside prose — amber highlighter under the
     baseline gives the operator the at-a-glance scan: counts, IDs,
     gate values get a marker; verbs and connecting words don't. */
  font-family: var(--font-code); font-variant-numeric: tabular-nums;
  font-size: 0.95em; color: var(--ink-dark);
  background: linear-gradient(transparent 58%, var(--hl) 58%);
  padding: 0 0.18em;
}
.atm-pretext p .fig.fig-hot {
  background: linear-gradient(transparent 58%, var(--hl-hot) 58%);
  color: var(--ink-dark);
}
.atm-pretext p .hl  { background: linear-gradient(transparent 58%, var(--hl) 58%); padding: 0 0.1em; }
.atm-pretext p .hl-hot { background: linear-gradient(transparent 58%, var(--hl-hot) 58%); padding: 0 0.1em; }
.atm-pretext p .tap {
  color: var(--red); cursor: pointer;
  border-bottom: 1px dotted var(--accent-dotted);
  transition: border-color 0.12s;
  font-style: italic;
}
.atm-pretext p .tap:hover { border-bottom-color: var(--red); border-bottom-style: solid; }

/* Narrow viewport: layout already single-column, but the four floating
   panels can stack on top of each other in tight viewports.  Shrink
   them so they don't overlap the cube. */
@media (max-width: 900px) {
  .atm-stage  { min-height: 480px; }
  .atm-ledger { width: min(380px, calc(100vw - 1.5rem)); max-height: calc(100% - 8rem); }
  .atm-scene  { width: min(264px, calc(100vw - 1.5rem)); }
}

  body em, body i { white-space: normal; }
  .nav-links, .nav-row, .run-tabs, .customer-tabs, .filter-group, .controls, .hero-actions, .actions, .toolbar, .topbar, .pretext, .axis-bar, .atm-top, .atm-pretext, .atm-axis-bar, .cx-top, .cx-tree, .cx-stage { flex-wrap: wrap !important; min-width: 0 !important; }
  .stamp, .hero-orb, .hero-card, .hero-visual, .hero-below, .ui-demo, .panel, .run-card, .app-card, .meet-card, .variation-tile, .b-meta, .h-meta, .h-eyebrow, .h-title, .verse-body, .benefit-copy, .benefit-visual, .compare-table, .install-cmd, .atm-stage, .atm-ledger, .axis-bar, .pui-kpi-pill, .detail-badge, .kbd-hint, .waterfall-chart, .dim-compare, .sparkline, .sparkline-table, .ledger, .lineage, .sg-table, .d-table { width: auto !important; max-width: 100% !important; min-width: 0 !important; }
  /* preserve brand wordmark integrity — don't break inside logo containers */
  .nav-logo, .nav-logo *, .h-mark, .h-mark *, .stamp-wordmark, .stamp-wordmark *, .wordmark, .wordmark *, .brand-mark, .brand-mark *, .logo, .logo *, .brand-logo, .brand-logo *, .stamp, .stamp *, .logo-wordmark, .logo-wordmark *, .footer-logo, .footer-logo *, .hero-wordmark, .hero-wordmark * { word-break: keep-all !important; overflow-wrap: normal !important; white-space: nowrap !important; }

<body>

<div class="atrium" id="atrium">

  <!-- HEADER · stacked brand on the left (OpenProse / organization),
       insight pill immediately after the stack, counts pinned far right. -->
  <header class="atm-top">
    <div class="atm-brand atm-brand-stack">
      <span class="brand-product">Open<em>Prose</em> <span class="brand-rev">modular</span></span>
      <span class="brand-customer"><span id="brand-org"></span> <em class="brand-window"><span class="hl" id="brand-window"></span></em></span>
    </div>
    <div class="atm-header-insight">
      <button class="atm-insight-pill" id="insight-pill" aria-haspopup="listbox" aria-expanded="false"></button>
    </div>
    <div class="atm-info">
      <span><span class="info-fig" id="info-programs"></span> programs</span>
      <span class="info-dot">&middot;</span>
      <span><span class="info-fig hl" id="info-runs"></span> runs</span>
      <span class="info-dot">&middot;</span>
      <span><span class="info-fig" id="info-evals"></span> evals</span>
      <span class="info-dot">&middot;</span>
      <span><span class="info-fig hl" id="info-pass"></span> pass</span>
    </div>
  </header>

  <!-- PRETEXT BAND — moved above the channels strip.  Sits between the
       header band and the channels strip in the page grid; reads as
       part of the header area for the active insight's narrative. -->
  <footer class="atm-pretext">
    <div class="atm-pretext-inner"><p id="pretext"></p></div>
  </footer>

  <!-- CHANNELS strip — its own grid row.  Stage + ledger start at the
       bottom edge of this strip. -->
  <div class="atm-axis-bar tuning" id="axis-bar">
    <div id="axis-chips" style="display:flex;gap:0.4rem;flex-wrap:wrap;"></div>
    <!-- MODULAR: consolidated slab row — channel chips, filter chips,
         cluster + save view all on one line.  The slab row is the SINGLE
         control surface for everything inside-the-cube + how the floor
         + saved views work.  Filter slabs ride next to slab channels so
         "what's encoded" and "what's visible" sit together. -->
    <div class="atm-slab-row" id="slab-row">
      <span class="atm-slab-eyebrow">Slab</span>
      <div id="slab-chips" class="atm-slab-chips"></div>
      <span class="atm-slab-eyebrow muted">Filter</span>
      <div id="stepfilter-chips" class="atm-stepfilter-chips"></div>
      <span class="atm-slab-eyebrow muted" style="margin-left:auto">Cluster</span>
      <div id="cluster-chips" class="atm-cluster-chips"></div>
      <span class="atm-slab-eyebrow muted" style="margin-left:0.5rem">View</span>
      <button id="save-view-btn" class="atm-save-view" title="Save the current encoding as a custom insight">+ save</button>
    </div>
    <!-- MODULAR: live narration strip removed — the editorial pretext
         sentence above the channels strip is the single narrative line.
         renderNarration() is left in JS as a guarded no-op (it bails when
         $narration is null) so we don't surgery all the call sites. -->
  </div>

  <!-- STAGE · 3D ATRIUM. Lanes + camera float above the canvas. -->
  <section class="atm-stage" id="stage">

    <!-- FLOATING · PROGRAMS / FILTERS (top-left glass panel) -->
    <aside class="atm-lanes">
      <span class="lane-eyebrow">Programs</span>
      <ul class="lane-list" id="lane-list"></ul>
      <div class="lane-divider"></div>
      <span class="lane-eyebrow">Subset</span>
      <div class="lane-filter-row" id="lane-filters"></div>
    </aside>

    <!-- FLOATING · LEDGER (top-right glass panel).
         v3.1: now hovers over the graph instead of taking a 400px column.
         Same chrome as the lanes panel; width 380px; scrolls inside. -->
    <aside class="atm-ledger">
      <div class="atm-ledger-body" id="ledger">
        <div class="atm-empty">Loading&hellip;</div>
      </div>
    </aside>

    <!-- FLOATING · CAMERA (bottom-left). Flat icon strip. -->
    <aside class="atm-camleg" aria-label="Camera">
      <div class="atm-camleg-section">
        <span class="eyebrow">Camera</span>
        <div class="atm-camleg-cams" role="group" aria-label="Camera presets">
          <button class="active" data-preset="corner" title="corner view, pitched 45°"><span class="g">&#x25C6;</span></button>
          <button data-preset="xy" title="X &times; Y face — front of cube"><span class="g">&#x25AD;</span>XY</button>
          <button data-preset="yz" title="Y &times; Z face — side of cube"><span class="g">&#x25AD;</span>YZ</button>
          <button data-preset="xz" title="X &times; Z face — top of cube"><span class="g">&#x25AD;</span>XZ</button>
          <button data-preset="frame" title="Fit — frame all books"><span class="g">&#x2922;</span></button>
        </div>
      </div>
      <div class="atm-camleg-legend" id="legend" style="display:none"></div>
    </aside>

    <!-- FLOATING · SCENE CONTROLS (right edge of stage).
         Live readouts of camera + scene state, plus nudgeable inputs for
         the constants that govern viewport fit (FOV, corner / face
         distances, label scale clamps).  Click the eyebrow to collapse.
         JH asked for "an output of the values so I can dial it in" —
         the live readouts ARE the output; the inputs let the user push
         a value and watch the scene respond. -->
    <aside class="atm-scene" id="scene-controls" aria-label="Scene controls">
      <div class="atm-scene-head" id="scene-toggle" role="button" tabindex="0" aria-expanded="true">
        <span class="atm-scene-num">III</span>
        <span class="atm-scene-eyebrow">Scene controls</span>
        <span class="atm-scene-chev" aria-hidden="true">&#x25BE;</span>
      </div>
      <div class="atm-scene-body">

        <!-- Every value is draggable: live camera state directly drives
             the camera, tune values drive sceneTune which rebuilds the
             presets and re-snaps.  Shift = fine (0.1×), Cmd = coarse
             (10×).  Double-click a label resets to its default. -->
        <div class="atm-scene-section">
          <div class="atm-scene-row">
            <span class="lab scrub" data-scrub="sc-in-fov" title="Drag · Shift = fine · Cmd = coarse">FOV°</span>
            <input type="number" id="sc-in-fov" min="10" max="90" step="1" value="36">
          </div>
          <div class="atm-scene-row">
            <span class="lab scrub" data-live="dist" title="Drag to dolly camera in/out along its current view direction">Distance</span>
            <span class="val" id="sc-dist">0</span>
          </div>
          <div class="atm-scene-row">
            <span class="lab">Pos</span>
            <span class="val tri" id="sc-pos">
              <span class="ax"><span class="ax-k scrub" data-live="pos-x" title="Drag to move camera along world X">x</span><span data-k="x">0</span></span>
              <span class="ax"><span class="ax-k scrub" data-live="pos-y" title="Drag to move camera along world Y">y</span><span data-k="y">0</span></span>
              <span class="ax"><span class="ax-k scrub" data-live="pos-z" title="Drag to move camera along world Z">z</span><span data-k="z">0</span></span>
            </span>
          </div>
          <div class="atm-scene-row">
            <span class="lab">Target</span>
            <span class="val tri" id="sc-look">
              <span class="ax"><span class="ax-k scrub" data-live="tgt-x" title="Drag to move look-at point along world X">x</span><span data-k="x">0</span></span>
              <span class="ax"><span class="ax-k scrub" data-live="tgt-y" title="Drag to move look-at point along world Y">y</span><span data-k="y">0</span></span>
              <span class="ax"><span class="ax-k scrub" data-live="tgt-z" title="Drag to move look-at point along world Z">z</span><span data-k="z">0</span></span>
            </span>
          </div>
          <div class="atm-scene-row">
            <span class="lab scrub" data-live="preset" title="Drag to cycle through camera presets (corner / xy / yz / xz)">Preset</span>
            <span class="val" id="sc-preset">corner</span>
          </div>
        </div>

        <!-- Tunable constants — same scrub mechanism, but they update
             sceneTune (and rebuild presets / projection matrix on
             change) rather than pushing the camera directly. -->
        <div class="atm-scene-section atm-scene-tunes">
          <div class="atm-scene-row">
            <span class="lab scrub" data-scrub="sc-in-corner" title="Drag · Shift = fine · Cmd = coarse">corner d</span>
            <input type="number" id="sc-in-corner" min="10" max="120" step="1" value="38">
          </div>
          <div class="atm-scene-row">
            <span class="lab scrub" data-scrub="sc-in-face" title="Drag · Shift = fine · Cmd = coarse">Face d</span>
            <input type="number" id="sc-in-face" min="10" max="120" step="1" value="34">
          </div>
          <div class="atm-scene-row">
            <span class="lab scrub" data-scrub="sc-in-pitch" title="Drag · Shift = fine · Cmd = coarse">Pitch</span>
            <input type="number" id="sc-in-pitch" min="0" max="0.8" step="0.02" value="0.22">
          </div>
          <div class="atm-scene-row">
            <span class="lab scrub" data-scrub="sc-in-ref" title="Drag · Shift = fine · Cmd = coarse">Ref dist</span>
            <input type="number" id="sc-in-ref" min="10" max="120" step="1" value="52">
          </div>
          <div class="atm-scene-row">
            <span class="lab scrub" data-scrub="sc-in-min" title="Drag · Shift = fine · Cmd = coarse">Min k</span>
            <input type="number" id="sc-in-min" min="0.1" max="2" step="0.05" value="0.45">
          </div>
          <div class="atm-scene-row">
            <span class="lab scrub" data-scrub="sc-in-max" title="Drag · Shift = fine · Cmd = coarse">Max k</span>
            <input type="number" id="sc-in-max" min="0.5" max="6" step="0.1" value="2.4">
          </div>
        </div>

        <div class="atm-scene-actions">
          <button class="atm-scene-btn" id="sc-snap" title="Print current camera pose as a preset block">snap</button>
          <button class="atm-scene-btn primary" id="sc-reset" title="Reapply current preset with current frame constants">Reapply</button>
        </div>

        <pre class="atm-scene-snippet" id="sc-snippet" hidden></pre>
      </div>
    </aside>

    <div class="atm-tooltip" id="tooltip"></div>
  </section>

</div>

<!-- Data slot: lib/data-slot.js guards the page; data/run-atrium.js is
     empty in the template and is where a dataset gets dropped in. -->
<script src="../lib/data-slot.js"></script>
<script src="../data/run-atrium.js"></script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================
   1. RUN INVENTORY  (data slot)
   The page ships as code only. Every trace value
   (programs, runs, step trees, binding artifacts,
   contract glosses, eval phrasings) arrives through
   window.TRACE_DATA, defined by data/run-atrium.js.
   Field shapes: data/run-atrium.schema.md.
   With the slot empty, TraceSlot.require() shows a
   notice and halts this module before any drawing.
   ============================================ */
const TRACE_DATA = TraceSlot.require('run-atrium', ['PROGRAMS', 'RUNS', 'RUN_STATES', 'BINDINGS_INDEX']);
const { PROGRAMS, RUNS, RUN_STATES, BINDINGS_INDEX } = TRACE_DATA;

// Display order of the program lanes. Falls back to PROGRAMS key order.
const PROGRAM_ORDER = TRACE_DATA.PROGRAM_ORDER || Object.keys(PROGRAMS);

// Program identity colours come from four CSS palette slots (--prog-1..4),
// assigned by position in PROGRAM_ORDER and cycled past the fourth. A
// dataset may pin its own `cssColor` per program instead.
PROGRAM_ORDER.forEach((p, i) => {
  const info = PROGRAMS[p];
  if (info && !info.cssColor) info.cssColor = `var(--prog-${(i % 4) + 1})`;
});

// Attach parent↔eval back-refs so the 3D can draw arcs
RUNS.forEach(r => {
  if (r.evalRunId) {
    const child = RUNS.find(x => x.id === r.evalRunId);
    if (child) r.evalChild = child;
  }
  if (r.upstream) {
    r.parentRun = RUNS.find(x => x.id === r.upstream);
  }
});

// Time range for Y-axis mapping: the earliest start floored to the hour,
// through the latest end rounded up to the hour plus one hour of headroom.
// A dataset may pin it with EPOCH_WINDOW = { start, end } (ISO strings).
const HOUR_MS = 3600000;
const _starts = RUNS.map(r => new Date(r.startedAt).getTime()).filter(Number.isFinite);
const _ends   = RUNS.map(r => new Date(r.endedAt || r.startedAt).getTime()).filter(Number.isFinite);
const EPOCH_MIN = TRACE_DATA.EPOCH_WINDOW
  ? new Date(TRACE_DATA.EPOCH_WINDOW.start).getTime()
  : Math.floor(Math.min(..._starts) / HOUR_MS) * HOUR_MS;
const EPOCH_MAX = TRACE_DATA.EPOCH_WINDOW
  ? new Date(TRACE_DATA.EPOCH_WINDOW.end).getTime()
  : Math.ceil(Math.max(..._ends) / HOUR_MS) * HOUR_MS + HOUR_MS;
const EPOCH_RANGE = (EPOCH_MAX - EPOCH_MIN) || 1;

function runTimeU(r) {
  // Map to 0..1 within the epoch window; 3D Y axis goes 0..TIME_DEPTH
  const t = new Date(r.startedAt).getTime();
  return (t - EPOCH_MIN) / EPOCH_RANGE;
}

// The UTC calendar days the runs touch, in order. Drives the `day` aspect,
// the day cluster, and the header's window label.
const RUN_DAYS = [...new Set(RUNS.map(r => String(r.startedAt).slice(0, 10)))].sort();

/* ============================================
   1a. STEP TREES
   --------------------------------------------
   RUN_STATES holds, per run id, the ordered list
   of logged steps from the run's state file.  Every
   slab in the strata cube corresponds to one logged
   ✓ or ✗ step.  The shape per step:
       { phase, sub, name, kind, status, parallel, siblings }
     phase     serial step number (∥start/done not stored)
     sub       '' or 'a'..'f' for parallel branches
     name      the service, input, or eval predicate name
     kind      'input' | 'agent' | 'eval'
     status    'ok' | 'fail'     ← the logged ✓/✗
     parallel  true when in a ∥ block
     siblings  the full ∥start member list

   SERVICE_SYNOPSES + EVAL_PREDICATES carry the
   one-line contracts for each service and eval
   check.  Used by the per-slab hover tooltip so
   each slice answers, in plain words, "what does
   this step actually do?".

   The synth path (PROGRAM_NODES + ROLE_WEIGHT)
   stays below as a fallback for any run not
   present in RUN_STATES: it copies a per-program
   role template, expands or trims it to run.steps,
   and weights each node by role (the compiler, the
   synthesis step, gets the thickest share).  Small
   jitter keyed off run.id keeps same-template runs
   from looking identical.  Shares are normalised to
   sum to 1, so the slab stack fills the cube.
   ============================================ */

/* Optional gloss tables. Each defaults to empty, so a
   dataset without them still renders; the tooltip and
   sidebar simply omit the matching line.
     ENSURES_GIST      service name → what its contract guarantees
     INPUT_GLOSS       input name   → what the caller supplies there
     RUN_PROGRAM_FLOW  program label → one-line shape of the program
     SERVICE_SYNOPSES  service name → one-line description of the step
     EVAL_PREDICATES   predicate name → the check phrased as a question
     TREND_NOTES       program id   → operations note under its health bar */
const ENSURES_GIST     = TRACE_DATA.ENSURES_GIST     || {};
const INPUT_GLOSS      = TRACE_DATA.INPUT_GLOSS      || {};
const RUN_PROGRAM_FLOW = TRACE_DATA.RUN_PROGRAM_FLOW || {};
const SERVICE_SYNOPSES = TRACE_DATA.SERVICE_SYNOPSES || {};
const EVAL_PREDICATES  = TRACE_DATA.EVAL_PREDICATES  || {};
const TREND_NOTES      = TRACE_DATA.TREND_NOTES      || {};
// Program ids whose delivered runs the Ship-log read-back names one by one.
const DELIVERABLE_PROGRAMS = TRACE_DATA.DELIVERABLE_PROGRAMS || [];

/* PHASE_GLOSS: what stage of the run a slab belongs to, keyed by the
   phase bucket the step card picks (input / profile / scout /
   synthesis / eval).  Neutral defaults; a dataset may override any. */
const PHASE_GLOSS = {
  input:     'INPUT · supplied by the caller, bound and checked before any agent runs.',
  profile:   'LEAD · a single agent runs ahead of the parallel fan-out.',
  scout:     'FAN-OUT · a parallel branch; each sibling works its own slice independently.',
  synthesis: 'SYNTHESIS · one agent reads every branch output and writes the final artifact.',
  eval:      'EVAL · a post-run check, one predicate at a time, against what each agent emitted.',
  ...(TRACE_DATA.PHASE_GLOSS || {}),
};

/* Eval predicates that read as a verdict (heavier slab, `verdict` role)
   rather than a single check.  Defaults to any predicate named *verdict*. */
const VERDICT_PREDICATES = TRACE_DATA.VERDICT_PREDICATES || null;
function _isVerdictPredicate(n) {
  return VERDICT_PREDICATES ? VERDICT_PREDICATES.includes(n) : /verdict/.test(n || '');
}

/* ============================================
   TRACE BUNDLE INTERFACE (modular foundation)
   ----------------------------------------------------
   Everything the atrium needs to render a trace lives
   in these consts: PROGRAMS, PROGRAM_ORDER, RUNS,
   RUN_STATES, BINDINGS_INDEX, SERVICE_SYNOPSES,
   EVAL_PREDICATES, ENSURES_GIST.  Together they form a
   TRACE_BUNDLE, the contract a TraceLoader has to
   produce.

   Today the bundle arrives through the data slot.
   Future work: TraceLoader.fromProseFolder(url) would
   fetch + parse a `.prose/` folder and return a fresh
   bundle, then TraceLoader.install(bundle) would swap
   the globals + re-layout.  Stubbed below so the
   contract is documented even though the install path
   isn't wired yet. */
const TRACE_BUNDLE = {
  customer: (TRACE_DATA.ORG && TRACE_DATA.ORG.slug) || null,
  window:   TRACE_DATA.TRACE_WINDOW || { start: RUN_DAYS[0] || null, end: RUN_DAYS[RUN_DAYS.length - 1] || null },
  programs: PROGRAMS,
  programOrder: PROGRAM_ORDER,
  runs:     RUNS,
  states:   RUN_STATES,
  bindings: BINDINGS_INDEX,

const TraceLoader = {

  isValid(b) {

  install(_bundle) {

function prettyStepName(s) {
  // 'some-compiler' → 'some · compiler'; 'has_some_check' → 'has some check'
  if (!s) return '';
  if (s.includes('_')) return s.replace(/_/g, ' ');
  if (s.includes('-')) return s.replace(/-/g, ' · ');
  return s;
}

/* PROGRAM_NODES: synth-fallback role template per program id, each an
   ordered list of { role, label }.  Supplied by the dataset; the
   generic eval template below is the built-in default for eval runs. */
const PROGRAM_NODES = {
  '__eval': [
    { role: 'load',    label: 'load' },
    { role: 'parse',   label: 'parse' },
    { role: 'check',   label: 'check · 1' },
    { role: 'check',   label: 'check · 2' },
    { role: 'check',   label: 'check · 3' },
    { role: 'check',   label: 'check · 4' },
    { role: 'check',   label: 'check · 5' },
    { role: 'check',   label: 'check · 6' },
    { role: 'check',   label: 'check · 7' },
    { role: 'check',   label: 'check · 8' },
    { role: 'verdict', label: 'verdict' },
  ],
  ...(TRACE_DATA.PROGRAM_NODES || {}),
};

// Relative effort weight per synth role; roles not listed weigh 1.0.
const ROLE_WEIGHT = {
  profile: 0.65,
  scout:   1.00,
  compiler:1.80, load:    0.50, parse:    0.70,
  check:   0.85, verdict: 1.15,
  ...(TRACE_DATA.ROLE_WEIGHT || {}),
};

function _strataJitter(seed, i) {
  // Deterministic 0..1 hash-noise; same run+node returns same value.
  const x = Math.sin((seed * 9301 + i * 49297) % 233280) * 43758.5453;
  return x - Math.floor(x);
}

function _kindWeight(step, run) {
  // Effort-share weight per real step.  Inputs are thin; agents are full
  // unit; evals are 0.8; the run's synthesis step (-compiler, a verdict,
  // or a single-step composite) gets a lift so the cap of the stack
  // reads wider, mirroring the real wall-clock cost of compilation.
  const n = step.name || '';
  if (step.kind === 'input') return 0.42;
  if (step.kind === 'eval')  {
    // verdict-style evals are weightier than predicate checks.
    if (_isVerdictPredicate(n)) return 1.10;
    return 0.78;
  }
  // agent step
  if (/-compiler$/.test(n)) return 1.80;
  // A composite step named after its own program: the whole fan-out
  // collapsed into one step.
  if (run && n === run.program) return 1.55;
  // A serial lead step that runs ahead of the run's first parallel block.
  const tree = (run && RUN_STATES[run.id]) || [];
  const firstPar = tree.find(s => s.parallel);
  if (firstPar && !step.parallel && step.phase < firstPar.phase) return 1.05;
  return 1.00;
}

function _kindToRole(step) {
  // Map real step.kind → the 'role' field the slab-build tint code
  // already knows about ('compiler' / 'verdict' get the amber lift).
  const n = step.name || '';
  if (/-compiler$/.test(n)) return 'compiler';
  if (step.kind === 'input') return 'profile';   // thin tint
  if (step.kind === 'eval')  {
    if (_isVerdictPredicate(n)) return 'verdict';
    return 'check';
  }
  return 'scout';   // default agent tint
}

function nodeTreeFor(run) {
  // REAL data path — RUN_STATES[run.id] is the parsed step list.
  const real = RUN_STATES[run.id];
  if (real && real.length) {
    const weights = real.map(s => _kindWeight(s, run));
    const total = weights.reduce((s, w) => s + w, 0) || 1;
    const dur = run.durationMin || 1;
    return real.map((step, i) => {
      const share = weights[i] / total;
      return {
        // For the slab-build tint code (back-compat):
        role:        _kindToRole(step),
        label:       prettyStepName(step.name),
        // Real per-step data — surfaced by the hover tooltip:
        name:        step.name,
        kind:        step.kind,
        status:      step.status,
        phase:       step.phase,
        sub:         step.sub,
        parallel:    step.parallel,
        siblings:    step.siblings || [],
        // Share + duration (drives slab width):
        share,
        durationMin: share * dur,
        // Provenance:
        source: 'state.md',
      };
    });
  }

  // SYNTH FALLBACK — for any run not present in RUN_STATES (none today,
  // but kept so the file stays robust if new runs land before the embed
  // is regenerated).
  const tmpl = run.isEval ? PROGRAM_NODES.__eval : PROGRAM_NODES[run.program];
  if (!tmpl) return [];
  const targetN = Math.max(2, Math.min(run.steps || tmpl.length, tmpl.length + 4));
  let nodes = tmpl.map(n => ({ ...n, source: 'synth' }));
  if (targetN > nodes.length) {
    const fillIdx = nodes.findIndex(x => x.role === 'scout' || x.role === 'check');
    const fill = fillIdx >= 0 ? nodes[fillIdx] : nodes[Math.floor(nodes.length / 2)];
    while (nodes.length < targetN) {
      nodes.splice(nodes.length - 1, 0, { role: fill.role, label: fill.label + ' +', source: 'synth' });
    }
  } else if (targetN < nodes.length) {
    while (nodes.length > targetN) {
      nodes.splice(Math.max(1, Math.floor(nodes.length / 2)), 1);
    }
  }
  const seedSrc = (run.id || '').split('').reduce((s, ch) => s + ch.charCodeAt(0), 0);
  const weights = nodes.map((nd, i) => {
    const base = ROLE_WEIGHT[nd.role] ?? 1.0;
    const j = 0.85 + _strataJitter(seedSrc, i) * 0.30;
    return base * j;
  });
  const total = weights.reduce((s, w) => s + w, 0);
  const dur = run.durationMin || 1;
  nodes.forEach((nd, i) => {
    nd.share = weights[i] / total;
    nd.durationMin = nd.share * dur;
    nd.status = 'ok';
    nd.kind = nd.role === 'check' ? 'eval' : nd.role === 'profile' ? 'input' : 'agent';
  });
  return nodes;
}

/* ============================================
   1b. ASPECT CATALOGUE — the "lego bricks"
   ------------------------------------------
   Every aspect is something derivable from a run.
   Each aspect has a type (continuous or
   categorical) that dictates which visual channels
   can accept it.  `get(run)` returns null/undefined
   when the aspect doesn't apply — the layout
   engine treats that as "missing" and places the

/* ---------- PALETTE WIRING ----------
   All hex ints used by Three.js come from the OKLCH-defined CSS

   load and populates PALETTE; the program / mode / gate maps

}

    pass: '--pass', partial: '--partial', pending: '--pending', fail: '--fail',
    accent: '--accent',
    inkDark: '--ink-dark', inkMedium: '--ink-medium', inkLight: '--ink-light', inkFaded: '--ink-faded',
    paperCream: '--paper-cream', paperWarm: '--paper-warm', paperAged: '--paper-aged',
    rule: '--rule', ruleMid: '--rule-mid',
    axisX: '--axis-x', axisY: '--axis-y', axisZ: '--axis-z',
    // mode + kind: their own palette so chart-by-mode/kind doesn't echo programs

    modeScheduled: '--mode-scheduled',
    modeEval: '--mode-eval',
    kindRun: '--kind-run',
    kindEval: '--kind-eval',

function filterMatches(filterId, r) {

  if (f.aspect) {
    const a = ASPECTS[f.aspect];
    if (!a) return true;
    return f.matchValues.includes(a.get(r));
  }
  return true;
}

/* Right-rail lenses — Summary (aggregate view of the whole fleet) vs

const LENS_ORDER = ['summary', 'selected'];

// Which channels accept which aspect types — the grammar of the lego system.
// Position channels accept both (categorical → lanes, continuous → scatter).
// Size channels accept only continuous (no sensible "size by gate state").
// Colour accepts categorical first-class; continuous colour uses a 3-stop
// (fail → partial → pass) gradient when assigned.
const CHANNELS = {
  x:      { label: 'X axis',     key: 'X', accepts: ['continuous', 'categorical'], role: 'position' },
  y:      { label: 'Y axis',     key: 'Y', accepts: ['continuous', 'categorical'], role: 'position' },
  z:      { label: 'Z axis',     key: 'Z', accepts: ['continuous', 'categorical'], role: 'position' },

};

/* ============================================
   1b-step. STEP_ASPECTS — the lego bricks at SLAB level
   ----------------------------------------------------
   Mirrors ASPECTS but at step granularity.  Each aspect:
       { id, label, register, type, get(step, run), format, labelFor?,
         values?, colorFor?, palette?, domain? }
   `get` receives the per-step record (parsed from state.md and
   enriched by nodeTreeFor) plus the parent run for cases where the
   step needs run context (e.g. artifact bytes pulled from
   BINDINGS_INDEX which is keyed by run.id).

   Six registers, same as run-level: when / what / state / effort /
   outcome / quality.  Step aspects answer "what is this slab?"

   These become the menu the SLAB chip strip's picker lists. */
const STEP_ASPECTS = {
  // ---- WHAT — identity / kind ----
  'step:name': {
    id: 'step:name', label: 'step name', register: 'what', type: 'categorical',
    get: (s) => s.name || s.label,
    format: v => v,
  },
  'step:kind': {
    id: 'step:kind', label: 'step kind', register: 'what', type: 'categorical',
    values: ['input', 'agent', 'eval'],
    get: (s) => s.kind || 'agent',
    labelFor: k => k === 'input' ? '[input]' : k === 'eval' ? '[eval]' : 'agent',
    colorFor: k => k === 'input' ? 0x847d75       /* ink-light  */
                 : k === 'eval'  ? 0xc49a5c       /* amber      */
                 :                 0x3a7a6a,      /* accent teal */
  },
  'step:role': {
    id: 'step:role', label: 'step role', register: 'what', type: 'categorical',
    // Built-in roles, plus any extra roles a dataset's PROGRAM_NODES uses.
    values: [...new Set(['profile', 'scout', 'compiler', 'check', 'verdict',
      ...Object.values(PROGRAM_NODES).flat().map(n => n.role)])],
    get: (s) => s.role || 'scout',
    labelFor: k => k,
    // Compiler / verdict get amber; check gets amber-deep; default teal.
    colorFor: k => (k === 'compiler' || k === 'verdict') ? 0xc49a5c
                 : k === 'check' ? 0xa87f44
                 : 0x3a7a6a,
  },
  // ---- STATE — pass / fail ----
  'step:status': {
    id: 'step:status', label: 'status', register: 'state', type: 'categorical',
    values: ['ok', 'fail'],
    get: (s) => s.status || 'ok',
    labelFor: k => k === 'fail' ? '✗ fail' : '✓ pass',
    colorFor: k => k === 'fail' ? 0xb34a3e /* fail brick */ : 0x14803e /* pass green */,
  },
  // ---- WHEN — phase order ----
  'step:phase': {
    id: 'step:phase', label: 'phase #', register: 'when', type: 'continuous',
    get: (s) => s.phase ?? null,
    format: v => '#' + v,
  },
  'step:order': {
    id: 'step:order', label: 'order in run', register: 'when', type: 'continuous',
    // Step index (0..N-1) — set per-slab by the slab builder.
    get: (s) => s.nodeIndex ?? null,
    format: v => '#' + (v + 1),
  },
  // ---- EFFORT — work expended ----
  'step:share': {
    id: 'step:share', label: 'effort share', register: 'effort', type: 'continuous',
    get: (s) => s.share != null ? s.share : null,
    format: v => (v * 100).toFixed(1) + '%',
  },
  'step:duration-est': {
    id: 'step:duration-est', label: 'duration (est)', register: 'effort', type: 'continuous',
    get: (s) => s.durationMin != null ? s.durationMin : null,
    format: v => v < 1 ? (v * 60).toFixed(0) + 's' : v.toFixed(1) + 'm',
  },
  'step:fanout': {
    id: 'step:fanout', label: '‖ fan-out', register: 'effort', type: 'continuous',
    // Cardinality of the parallel group this step belongs to; 1 if serial.
    get: (s) => (s.parallel && Array.isArray(s.siblings) && s.siblings.length) ? s.siblings.length : 1,
    format: v => v + (v === 1 ? ' (serial)' : '×'),
  },
  // ---- OUTCOME — what the step actually produced ----
  'step:artifact-bytes': {
    id: 'step:artifact-bytes', label: 'artifact bytes', register: 'outcome', type: 'continuous',
    // Real bytes from BINDINGS_INDEX (parsed from .prose/runs/<id>/bindings/).
    // For input slabs we hit the `caller` pseudo-step; for evals the
    // `evaluator` dir; for agents the step's own dir.
    get: (s, run) => {
      if (!run || !BINDINGS_INDEX[run.id]) return null;
      const b = BINDINGS_INDEX[run.id];
      if (s.kind === 'input' && b.caller) {
        const match = b.caller.find(f => f.name.replace(/\.md$/, '') === (s.name || s.label));
        return match ? match.bytes : null;
      }
      if (s.kind === 'eval' && b.evaluator && b.evaluator.length) {
        // All eval steps share the single result.md — divide by step count
        // so per-step "weight" is meaningful while preserving the sum.
        const total = b.evaluator[0].bytes;
        const nEval = (RUN_STATES[run.id] || []).filter(x => x.kind === 'eval').length || 1;
        return Math.round(total / nEval);
      }
      const dir = b[s.name];
      if (!dir || !dir.length) return null;
      return dir.reduce((sum, f) => sum + f.bytes, 0);
    },
    format: v => v == null ? '—' : v >= 1024 ? (v / 1024).toFixed(1) + ' KB' : v + ' B',
  },
  // ---- QUALITY — placeholder; per-step quality isn't logged today ----
  'step:parallel': {
    id: 'step:parallel', label: '‖ parallel?', register: 'what', type: 'categorical',
    values: ['serial', 'parallel'],
    get: (s) => s.parallel ? 'parallel' : 'serial',
    labelFor: k => k,
    colorFor: k => k === 'parallel' ? 0x4587b3 : 0x847d75,
  },
};

/* ============================================
   1c-step. SLAB CHANNELS — the visual encoding slots for slabs
   ----------------------------------------------------
   These are the IN-cube channels.  Each accepts step-level
   aspects of the declared types.  Bindings live in state.slabAxes
   and reshape the cube live on change.

       slab:color  ← any step-level aspect (categorical → palette,
                                            continuous → gradient)
       slab:width  ← continuous step-level aspect; min-clamped
                     so the lightest slabs stay legible
       slab:edge   ← categorical step-level aspect; selects the
                     edge-line colour + weight (e.g. ✗ fail-red,
                     ✓ ink-thin)

   Defaults reproduce the prior strata fork's look so the page
   reads identically until the user rebinds. */
const SLAB_CHANNELS = {
  'slab:color':     { label: 'Slab colour',    key: '◆', accepts: ['categorical', 'continuous'], role: 'color' },
  'slab:width':     { label: 'Slab width',     key: 'W', accepts: ['continuous'],                role: 'size'  },
  'slab:edge':      { label: 'Slab edge',      key: '─', accepts: ['categorical'],               role: 'edge'  },
  // PHASE B — slab thickness along the stack axis.  When bound to
  // step:share, the cube interior becomes a flame-graph (compiler
  // slab is a thick cap, inputs are thin layers).
  'slab:thickness': { label: 'Slab thickness', key: '↕', accepts: ['continuous'],                role: 'size'  },
};
const SLAB_CHANNEL_ORDER = ['slab:color', 'slab:width', 'slab:thickness', 'slab:edge'];
const SLAB_AXES_DEFAULT = {
  'slab:color':     'step:kind',
  'slab:width':     'step:artifact-bytes',
  'slab:thickness': 'step:share',
  'slab:edge':      'step:status',
};

/* ============================================
   1d-modular. CLUSTERS — the floor / hull layer
   ----------------------------------------------------
   Clusters surface RELATIONSHIPS across runs by drawing
   floor-level shapes that group cubes together.  Each
   cluster algorithm walks the bookMeshes set, partitions
   them by some key (program id, day-of-month, retry chain
   leader), and emits Three.js geometry into hullsGroup.

   The CLUSTER channel slot is held in state.cluster
   ('program' | 'day' | 'none').  Only one cluster
   layer is on at a time so the floor stays legible.

   Adding a new cluster algorithm = a new entry here
   with a `build(bookMeshes, runs)` callback. */
const CLUSTERS = {
  'none':    { label: 'none',          description: 'No floor cluster layer.' },
  'program': { label: 'by program',    description: 'Soft hulls in each program’s identity colour, grouping same-program cubes.' },
  'day':     { label: 'by day',        description: 'Ground stripes per UTC day, so the temporal grouping reads through the cubes.' },
};
const CLUSTER_ORDER = ['program', 'day', 'none'];

/* Helper — look up step aspect record by id, returning null on miss. */
function stepAspectFor(channelKey, slabAxes) {
  const aid = (slabAxes || {})[channelKey];
  return aid ? STEP_ASPECTS[aid] : null;
}

/* ============================================
   PHASE A — stack-axis coherence
   ----------------------------------------------------
   The slab stack direction follows whichever run-axis
   channel (x / y / z) is bound to a WHEN-register
   aspect.  This makes time consistent at both scales:
   the fleet axis encodes when each run fired; the
   in-cube stack axis encodes when each step ran.

   If no WHEN binding is active, the stack falls back
   to local Y (matches the prior strata behaviour).
   ============================================ */
function getStackAxis() {
  for (const ch of ['x', 'y', 'z']) {
    const aId = state.axes[ch];
    const asp = aId ? ASPECTS[aId] : null;
    if (asp && asp.group === 'when') return ch;
  }
  return 'y';
}

/* Stack-axis geometry helpers.  Given a stackAxis, the cube has:
       stack-extent       — length along stackAxis (slabs accumulate here)
       width-extent       — perp1: where slab:width varies (frontal)
       depth-extent       — perp2: where parallel siblings spread
   The cube's outer (w, h, d) maps onto those by convention below. */
function cubeStackExtent(w, h, d, axis) {
  return axis === 'x' ? w : axis === 'z' ? d : h;
}
function cubeWidthExtent(w, h, d, axis) {
  // perp1 — the "frontal" axis the operator reads slab:width along.
  // Y-stack uses world X for width; X-stack uses world Y; Z-stack uses world X.
  return axis === 'y' ? w : axis === 'x' ? h : w;
}
function cubeDepthExtent(w, h, d, axis) {
  // perp2 — the axis parallel siblings spread along.
  // Y-stack uses world Z; X-stack uses world Z; Z-stack uses world Y.
  return axis === 'y' ? d : axis === 'x' ? d : h;
}
function slabBoxGeometry(thickness, width, depth, axis) {
  // Three.js BoxGeometry takes (worldX, worldY, worldZ) extents; map
  // (thickness, width, depth) into those world extents per axis.
  if (axis === 'x') return new THREE.BoxGeometry(thickness, width,     depth);
  if (axis === 'z') return new THREE.BoxGeometry(width,     depth,     thickness);
  return                new THREE.BoxGeometry(width,     thickness, depth);
}
function slabLocalPosition(stackOffset, sibOffset, axis) {
  if (axis === 'x') return new THREE.Vector3(stackOffset, 0,           sibOffset);
  if (axis === 'z') return new THREE.Vector3(sibOffset,   0,           stackOffset);
  return                new THREE.Vector3(0,           stackOffset, sibOffset);
}

   1c. INSIGHT CATALOG — curated question-driven views
   ============================================
   Each insight is a packaged view: a question it
   answers, a one-line "reads as" caption that
   explains the visual encoding in plain English,
   a full seven-channel axis map, and the best
   camera angle for the story it tells.

   These are the primary UX — the user picks one of
   five questions, not seven channels.  The axis
   controller is advanced tuning.
   ============================================ */

   audience register (what shipped, what's queued, what flagged).  Ops =

   A few sit in both registers because the question serves either

    narrate: () => {

  {

const INSIGHT_BY_ID = Object.fromEntries(INSIGHTS.map(v => [v.id, v]));

/* ============================================
   2. SHARED STATE
   ============================================ */
const state = {
  mode: 'reading',
  selectedId: null,
  selectedStepIdx: null,      // STRATA: when a slab is clicked, locks the step
  hoveredId: null,
  laneFilter: null,           // null = all programs; otherwise a program id
  runFilter: 'all',           // keys into FILTERS table — never a free string
  lens: 'summary',            // keys into LENSES — auto-flips to 'selected' on selection
  // Axis mapping starts on the "Ship log" insight — the most legible
  // default for a first-time reader looking at the fleet.
  axes: { ...INSIGHTS[0].axes },
  // MODULAR — slab channels live alongside run-axis channels.  Default
  // bindings reproduce the prior strata look (color = kind, width =
  // artifact bytes, edge = status).
  slabAxes: { ...SLAB_AXES_DEFAULT },
  // MODULAR — which cluster algorithm draws on the floor.  'program' =
  // per-program convex hulls (default); 'day' = horizontal ground
  // stripes; 'none' = clean floor.
  cluster: 'program',
  // MODULAR — step-level filters.  null = no filter on that axis;
  // values are aspect-value strings ('fail', 'eval', 'compiler', 'parallel').
  // Multiple filters compose with logical AND; non-matching slabs dim.
  stepFilters: {
    status: null,    // 'fail' | null
    kind:   null,    // 'input' | 'agent' | 'eval' | null
    role:   null,    // 'compiler' | 'check' | 'scout' | … | null
    parallel: null,  // 'parallel' | 'serial' | null
  },
  currentInsight: INSIGHTS[0].id,
  insightModified: false,     // true once the user touches a channel manually
  openChip: null,             // channel key whose popover is open
  tuning: false,              // is the axis-chip strip expanded?
};
const listeners = { select: [], mode: [], filter: [], axes: [] };
const onSelect = (fn) => listeners.select.push(fn);
const onMode = (fn) => listeners.mode.push(fn);
const onFilter = (fn) => listeners.filter.push(fn);
const onAxes = (fn) => listeners.axes.push(fn);
function setSelected(id, stepIdx) {
  // STRATA: optional stepIdx locks a specific slab within the run so the
  // sidebar can render the same step card the tooltip shows.  Passing
  // undefined preserves any previously locked step on the SAME run, but
  // clears it when the run changes.  Passing null explicitly clears.
  const sameRun = id != null && id === state.selectedId;
  state.selectedId = id;
  if (stepIdx === null) {
    state.selectedStepIdx = null;
  } else if (typeof stepIdx === 'number') {
    state.selectedStepIdx = stepIdx;
  } else if (!sameRun) {
    state.selectedStepIdx = null;
  }
  // Auto-flip the right-rail lens when something gets picked. Going back to
  // the summary is a deliberate user action (clicking the Summary tab), not
  // a side effect of clicking a book.
  if (id) state.lens = 'selected';
  listeners.select.forEach(fn => fn(id));
}
function setLens(lens) {
  if (!LENSES[lens]) return;
  state.lens = lens;
  listeners.select.forEach(fn => fn(state.selectedId));
}
function setMode(m) { state.mode = m; listeners.mode.forEach(fn => fn(m)); }
function setLaneFilter(p) { state.laneFilter = p; listeners.filter.forEach(fn => fn()); }
function setRunFilter(f) { state.runFilter = f; listeners.filter.forEach(fn => fn()); }
function setAxis(channel, aspectId) {

  listeners.axes.forEach(fn => fn());
}
// MODULAR — re-bind a slab channel to a step-level aspect.  Setting

function setSlabAxis(channel, aspectId) {

  listeners.axes.forEach(fn => fn());
}
// MODULAR — toggle a step filter.  Setting filterKey,value, then again
// with the same value clears it (chip behaves as a single-select).
function toggleStepFilter(filterKey, value) {
  if (!(filterKey in state.stepFilters)) return;
  state.stepFilters[filterKey] = state.stepFilters[filterKey] === value ? null : value;
  listeners.filter.forEach(fn => fn());
}
// MODULAR — switch the active cluster layer.
// PHASE E: previously fired listeners.axes which triggered a full
// layoutBooks (geometry rebuild for every cube + every slab).  Now we
// rebuild ONLY the hulls/stripes layer in place — cube + slab geometry
// is left untouched, so the change is essentially free.
function setCluster(c) {
  if (!CLUSTERS[c]) return;
  state.cluster = c;
  state.insightModified = true;
  if (typeof rebuildClusterLayer === 'function') rebuildClusterLayer();

  // know the state changed; fire the filter listener so chip / narration
  // strip refresh without paying for layoutBooks.
  listeners.filter.forEach(fn => fn());

// MODULAR — snapshot the current encoding as a new insight and append
// it to the in-memory INSIGHTS list.  The new insight is named with a
// short timestamp + the user-supplied label; the picker reflects it
// immediately so the operator can return to this view from the same
// pill they use for the curated ones.
function saveCurrentViewAsInsight() {
  const lbl = window.prompt(
    'Name this view (it will appear in the insight picker):',
    'My view ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
  );
  if (!lbl) return;
  const id = 'view-' + Date.now().toString(36);
  const num = String(INSIGHTS.length + 1).padStart(2, '0');
  const newInsight = {
    id, num, title: lbl,
    modes: [state.mode || 'reading'],
    question: '(saved view)',
    axes: { ...state.axes },
    slabAxes: { ...state.slabAxes },
    cluster: state.cluster,
    stepFilters: { ...state.stepFilters },
    lens: state.lens,
    camera: 'corner',
    saved: true,
    narrate: () => `Saved view <em>${lbl}</em> — a snapshot of the encoding at ${new Date().toLocaleString()}.`,

}
function applyInsight(id) {
  const v = INSIGHT_BY_ID[id];
  if (!v) return;
  CHANNEL_ORDER.forEach(c => { state.axes[c] = v.axes[c] ?? null; });
  // MODULAR — insights now orchestrate the FULL encoding.  If an
  // insight declares slabAxes / cluster / stepFilters, those override
  // the user's prior choices; otherwise we fall back to the modular
  // defaults so a vintage insight (no modular fields) still produces a
  // legible scene.
  if (v.slabAxes) {
    SLAB_CHANNEL_ORDER.forEach(ch => {
      state.slabAxes[ch] = v.slabAxes[ch] !== undefined ? v.slabAxes[ch] : SLAB_AXES_DEFAULT[ch];
    });
  } else {
    Object.assign(state.slabAxes, SLAB_AXES_DEFAULT);
  }
  state.cluster = v.cluster || 'program';
  if (v.stepFilters) {
    // Replace the whole filter set (so an insight that wants "no
    // filters" can express that by passing {}).
    state.stepFilters = { status: null, kind: null, role: null, parallel: null, ...v.stepFilters };
  } else {
    state.stepFilters = { status: null, kind: null, role: null, parallel: null };
  }
  if (v.lens) state.lens = v.lens;
  state.currentInsight = id;
  state.insightModified = false;
  const primaryMode = v.modes[0];
  if (primaryMode && state.mode !== primaryMode) {
    setMode(primaryMode);
  } else {
    listeners.axes.forEach(fn => fn());
  }
  // The filter listener fires regardless so the chip rows update.
  listeners.filter.forEach(fn => fn());
  if (typeof applyPreset === 'function') applyPreset(v.camera || 'pitched');
}

function runVisible(r) {
  if (state.laneFilter && r.program !== state.laneFilter) return false;
  // For the `verified` filter we also let eval runs themselves through —
  // an eval is, by definition, attached to its parent. Otherwise predicate
  // is straight aspect-match via FILTERS.
  if (state.runFilter === 'verified' && r.isEval) return true;
  return filterMatches(state.runFilter, r);
}

/* ============================================
   3. LEFT RAIL · PROGRAM LANES
   ============================================ */
const $lanes = document.getElementById('lane-list');
function renderLanes() {
  const countByProg = {};
  let total = 0;
  RUNS.forEach(r => {
    if (r.isEval) return;
    countByProg[r.program] = (countByProg[r.program] || 0) + 1;
    total++;
  });
  // "All" pseudo-row sits at the top — clicking it clears the program filter.
  // Visually a neutral swatch since "all" is not an identity, just a reset.
  const allActive = state.laneFilter === null ? ' active' : '';
  let html = `<li class="lane-item lane-item-all${allActive}" data-prog="">
      <div class="lane-head">
        <span class="lane-swatch lane-swatch-all"></span>
        <span class="lane-name">All programs</span>
        <span class="lane-count">${total} runs</span>
      </div>
    </li>`;
  html += PROGRAM_ORDER.map(p => {
    const info = PROGRAMS[p];
    const n = countByProg[p] || 0;
    const score = info.baseline.overall;
    const active = state.laneFilter === p ? ' active' : '';
    // Single-line program row — cadence + baseline live in the tooltip.
    // The at-a-glance view stays clean; details surface on hover.
    const tooltip = `${info.cadence} · baseline ${score}`;

      <div class="lane-head">
        <span class="lane-swatch" style="background:${info.cssColor}"></span>
        <span class="lane-name">${info.label}</span>

      // All-row resets; program rows still toggle off when clicked again

}

const $laneFilters = document.getElementById('lane-filters');

/* ============================================
   4. RIGHT RAIL · LEDGER (reading) / TRENDS (ops)
   ============================================ */
const $ledger = document.getElementById('ledger');
// Pretext eyebrow removed — see renderPretext().

function renderLedger() {

function renderReadingSummaryBody() {

  // its ratio inline with the "open eval run" link as a single component.

    h += `<span class="atm-run-eval ${cls}"><span class="dot"></span>eval <span class="ratio">${c.evalPass} / ${c.evalTotal}</span> &middot; <span style="cursor:pointer;text-decoration:underline" data-nav="${c.id}">open eval run</span></span>`;

/* ============================================
   6. 3D STAGE — volumetric aspect engine
   ============================================
   The view is a 20×20×20 cube centered at the origin.
   Every run is a "book" (box geometry) placed in that
   cube by a user-defined axis mapping.  Each of the
   seven visual channels (x, y, z, width, height, depth,
   colour) is bound to one ASPECT from the catalogue
   above — or left empty, in which case the channel
   takes a uniform default.

   Categorical aspects on a position channel produce
   discrete lanes (one book-column per category).
   Continuous aspects produce a normalised scatter
   (min → -AXIS/2, max → +AXIS/2, with √-scale if the
   aspect opts in).  Size channels accept only
   continuous aspects.  Colour accepts both — categorical
   pulls the aspect's own palette, continuous uses a
   fail → partial → pass gradient.

   Rulers and lane labels are rebuilt every time the
   mapping changes, so the space always carries its own
   legend in 3D.
   ============================================ */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(stage.clientWidth, stage.clientHeight);
renderer.setClearColor(0x000000, 0);
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, stage.clientWidth / stage.clientHeight, 0.1, 400);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.1;
controls.minDistance = 6;
controls.maxDistance = 100;

// ---- Volumetric constants ----
const AXIS_LEN    = 20;        // world-space length per axis (cube is 20³)
const AXIS_HALF   = AXIS_LEN / 2;
const SIZE_MIN    = 0.35;      // smallest book edge when a size aspect is assigned
const SIZE_MAX    = 1.9;       // largest
const SIZE_DEFAULT = 0.65;     // uniform size when a size channel is unassigned
const MISSING_JITTER = 0.4;    // spread missing-value books so they don't z-stack
const CATEGORY_JITTER = 0.35;  // jitter within a categorical lane to avoid same-point collision

// Colour gradient stops (continuous colour channel): 0 → fail, 0.5 → partial, 1 → pass
// Built each time we render — reads the PALETTE that initPalette() has
// already populated. Wrapped in a getter so the gradient picks up any
// hot-swapped palette values (dark mode toggle, live theme tweak, etc).
function getColorGradient() {
  return [
    { u: 0.0, c: new THREE.Color(PALETTE.fail || 0xb34a3e) },
    { u: 0.5, c: new THREE.Color(PALETTE.partial || 0xa87f44) },
    { u: 1.0, c: new THREE.Color(PALETTE.pass || 0x14803e) },
  ];
}
function gradientColor(u) {
  if (u == null) return new THREE.Color(PALETTE.pending || PALETTE.inkFaded || 0xa8a29e);
  const stops = getColorGradient();
  u = Math.max(0, Math.min(1, u));
  for (let i = 1; i < stops.length; i++) {
    if (u <= stops[i].u) {
      const span = stops[i].u - stops[i-1].u;
      const t = span ? (u - stops[i-1].u) / span : 0;
      const c = stops[i-1].c.clone();
      c.lerp(stops[i].c, t);
      return c;
    }
  }
  return stops[stops.length - 1].c.clone();
}

/* ---- Aspect-domain inspector ----
   Walk the visible runs and compute the empirical
   range/categories for an aspect. Used to normalise
   values to [0,1] for continuous, or to lanes for
   categorical. */
function aspectDomain(aspect, runs) {
  if (!aspect) return null;
  if (aspect.type === 'continuous') {
    // Fixed domain wins — used for bounded metrics (0–100% evals, 0–100
    // baseline scores) where empirical normalisation would exaggerate
    // small differences and paint "91% passing" like a failure.
    if (aspect.domainFixed) {
      return { type: 'continuous', min: aspect.domainFixed.min, max: aspect.domainFixed.max, scale: aspect.scale || 'linear' };
    }
    let mn = Infinity, mx = -Infinity;
    let any = false;
    runs.forEach(r => {
      const v = aspect.get(r);
      if (v == null || !isFinite(v)) return;
      any = true;
      if (v < mn) mn = v;
      if (v > mx) mx = v;
    });
    if (!any) return null;
    if (mn === mx) { mn -= 0.5; mx += 0.5; }   // no range → spread books arbitrarily
    return { type: 'continuous', min: mn, max: mx, scale: aspect.scale || 'linear' };
  }
  // Categorical: collect unique values in canonical order
  const seen = new Set();
  const order = [];
  (aspect.values || []).forEach(v => { order.push(v); seen.add(v); });
  runs.forEach(r => {
    const v = aspect.get(r);
    if (v != null && !seen.has(v)) { order.push(v); seen.add(v); }
  });
  return { type: 'categorical', values: order, index: Object.fromEntries(order.map((v, i) => [v, i])) };
}
function scaleU(aspect, domain, v) {
  if (v == null || !isFinite(v)) return null;
  if (domain.scale === 'sqrt') {
    const mn = Math.sqrt(Math.max(0, domain.min));
    const mx = Math.sqrt(Math.max(0, domain.max));
    if (mx === mn) return 0.5;
    return (Math.sqrt(Math.max(0, v)) - mn) / (mx - mn);
  }
  if (domain.max === domain.min) return 0.5;
  return (v - domain.min) / (domain.max - domain.min);
}
function posForValue(domain, v, laneJitter) {
  // Returns world-space position along AN axis in [-AXIS_HALF, AXIS_HALF], plus
  // missing flag so caller can fade ghosts. laneJitter applies to categorical.
  if (!domain) return { p: 0, missing: false };    // channel unused → center
  if (domain.type === 'continuous') {
    const u = scaleU(null, domain, v);
    if (u == null) return { p: 0, missing: true };
    return { p: -AXIS_HALF + u * AXIS_LEN, missing: false };
  }
  // categorical
  if (v == null) return { p: 0, missing: true };
  const i = domain.index[v];
  if (i == null) return { p: 0, missing: true };
  const N = domain.values.length;
  const slot = AXIS_LEN / N;
  const base = -AXIS_HALF + (i + 0.5) * slot;
  // ACCURACY — was: random in-lane jitter (±27% of slot).  That's noise:
  // every cube in a lane legitimately HAS that lane's value, so the cube
  // should sit at the lane centre exactly.  Collisions are handled later
  // by the deconflict pass along the FREE axes (unmapped channels), which
  // doesn't lie about the cube's actual aspect value.
  return { p: base, missing: false };
}
/* Cube size rule — deterministic and explicit:
     • A size channel (width / height / depth) with an aspect assigned →
       that edge scales with the aspect value in [SIZE_MIN, SIZE_MAX].
       Missing values fall back to SIZE_MIN (smallest cube = least data).
     • A size channel with NO aspect assigned → uniform SIZE_DEFAULT.
       (Position does the talking; size is just a readable cube.)
     • Categorical aspects are not allowed on size channels (enforced in
       the UI via CHANNELS[].accepts), but if one slips through, we fall
       back to SIZE_DEFAULT as well.
   The result: a book's dimensions always answer "how much of this
   quantity does it have?", never "what brand is it?"
*/
function sizeForValue(domain, v) {
  if (!domain) return SIZE_DEFAULT;
  if (domain.type !== 'continuous') return SIZE_DEFAULT;
  const u = scaleU(null, domain, v);
  if (u == null) return SIZE_MIN;
  return SIZE_MIN + u * (SIZE_MAX - SIZE_MIN);
}

/* ---- Scene groups ---- */
// Root for the entire mapped scene — axes + books + arcs. Clearing this group
// between layouts is how we "reset" when the mapping changes.
const sceneRoot = new THREE.Group();
scene.add(sceneRoot);
const axesGroup = new THREE.Group();   // rulers, tick labels, axis titles
const booksGroup = new THREE.Group();  // book meshes
const arcsGroup = new THREE.Group();   // parent → eval lineage arcs
const hullsGroup = new THREE.Group();  // MODULAR: per-program convex hulls on the floor
sceneRoot.add(axesGroup);
sceneRoot.add(hullsGroup);             // hulls draw UNDER books so they read as floor markings
sceneRoot.add(booksGroup);
sceneRoot.add(arcsGroup);

/* Filter-active outline — a thin warm-amber wireframe along the cube's
   edges that fades in when any filter narrows the view. Built once at
   load; opacity is animated in the tick loop based on filter state.
   Reads as "this view is narrowed" without competing with axis lines. */
const filterFrame = (() => {
  const half = AXIS_HALF;
  const corners = [
    [-half,-half,-half],[ half,-half,-half],[ half,-half, half],[-half,-half, half],
    [-half, half,-half],[ half, half,-half],[ half, half, half],[-half, half, half],
  ];
  const edges = [
    [0,1],[1,2],[2,3],[3,0], // floor
    [4,5],[5,6],[6,7],[7,4], // ceiling
    [0,4],[1,5],[2,6],[3,7], // verticals
  ];
  const pts = [];
  edges.forEach(([a,b]) => {
    pts.push(...corners[a], ...corners[b]);
  });
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  const mat = new THREE.LineBasicMaterial({
    color: 0xc49a5c,         // warm amber — the rare amber moment for narrowed-view outline
    transparent: true,
    opacity: 0,                // hidden by default; tick loop fades it in
    linewidth: 2,
  });
  const lines = new THREE.LineSegments(geo, mat);
  lines.userData.isFilterFrame = true;
  sceneRoot.add(lines);
  return lines;
})();

/* SELECTION OUTLINE — single reusable wireframe box that hugs the
   currently selected book.  Hidden when nothing is selected.  Replaces
   the previous "float upward + sin pulse" animation: the cube reads as
   selected by virtue of a static teal outline rather than motion, which
   keeps the scene readable when scanning at rest.
   Built once at scene init from a unit BoxGeometry; the tick loop just
   copies the selected book's position and scales the outline to wrap it
   with a small offset so the lines sit just outside the book's surface. */
const selectionOutline = (() => {
  const edges = new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1));
  const mat = new THREE.LineBasicMaterial({
    color: 0x3a7a6a,        // editorial teal — matches the selected swatch
    transparent: true,
    opacity: 0.95,
    linewidth: 2,
    depthTest: false,       // always draw on top of the book it wraps
  });
  const seg = new THREE.LineSegments(edges, mat);
  seg.renderOrder = 999;
  seg.visible = false;
  sceneRoot.add(seg);
  return seg;
})();

/* ---- Canvas-sprite label helper ----
   Used for lane labels, tick labels, axis titles. */
function spriteLabel(text, opts = {}) {
  const { color = '#4c4742', size = 30, weight = '600', italic = false, w = 260, h = 72, scale = 1 } = opts;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = color;
  ctx.font = `${italic ? 'italic ' : ''}${weight} ${size}px "Kecal", system-ui, sans-serif`;
  ctx.textBaseline = 'middle';
  const metrics = ctx.measureText(text);
  const tx = (w - metrics.width) / 2;
  ctx.fillText(text, Math.max(6, tx), h / 2);
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0.85, depthTest: false });
  const sp = new THREE.Sprite(mat);
  // Base scale at the reference camera distance — the inverse-zoom loop in
  // tick() multiplies by (camDist / REF_DIST) every frame so the label keeps
  // a roughly constant on-screen size whether the user is dollied in tight
  // or pulled way back.
  const bx = 2.6 * scale, by = 0.72 * scale;
  sp.scale.set(bx, by, 1);
  sp.userData.baseScale = [bx, by];
  sp.userData.isAxisLabel = true;
  sp.renderOrder = 10;
  return sp;
}

/* ---- Axis builder ----
   Given a channel key and a domain, draw an axis line
   + ticks + tick labels + title at the correct edge
   of the 20³ cube.

   edge anchoring:  X axis goes along the floor-front:
                    y = -AXIS_HALF - 1, z =  AXIS_HALF + 0.5
                    Y axis goes along the front-left:
                    x = -AXIS_HALF - 0.5, z =  AXIS_HALF + 0.5
                    Z axis goes along the floor-left:
                    x = -AXIS_HALF - 0.5, y = -AXIS_HALF - 0.5
*/
function buildAxis(channelKey, domain, aspectId, aspect) {
  if (channelKey !== 'x' && channelKey !== 'y' && channelKey !== 'z') return;
  const axisColor = { x: PALETTE.axisX, y: PALETTE.axisY, z: PALETTE.axisZ }[channelKey];
  const axisColorHex = '#' + axisColor.toString(16).padStart(6, '0');
  // Title colour picks up the MEANING of the axis, not the axis line colour —
  // continuous aspects reuse the axis hint hue; categorical ones stay ink-dark
  // so the category labels don't compete with the lane colours.
  const titleColor = axisColorHex;

  // Endpoint lambdas — return Vector3 given axis-normalized u in [-AXIS_HALF, AXIS_HALF]
  const endpoint = (u) => {
    if (channelKey === 'x') return new THREE.Vector3(u, -AXIS_HALF - 1, AXIS_HALF + 0.5);
    if (channelKey === 'y') return new THREE.Vector3(-AXIS_HALF - 0.5, u, AXIS_HALF + 0.5);
    return new THREE.Vector3(-AXIS_HALF - 0.5, -AXIS_HALF - 0.5, u);
  };

  // Axis line — thicker, more saturated than before for readability
  const p0 = endpoint(-AXIS_HALF), p1 = endpoint(AXIS_HALF);
  const lineGeo = new THREE.BufferGeometry().setFromPoints([p0, p1]);
  const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: axisColor, transparent: true, opacity: 0.8 }));
  axesGroup.add(line);

  // Arrow head at the + end so the axis direction is obvious from any
  // camera angle (before only a sprite told direction; the 3D angle could
  // still confuse)
  const arrowDir = channelKey === 'x' ? new THREE.Vector3(1, 0, 0)
                 : channelKey === 'y' ? new THREE.Vector3(0, 1, 0)
                                      : new THREE.Vector3(0, 0, 1);
  const tipBase = endpoint(AXIS_HALF);
  const arrowHead = new THREE.Mesh(
    new THREE.ConeGeometry(0.28, 0.9, 10),
    new THREE.MeshBasicMaterial({ color: axisColor, transparent: true, opacity: 0.85 })
  );
  arrowHead.position.copy(tipBase);
  // Align cone default-up (+Y) to axis direction
  if (channelKey !== 'y') {
    const quat = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), arrowDir);
    arrowHead.setRotationFromQuaternion(quat);
  }
  arrowHead.position.addScaledVector(arrowDir, 0.45);
  axesGroup.add(arrowHead);

  // Title sprite at the + end of the axis — bigger, bolder for legibility
  const titleText = aspect
    ? `${channelKey.toUpperCase()} \u2014 ${aspect.label.replace(/\s*\([^)]*\)/, '').replace(/^Baseline · /, 'baseline · ')}`
    : `${channelKey.toUpperCase()} \u2014 (empty)`;
  const title = spriteLabel(titleText, { color: titleColor, size: 40, weight: '700', w: 640, h: 96, scale: 1.9 });
  const pad = 2.3;
  if (channelKey === 'x') title.position.set(tipBase.x + pad, tipBase.y - 0.2, tipBase.z);
  else if (channelKey === 'y') title.position.set(tipBase.x - 0.15, tipBase.y + pad, tipBase.z);
  else title.position.set(tipBase.x - 0.05, tipBase.y - 0.1, tipBase.z - pad);
  axesGroup.add(title);

  // Ticks + tick labels
  if (!domain) return;
  if (domain.type === 'continuous') {
    const TICK_COUNT = 4;
    for (let i = 0; i <= TICK_COUNT; i++) {
      const u = -AXIS_HALF + (i / TICK_COUNT) * AXIS_LEN;
      const v = domain.scale === 'sqrt'
        ? Math.pow((Math.sqrt(Math.max(0, domain.min)) + (i / TICK_COUNT) * (Math.sqrt(Math.max(0, domain.max)) - Math.sqrt(Math.max(0, domain.min)))), 2)
        : domain.min + (i / TICK_COUNT) * (domain.max - domain.min);
      const tickPos = endpoint(u);
      const tickDir = channelKey === 'x'
        ? new THREE.Vector3(0, -0.35, 0)
        : channelKey === 'y'
          ? new THREE.Vector3(-0.35, 0, 0)
          : new THREE.Vector3(-0.35, 0, 0);
      const tg = new THREE.BufferGeometry().setFromPoints([tickPos, tickPos.clone().add(tickDir)]);
      axesGroup.add(new THREE.Line(tg, new THREE.LineBasicMaterial({ color: axisColor, transparent: true, opacity: 0.6 })));

      const labelText = aspect ? aspect.format(v) : String(v);
      // Tick labels: larger + darker than before for legibility against the
      // paper background, and explicitly tinted to match the axis's grey so
      // the reader can tell X / Y / Z labels apart at a glance.
      const label = spriteLabel(labelText, { color: '#2a2520', size: 38, weight: '600', w: 360, h: 64, scale: 1.45 });
      const lpos = tickPos.clone().add(tickDir.clone().multiplyScalar(4));
      label.position.copy(lpos);
      axesGroup.add(label);
    }
  } else {
    // categorical — label each lane at its center (larger, italic)
    // and lay a thin tinted plane through the cube at the lane's
    // position so the spatial grouping reads even when books in that
    // lane are sparse. Plane colour = the lane's own categorical hue
    // at very low alpha (acts as a depth cue, not a feature).
    const N = domain.values.length;
    const slot = AXIS_LEN / N;
    const PLANE_ALPHA = 0.07;
    domain.values.forEach((v, i) => {
      const u = -AXIS_HALF + (i + 0.5) * slot;
      const anchor = endpoint(u);
      const offset = channelKey === 'x' ? new THREE.Vector3(0, -1.2, 0)
                    : channelKey === 'y' ? new THREE.Vector3(-1.5, 0, 0)
                                         : new THREE.Vector3(-1.5, 0, 0);
      const labelText = aspect.labelFor ? aspect.labelFor(v) : String(v);
      // Lane labels: even darker (near-black) and larger so categorical
      // groupings read as primary content, not chrome.
      const label = spriteLabel(labelText, { color: '#2a2520', size: 40, weight: '600', italic: true, w: 420, h: 80, scale: 1.55 });
      label.position.copy(anchor.clone().add(offset));
      axesGroup.add(label);

      // Subtle lane divider on the axis — helps eye land on the lane center
      const divStart = anchor.clone();
      const divEnd = anchor.clone().add(offset.clone().multiplyScalar(0.6));
      const dg = new THREE.BufferGeometry().setFromPoints([divStart, divEnd]);
      axesGroup.add(new THREE.Line(dg, new THREE.LineBasicMaterial({ color: axisColor, transparent: true, opacity: 0.35 })));

      // Tinted plane through the cube at this lane's slice. Plane normal is
      // perpendicular to the axis; the plane fills the other two dimensions
      // of the 20³ cube. Colour tracks the lane's own categorical hue so a
      // "by program" Y axis literally lays four colour-of-program slabs in
      // 3D space. Books in that lane sit on (or near) the plane.
      let planeColorHex = 0x808080;
      if (aspect.colorFor) {
        const c = aspect.colorFor(v);
        if (typeof c === 'number') planeColorHex = c;
      }
      const planeGeo = new THREE.PlaneGeometry(AXIS_LEN, AXIS_LEN);
      const planeMat = new THREE.MeshBasicMaterial({
        color: planeColorHex,
        transparent: true,
        opacity: PLANE_ALPHA,
        side: THREE.DoubleSide,
        depthWrite: false,
      });
      const plane = new THREE.Mesh(planeGeo, planeMat);
      // Position + rotate plane so it lies perpendicular to the lane axis.
      if (channelKey === 'x') {
        plane.position.set(u, 0, 0);
        plane.rotation.y = Math.PI / 2;
      } else if (channelKey === 'y') {
        plane.position.set(0, u, 0);
        plane.rotation.x = Math.PI / 2;
      } else {
        plane.position.set(0, 0, u);
      }
      axesGroup.add(plane);
    });
  }
}

/* ---- Floor grid ----
   Soft grid lines on the cube's "floor" (y = -AXIS_HALF) give the eye
   depth anchors when the default camera is the corner view. Ticked at
   quarter intervals matching the axis ticks. */
function buildFloorGrid() {
  const steps = 4;
  const geo = new THREE.BufferGeometry();
  const pts = [];
  for (let i = 0; i <= steps; i++) {
    const u = -AXIS_HALF + (i / steps) * AXIS_LEN;
    // Lines running along X at each Z
    pts.push(-AXIS_HALF, -AXIS_HALF, u, AXIS_HALF, -AXIS_HALF, u);
    // Lines running along Z at each X
    pts.push(u, -AXIS_HALF, -AXIS_HALF, u, -AXIS_HALF, AXIS_HALF);
  }
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  const mat = new THREE.LineBasicMaterial({ color: PALETTE.inkLight, transparent: true, opacity: 0.12 });
  return new THREE.LineSegments(geo, mat);
}

/* ---- Books layout — the core engine ---- */
const bookMeshes = []; // { mesh, run, basePos, lineage?, missingX?, missingY?, missingZ? }
let currentDomains = {}; // per-channel domains, cached for tooltip inspectors
let currentAspects = {}; // per-channel aspect objects

function clearScene() {
  while (axesGroup.children.length) {
    const c = axesGroup.children.pop();
    if (c.material) c.material.dispose && c.material.dispose();
    if (c.geometry) c.geometry.dispose && c.geometry.dispose();
    if (c.material?.map) c.material.map.dispose();
  }
  while (booksGroup.children.length) {
    const c = booksGroup.children.pop();
    if (c.material) c.material.dispose();
    if (c.geometry) c.geometry.dispose();
  }
  while (arcsGroup.children.length) {
    const c = arcsGroup.children.pop();
    if (c.material) c.material.dispose();
    if (c.geometry) c.geometry.dispose();
  }
  // MODULAR: also wipe the hulls group so a re-layout doesn't stack
  // stale program rings on top of fresh ones.
  while (hullsGroup.children.length) {
    const c = hullsGroup.children.pop();
    if (c.material) c.material.dispose();
    if (c.geometry) c.geometry.dispose();
  }
  bookMeshes.length = 0;
}

function layoutBooks() {
  clearScene();

  // The "universe" for domain computation: every run that could be placed —
  // we always compute domains off the complete set so filter changes don't
  // rescale axes under the user's feet.
  const allRuns = RUNS;
  const aspectFor = (ch) => ASPECTS[state.axes[ch]] || null;
  const domains = {};
  CHANNEL_ORDER.forEach(ch => {
    const asp = aspectFor(ch);
    if (asp) domains[ch] = aspectDomain(asp, allRuns);
  });
  currentDomains = domains;
  currentAspects = Object.fromEntries(CHANNEL_ORDER.map(ch => [ch, aspectFor(ch)]));

  // Build the three position axes with rulers
  ['x', 'y', 'z'].forEach(ch => {
    buildAxis(ch, domains[ch], state.axes[ch], aspectFor(ch));
  });

  // Faint cube edge frame (helps the eye anchor the volume)
  const edgeMat = new THREE.LineBasicMaterial({ color: PALETTE.inkFaded, transparent: true, opacity: 0.18 });
  const box = new THREE.BoxGeometry(AXIS_LEN, AXIS_LEN, AXIS_LEN);
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(box), edgeMat);
  axesGroup.add(edges);

  // Floor grid — quarter-tick grid at y = -AXIS_HALF, gives depth cues
  axesGroup.add(buildFloorGrid());

  // Place each run as a book
  RUNS.forEach(run => {
    // Aspect values
    const ax = aspectFor('x'), ay = aspectFor('y'), az = aspectFor('z');
    const aw = aspectFor('width'), ah = aspectFor('height'), ad = aspectFor('depth');
    const ac = aspectFor('color');

    const xVal = ax ? ax.get(run) : null;
    const yVal = ay ? ay.get(run) : null;
    const zVal = az ? az.get(run) : null;
    const wVal = aw ? aw.get(run) : null;
    const hVal = ah ? ah.get(run) : null;
    const dVal = ad ? ad.get(run) : null;

    // Small deterministic jitter for collision avoidance (doesn't change per frame)
    const seed = (run.id || '').split('').reduce((s, ch) => s + ch.charCodeAt(0), 0);
    const jitter = {
      x: ((seed * 2654435761 & 0xffff) / 0xffff),
      y: ((seed * 40503 & 0xffff) / 0xffff),
      z: ((seed * 57 & 0xffff) / 0xffff),
    };

    const px = posForValue(domains.x, xVal, jitter.x);
    const py = posForValue(domains.y, yVal, jitter.y);
    const pz = posForValue(domains.z, zVal, jitter.z);

    // Missing values land at axis center but with a small spread so they don't
    // all stack on top of each other at (0, 0, 0)
    let cx = px.p, cy = py.p, cz = pz.p;
    if (px.missing) cx = (jitter.x - 0.5) * MISSING_JITTER * 2;
    if (py.missing) cy = (jitter.y - 0.5) * MISSING_JITTER * 2;
    if (pz.missing) cz = (jitter.z - 0.5) * MISSING_JITTER * 2;

    // Sizes
    const w = sizeForValue(domains.width, wVal);
    const h = sizeForValue(domains.height, hVal);
    const d = sizeForValue(domains.depth, dVal);

    // CONTAINMENT — clamp cube centres so the cube (centre ± half-size on
    // each axis) stays fully inside the 20³ world cube [-AXIS_HALF,
    // +AXIS_HALF].  Previously cubes whose positional aspect mapped to
    // the domain extremes could poke 1+ unit past the world edge,
    // especially after Phase A made the slab stack consume the cube's
    // outer width/height/depth.  We pull cubes inward just enough that
    // the bounding box sits flush with the world cube face.
    cx = Math.max(-AXIS_HALF + w / 2, Math.min(AXIS_HALF - w / 2, cx));
    cy = Math.max(-AXIS_HALF + h / 2, Math.min(AXIS_HALF - h / 2, cy));
    cz = Math.max(-AXIS_HALF + d / 2, Math.min(AXIS_HALF - d / 2, cz));

    // Colour
    let col;
    if (ac) {
      if (ac.type === 'categorical') {
        const v = ac.get(run);
