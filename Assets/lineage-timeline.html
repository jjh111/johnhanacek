    <script>
    (function () {
        var data = JSON.parse(document.getElementById('lineage-data').textContent);
        var COLLAPSED = 6;
        var expanded = false;
        var list = document.getElementById('tl-list');
        var toggle = document.getElementById('tl-toggle');

        function el(tag, cls, text) {
            var e = document.createElement(tag);
            if (cls) e.className = cls;
            if (text != null) e.textContent = text;
            return e;
        }
        function famClass(badge) {
            if (badge.indexOf('CONVERGENCE') >= 0) return 'fam-convergence';
            if (badge.indexOf('×') >= 0) return 'fam-dual';
            if (badge.indexOf('INTELLIGENCE') >= 0) return 'fam-intel';
            if (badge.indexOf('RECOGNITION') >= 0) return 'fam-rec';
            return 'fam-vis';
        }
        function entry(e) {
            var row = el('div', 'tl-entry ' + famClass(e.badge) + (e.hidden && !expanded ? ' tl-collapsed' : ''));
            row.appendChild(el('div', 'tl-year', e.year));
            var axis = el('div', 'tl-axis');
            axis.appendChild(el('span', 'dot'));
            row.appendChild(axis);
            var body = el('div', 'tl-body');
            var title = el('div', 'tl-title', e.title);
            title.appendChild(el('span', 'tl-badge', e.badge));
            body.appendChild(title);
            body.appendChild(el('div', 'tl-author', e.author));
            if (e.desc) body.appendChild(el('div', 'tl-desc', e.desc));
            if (e.synthesis && e.synthesis.length) {
                var ul = el('ul', 'tl-synthesis');
                e.synthesis.forEach(function (s) { ul.appendChild(el('li', null, s)); });
                body.appendChild(ul);
            }
            if (e.sig) body.appendChild(el('div', 'tl-sig', '\u2517\u2501\u2501 ' + e.sig));
            row.appendChild(body);
            return row;
        }
        function render() {
            list.innerHTML = '';
            data.forEach(function (e) { list.appendChild(entry(e)); });
            var extra = data.length - COLLAPSED;
            toggle.textContent = expanded ? 'Collapse the lineage' : 'Show full lineage (' + extra + ' more entries)';
            toggle.setAttribute('aria-expanded', expanded ? 'true' : 'false');
            postHeight();
        }
        toggle.addEventListener('click', function () { expanded = !expanded; render(); });

        function postHeight() {
            try { parent.postMessage({ type: 'jh-embed-height', height: document.documentElement.scrollHeight }, '*'); } catch (e) {}
        }
        if (window.ResizeObserver) new ResizeObserver(postHeight).observe(document.documentElement);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(postHeight);
        window.addEventListener('load', postHeight);
        render();
    })();
