<title>Sizzle reel, cut 2 — render rig</title>
<!-- Unlisted render rig: cut 2 of the sizzle reel. Cut 1 (Assets/sizzle-reel.html, media-kit.json →
     `reel`) is kept as it was; this is the second pass on the same material, exactly 60 s.

     THE EDIT LIVES IN Assets/sizzle-reel-2.script.txt, a plain-text script: every word on screen
     and when it happens (scripts/reel-script.js reads it; `node scripts/reel-script.js check`
     prints its cue sheet). This page only knows how things move. Live, it is the script's
     preview: save the script, reload, and it comes back to the same moment.

     The site's own command bar narrates. The hero oval collapses into the bar, and every section
     is a question a visitor would type — who is john?, what has he shipped?, add 3 small fish and
     2 coral — answered from the same audited copy the search chunks carry. Each question is typed
     over the last one's selection, the way a real bar is used, so no section waits on an empty
     frame. The last answer opens the bar back out into the oval: the reel ends on the site's hero.

     The tank is a fixed band along the bottom of the frame for the whole cut. Fish never share
     space with copy, so no wall ever has to shove one aside; they only arrive when something in
     the story makes them — the opening loop, and the scene-language command, which spawns its fish
     through the engine's real stroke recognizer exactly as the site does.

     Motion vocabulary, one grammar: expo ease-outs that land fast and settle long; a line slides
     up out of its own clip (text) and a picture pushes in from the right inside its own window
     (work); counters roll like an odometer; chips and cards take a small back-overshoot. Every
     value is a pure function of t on a 120 BPM grid.

     Clocks, as in cut 1: live by default (space, ←/→, R, ?t=); ?render=1 hands the renderer a
     virtual clock — node scripts/render-sizzle-reel.mjs --cut=2. -->
<script>
  (function () {
    // The opening pulls back from a 2.1x close-up of the tank. The engine sizes its bitmap by
    // devicePixelRatio, so give it at least 2 and the fish stay sharp while the camera is in close.
    if ((window.devicePixelRatio || 1) < 2) Object.defineProperty(window, 'devicePixelRatio', { get: function () { return 2; }, configurable: true });
    if (!new URLSearchParams(location.search).has('render')) return;
    // The renderer owns the clock: Date.now / performance.now are virtual and rAF queues until the
    // next tick, so the engine simulates at exactly 60 Hz however slow the capture.
    var vt = 0, epoch = Date.UTC(2026, 8, 26), next = 1, queue = new Map();
    Date.now = function () { return epoch + vt; };
    performance.now = function () { return vt; };
    window.requestAnimationFrame = function (cb) { var id = next++; queue.set(id, cb); return id; };
    window.cancelAnimationFrame = function (id) { queue.delete(id); };
    window.__reelClock = {
      now: function () { return vt; },
      tick: function (ms) { vt += ms; var run = Array.from(queue.values()); queue.clear(); for (var i = 0; i < run.length; i++) run[i](vt); }
    };
  })();
</script>

  display: flex; flex-direction: column; transform-origin: 50% 0; }
.intent .eyebrow { color: var(--gold); margin-bottom: 20px; }
.intent .oh { font: 200 64px/1.12 var(--font-display); color: var(--text-subhead); }
.three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 64px; margin: 34px 0 28px; }
.three > div { position: relative; display: flex; flex-direction: column; gap: 12px; padding-top: 18px; }
.trule { position: absolute; left: 0; right: 0; top: 0; height: 1px; background: rgba(var(--cyan-dim-rgb), 0.45); transform-origin: 0 50%; }
.three .k { font: 500 32px/1 var(--font-display); color: var(--cyan); }
.three .v { font: 500 20px/1.45 var(--font-mono); color: var(--text-primary); }

/* live-mode controls (never in a render) */
#hud { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 20px 16px; display: flex; gap: 18px; align-items: center;
  font: 500 12px/1 var(--font-mono); letter-spacing: 0.08em; color: var(--ink-faint);
  background: linear-gradient(to top, rgba(0, 0, 0, 0.7), transparent); transition: opacity 0.4s; }
#hud[hidden] { display: none; }
#hud.idle { opacity: 0; }
#hud .bar { flex: 1; height: 3px; background: rgba(var(--cyan-dim-rgb), 0.18); border-radius: 2px; cursor: pointer; position: relative; }
#hud .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--cyan-dim); border-radius: 2px; }
#hud .time { color: var(--cyan); min-width: 7ch; }
#hud .bar b { position: absolute; top: -4px; bottom: -4px; width: 1px; background: var(--ink-faint); pointer-events: none; }
#hud .scene { color: var(--ink-quiet); width: 42ch; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#hud .scene.loop { color: var(--gold); }
#err { position: fixed; inset: 0; margin: 0; padding: 20px; color: #ff6b6b; font: 14px/1.5 monospace; background: #000; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="stage" role="img" aria-label="Sizzle reel of John Hanacek's portfolio, cut 2">
  <div id="camera">
    <div class="sea"></div>
    <canvas id="tank" aria-hidden="true"></canvas>
    <div class="vignette"></div>
    <svg id="chipLead" viewBox="0 0 1920 1080" aria-hidden="true"><line/><circle r="3.5"/></svg>
    <div id="chip" aria-hidden="true"><b></b><span></span></div>
    <div id="glass"><div class="ping"></div></div>
    <div id="bar"><span class="mag"></span><span class="q"><span class="qt"></span><i class="caret"></i></span><span class="kbd">⌘K</span></div>
    <div id="tiers"></div>
    <div id="scenes" class="measuring"></div>
  </div>
  <div id="blackout"></div>
</div>
<div id="hud" hidden><span class="time">0.0</span><span class="scene"></span><div class="bar"><i></i></div><span>space pause · ←/→ 5 s · [ ] scene · L loop · R restart</span></div>
<script src="../scripts/shape-detection.js"></script>
<script src="../scripts/jh-shapes.js"></script>
<script src="../scripts/jh-strokes.js"></script>
<script src="../scripts/fish-engine.js"></script>
<script src="../scripts/reel-script.js"></script>
<script>
(async function () {
  'use strict';
  const Q = new URLSearchParams(location.search);
  const RENDER = Q.has('render');
  const CLOCK = window.__reelClock;
  const W = 1920, H = 1080, CX = 960;
  const STEP = 1000 / 60;
  const TANK_Y = 540, TANK_H = 540;
  const COL_Y = 457;                                 // copy columns centre here, clear of bar and tank
  const stage = document.getElementById('stage');
  const camera = document.getElementById('camera');
  const scenesEl = document.getElementById('scenes');
  const glassEl = document.getElementById('glass');
  const pingEl = glassEl.querySelector('.ping');
  const barEl = document.getElementById('bar');
  const qtEl = barEl.querySelector('.qt');
  const caretEl = barEl.querySelector('.caret');
  const tiersEl = document.getElementById('tiers');
  const blackout = document.getElementById('blackout');
  barEl.querySelector('.mag').innerHTML = JHShapes.svg.search;

  // ── math: the easing is the motion design ─────────────────────────────
  const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
  const lerp = (a, b, k) => a + (b - a) * k;
  const E = {
    lin: x => x,
    outCubic: x => 1 - Math.pow(1 - x, 3),
    inCubic: x => x * x * x,
    inOutCubic: x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
    outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
    inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
    inOutExpo: x => x <= 0 ? 0 : x >= 1 ? 1 : x < 0.5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2,
    outBack: x => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
    inOutSine: x => -(Math.cos(Math.PI * x) - 1) / 2,
  };
  const seg = (t, a, d, ease = E.lin) => ease(clamp01((t - a) / d));
  const fx = n => n.toFixed(2);
  const hash01 = i => { let h = Math.imul(i ^ 0x9e3779b9, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
  function seedRandom(seed) {
    let s = seed >>> 0;
    Math.random = function () { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function smooth(pts) {
    const P = pts.map(p => Array.isArray(p) ? { x: p[0], y: p[1] } : p);
    let d = `M${fx(P[0].x)} ${fx(P[0].y)}`;
    for (let i = 0; i < P.length - 1; i++) {
      const p0 = P[i - 1] || P[i], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2] || p2;
      d += `C${fx(p1.x + (p2.x - p0.x) / 6)} ${fx(p1.y + (p2.y - p0.y) / 6)} ${fx(p2.x - (p3.x - p1.x) / 6)} ${fx(p2.y - (p3.y - p1.y) / 6)} ${fx(p2.x)} ${fx(p2.y)}`;
    }
    return d;
  }
  const closedPath = pts => 'M' + pts.map(p => fx(p.x) + ' ' + fx(p.y)).join('L') + 'Z';

  // ── kinetic type ──────────────────────────────────────────────────────
  // A designed line is `<span class="lm"><span class="li">…</span></span>`: the outer clips, the
  // inner slides. Breaks are authored in the edit, never left to the wrapper.
  const maskLine = (html, cls = '') => `<span class="lm ${cls}"><span class="li">${html}</span></span>`;
  const maskLetters = text => [...text].map(ch => ch === ' ' ? ' ' : `<span class="li">${ch}</span>`).join('');
  const inner = (root, sel) => [...root.querySelectorAll(sel)].map(n => n.querySelector(':scope > .li') || n);
  // Hidden is set explicitly and shown is left to inherit ('' rather than 'visible'), so a parent
  // that hides takes every line inside it along.
  function lines(spans, t, tin, tout, o) {
    o = o || {};
    const st = o.stagger != null ? o.stagger : 0.07, d = o.dur || 0.6, dO = o.durOut || 0.3, sto = o.staggerOut != null ? o.staggerOut : 0.035;
    for (let i = 0; i < spans.length; i++) {
      const a = seg(t, tin + i * st, d, E.outExpo);
      const b = tout == null ? 0 : seg(t, tout + i * sto, dO, E.inExpo);
      const s = spans[i].style;
      s.transform = `translate3d(0,${fx((1 - a) * 108 - b * 108)}%,0)`;
      s.visibility = a <= 0 || b >= 1 ? 'hidden' : '';
    }
  }
  // chips and cards: a small overshoot on the way in, a quick dip on the way out
  function pop(el, t, tin, tout, o) {
    o = o || {};
    const from = o.from != null ? o.from : 0.86, d = o.dur || 0.45;
    const a = seg(t, tin, d), b = tout == null ? 0 : seg(t, tout, o.durOut || 0.25, E.inCubic);
    const sc = from + (1 - from) * E.outBack(a) - b * 0.05;
    el.style.opacity = (E.outCubic(a) * (1 - b)).toFixed(3);
    el.style.transform = `translate3d(0,${fx((1 - E.outExpo(a)) * (o.rise != null ? o.rise : 14) - b * 10)}px,0) scale(${sc.toFixed(4)})`;
    el.style.visibility = a <= 0 || b >= 1 ? 'hidden' : '';
    return a * (1 - b);
  }
  function fade(el, t, tin, d, tout, dO) {
    const v = seg(t, tin, d, E.outCubic) * (tout == null ? 1 : 1 - seg(t, tout, dO || 0.25, E.inCubic));
    el.style.opacity = v.toFixed(3);
    return v;
  }
  const drawRule = (el, t, tin, tout, d = 0.5) => { el.style.transform = `scaleX(${(seg(t, tin, d, E.outExpo) * (1 - seg(t, tout, 0.25, E.inExpo))).toFixed(3)})`; };
  // a number rolls up to itself: each digit a strip that runs past ten before it lands. Each
  // digit's window is as wide as the digit it lands on (measured once the fonts are in), so a
  // landed "14" is set like type, not like a row of equal slots.
  function odometer(el, n) {
    const digits = String(n).split('');
    el.innerHTML = digits.map(() => `<span class="od"><span class="ods">${'01234567890123456789'.split('').map(d => `<i>${d}</i>`).join('')}</span></span>`).join('');
    const strips = [...el.querySelectorAll('.ods')];
    LAYOUT.push(() => el.querySelectorAll('.od').forEach((od, i) => {
      const probe = document.createElement('span');
      probe.style.cssText = 'display:inline-block;position:absolute;visibility:hidden;white-space:pre';
      probe.textContent = digits[i];
      el.appendChild(probe); od.style.width = probe.offsetWidth + 'px'; probe.remove();
    }));
    return k => strips.forEach((s, i) => {
      const kk = clamp01(k * 1.25 - 0.12 * i);
      s.style.transform = `translate3d(0,${fx(-E.outExpo(kk) * (10 + +digits[i]))}em,0)`;
    });
  }
  // a stat: the number fades up and rolls, its label slides up after it
  function statMotion(node, n) {
    const num = node.querySelector('.num'), roll = odometer(num, n), lab = node.querySelector('.lab > .li');
    return (t, tin, tout) => {
      roll(seg(t, tin + 0.05, 1.1));
      num.style.opacity = (seg(t, tin, 0.25) * (tout == null ? 1 : 1 - seg(t, tout, 0.2))).toFixed(3);
      lines([lab], t, tin + 0.12, tout);
    };
  }
  const rectAt = (A, B, k) => ({ x: lerp(A.x, B.x, k), y: lerp(A.y, B.y, k), w: lerp(A.w, B.w, k), h: lerp(A.h, B.h, k) });
  const place = (el, r) => { el.style.left = fx(r.x) + 'px'; el.style.top = fx(r.y) + 'px'; el.style.width = fx(r.w) + 'px'; el.style.height = fx(r.h) + 'px'; };

  // ── the edit ──────────────────────────────────────────────────────────
  // read fresh every load: a reload after saving the script shows the save
  const fresh = (url, as) => fetch(url, { cache: 'no-store' }).then(r => { if (!r.ok) throw new Error(url + ' ' + r.status); return r[as](); });
  const MK = await fresh('./media-kit.json', 'json');       // the boards (clients, offer) and the site's name
  const EDIT = ReelScript.parse(await fresh('./sizzle-reel-2.script.txt', 'text')).edit;
  const boardNamed = name => { const b = MK.boards.find(x => x.name === name); if (!b) throw new Error('cut 2: no board named ' + name); return b; };
  let acc = 0;
  const SC = EDIT.scenes.map((s, i) => { const o = Object.assign({}, s, { i, start: acc, end: acc + s.dur }); acc += s.dur; return o; });
  const DURATION = Math.round(acc * 1000) / 1000;

  const SIG_D = await fetch('./JHsig.svg').then(r => r.text()).then(s => new DOMParser().parseFromString(s, 'image/svg+xml').querySelector('path').getAttribute('d'));
  // pen paths over the signature (150×75): the J and its crossbar in one movement, then the H
  const SIG_PEN = [
    [[16.5, 39.5], [20, 34.5], [25, 28.2], [30, 22.8], [36, 17.6], [42, 13.6], [48, 10.6], [54, 8.5], [59, 7.9], [63, 8.7], [65.6, 11.6], [66.2, 16], [65.6, 21], [64, 26.4], [62.1, 31.3], [60.3, 35.6], [57.8, 40.6], [54.4, 45.6], [49, 51.5], [42, 57.4], [34, 62.6], [25, 67.1], [16, 70.7], [9, 72.3], [4.6, 71.6], [2.6, 68.8], [3.8, 65.4], [7.2, 61.9], [12.2, 58.4], [19, 54.6], [27, 50.8], [35, 47.4], [43, 44.3], [51, 41.3], [57.6, 38.9], [62.2, 36.9], [68, 34.7], [75, 32.4], [82, 30.5], [90, 28.3], [98, 25.8], [106, 23.5], [114, 21.4], [122, 19.5], [130, 17.5], [138, 15.4], [144, 13.9], [147.8, 13.2]],
    [[81.4, 5.2], [79.8, 6.2], [78.8, 8.6], [78.1, 12.5], [77.6, 18], [77.1, 25], [76.7, 32], [76.9, 40], [77.7, 47], [79, 52], [80.8, 56], [82.9, 59.3]],
    [[93, 1.6], [92.1, 5], [91.6, 10], [91.1, 18], [90.7, 26], [90.9, 34], [91.7, 42], [93, 48.5], [94.8, 54], [97, 58.6]],
  ];
  let sigN = 0;
  const sigMarkup = () => { const id = 'pen' + (sigN++);
    return `<svg class="sig" viewBox="0 0 150 75" aria-hidden="true"><defs><mask id="${id}" maskUnits="userSpaceOnUse" x="-8" y="-8" width="166" height="91">${SIG_PEN.map(p => `<path d="${smooth(p)}"/>`).join('')}</mask></defs><path class="ink2" d="${SIG_D}" mask="url(#${id})"/></svg>`; };
  function sigWriter(svg) {
    const pens = [...svg.querySelectorAll('mask path')], lens = pens.map(p => p.getTotalLength()), total = lens.reduce((a, b) => a + b, 0), LIFT = 0.07;
    pens.forEach((p, i) => { p.style.strokeDasharray = `${lens[i]} ${lens[i]}`; });
    // a pen that hasn't started stays out of the mask: a zero-length dash with round caps still
    // paints a dot, which would show as specks of ink before the signature is written
    return (t, t0, dur) => { const run = dur - LIFT * (pens.length - 1); let at = t0;
      pens.forEach((p, i) => { const d = run * lens[i] / total, k = seg(t, at, d, E.inOutSine);
        p.style.strokeDashoffset = fx(lens[i] * (1 - k)); p.style.visibility = k > 0 ? '' : 'hidden'; at += d + LIFT; }); };
  }
  const glyphSvg = key => JHShapes.svg[key];
  const pageBadge = (it, cls = '') => it.page ? `<span class="wbadge ${cls}">${glyphSvg(it.shape || 'roundedSquare')}${it.page} ↗</span>` : '';

  // ── the tank: a band along the bottom, one population for the whole cut ──
  seedRandom(parseInt(Q.get('seed') || EDIT.seed || 1, 10));
  const tankEl = document.getElementById('tank');
  tankEl.getBoundingClientRect = () => ({ x: 0, y: 0, left: 0, top: 0, right: W, bottom: TANK_H, width: W, height: TANK_H });
  // ── attention: what the fish look at ──────────────────────────────────
  // Freehand fish, structured data: each builder says what on screen matters and
  // when ({ t0, t1, x, y }, stage px). The fish drawn in the opening swims to a
  // spot beside it (on whichever side it already is, so it travels as little as
  // it can) and tilts its nose up at it; the school sweeps along the other side.
  // Both go through the engine's opt-in host hooks: every turn is the engine's arc.
  const ATTN = [];
  const look = (t0, t1, x, y) => ATTN.push({ t0, t1, x, y });
  let reelT = 0, BIG = null;                   // the reel's clock as the tank sees it; the opening's fish
  const SPOT_Y = 322, SCHOOL_Y = 296;          // tank px (stage 862 / 836); 296 is as deep as the engine lets a school waypoint go
  const BIG_DX = 250, SCHOOL_DX = 210;         // how far to either side of the thing each one stands
  const attnAt = t => { let a = null; for (const x of ATTN) if (t >= x.t0 && t < x.t1 && (!a || x.t0 >= a.t0)) a = x; return a; };
  const sideOf = A => {                        // decided once, from where the big fish is when it notices
    if (A.side === undefined) {
      A.side = BIG && BIG.x > A.x ? 1 : -1;
      if (A.x + A.side * BIG_DX < 140 || A.x + A.side * BIG_DX > W - 140) A.side = -A.side;
    }
    return A.side;
  };
  const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };
  // a heading with its tilt held to ±m of horizontal; straight up keeps the side it faces
  const clampTilt = (a, m, cur) => {
    let c = Math.cos(a); const sn = Math.sin(a);
    if (Math.abs(c) < 0.25 && cur != null) c = Math.cos(cur) >= 0 ? 0.25 : -0.25;
    const e = Math.max(-m, Math.min(m, Math.atan2(sn, Math.abs(c))));
    return c >= 0 ? e : Math.PI - e;
  };
  function steerBig(f) {
    if (f !== BIG) return null;
    const A = attnAt(reelT);
    if (!A) return null;
    const sx = Math.max(140, Math.min(W - 140, A.x + sideOf(A) * BIG_DX));
    const dx = sx - f.x, dy = SPOT_Y - f.y, d = Math.hypot(dx, dy);
    if (d > (f.reelAtSpot ? 130 : 46)) {       // swim over, faster the further it has to go
      f.reelAtSpot = false;
      let speed = Math.min(2.4, 0.9 + d / 200);
      // Courtesy: the school is slower and always to its right. If it is still in the way,
      // drift behind it instead of cutting through (a large fish closing in reads as a
      // predator, and the school would scatter).
      let n = 0, cx = 0, cy = 0;
      for (const m of tank.state.fish) if (m !== f && m.bodyWidth >= 35 && m.bodyWidth < 60) { cx += m.x; cy += m.y; n++; }
      if (n) { cx /= n; cy /= n; if (Math.sign(cx - f.x) === Math.sign(dx) && Math.hypot(cx - f.x, cy - f.y) < 300) speed = 0.3; }
      const heading = clampTilt(Math.atan2(dy, dx), 0.5);
      // a big turn is made nearly on the spot, not at cruising speed (that reads as rearing up)
      speed *= Math.max(0.22, Math.cos(Math.min(Math.PI, Math.abs(angDiff(heading, f.heading))) / 2));
      return { heading, speed };
    }
    f.reelAtSpot = true;                       // there: nose up at the thing, barely moving
    return { heading: clampTilt(Math.atan2((A.y - TANK_Y) - f.y, A.x - f.x), 0.62, f.heading), speed: 0.12 };
  }
  // The school's waypoint sweeps slowly left and right under the thing: a school parked on a
  // fixed point circles it (its turn rate is capped) and rides up behind the copy.
  function schoolSpot(c) {
    const A = attnAt(reelT);
    if (!A) return null;
    const x = Math.max(160, Math.min(W - 160, A.x - sideOf(A) * SCHOOL_DX + 170 * Math.sin(reelT * 0.55)));
    return { x, y: SCHOOL_Y, pace: 1 + Math.min(1, Math.abs(x - c.x) / 500) };   // hurry when far
  }
  const tank = FishCanvas(tankEl, { transparent: true, seedFish: false, seedJellyfish: false, steer: steerBig, schoolTarget: schoolSpot, calmSchool: true });
  const inTank = pts => pts.map(p => ({ x: p.x, y: p.y - TANK_Y }));   // stage → tank coordinates
  function spawnStroke(stagePts, kind, heading) {
    tank.processStroke(inTank(stagePts), [kind]);
    if (kind !== 'fish') return null;
    const f = tank.state.fish[tank.state.fish.length - 1];
    if (f && heading != null) { f.heading = f.targetHeading = f.cruiseAngle = heading; f.vx = Math.cos(heading) * 0.4; f.vy = Math.sin(heading) * 0.4; }
    return f;
  }

  // ── registries the scenes fill ────────────────────────────────────────
  const MEDIA = [], EVENTS = [], LAYOUT = [], QUERIES = [];
  const at = (t, run) => EVENTS.push({ t, run });
  function segEl(sc, html) {
    const el = document.createElement('section');
    el.className = 'seg ' + sc.type;
    el.innerHTML = html;
    scenesEl.appendChild(el);
    return el;
  }
  const box = el => {                         // stage-space box of a laid-out element
    let x = 0, y = 0, n = el;
    while (n && n !== camera) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
    return { x, y, w: el.offsetWidth, h: el.offsetHeight };
  };
  const centreColumn = col => LAYOUT.push(() => { col.style.top = (COL_Y - col.offsetHeight / 2) + 'px'; });
  function mediaLayer(host, b, start, end) {
    const layer = document.createElement('div'); layer.className = 'layer';
    let m;
    if (b.video) {
      m = document.createElement('video');
      m.muted = true; m.playsInline = true; m.preload = 'auto';
      m.setAttribute('muted', ''); m.setAttribute('playsinline', '');
      // A clip only seeks if its server answers byte ranges. The renderer does; python's
      // http.server does not, and a clip it serves plays from 0 whatever `from` says. So live,
      // play it from a blob, which always seeks.
      if (RENDER) m.src = b.video;
      else fetch(b.video).then(r => r.ok ? r.blob() : Promise.reject(r.status)).then(bl => { m.src = URL.createObjectURL(bl); }, () => { m.src = b.video; });
      m.loop = !!b.loop;                        // a clip shorter than its beat (the AROC HUD is 1.3 s) repeats
      MEDIA.push({ el: m, from: b.from || 0, start, end, loop: !!b.loop });
    } else { m = new Image(); m.decoding = 'async'; m.alt = ''; m.src = b.img; }
    const focus = b.focus || [0.5, 0.5];
    m.style.objectPosition = b.pan ? '0% 50%' : `${focus[0] * 100}% ${focus[1] * 100}%`;
    m.style.transformOrigin = `${focus[0] * 100}% ${focus[1] * 100}%`;
    layer.appendChild(m); host.appendChild(layer);
    const zoom = b.zoom || (b.video ? [1.0, 1.05] : [1.02, 1.1]);
    return { layer, m, update(t, o) {
      const on = t >= start - 0.05 && t <= end + 0.05;
      layer.style.visibility = on ? '' : 'hidden';
      if (!on) return;
      layer.style.opacity = o == null ? 1 : o;
      const k = seg(t, start, end - start, E.inOutSine);
      m.style.transform = `scale(${lerp(zoom[0], zoom[1], k).toFixed(4)})`;
      if (b.pan) m.style.objectPosition = `${fx(k * 100)}% 50%`;
    } };
  }

  // A text column for one piece of work: eyebrow, two headline lines, a gold rule, then a slot
  // whose beats swap in place (lines, a lead + counters, or a quote) and/or an awards ledger.
  const hasCopy = b => b.line || b.lead || b.quote;
  function beatMarkup(b, quiet) {
    if (b.quote) return `<div class="bt"><div class="ql">${b.quote.map(l => maskLine(l, 'qt3')).join('')}</div>${maskLine(`<strong>${b.cite[0]}</strong><span> · ${b.cite[1]}</span>`, 'cite')}</div>`;
    const ls = b.line || [b.lead];
    return `<div class="bt"><div class="ll">${ls.map(l => maskLine(l, quiet ? 'ln cap' : 'ln')).join('')}</div>${b.stats ? `<div class="stats">${b.stats.map(s => `<div class="stat"><span class="num"></span>${maskLine(s.label, 'lab')}</div>`).join('')}</div>` : ''}</div>`;
  }
  function columnMarkup(it, x, width) {
    const beats = (it.beats || []).filter(hasCopy);
    return `<div class="col" style="left:${x}px;width:${width}px">
      ${maskLine(it.eyebrow, 'eyebrow')}
      <div class="hls">${it.headline.map(l => maskLine(l, 'hl')).join('')}</div>
      <div class="rule"></div>
      ${beats.length ? `<div class="slot">${beats.map(b => beatMarkup(b, it.quiet)).join('')}</div>` : ''}
      ${it.awards ? `<div class="ledger">${it.awards.map(a => `<div class="lrow"><i class="lrule"></i>${maskLine(a.yr, 'inl yr')}${maskLine(a.text, 'inl aw')}</div>`).join('')}</div>` : ''}
    </div>`;
  }
  // animate that column: tin = first arrival, tout = everything leaves; base = where beat `at`s count from
  function columnMotion(colEl, it, base) {
    const eb = inner(colEl, '.lm.eyebrow');
    const heads = inner(colEl, '.hls > .lm');
    const rule = colEl.querySelector('.rule');
    const beats = (it.beats || []).filter(hasCopy);
    const bts = [...colEl.querySelectorAll('.slot > .bt')].map((node, i) => ({
      b: beats[i],
      lines: inner(node, '.ll > .lm, .ql > .lm'),
      cite: inner(node, ':scope > .cite'),
      stats: [...node.querySelectorAll('.stat')].map((s, j) => statMotion(s, beats[i].stats[j].n)),
    }));
    const rows = [...colEl.querySelectorAll('.lrow')].map((r, i) => ({ a: it.awards[i], rule: r.querySelector('.lrule'), ls: inner(r, '.lm') }));
    return (t, tin, tout) => {
      lines(eb, t, tin, tout, { dur: 0.55 });
      lines(heads, t, tin + 0.06, tout, { stagger: 0.07 });
      drawRule(rule, t, tin + 0.3, tout);
      bts.forEach((x, i) => {
        const next = bts[i + 1];
        const bin = i === 0 ? tin + 0.36 : base + x.b.at + 0.12;
        const bout = next ? base + next.b.at - 0.3 : tout;   // gone before the next beat rises into the same slot
        lines(x.lines, t, bin, bout, { stagger: 0.06 });
        lines(x.cite, t, bin + 0.28, bout);
        x.stats.forEach((s, j) => s(t, bin + 0.14 + j * 0.12, bout));
      });
      rows.forEach(x => {
        const tin2 = base + x.a.at;
        drawRule(x.rule, t, tin2, tout, 0.55);
        lines(x.ls, t, tin2 + 0.05, tout, { stagger: 0.06 });
      });
    };
  }
  const TIERCLASS = { 'LFM2.5 · WebGPU': 'gpu', 'scene language': 'gold', 'intent': 'gold' };

  // ── scene builders ────────────────────────────────────────────────────
  const BUILD = {
    open(sc) {
      const S = 2.0, cx = 924, cy = 895;           // in the tank, just below its midline
      const pts = JHStrokes.points.loop(cx, cy, S), d = smooth(pts);
      const el = segEl(sc, `
        <svg class="ink" viewBox="0 0 ${W} ${H}"><g class="glow"><path d="${d}"/><circle class="nib" r="10"/></g><path class="main" d="${d}"/><circle class="nib" r="5.5"/></svg>
        <p class="guide">${maskLine(sc.caption, 'g1')}${maskLine(sc.reveal, 'g2')}</p>`);
      const paths = [...el.querySelectorAll('.ink path')], nibs = [...el.querySelectorAll('.nib')];
      const main = el.querySelector('.main'), glow = el.querySelector('.glow'), L = main.getTotalLength();
      paths.forEach(p => { p.style.strokeDasharray = `${L} ${L}`; });
      const g1 = inner(el, '.g1'), g2 = inner(el, '.g2');
      const D0 = 0.2, D1 = 0.95, DONE = D0 + D1, OUT = sc.dur - 0.45;
      let born = null;
      at(sc.start + DONE, () => { born = BIG = spawnStroke(pts, 'fish', Math.PI); });
      return (lt) => {
        const k = seg(lt, D0, D1, E.inOutCubic);
        paths.forEach(p => { p.style.strokeDashoffset = fx(L * (1 - k)); });
        const pt = main.getPointAtLength(L * k);
        nibs.forEach(c => { c.setAttribute('cx', fx(pt.x)); c.setAttribute('cy', fx(pt.y)); c.style.opacity = (seg(lt, 0.08, 0.15) * (1 - seg(lt, DONE - 0.04, 0.15))).toFixed(3); });
        const flare = Math.sin(Math.PI * seg(lt, DONE - 0.08, 0.4)), gone = seg(lt, DONE + 0.05, 0.4, E.inOutSine);
        main.style.opacity = (1 - gone).toFixed(3);
        glow.style.opacity = ((0.7 + 0.6 * flare) * (1 - gone)).toFixed(3);
        if (born && lt < DONE + 0.45) { born.heading = born.targetHeading = born.cruiseAngle = Math.PI; born.vx = -0.3; born.vy = 0; }
        lines(g1, lt, 0.22, OUT, { dur: 0.5 });
        lines(g2, lt, DONE + 0.06, OUT, { dur: 0.45 });
      };
    },

    title(sc) {
      const tag = sc.tagline.map((g, i) => (i ? '<span class="dot">·</span>' : '') + maskLine(g, 'inl')).join('');
      const el = segEl(sc, `<div class="tt">${sigMarkup()}<div class="lm name">${maskLetters(sc.name)}</div><div class="tag">${tag}</div></div>`);
      const tt = el.querySelector('.tt'), name = el.querySelector('.name'), sig = el.querySelector('.sig');
      const letters = [...name.querySelectorAll('.li')], tags = inner(el, '.tag > .lm'), dots = [...el.querySelectorAll('.tag .dot')];
      const write = sigWriter(sig);
      LAYOUT.push(() => { tt.style.top = (380 - tt.offsetHeight / 2 + 6) + 'px'; });
      const OUT = sc.dur - 0.65;
      look(sc.start + 0.3, sc.end, 960, 390);
      return (lt) => {
        write(lt, 0.2, 0.7);

    answer(sc, q) {
      const el = segEl(sc, `<div class="ansc" style="left:96px"><div class="ansb">${sc.lines.map((l, i) => maskLine(l, 'ans' + (i === 0 ? ' gold' : ''))).join('')}</div>
        ${sc.support ? `<div class="supw">${maskLine(sc.support, 'sup')}</div>` : ''}
        <div class="stats astats">${sc.stats.map(s => `<div class="stat"><span class="num"></span>${maskLine(s.label, 'lab')}</div>`).join('')}</div></div>`);
      centreColumn(el.querySelector('.ansc'));
      const ls = inner(el, '.ansb > .lm'), sup = inner(el, '.lm.sup');
      const stats = [...el.querySelectorAll('.stat')].map((s, j) => statMotion(s, sc.stats[j].n));
      const IN = q.enter - sc.start + 0.04, OUT = sc.dur - 0.32;
      look(sc.start + IN, sc.end, 560, COL_Y);
      return (lt) => {
        lines(ls, lt, IN, OUT, { stagger: 0.075, dur: 0.65 });
        lines(sup, lt, IN + 0.3, OUT, { dur: 0.6 });

      };
    },

    results(sc, q) {
      const items = sc.items, LIST = sc.dur - items.reduce((a, it) => a + it.dur, 0);
      const WIN = { x: 924, y: 204, w: 900, h: 506 };
      const rowsHtml = sc.rows.map((r, i) => `<div class="row">
          <div class="thumb${r.thumb || i === 0 ? '' : ' tile'}">${i === 0 ? '' : r.thumb ? `<img src="${r.thumb}" alt="">` : glyphSvg(r.shape)}</div>
          <div class="meta">${maskLine(`${glyphSvg(r.shape)}${r.page} ↗`, 'badge')}${maskLine(r.title, 'rtitle')}${maskLine(r.micro, 'micro')}</div></div>`).join('');
      // one window; each result is a pane that pushes in from the right through it
      const panes = items.map(it => `<div class="pane"><div class="media"></div><div class="shade"></div>${pageBadge(it)}</div>`).join('');
      const pager = `<b><span class="od"><span class="ods">${items.map((_, i) => `<i>${i + 1}</i>`).join('')}</span></span></b> / ${items.length}  ·  ${q.text}`;
      const el = segEl(sc, `<div class="rows">${rowsHtml}</div>${items.map(it => columnMarkup(it, 96, 780)).join('')}
        <div class="win">${panes}</div>
        <div class="status" style="left:auto;right:96px;top:146px">${pager}</div>`);
      const rows = [...el.querySelectorAll('.row')];
      const thumbs = rows.map(r => r.querySelector('.thumb'));
      const metaLines = rows.map(r => inner(r, '.meta > .lm'));
      const win = el.querySelector('.win'), cols = [...el.querySelectorAll('.col')];

      const shades = paneEls.map(p => p.querySelector('.shade')), badges = paneEls.map(p => p.querySelector('.wbadge'));
      const pg = el.querySelector('.status'), pgStrip = pg.querySelector('.ods');
      const t0 = sc.start, starts = [], ends = [];
      let cur = t0 + LIST;
      items.forEach(it => { starts.push(cur); cur += it.dur; ends.push(cur); });
      const PUSH = 0.6;                               // a push is centred on the cut: half before, half after
      const layers = items.map((it, i) => it.beats.filter(b => b.video || b.img).map((b, j, arr) => {

      return (lt, t) => {

        rows.forEach((r, i) => {
          const tin = ROW_IN + i * 0.06, tout = LIST - 0.1 + i * 0.03;
          if (i > 0) pop(thumbs[i], lt, tin, tout, { from: 0.9, rise: 18 }); else thumbs[0].style.opacity = 0;
          lines(metaLines[i], lt, tin + 0.04, tout, { stagger: 0.04, dur: 0.5, durOut: 0.22, staggerOut: 0.02 });
        });
        // the window: pops in as row 1's thumbnail, dives out of it to full size, then holds

        place(win, rectAt(THUMB, WIN, kd));
        win.style.borderRadius = fx(lerp(9, 16, kd)) + 'px';
        if (t < starts[0] - 0.1) pop(win, lt, ROW_IN, null, { from: 0.9, rise: 18 });
        else {
          const b = seg(t, OUT, 0.3, E.inCubic);
          win.style.visibility = b >= 1 ? 'hidden' : '';
          win.style.opacity = (1 - b).toFixed(3);
          win.style.transform = `scale(${(1 - 0.05 * b).toFixed(4)})`;
        }
        // panes: the next result covers the last, which slips a third of the way left and darkens
        paneEls.forEach((p, i) => {
          const kin = i === 0 ? 1 : seg(t, starts[i] - PUSH / 2, PUSH, E.inOutExpo);
          const kout = i < items.length - 1 ? seg(t, starts[i + 1] - PUSH / 2, PUSH, E.inOutExpo) : 0;
          const vis = kin > 0 && kout < 1;
          p.style.visibility = vis ? '' : 'hidden';
          if (!vis) return;
          p.style.transform = `translate3d(${fx((1 - kin) * 100 - kout * 32)}%,0,0)`;
          shades[i].style.opacity = (kout * 0.75).toFixed(3);
          layers[i].forEach(({ b, j, L }) => L.update(t, j === 0 ? 1 : seg(t, starts[i] + b.at, 0.35, E.outCubic)));
          pop(badges[i], t, i === 0 ? starts[0] + 0.5 : starts[i] + 0.25, null, { from: 0.8, rise: 0 });
        });
        // columns: out just before the push, in just after it
        cols.forEach((c, i) => motions[i](t, i === 0 ? starts[0] + 0.3 : starts[i] + 0.3, i < items.length - 1 ? ends[i] - 0.32 : OUT));
        // the pager rolls to the next result number on every push
        let n = 0; for (let i = 1; i < items.length; i++) n += seg(t, starts[i] - 0.1, 0.45, E.outExpo);
        pgStrip.style.transform = `translate3d(0,${fx(-n)}em,0)`;
        pg.style.opacity = (seg(t, starts[0] + 0.3, 0.25) * (1 - seg(t, OUT, 0.2))).toFixed(3);
      };
    },

    feature(sc, q) {
      const R = { x: 96, y: 204, w: 900, h: 506 };
      const el = segEl(sc, `<div class="win" style="left:${R.x}px;top:${R.y}px;width:${R.w}px;height:${R.h}px"><div class="media"></div>
          <div class="cap3"><div class="slot">${sc.beats.map(b => maskLine(b.caption, 'c3')).join('')}</div></div>${pageBadge(sc)}</div>${columnMarkup(sc, 1044, 780)}`);
      const win = el.querySelector('.win'), media = win.querySelector('.media'), col = el.querySelector('.col');
      const caps = inner(win, '.c3'), badge = win.querySelector('.wbadge');

      const vis = sc.beats.filter(b => b.video || b.img);

        layers.forEach((L, j) => L.update(t, j === 0 ? 1 : seg(t, sc.start + vis[j].at, 0.35, E.outCubic)));

        });
        pop(badge, t, IN + 0.4, OUT - 0.05, { from: 0.8, rise: 0 });
        motion(t, IN + 0.1, OUT);
      };
    },

    command(sc, q) {                             // scene language: a typed sentence becomes a school
      const G = JHStrokes.points;
      const icon = k => `<svg viewBox="0 0 24 24">${JHStrokes.marks[k === 'square' ? 'square' : 'loop']()}</svg>`;
      // where the command's strokes land: four medium loops left of the card, clear of the big fish
      // (it watches the card from the right, coming from the art); two squares out in the corners
      const FISH = [[470, 872], [595, 930], [720, 866], [845, 924]], CORAL = [[300, 1000, 92], [1730, 1006, 82]];
      const strokes = FISH.map(([x, y]) => ({ pts: G.loop(x, y, 1.0), kind: 'fish' }))
        .concat(CORAL.map(([x, y, s]) => ({ pts: G.square(x, y, s), kind: 'coral' })));
      const rowOf = strokes.map(s => sc.plan.findIndex(p => (p.glyph === 'square') === (s.kind === 'coral')));
      const strip = '0123456789'.split('').map(d => `<i>${d}</i>`).join('');
      const el = segEl(sc, `
        <div class="plan">
          <div class="ptop"><span class="pts">${maskLine('Plan', 'p1')}${maskLine('Receipt', 'p2')}</span><span class="lang">scene language</span></div>
          ${sc.plan.map(p => `<div class="prow">${icon(p.glyph)}<span class="cnt">${maskLine(`<b>${p.n}</b> ×`, 'pl')}${maskLine(`<b><span class="od"><span class="ods">${strip}</span></span></b>/${p.n}`, 'rc')}</span>${maskLine(p.what, 'what')}${maskLine('✓', 'ck')}</div>`).join('')}
          <div class="pact">${maskLine('<span class="go">Make it</span><span class="no">cancel</span>', 'pa')}${maskLine(`<span class="ok">✓</span> built · ${sc.receipt}`, 'pb')}</div></div>
        <svg class="ink" viewBox="0 0 ${W} ${H}">${strokes.map(s => `<path d="${s.kind === 'fish' ? smooth(s.pts) : closedPath(s.pts)}"/>`).join('')}
          <circle class="ripple" r="10"/><circle class="nib cur" r="9"/></svg>`);
      const plan = el.querySelector('.plan'), go = el.querySelector('.go');
      const [p1] = inner(el, '.p1'), [p2] = inner(el, '.p2'), [pa] = inner(el, '.pa'), [pb] = inner(el, '.pb');
      const prows = [...el.querySelectorAll('.prow')].map(r => ({ icon: r.querySelector('svg'), pl: inner(r, '.pl'), rc: inner(r, '.rc'), what: inner(r, '.what'), ck: inner(r, '.ck'), ods: r.querySelector('.ods') }));
      const paths = [...el.querySelectorAll('.ink path')], lens = paths.map(p => p.getTotalLength());
      paths.forEach((p, i) => { p.style.strokeDasharray = `${lens[i]} ${lens[i]}`; });
      const cur = el.querySelector('.cur'), ripple = el.querySelector('.ripple');
      const IN = q.enter - sc.start + 0.04, TAP = IN + 0.75, GO = { x: 0, y: 0 };
      LAYOUT.push(() => { plan.style.top = (COL_Y - plan.offsetHeight / 2) + 'px'; });
      LAYOUT.push(() => { const b = box(go); GO.x = b.x + b.w / 2; GO.y = b.y + b.h / 2; });
      const draw = strokes.map((s, i) => ({ a: TAP + 0.15 + i * 0.1, d: s.kind === 'fish' ? 0.2 : 0.24 }));
      const born = draw.map(dd => dd.a + dd.d);
      draw.forEach((dd, i) => at(sc.start + born[i], () => spawnStroke(strokes[i].pts, strokes[i].kind, strokes[i].kind === 'fish' ? Math.PI : null)));
      look(sc.start + IN, sc.end, 960, COL_Y);

        // Plan → Receipt: the header, each count and the action row all turn over on the tap

        lines([p2], lt, TAP + 0.16, OUT);
        prows.forEach((x, i) => {
          fade(x.icon, lt, IN + 0.12 + i * 0.07, 0.3, OUT, 0.2);
          lines(x.pl, lt, IN + 0.14 + i * 0.07, TAP + 0.05 + i * 0.04, { durOut: 0.2 });
          lines(x.what, lt, IN + 0.18 + i * 0.07, OUT);
          lines(x.rc, lt, TAP + 0.14 + i * 0.05, OUT);
          // the count rolls as each of this row's strokes becomes a living thing in the tank
          let c = 0; born.forEach((b, s) => { if (rowOf[s] === i) c += E.outExpo(seg(lt, b, 0.3)); });
          x.ods.style.transform = `translate3d(0,${fx(-c)}em,0)`;
          lines(x.ck, lt, Math.max(...born.filter((b, s) => rowOf[s] === i)) + 0.2, OUT, { dur: 0.45 });
        });
        lines([pa], lt, IN + 0.3, TAP + 0.1, { durOut: 0.2 });
        lines([pb], lt, DONE + 0.25, OUT);

        const m = seg(lt, TAP - 0.4, 0.38, E.outExpo);
        cur.setAttribute('cx', fx(lerp(GO.x + 170, GO.x, m))); cur.setAttribute('cy', fx(lerp(GO.y + 120, GO.y, m)));
        cur.style.opacity = (seg(lt, TAP - 0.4, 0.15) * (1 - seg(lt, TAP + 0.15, 0.2))).toFixed(3);
        const rp = seg(lt, TAP, 0.45, E.outCubic);
        ripple.setAttribute('cx', fx(GO.x)); ripple.setAttribute('cy', fx(GO.y)); ripple.setAttribute('r', fx(8 + rp * 46));
        ripple.style.opacity = (lt >= TAP ? 1 - rp : 0).toFixed(3);
        go.style.transform = `scale(${(1 - 0.06 * Math.sin(Math.PI * seg(lt, TAP - 0.04, 0.2))).toFixed(4)})`;
        // the recognizer's strokes, fast, then gone into what they became
        paths.forEach((p, i) => {
          const k = seg(lt, draw[i].a, draw[i].d, E.inOutCubic);
          p.style.strokeDashoffset = fx(lens[i] * (1 - k));
          p.style.opacity = (k > 0 ? 1 - seg(lt, born[i], 0.35) : 0).toFixed(3);

    },

    art(sc, q) {
      const C = { x: 1824 - 250, y: COL_Y, r: 250 };
      const it = Object.assign({ quiet: true }, sc);
      const el = segEl(sc, `<div class="port" style="left:${C.x}px;top:${C.y}px;width:0;height:0"></div>
        <svg class="ring" style="left:${C.x - C.r - 16}px;top:${C.y - C.r - 16}px;width:${(C.r + 16) * 2}px;height:${(C.r + 16) * 2}px" viewBox="0 0 ${(C.r + 16) * 2} ${(C.r + 16) * 2}"><circle cx="${C.r + 16}" cy="${C.r + 16}" r="${C.r + 12}"/></svg>
        ${pageBadge(sc, 'free')}${columnMarkup(it, 96, 900)}`);

    logos(sc, q) {

        cols.forEach((c, i) => {

    },

    end(sc) {
      const bd = boardNamed(sc.board);
      const el = segEl(sc, `
        <nav class="pill" aria-hidden="true">${['search', 'triangle', 'roundedSquare', 'circle', 'diamond', 'star', 'hexagon'].map(k => `<span class="ic">${glyphSvg(k)}</span>`).join('')}</nav>
        <div class="endc">${sigMarkup()}<div class="lm url">${maskLetters(MK.meta.site)}</div>${maskLine(sc.line, 'endline')}</div>
        <svg class="ink" viewBox="0 0 ${W} ${H}"><circle class="ripple r0" r="10"/><circle class="ripple r1" r="10"/><circle class="nib c0" r="9"/><circle class="nib c1" r="9"/></svg>`);

  // Client wall items: the media kit's doctrine — inline SVG reads currentColor, pixel logos are masks.
  const MARKS = { muse: { cls: 'mark-full mark-muse', aria: 'Muse.Bio' }, badvr: { cls: 'mark mark-badvr', aria: null } };

  }

  // ── the command bar's queries ─────────────────────────────────────────

  const QS = SC.filter(s => s.query);

  EVENTS.sort((a, b) => a.t - b.t);

  // ── the glass: hero oval → command bar → hero oval ────────────────────
  const title = SC.find(s => s.type === 'title'), end = SC.find(s => s.type === 'end');

  const EOVAL = { cx: 960, cy: 430, w: 1160, h: 360, rx: 580, ry: 180 };

    { a: end.start + 0.05, b: end.start + 0.75, from: BAR, to: EOVAL, ease: E.inOutExpo },

  function paintGlass(t) {

    const r = {}; for (const f of ['cx', 'cy', 'w', 'h', 'rx', 'ry']) r[f] = lerp(k0.from[f], k0.to[f], k);
    glassEl.style.left = fx(r.cx - r.w / 2) + 'px'; glassEl.style.top = fx(r.cy - r.h / 2) + 'px';
    glassEl.style.width = fx(r.w) + 'px'; glassEl.style.height = fx(r.h) + 'px';

  }
  function paintBar(t) {

    let q = null; for (const x of QUERIES) if (t >= x.t0) q = x;
    let text = '', sel = false, typing = false;
    if (q) {
      let n = 0; while (n < q.times.length && q.times[n] <= t) n++;
      text = q.text.slice(0, n);
      sel = t >= q.clear;
      typing = t < q.typed + 0.2;
    }

    qtEl.classList.toggle('sel', sel);

      const on = x === q;
      x.g.style.display = on ? 'flex' : 'none';

    });
  }
  // The drawn fish's record, read live off the engine: freehand stroke in, structured data out.
  const chipEl = document.getElementById('chip'), chipB = chipEl.querySelector('b'), chipS = chipEl.querySelector('span');
  const leadEl = document.getElementById('chipLead'), leadLine = leadEl.querySelector('line'), leadDot = leadEl.querySelector('circle');
  const OPEN = SC[0];
  function paintChip(t) {
    const v = BIG ? seg(t, OPEN.start + 1.25, 0.3, E.outCubic) * (1 - seg(t, title.end - 0.75, 0.3, E.inCubic)) : 0;
    chipEl.style.opacity = leadEl.style.opacity = v.toFixed(3);
    if (v <= 0) return;
    const x = BIG.x, y = BIG.y + TANK_Y, bw = Math.round(BIG.bodyWidth || 0);
    const cx = x + 58, cy = y + 40;
    chipEl.style.left = fx(cx) + 'px'; chipEl.style.top = fx(cy) + 'px';
    leadLine.setAttribute('x1', fx(x)); leadLine.setAttribute('y1', fx(y));
    leadLine.setAttribute('x2', fx(cx)); leadLine.setAttribute('y2', fx(cy + 12));
    leadDot.setAttribute('cx', fx(x)); leadDot.setAttribute('cy', fx(y));
    const deg = Math.round(((BIG.heading * 180 / Math.PI) % 360 + 360) % 360);
    const pxs = Math.round(Math.hypot(BIG.vx || 0, BIG.vy || 0) * 60);
    chipB.textContent = `fish · ${bw >= 60 ? 'large' : bw >= 35 ? 'medium' : 'small'} · ${bw} px`;

  }
  function paintCamera(t) {
    const k = seg(t, 1.2, 1.1, E.inOutExpo);
    const s = lerp(2.1, 1, k), fxp = lerp(924, 960, k), fyp = lerp(895, 540, k);
    camera.style.transform = k >= 1 ? 'none' : `translate3d(${fx(960 - fxp * s)}px,${fx(540 - fyp * s)}px,0) scale(${s.toFixed(4)})`;
  }

  // ── readiness ─────────────────────────────────────────────────────────
  const ready = (async () => {
    await document.fonts.ready;
    await Promise.all(['200 80px Raleway', '300 40px Raleway', '500 32px Raleway', '500 20px "JetBrains Mono"', '600 20px "JetBrains Mono"']
      .map(f => document.fonts.load(f).catch(() => null)));
    await Promise.all([...stage.querySelectorAll('img')].map(i => i.decode().catch(() => null)));
    await Promise.all(MEDIA.map(({ el }) => el.readyState >= 2 ? null : new Promise(res => {
      el.addEventListener('loadeddata', res, { once: true }); el.addEventListener('error', res, { once: true }); setTimeout(res, 20000);
    })));
    LAYOUT.forEach(f => f());
    scenesEl.classList.remove('measuring');
  })();

  // ── one moment ────────────────────────────────────────────────────────
  let firedT = -1;
  function simulate(t) {                        // the tank's side: events, on every 60 Hz tick
    reelT = t;
    // a rewind regrows the tank from nothing; a hair's floating-point wobble is not a rewind
    if (t < firedT - 1e-6) { tank.clearFish(); tank.state.coral.length = 0; firedT = -1; BIG = null; ATTN.forEach(a => { delete a.side; }); }
    for (const ev of EVENTS) if (ev.t > firedT && ev.t <= t) ev.run();
    firedT = Math.max(firedT, t);              // never backwards, or an event could fire twice
  }
  function paint(t) {                           // the picture's side: a pure function of t
    paintCamera(t); paintGlass(t); paintBar(t); paintChip(t);
    for (const sc of SC) {
      const on = t >= sc.start - 0.02 && t <= sc.end + 0.02;
      sc.el.classList.toggle('on', on);
      if (on) sc.update(t - sc.start, t);
    }
    blackout.style.opacity = (1 - seg(t, 0, 0.35, E.inOutSine)).toFixed(3);
  }
  function seekVideo(v, time) {
    return new Promise(res => { const done = () => { clearTimeout(timer); res(); }; const timer = setTimeout(done, 4000); v.addEventListener('seeked', done, { once: true }); v.currentTime = time; });
  }
  // where a clip should be at reel time t: it runs from `from` at its layer's start, and a looping
  // clip wraps at its own end instead of holding the last frame
  const clipTime = (m, t) => {
    const d = m.el.duration || 1e9, run = Math.max(0, t - m.start);
    return m.loop ? Math.min(m.from + run % Math.max(0.1, d - m.from), d - 0.01) : Math.min(m.from + run, d - 0.05);
  };
  const clipDrift = (m, ct) => {             // how far a playing clip is off, the short way round a loop
    const e = Math.abs(m.el.currentTime - ct), p = (m.el.duration || 1e9) - m.from;
    return m.loop ? Math.min(e, p - e) : e;
  };

  if (RENDER) {
    let ticks = 0;
    MEDIA.forEach(m => m.el.pause());
    window.REEL = {
      duration: DURATION, ready,
      debug: { scenes: SC, tank, queries: QUERIES },
      async frame(t) {
        const want = Math.round(t * 60);
        while (ticks < want) { simulate((ticks + 1) / 60); tank.startAnimation(); CLOCK.tick(STEP); ticks++; }
        simulate(t); paint(t);
        const waits = [];
        for (const m of MEDIA) {
          if (t < m.start - 0.2 || t > m.end + 0.2) continue;
          const ct = clipTime(m, t);
          if (Math.abs(m.el.currentTime - ct) > 1e-4) waits.push(seekVideo(m.el, ct));
        }
        await Promise.all(waits);
      }
    };
    return;
  }

  // ── live mode: the script's preview ───────────────────────────────────
  // The scrub bar carries a tick per scene; [ and ] jump a scene, L loops the one you are on.
  // Where you are (and the loop) ride in the URL's #hash, so saving the script and reloading
  // comes back to the same moment: edit, save, reload is the whole loop.
  try { await ready; } catch (e) { console.error(e); }
  const hud = document.getElementById('hud'), bar = hud.querySelector('.bar'), fill = bar.querySelector('i'), clock = hud.querySelector('.time');
  const sceneEl = hud.querySelector('.scene');
  hud.hidden = false;
  const fit = () => { const s = Math.min(innerWidth / W, innerHeight / H);
    stage.style.transform = `translate(${fx((innerWidth - W * s) / 2)}px,${fx((innerHeight - H * s) / 2)}px) scale(${s.toFixed(5)})`; };
  fit(); addEventListener('resize', fit);
  SC.forEach(sc => { const b = document.createElement('b'); b.style.left = (sc.start / DURATION * 100).toFixed(3) + '%'; bar.appendChild(b); });
  const sceneAt = t => { let s = SC[0]; for (const x of SC) if (t >= x.start - 1e-6) s = x; return s; };
  const HASH = new URLSearchParams(location.hash.slice(1));
  let loopSc = SC[parseInt(HASH.get('loop'), 10)] || null;
  let playing = true, base = performance.now() - (parseFloat(HASH.get('t') || Q.get('t')) || 0) * 1000, held = 0;
  const now = () => playing ? (performance.now() - base) / 1000 : held;
  const seekTo = s => { s = Math.max(0, Math.min(DURATION, s)); if (playing) base = performance.now() - s * 1000; else held = s; };
  const jump = sc => { if (!sc) return; if (loopSc) loopSc = sc; seekTo(sc.start); };
  addEventListener('keydown', e => {
    if (e.key === ' ') { e.preventDefault(); if (playing) { held = now(); playing = false; } else { playing = true; seekTo(held >= DURATION ? 0 : held); } }
    else if (e.key === 'ArrowRight') seekTo(now() + 5);
    else if (e.key === 'ArrowLeft') seekTo(now() - 5);
    else if (e.key === ']') jump(SC[sceneAt(now()).i + 1]);
    else if (e.key === '[') { const t = now(), sc = sceneAt(t); jump(t - sc.start > 0.5 || !sc.i ? sc : SC[sc.i - 1]); }  // like a player: the start first, then the one before
    else if (e.key === 'l' || e.key === 'L') loopSc = loopSc ? null : sceneAt(now());
    else if (e.key === 'r' || e.key === 'R') { playing = true; loopSc = null; seekTo(0); }
  });
  let hashAt = -1, hashLoop = null;
  bar.addEventListener('click', e => { const r = bar.getBoundingClientRect(); seekTo((e.clientX - r.left) / r.width * DURATION); });
  let idle; const wake = () => { hud.classList.remove('idle'); clearTimeout(idle); idle = setTimeout(() => hud.classList.add('idle'), 2200); };
  addEventListener('mousemove', wake); wake();
  (function loop() {
    let t = now();
    if (loopSc && playing && (t >= loopSc.end || t < loopSc.start - 0.05)) { seekTo(loopSc.start); t = loopSc.start; }
    if (t >= DURATION) { t = DURATION; if (playing) { held = t; playing = false; } }
    simulate(t);
    tank.startAnimation();
    paint(t);
    for (const m of MEDIA) {
      const on = t >= m.start - 0.25 && t <= m.end + 0.25;
      if (!on || !playing) { if (!m.el.paused) m.el.pause(); if (!on) continue; }
      const ct = clipTime(m, t);
      if (clipDrift(m, ct) > 0.3) m.el.currentTime = ct;
      if (playing && m.el.paused) m.el.play().catch(() => {});
    }
    fill.style.width = (t / DURATION * 100).toFixed(2) + '%';
    clock.textContent = t.toFixed(1);
    const cur = sceneAt(t), what = cur.query || cur.name || cur.caption || cur.line || '';
    sceneEl.textContent = `${cur.i + 1}/${SC.length} ${cur.type}${what ? ' · ' + what : ''}${loopSc ? ' · looping' : ''}`;
    sceneEl.classList.toggle('loop', !!loopSc);
    if (Math.abs(t - hashAt) >= 0.25 || loopSc !== hashLoop) {   // a few times a second, never a history entry
      history.replaceState(null, '', `#t=${t.toFixed(2)}${loopSc ? '&loop=' + loopSc.i : ''}`);
      hashAt = t; hashLoop = loopSc;
    }
    requestAnimationFrame(loop);
  })();
})().catch(err => {
  const pre = document.createElement('pre'); pre.id = 'err';
  pre.textContent = err && err.errors
    ? 'Assets/sizzle-reel-2.script.txt has ' + err.errors.length + ' mistake' + (err.errors.length > 1 ? 's' : '') + ':\n\n  ' + err.errors.join('\n  ') + '\n\nFix the script and reload. Nothing was drawn.'
    : 'sizzle-reel-2 rig failed: ' + (err && err.stack || err) + '\nCheck Assets/sizzle-reel-2.script.txt (node scripts/reel-script.js check) and reload. Nothing was drawn.';
  document.body.appendChild(pre);
  console.error(err);
});
</script>
