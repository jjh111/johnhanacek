<title>Sizzle reel, cut 2 — render rig</title>
<!-- Unlisted render rig: cut 2 of the sizzle reel. Cut 1 (Assets/sizzle-reel.html, media-kit.json →
     `reel`) is kept as it was; this is the second pass on the same material, exactly 60 s.

     THE EDIT LIVES IN Assets/sizzle-reel-2.script.txt, a plain-text script: every word on screen
     and when it happens (scripts/reel-script.js reads it; `node scripts/reel-script.js check`
     prints its cue sheet). This page only knows how things move. Live, it is the script's
     preview: save the script, reload, and it comes back to the same moment.

     The site's own command bar narrates. The hero oval collapses into the bar, and every section
     is a question a visitor would type — who is john?, what has he shipped?, add 3 small fish and
     2 coral — answered from the same audited copy the search chunks carry. Each question is typed
     over the last one's selection, the way a real bar is used, so no section waits on an empty
     frame. The last answer opens the bar back out into the oval: the reel ends on the site's hero.

     The tank is a fixed band along the bottom of the frame for the whole cut. Fish never share
     space with copy, so no wall ever has to shove one aside; they only arrive when something in
     the story makes them — the opening loop, and the scene-language command, which spawns its fish
     through the engine's real stroke recognizer exactly as the site does.

     Motion vocabulary, one grammar: expo ease-outs that land fast and settle long; a line slides
     up out of its own clip (text) and a picture pushes in from the right inside its own window
     (work); counters roll like an odometer; chips and cards take a small back-overshoot. Every
     value is a pure function of t on a 120 BPM grid.

     Clocks, as in cut 1: live by default (space, ←/→, R, ?t=); ?render=1 hands the renderer a
     virtual clock — node scripts/render-sizzle-reel.mjs --cut=2. -->
<script>
  (function () {
    // The opening pulls back from a 2.1x close-up of the tank. The engine sizes its bitmap by
    // devicePixelRatio, so give it at least 2 and the fish stay sharp while the camera is in close.
    if ((window.devicePixelRatio || 1) < 2) Object.defineProperty(window, 'devicePixelRatio', { get: function () { return 2; }, configurable: true });
    if (!new URLSearchParams(location.search).has('render')) return;
    // The renderer owns the clock: Date.now / performance.now are virtual and rAF queues until the
    // next tick, so the engine simulates at exactly 60 Hz however slow the capture.
    var vt = 0, epoch = Date.UTC(2026, 8, 26), next = 1, queue = new Map();
    Date.now = function () { return epoch + vt; };
    performance.now = function () { return vt; };
    window.requestAnimationFrame = function (cb) { var id = next++; queue.set(id, cb); return id; };
    window.cancelAnimationFrame = function (id) { queue.delete(id); };
    window.__reelClock = {
      now: function () { return vt; },
      tick: function (ms) { vt += ms; var run = Array.from(queue.values()); queue.clear(); for (var i = 0; i < run.length; i++) run[i](vt); }
    };
  })();
</script>

  background: rgba(var(--surface-rgb), 0.6); border: 1px solid rgba(var(--gold-rgb), 0.5); box-shadow: 0 0 60px rgba(var(--gold-rgb), 0.06), 0 30px 80px rgba(0, 0, 0, 0.5);
  display: flex; flex-direction: column; transform-origin: 50% 0; }
.intent .eyebrow { color: var(--gold); margin-bottom: 20px; }
.intent .oh { font: 200 64px/1.12 var(--font-display); color: var(--text-subhead); }
.three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 64px; margin: 34px 0 28px; }
.three > div { position: relative; display: flex; flex-direction: column; gap: 12px; padding-top: 18px; }
.trule { position: absolute; left: 0; right: 0; top: 0; height: 1px; background: rgba(var(--cyan-dim-rgb), 0.45); transform-origin: 0 50%; }
.three .k { font: 500 32px/1 var(--font-display); color: var(--cyan); }
.three .v { font: 500 20px/1.45 var(--font-mono); color: var(--text-primary); }
.intent .cta { margin-top: auto; }

/* ── square and vertical (?format=): one 1080-wide band of type ──
   The geometry lives in FORMATS in the script below; this is only the type. At 1080 wide a frame
   plays on a phone at about a third of its size, so nothing that reads as copy is set under 27 px
   and labels stay at 20 px or more. A line the script authored on one line may wrap here (its
   mask holds the wrapped block and slides it as one); the wide frame never wraps. */
#stage.narrow .tier { width: 42px; height: 42px; }
#stage.narrow .tier svg { width: 24px; height: 24px; }
#stage.narrow .status { font-size: 20px; }
#stage.narrow .eyebrow { font-size: 24px; letter-spacing: 0.18em; }
#stage.narrow .lm.eyebrow, #stage.narrow .lm.ln, #stage.narrow .lm.cite, #stage.narrow .lm.sup, #stage.narrow .lm.qt2, #stage.narrow .lm.qt3,
#stage.narrow .lm.c3, #stage.narrow .lm.aw, #stage.narrow .lm.v, #stage.narrow .lm.endline, #stage.narrow .lm.lab, #stage.narrow .lm.oh { white-space: normal; }
/* wide: a column beside a 1080 px window is 600 px (2026-10-05), and a line of copy that John wrote
   on one line wraps in it, balanced, its mask sliding the block as one (labels shrink instead) */
#stage:not(.narrow) .col .lm.ln, #stage:not(.narrow) .col .lm.qt3, #stage:not(.narrow) .col .lm.aw { white-space: normal; text-wrap: balance; }
#stage.narrow .lm.qt2, #stage.narrow .lm.oh, #stage.narrow .lm.endline, #stage.narrow .lm.cite { text-wrap: balance; }
#stage.narrow .ln.cap { font-size: 30px; }
#stage.narrow .cite { font-size: 28px; line-height: 1.4; }
#stage.narrow .stat .lab { font-size: 22px; }
#stage.narrow .astats { display: grid; grid-template-columns: repeat(4, auto); justify-content: space-between; gap: 32px; }
#stage.narrow .astats .stat { min-width: 0; }
#stage.narrow .lrow .aw { font-size: 28px; }
#stage.narrow .sup { font-size: 30px; }
#stage.narrow .row { height: auto; min-height: 96px; }
#stage.narrow .rtitle { font-size: 36px; }
#stage.narrow .micro { font-size: 27px; }
#stage.narrow .badge, #stage.narrow .wbadge { font-size: 20px; }
#stage.narrow .badge svg, #stage.narrow .wbadge svg { width: 20px; height: 20px; }
#stage.narrow .c3 { font-size: 28px; }
#stage.narrow .plan .ptop { font-size: 22px; }
#stage.narrow .plan .pact { font-size: 26px; }
#stage.narrow .plan .no { font-size: 22px; }
#stage.narrow .name { font-size: 92px; }
#stage.narrow .tag { flex-direction: column; align-items: center; gap: 16px; }
#stage.narrow .tag .dot { display: none; }
#stage.narrow .url { font-size: 80px; }
#stage.narrow .endline { font-size: 30px; line-height: 1.3; text-align: center; letter-spacing: 0.04em; }
#stage.narrow .endc .lm.endline { max-width: 640px; }
#stage.narrow .panel-in { padding: 40px 36px 44px; }
#stage.narrow .grp { font-size: 22px; }
#stage.narrow .wall { flex-wrap: wrap; row-gap: 26px; gap: 26px 56px; }
#stage.narrow .wall.teams { gap: 26px 48px; }
#stage.narrow .wm { font-size: 44px; }
#stage.narrow .wm-svg { height: 40px; }
#stage.narrow .intent { padding: 36px 44px 38px; }
#stage.narrow .three { grid-template-columns: 1fr; gap: 18px; margin: 28px 0 26px; }
#stage.narrow .three > div { display: grid; grid-template-columns: 150px 1fr; column-gap: 24px; align-items: baseline; padding-top: 16px; }
#stage.narrow .three .v { font-size: 28px; line-height: 1.35; }
#stage.narrow .intent .lm.cta { white-space: normal; text-wrap: balance; }   /* a link wider than the card breaks after its arrow */
#stage.narrow .intent > * { flex-shrink: 0; }   /* a masked line never squeezes (it clipped instead): the card measures its copy (offer, LAYOUT) */
#stage.narrow #chip { font-size: 16px; padding: 8px 11px 9px; gap: 4px; }
#stage.narrow .lrow .lm.yr { flex: none; }
#stage.narrow .lm.ln { text-wrap: pretty; }
/* square: the wide split, narrower; vertical: the split stacked, so the type can be larger */
#stage.square .hl { font-size: 64px; }
#stage.square .ln, #stage.square .ln.cap { font-size: 28px; }
#stage.square .ans { font-size: 70px; }
#stage.square .stat .num { font-size: 80px; }
#stage.square .col .stat .num { font-size: 72px; }
#stage.square .qt3 { font-size: 48px; }
#stage.square .qt2 { font-size: 54px; }
#stage.square .qt2.big { font-size: 62px; }
#stage.square .intent { padding: 30px 40px 32px; }
#stage.square .intent .eyebrow { margin-bottom: 16px; }
#stage.square .intent .oh { font-size: 46px; }
#stage.square .three { gap: 14px; margin: 22px 0 20px; }
#stage.square .three .v { line-height: 1.3; }
#stage.vertical #bar .q { font-size: 44px; }
#stage.vertical #bar .caret { height: 48px; }
#stage.vertical .status { font-size: 22px; }
#stage.vertical .eyebrow { font-size: 26px; }
#stage.vertical .hl { font-size: 96px; }
#stage.vertical .ln, #stage.vertical .ln.cap { font-size: 34px; }
#stage.vertical .cite { font-size: 30px; }
#stage.vertical .qt3 { font-size: 64px; }
#stage.vertical .ans { font-size: 88px; }   /* "Meets Structured Data." in the 936 px band (at 90 its period was cut by 2 px) */
#stage.vertical .sup { font-size: 34px; }
#stage.vertical .stat .num { font-size: 110px; }
#stage.vertical .col .stat .num { font-size: 96px; }
#stage.vertical .stat .lab { font-size: 24px; }
#stage.vertical .lrow .yr { font-size: 42px; }
#stage.vertical .lrow .aw { font-size: 30px; }
#stage.vertical .c3 { font-size: 30px; }
#stage.vertical .rtitle { font-size: 40px; }
#stage.vertical .qt2 { font-size: 64px; }
#stage.vertical .qt2.big { font-size: 80px; }
#stage.vertical .plan { padding: 36px 44px 40px; }
#stage.vertical .plan .ptop { font-size: 26px; }
#stage.vertical .plan .prow { font-size: 60px; gap: 26px; margin-top: 30px; }
#stage.vertical .plan .prow svg { width: 60px; height: 60px; }
#stage.vertical .plan .prow .ck { font-size: 38px; }
#stage.vertical .plan .pact { font-size: 30px; margin-top: 40px; }
#stage.vertical .plan .no { font-size: 26px; }
#stage.vertical .panel .eyebrow { font-size: 28px; }
#stage.vertical .grp { font-size: 26px; }
#stage.vertical .wm { font-size: 50px; min-height: 58px; }
#stage.vertical .wall, #stage.vertical .wall.teams { gap: 28px 44px; }
#stage.vertical .wm-svg { height: 46px; }
#stage.vertical .intent .oh { font-size: 66px; }
#stage.vertical .three .k { font-size: 40px; }
#stage.vertical .three .v { font-size: 32px; }
#stage.vertical .three > div { grid-template-columns: 180px 1fr; }
#stage.vertical .intent .cta { font-size: 34px; }
#stage.vertical .name { font-size: 100px; }
#stage.vertical .tag { font-size: 30px; }
#stage.vertical .url { font-size: 84px; }
#stage.vertical .endline { font-size: 34px; }

/* live-mode controls (never in a render) */
/* z 55: above the timeline (50), so the More menu opens over it; under the synth rack (60) and the dialogs */
#hud { position: fixed; left: 0; right: 0; bottom: 0; z-index: 55; padding: 10px 16px 12px; display: flex; gap: 14px; align-items: center;
  font: 500 12px/1 var(--font-mono); letter-spacing: 0.08em; color: var(--ink-faint);
  background: linear-gradient(to top, rgba(0, 0, 0, 0.78), rgba(0, 0, 0, 0.35) 70%, transparent); transition: opacity 0.4s; }
#hud[hidden] { display: none; }
#hud.idle:not(:hover):not(:focus-within) { opacity: 0; }
/* every key is also a button: the transport on the left, the tools (timeline, synths, export) on the right */
#hud button { font: 500 11px/1 var(--font-mono); letter-spacing: 0.04em; color: var(--text-bright); background: rgba(var(--cyan-dim-rgb), 0.08);
  border: 1px solid rgba(var(--cyan-dim-rgb), 0.32); border-radius: 6px; height: 30px; min-width: 30px; padding: 0 9px;
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer; white-space: nowrap; }
#hud button:hover, #hud button:focus-visible { border-color: var(--gold); color: var(--gold); outline: none; }
#hud button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); background: rgba(var(--gold-rgb), 0.12); }
#hud button svg { width: 14px; height: 14px; flex: none; }
#hud .tp { display: flex; gap: 4px; flex: none; }
#hud .tp .pp { min-width: 42px; }
#hud .pp .i-play, #hud .pp.paused .i-pause { display: none; }
#hud .pp.paused .i-play { display: block; }
#hud .tools { display: flex; gap: 6px; align-items: center; flex: none; }
#hud .tools .go { border-color: rgba(var(--gold-rgb), 0.6); color: var(--gold); }
/* The collapse rule (REEL_UI.fit): buttons never shrink; while the HUD overflows it takes these
   steps in order, each on top of the last. Nothing is lost: labels live on in tooltips, and the
   seek buttons move into the More menu. */
#hud button, #hud .time { flex: none; }
#hud .bar { flex: 1 1 auto; min-width: 72px; }
#hud .more, #hud .menu[hidden] { display: none; }
#hud.fit-kbd .tools kbd { display: none; }
#hud.fit-tools .tools .rl { display: none; }
#hud.fit-tools .tools button { padding: 0 8px; }
#hud.fit-scene .scene { display: none; }
#hud.fit-seek .tp [data-do="restart"], #hud.fit-seek .tp [data-do="back"], #hud.fit-seek .tp [data-do="fwd"] { display: none; }
#hud.fit-seek .more { display: inline-flex; }
#hud.fit-time .time { display: none; }
#hud.fit-wrap { flex-wrap: wrap; row-gap: 8px; }
#hud.fit-wrap .bar { order: -1; flex: 1 0 100%; }
#hud .menu { position: absolute; left: 16px; bottom: calc(100% + 6px); display: grid; gap: 4px; padding: 6px; border-radius: 10px; min-width: 230px;
  background: rgba(var(--surface-rgb), 0.97); border: 1px solid rgba(var(--cyan-dim-rgb), 0.4); box-shadow: 0 10px 30px var(--elevation); }
#hud .menu button { justify-content: flex-start; width: 100%; gap: 10px; }
#hud .menu button span:not(.n) { flex: 1; text-align: left; }
#hud .menu .n { min-width: 3ch; color: var(--ink-quiet); }
#hud kbd { font: 500 10px/1 var(--font-mono); color: var(--ink-faint); border: 1px solid rgba(var(--cyan-dim-rgb), 0.3); border-radius: 3px; padding: 2px 4px; }
#hud button:hover kbd { color: inherit; }
#hud .bar { flex: 1; height: 3px; background: rgba(var(--cyan-dim-rgb), 0.18); border-radius: 2px; cursor: pointer; position: relative; }
#hud .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--cyan-dim); border-radius: 2px; }
#hud .time { color: var(--cyan); min-width: 7ch; }
#hud .bar b { position: absolute; top: -4px; bottom: -4px; width: 1px; background: var(--ink-faint); pointer-events: none; }
#hud .scene { color: var(--ink-quiet); flex: 0 1 36ch; min-width: 6ch; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#hud .scene.loop { color: var(--gold); }
#err { position: fixed; inset: 0; margin: 0; padding: 20px; color: #ff6b6b; font: 14px/1.5 monospace; background: #000; white-space: pre-wrap; }
#boot { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: 90vw; text-align: center;
  font: 500 13px/1.5 var(--font-mono); letter-spacing: 0.08em; color: var(--ink-quiet); }
</style>
</head>

<script>
(async function () {
  'use strict';
  const Q = new URLSearchParams(location.search);

  // ── formats: one script, three frames ─────────────────────────────────
  // ?format=wide|square|vertical. Every rect the scenes use comes from this one table; the type
  // for the two narrow frames is in the stylesheet (#stage.narrow, .square, .vertical). Wide is

          const tin = ROW_IN + M.a(i * 0.06), tout = LIST - M.l(0.1) + M.l(i * 0.03);
          if (i > 0) pop(thumbs[i], lt, tin, tout, { from: 0.9, rise: 18 }); else thumbs[0].style.opacity = 0;
          lines(metaLines[i], lt, tin + M.a(0.04), tout, { stagger: 0.04, dur: 0.5, durOut: 0.22, staggerOut: 0.02 });
        });
        // the window: pops in as row 1's thumbnail, dives out of it to full size, then holds
        const kd = seg(t, starts[0] - M.a(0.1), M.a(0.62), M.eio(E.inOutExpo));
        place(win, rectAt(THUMB, WIN, kd));
        win.style.borderRadius = fx(lerp(9, 16, kd)) + 'px';
        if (t < starts[0] - M.a(0.1)) pop(win, lt, ROW_IN, null, { from: 0.9, rise: 18 });
        else {
          const b = seg(t, OUT, M.l(0.3), M.eo(E.inCubic));
          win.style.visibility = b >= 1 ? 'hidden' : '';
          win.style.opacity = (1 - b).toFixed(3);
          win.style.transform = `scale(${(1 - 0.05 * b).toFixed(4)})`;
        }
        // panes: the next result covers the last, which slips a third of the way left and darkens
        paneEls.forEach((p, i) => {
          const kin = i === 0 ? 1 : seg(t, starts[i] - PUSH / 2, PUSH, M.eio(E.inOutExpo));
          const kout = i < items.length - 1 ? seg(t, starts[i + 1] - PUSH / 2, PUSH, M.eio(E.inOutExpo)) : 0;
          const vis = kin > 0 && kout < 1;
          p.style.visibility = vis ? '' : 'hidden';
          if (!vis) return;
          p.style.transform = `translate3d(${fx((1 - kin) * 100 - kout * 32)}%,0,0)`;
          shades[i].style.opacity = (kout * 0.75).toFixed(3);
          layers[i].forEach(({ b, j, L }) => L.update(t, comeIn(b, j, t, starts[i] + b.at, M)));
          pop(badges[i], t, i === 0 ? starts[0] + M.a(0.5) : starts[i] + M.a(0.25), null, { from: 0.8, rise: 0 });
        });
        // columns: out just before the push, in just after it
        cols.forEach((c, i) => motions[i](t, i === 0 ? starts[0] + M.a(0.3) : starts[i] + M.a(0.3), i < items.length - 1 ? ends[i] - M.l(0.32) : OUT));
        // the pager rolls to the next result number on every push
        let n = 0; for (let i = 1; i < items.length; i++) n += seg(t, starts[i] - M.a(0.1), M.a(0.45), M.ei(E.outExpo));
        pgStrip.style.transform = `translate3d(0,${fx(-n)}em,0)`;
        pg.style.opacity = (seg(t, starts[0] + M.a(0.3), M.a(0.25)) * (1 - seg(t, OUT, M.l(0.2)))).toFixed(3);
      };
    },

    feature(sc, q) {
      const R = F.feature.win, FC = F.feature.col;
      const el = segEl(sc, `<div class="win" style="left:${R.x}px;top:${R.y}px;width:${R.w}px;height:${R.h}px"><div class="media"></div>
          <div class="cap3"><div class="slot">${sc.beats.filter(b => b.caption).map(b => maskLine(b.caption, 'c3', tagOf(b, 'caption'))).join('')}</div></div>${pageBadge(sc)}</div>${columnMarkup(sc, FC.x, FC.w, ownerOf(sc))}`);
      const win = el.querySelector('.win'), media = win.querySelector('.media'), col = el.querySelector('.col');

      const M = sc.motion, IN = q.enter + cue(sc, 'in'), OUT = sc.end - cue(sc, 'out');   // cues in / out

      const vis = sc.beats.filter(b => b.video || b.img);
      const layers = vis.map((b, j) => mediaLayer(media, b, j === 0 ? IN - 0.1 : sc.start + b.at, vis[j + 1] ? sc.start + vis[j + 1].at + Math.max(0.4, M.a(0.35) + 0.05) : sc.end + 0.2));

        win.style.visibility = a <= 0 || b >= 1 ? 'hidden' : '';

        layers.forEach((L, j) => L.update(t, comeIn(vis[j], j, t, sc.start + vis[j].at, M)));
        caps.forEach((c, i) => {                // (a beat with no caption of its own keeps the one before)
          const nb = capBeats[i + 1];
          lines([c], t, i === 0 ? IN + M.a(0.45) : sc.start + capBeats[i].at + M.a(0.15), nb ? sc.start + nb.at - M.l(0.25) : OUT - M.l(0.05));
        });
        pop(badge, t, IN + M.a(0.4), OUT - M.l(0.05), { from: 0.8, rise: 0 });
        motion(t, IN + M.a(0.1), OUT);

    command(sc, q) {                             // scene language: a typed sentence becomes a school
      const G = JHStrokes.points;
      const icon = k => `<svg viewBox="0 0 24 24">${JHStrokes.marks[k === 'square' ? 'square' : 'loop']()}</svg>`;
      // where the command's strokes land: four medium loops left of the card, clear of the big fish
      // (it watches the card from the right, coming from the art); two wide boxes along the floor
      const FISH = F.command.fish, CORAL = F.command.coral, PW = F.plan ? F.plan.w : 700;
      const strokes = FISH.map(([x, y]) => ({ pts: G.loop(x, y, 1.0), kind: 'fish' }))
        .concat(CORAL.map(([x, y, w, h]) => ({ pts: G.rect(x, y, w, h), kind: 'coral' })));   // wide low boxes: coral beds along the floor
      const rowOf = strokes.map(s => sc.plan.findIndex(p => (p.glyph === 'square') === (s.kind === 'coral')));
      const strip = '0123456789'.split('').map(d => `<i>${d}</i>`).join('');
      const el = segEl(sc, `
        <div class="plan" style="left:${CX - PW / 2}px${F.plan ? ';width:' + PW + 'px' : ''}">
          <div class="ptop"><span class="pts">${maskLine('Plan', 'p1')}${maskLine('Receipt', 'p2')}</span><span class="lang">scene language</span></div>
          ${sc.plan.map(p => `<div class="prow">${icon(p.glyph)}<span class="cnt">${maskLine(`<b>${p.n}</b> ×`, 'pl')}${maskLine(`<b><span class="od"><span class="ods">${strip}</span></span></b>/${p.n}`, 'rc')}</span>${maskLine(p.what, 'what', tagOf(ownerOf(sc), 'plan', sc.plan.indexOf(p), 'what'))}${maskLine('✓', 'ck')}</div>`).join('')}
          <div class="pact">${maskLine('<span class="go">Make it</span><span class="no">cancel</span>', 'pa')}${maskLine(`<span class="ok">✓</span> built · ${sc.receipt}`, 'pb')}</div></div>
        ${inkSvg(`${strokes.map(s => `<path d="${s.kind === 'fish' ? smooth(s.pts) : closedPath(s.pts)}"/>`).join('')}
          <circle class="ripple" r="10"/><circle class="nib cur" r="9"/>`)}`);
      const plan = el.querySelector('.plan'), go = el.querySelector('.go');
      const [p1] = inner(el, '.p1'), [p2] = inner(el, '.p2'), [pa] = inner(el, '.pa'), [pb] = inner(el, '.pb');
      const prows = [...el.querySelectorAll('.prow')].map(r => ({ icon: r.querySelector('svg'), pl: inner(r, '.pl'), rc: inner(r, '.rc'), what: inner(r, '.what'), ck: inner(r, '.ck'), ods: r.querySelector('.ods') }));
      const paths = [...el.querySelectorAll('.ink path')], lens = paths.map(p => p.getTotalLength());
      paths.forEach((p, i) => { p.style.strokeDasharray = `${lens[i]} ${lens[i]}`; });
      const cur = el.querySelector('.cur'), ripple = el.querySelector('.ripple');
      const M = sc.motion, IN = q.enter - sc.start + cue(sc, 'in'), TAP = IN + M.a(0.75), GO = { x: 0, y: 0 };   // cue in: the plan card
      LAYOUT.push(() => { plan.style.top = (COL_Y - plan.offsetHeight / 2) + 'px'; });
      LAYOUT.push(() => { const b = box(go); GO.x = b.x + b.w / 2; GO.y = b.y + b.h / 2; });
      const draw = strokes.map((s, i) => ({ a: TAP + 0.15 + i * 0.1, d: s.kind === 'fish' ? 0.2 : 0.24 }));
      const born = draw.map(dd => dd.a + dd.d);
      draw.forEach((dd, i) => at(sc.start + born[i], () => spawnStroke(strokes[i].pts, strokes[i].kind, strokes[i].kind === 'fish' ? Math.PI : null), `spawn ${strokes[i].kind} ${i}`));
      BORN.school = sc.start + Math.min(...born.filter((b, i) => strokes[i].kind === 'fish'));
      look(sc.start + IN, sc.end, CX, COL_Y, 1, 'the plan');   // from the right, whatever the frame: the school is born on the left
      const DONE = Math.max(...born), OUT = sc.dur - cue(sc, 'out');   // cue out
      return (lt) => {
        pop(plan, lt, IN, OUT, { from: 0.94, rise: 16 });
        // Plan → Receipt: the header, each count and the action row all turn over on the tap
        lines([p1], lt, IN + M.a(0.08), TAP + 0.05, { durOut: 0.22 });
        lines([p2], lt, TAP + 0.16, OUT);
        prows.forEach((x, i) => {
          fade(x.icon, lt, IN + M.a(0.12) + M.a(i * 0.07), 0.3, OUT, 0.2);
          lines(x.pl, lt, IN + M.a(0.14) + M.a(i * 0.07), TAP + 0.05 + i * 0.04, { durOut: 0.2 });
          lines(x.what, lt, IN + M.a(0.18) + M.a(i * 0.07), OUT);
          lines(x.rc, lt, TAP + 0.14 + i * 0.05, OUT);
          // the count rolls as each of this row's strokes becomes a living thing in the tank
          let c = 0; born.forEach((b, s) => { if (rowOf[s] === i) c += E.outExpo(seg(lt, b, 0.3)); });
          x.ods.style.transform = `translate3d(0,${fx(-c)}em,0)`;
          lines(x.ck, lt, Math.max(...born.filter((b, s) => rowOf[s] === i)) + 0.2, OUT, { dur: 0.45 });
        });
        lines([pa], lt, IN + M.a(0.3), TAP + 0.1, { durOut: 0.2 });
        lines([pb], lt, DONE + 0.25, OUT);
        // the cursor comes in from below right, taps Make it, and goes
        const m = seg(lt, TAP - 0.4, 0.38, E.outExpo);
        cur.setAttribute('cx', fx(lerp(GO.x + 170, GO.x, m))); cur.setAttribute('cy', fx(lerp(GO.y + 120, GO.y, m)));
        cur.style.opacity = (seg(lt, TAP - 0.4, 0.15) * (1 - seg(lt, TAP + 0.15, 0.2))).toFixed(3);
        const rp = seg(lt, TAP, 0.45, E.outCubic);
        ripple.setAttribute('cx', fx(GO.x)); ripple.setAttribute('cy', fx(GO.y)); ripple.setAttribute('r', fx(8 + rp * 46));
        ripple.style.opacity = (lt >= TAP ? 1 - rp : 0).toFixed(3);
        go.style.transform = `scale(${(1 - 0.06 * Math.sin(Math.PI * seg(lt, TAP - 0.04, 0.2))).toFixed(4)})`;
        // the recognizer's strokes, fast, then gone into what they became
        paths.forEach((p, i) => {
          const k = seg(lt, draw[i].a, draw[i].d, E.inOutCubic);
          p.style.strokeDashoffset = fx(lens[i] * (1 - k));
          p.style.opacity = (k > 0 ? 1 - seg(lt, born[i], 0.35) : 0).toFixed(3);
        });
      };
    },

        layers.forEach((L, j) => L.update(t, comeIn(sc.beats[j], j, t, sc.start + sc.beats[j].at, M)));
        pop(badge, t, IN + M.a(0.45), OUT, { from: 0.8, rise: 0 });

    end(sc) {
      const bd = boardNamed(sc.board);
      const el = segEl(sc, `
        <nav class="pill" aria-hidden="true">${['search', 'triangle', 'roundedSquare', 'circle', 'diamond', 'star', 'hexagon'].map(k => `<span class="ic">${glyphSvg(k)}</span>`).join('')}</nav>

    b.onclick = () => { try { sessionStorage.removeItem(window.__reelDraft); } catch (e) { /* ok */ } location.reload(); };
    pre.appendChild(b);
  }
  document.body.appendChild(pre);
  console.error(err);
});
</script>
</body>
</html>
