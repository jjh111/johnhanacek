<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Hypercube (2015) — ported to p5</title>
    <meta name="description" content="John Hanacek's 2015 Processing hypercube, ported to p5.js. Move the pointer: its quadrant picks which of the six 4D rotation planes advance. Click or tap to rebuild.">

    <link rel="icon" type="image/png" href="../../../../Assets/favicon-jhsigfrmpaper.png">

    <!-- The site's design tokens, for the palette only — no chrome, no nav.
         jh-chrome.css carries no bare element selectors, so it is safe to drop
         into a page like this one that has a visual language of its own. -->
    <link rel="stylesheet" href="../../../../styles/jh-chrome.css">

    <!-- p5 0.5.14, the copy that actually lives in CreativeCODE2016/ and the
         generation contemporary with these sketches. Same relative path the
         four sibling sketches were repaired onto on 2026-09-10 — no CDN, so
         this folder keeps working offline and forever.
         p5.dom and p5.sound are deliberately NOT loaded: this sketch uses
         neither, and p5.sound logs an AudioContext failure on a machine with
         no audio device. -->
    <script src="../p5.min.js" type="text/javascript"></script>
    <script src="port.js" type="text/javascript"></script>

    <style>
      html, body {
        padding: 0;
        margin: 0;
        overflow: hidden;              /* the canvas IS the page */
        background: var(--sea-deep, #020a12);
      }
      canvas {
        display: block;
        vertical-align: top;           /* kill the inline descender gap */
        touch-action: none;            /* nothing on this page scrolls, so this
                                          traps no gesture — it only stops the
                                          rubber-band from eating a drag */
      }
      .caption {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
        text-align: center;
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        line-height: 1.5;
        letter-spacing: 0.02em;
        color: var(--ink-faint, #86bccf);
        z-index: 2;                    /* p5 appends its canvas after this node */
        pointer-events: none;          /* the canvas is the whole surface */
      }
      @media (max-width: 560px) {
        .caption { font-size: 10px; }
      }
    </style>
  </head>
  <body>
    <p class="caption">Hypercube (2015) — the Processing original, ported to p5 in 2026. The unfinished 2015 hand-port sits beside it.</p>
  </body>
</html>
