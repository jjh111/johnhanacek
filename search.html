<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search — John Hanacek</title>
    <meta name="description" content="AI-powered search across John Hanacek's portfolio — projects, skills, services, and more. Instant keyword search with optional LLM answers.">

    <link rel="icon" type="image/png" href="./Assets/favicon-jhsigfrmpaper.png">

    <meta property="og:title" content="Search — John Hanacek">
    <meta property="og:description" content="AI-powered search across John Hanacek's portfolio — projects, skills, services, and more.">
    <meta property="og:image" content="https://www.johnhanacek.com/Assets/socialgraph-jhcom.webp">
    <meta property="og:url" content="https://www.johnhanacek.com/search.html">
    <link rel="canonical" href="https://www.johnhanacek.com/search.html">
    <meta property="og:type" content="website">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Search — John Hanacek">
    <meta name="twitter:description" content="AI-powered search across John Hanacek's portfolio.">
    <meta name="twitter:image" content="https://www.johnhanacek.com/Assets/socialgraph-jhcom.webp">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100;200;300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles/jh-chrome.css?v=1.83">
    <link rel="stylesheet" href="./styles/shared.css?v=1.83">
    <link rel="stylesheet" href="./scripts/search-overlay.css?v=1.83">

    <link rel="alternate" type="application/json" href="./john-hanacek.json" title="Structured data">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "SearchResultsPage",
        "name": "Search — John Hanacek Portfolio",
        "url": "https://www.johnhanacek.com/search.html",
        "mainEntity": {
            "@type": "WebSite",
            "name": "John Hanacek Portfolio",
            "url": "https://www.johnhanacek.com",
            "potentialAction": {
                "@type": "SearchAction",
                "target": "https://www.johnhanacek.com/search.html?q={search_term_string}",
                "query-input": "required name=search_term_string"
            }
        }
    }
    </script>
    <style>
        :root {
            --sea-deep: #020a12;
            --sea-mid: #0a1628;
            --cyan: #7dd8f7;
            --cyan-dim: #4dc9f6;
            --gold: #d4af37;
            --text-primary: #a8d0e4;
            --text-bright: #d8edf8;
            --text-heading: #7dd8f7;
            --muted: #6a90a4;
            --border: rgba(var(--cyan-dim-rgb, 77, 201, 246), 0.15);
            --border-hover: rgba(var(--cyan-dim-rgb, 77, 201, 246), 0.3);
            --engine-browser: #4dc9f6;
            --engine-lmstudio: #c084fc;
            --engine-ollama: #fb923c;
            --engine-custom: #4ade80;
            --engine-color: var(--muted); /* set dynamically */
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            line-height: 1.6;
            background: var(--sea-deep);
            color: var(--text-bright);
            -webkit-font-smoothing: antialiased;
            padding-top: 0;
        }

        #nav { opacity: 1; transform: none; pointer-events: auto; }

        footer { margin-top: var(--space-xl, 2.5rem); }

        .search-wrap {
            position: sticky;
            top: calc(40px + env(safe-area-inset-top));
            z-index: 300;
            max-width: 660px;
            margin: 0 auto;
            padding: 2.2rem 1.5rem 0.7rem;
            background: rgba(var(--surface-rgb, 2, 10, 18), 0.92);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(var(--cyan-dim-rgb, 77, 201, 246), 0.08);
        }
        .engine-bar {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-bottom: 0.35rem;
            position: relative;
            min-height: 1.4rem;
            z-index: 200;
        }
        .engine-model-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            color: var(--engine-color, var(--text-primary));
            font-weight: 500;
        }
        .engine-source-badge {
            display: inline-block;
            font-size: 0.65rem;
            padding: 0.1rem 0.4rem;
            border-radius: 2px;
            font-weight: 500;
        }
        .engine-source-badge.lmstudio { background: rgba(192, 132, 252, 0.12); color: var(--engine-lmstudio); }
        .engine-source-badge.ollama { background: rgba(251, 146, 60, 0.12); color: var(--engine-ollama); }
        .engine-source-badge.browser { background: rgba(var(--cyan-dim-rgb, 77, 201, 246), 0.12); color: var(--engine-browser); }
        .engine-source-badge.custom { background: rgba(74, 222, 128, 0.12); color: var(--engine-custom); }
        .engine-source-badge.none { background: rgba(var(--ink-rgb, 140, 184, 204), 0.08); color: rgba(var(--ink-rgb, 140, 184, 204), 0.6); }

        .status-dot {
            display: inline-block;
            width: 7px; height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .status-dot.off { background: rgba(var(--ink-rgb, 140, 184, 204), 0.25); }
        .status-dot.loading { background: var(--gold); animation: pulse-dot 1s infinite; }
        .status-dot.ready { background: var(--engine-color, #22c55e); }
        @keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

        .engine-info-btn {
            background: none; border: none; cursor: pointer;
            color: var(--muted); opacity: 0.5;
            padding: 0.35rem; border-radius: 3px;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.15s;
            margin-left: auto;
        }
        .engine-info-btn:hover { opacity: 1; }
        .engine-popover {
            display: none;
            position: absolute;
            top: calc(100% + 0.3rem);
            right: 0;
            background: var(--sea-mid);
            border: 1px solid var(--border-hover);
            border-radius: 6px;
            padding: 0.65rem 0.85rem;
            min-width: 260px;
            z-index: 100;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
        }
        .engine-popover.open { display: block; }

        .popover-section {
            padding: 0.45rem 0.55rem;
            border-radius: 4px;
            margin-bottom: 0.35rem;
            border: 1px solid transparent;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
        }
        .popover-section:last-child { margin-bottom: 0; }
        .popover-section:hover { border-color: rgba(var(--cyan-dim-rgb, 77, 201, 246), 0.1); }
        .popover-section.active { border-color: var(--section-color, rgba(var(--cyan-dim-rgb, 77, 201, 246), 0.25)); background: rgba(var(--ink-rgb, 140, 184, 204), 0.04); }
        .popover-section.disabled { opacity: 0.4; cursor: default; }
        .popover-section-header {
            display: flex; align-items: center; gap: 0.35rem; margin-bottom: 0.1rem;
        }
        .popover-radio {
            width: 8px; height: 8px; border-radius: 50%;
            border: 1.5px solid var(--muted); flex-shrink: 0;
        }
        .popover-section.active .popover-radio {
            border-color: var(--section-color, var(--cyan-dim)); background: var(--section-color, var(--cyan-dim));
        }
        .popover-section-name { font-size: 0.78rem; font-weight: 500; color: var(--text-bright); }
        .popover-section-badge {
            font-size: 0.58rem; padding: 0.06rem 0.3rem;
            border-radius: 2px; margin-left: auto; font-weight: 500;
        }
        .popover-section-detail { font-size: 0.65rem; color: var(--text-primary); margin-left: 1.15rem; }

        #localModelSection { display: none; }
        #localModelSection.detected { display: flex; flex-direction: column; }
        .badge-lmstudio { background: rgba(192, 132, 252, 0.12); color: var(--engine-lmstudio); }
        .badge-ollama { background: rgba(251, 146, 60, 0.12); color: var(--engine-ollama); }
        .badge-browser { background: rgba(var(--cyan-dim-rgb, 77, 201, 246), 0.12); color: var(--engine-browser); }
        .badge-webgpu { background: rgba(var(--cyan-dim-rgb, 77, 201, 246), 0.08); color: var(--engine-browser); }
        .badge-custom { background: rgba(74, 222, 128, 0.12); color: var(--engine-custom); }

        #enableBtn,
        #detectLocalBtn {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.62rem;
            background: rgba(var(--cyan-dim-rgb, 77, 201, 246), 0.08);
            color: var(--cyan-dim);
            border: 1px solid rgba(var(--cyan-dim-rgb, 77, 201, 246), 0.12);
            padding: 0.22rem 0.5rem;
            border-radius: 3px; cursor: pointer;
            transition: all 0.15s;
            width: 100%; margin-top: 0.2rem; margin-left: 1.15rem;
            width: calc(100% - 1.15rem);
        }
        #enableBtn:hover ,
        #detectLocalBtn:hover { background: rgba(var(--cyan-dim-rgb, 77, 201, 246), 0.14); border-color: rgba(var(--cyan-dim-rgb, 77, 201, 246), 0.25); }
        #enableBtn:disabled ,
        #detectLocalBtn:disabled { opacity: 0.3; cursor: default; }
        #enableBtn.cached { background: rgba(34, 197, 94, 0.05); border-color: rgba(34, 197, 94, 0.12); color: var(--engine-custom, #4ade80); }
        #enableBtn.cached:hover { background: rgba(34, 197, 94, 0.1); }
        #enableBtn.model-active,
        #detectLocalBtn.model-active { background: rgba(34, 197, 94, 0.06); border-color: rgba(34, 197, 94, 0.12); color: var(--engine-custom, #4ade80); cursor: default; }
        .cache-hint { font-size: 0.55rem; color: var(--muted); margin-top: 0.08rem; opacity: 0.6; margin-left: 1.15rem; }
        #progress { font-size: 0.58rem; color: var(--muted); margin-top: 0.1rem; margin-left: 1.15rem; }
        #progressBar { width: calc(100% - 1.15rem); height: 2px; background: rgba(var(--panel-rgb, 10, 22, 40),0.4); border-radius: 1px; margin-top: 0.1rem; display: none; margin-left: 1.15rem; }
        #progressFill { height: 100%; background: var(--cyan-dim); border-radius: 1px; width: 0%; transition: width 0.3s; }

        .custom-endpoint-input {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem; width: 100%;
            background: rgba(var(--panel-rgb, 10, 22, 40), 0.5);
            color: var(--text-bright);
            border: 1px solid rgba(var(--cyan-dim-rgb, 77, 201, 246), 0.1);
            border-radius: 3px;
            padding: 0.2rem 0.4rem;
            outline: none; margin-top: 0.2rem; margin-left: 1.15rem;
            width: calc(100% - 1.15rem);
            transition: border-color 0.15s;
        }
        .custom-endpoint-input:focus { border-color: rgba(var(--cyan-dim-rgb, 77, 201, 246), 0.3); }
        .custom-endpoint-input::placeholder { color: var(--muted); opacity: 0.5; }

        .search-input-wrap { position: relative; }
        #searchInput {
            width: 100%;
            padding: 0.75rem 2.8rem 0.75rem 1rem;
            font-family: 'Raleway', sans-serif;
            font-size: 1.1rem;
            font-weight: 300;
            background: rgba(var(--panel-rgb, 10, 22, 40), 0.55);
            color: var(--text-bright);
            border: 1px solid var(--border);
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        #searchInput:focus {
            border-color: rgba(var(--cyan-dim-rgb, 77, 201, 246), 0.35);
            box-shadow: 0 0 0 3px rgba(var(--cyan-dim-rgb, 77, 201, 246), 0.07);
        }
        #searchInput::placeholder { color: var(--muted); opacity: 0.65; }
        .clear-btn {
            position: absolute; right: 0.6rem; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: var(--muted); cursor: pointer;
            font-size: 1.1rem; padding: 0.2rem 0.35rem; border-radius: 3px;
            display: none; line-height: 1; opacity: 0.5; transition: opacity 0.15s;
        }
        .clear-btn:hover { opacity: 1; color: var(--text-bright); }

        /* Answer + results live OUTSIDE .search-wrap in the markup — pin
           them to the same 660px column or they bleed to the viewport edge */
        .ai-answer-wrap { position: relative; margin: 0.6rem auto 0; max-width: 660px; padding: 0 1.5rem; }
        #aiAnswer {
            display: none;
            padding: 0.8rem 1rem;
            background: rgba(255, 255, 255, 0.015);
            border-left: 2px solid var(--engine-color, var(--gold));
            border-radius: 0 5px 5px 0;
            font-size: 0.88rem;
            font-weight: 400;
            line-height: 1.7;
            color: var(--text-bright);
            white-space: pre-wrap;
            padding-right: 3.5rem;
        }
        #aiAnswer[data-model]::after {
            content: attr(data-model);
            display: block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            color: var(--engine-color, var(--text-primary));
            text-align: right;
            margin-top: 0.4rem;
            opacity: 0.8;
        }
        #aiAnswer.generating { border-left-color: var(--engine-color, var(--cyan-dim)); }
        #aiAnswer.generating::after { display: none; }

        .thinking-spinner { color: var(--cyan-dim); font-style: italic; font-size: 0.88rem; }
        .thinking-spinner::after { content: ''; animation: dots 1.5s infinite; }
        @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }

        .ai-actions {
            position: absolute; top: 0.5rem; right: 0.5rem;
            display: none; gap: 0.2rem;
        }
        .ai-actions.visible { display: flex; }
        .ai-action-btn {
            background: rgba(var(--panel-rgb, 10, 22, 40), 0.6); border: 1px solid rgba(var(--cyan-dim-rgb, 77, 201, 246), 0.1);
            color: var(--muted); cursor: pointer;
            width: 28px; height: 28px; border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            opacity: 0.4; transition: all 0.15s; position: relative;
        }
        .ai-action-btn:hover { opacity: 1; border-color: var(--border-hover); color: var(--text-bright); }
        .ai-action-btn.copied::after, .ai-action-btn.linked::after {
            content: 'Copied!';
            position: absolute; top: -1.6rem; left: 50%; transform: translateX(-50%);
            font-family: 'JetBrains Mono', monospace; font-size: 0.55rem; color: var(--engine-custom, #4ade80);
            white-space: nowrap; pointer-events: none;
            animation: fade-hint 1.5s forwards;
        }
        .ai-action-btn.linked::after { content: 'Link copied!'; }
        @keyframes fade-hint { 0%,60% { opacity: 1; } 100% { opacity: 0; } }

        #sourcesSection { display: none; margin: 0.7rem auto 0; max-width: 660px; padding: 0 1.5rem; }
        #sourcesSection.visible { display: block; }
        .section-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            color: var(--muted);
            margin-bottom: 0.3rem;
            display: flex; align-items: center; gap: 0.35rem;
        }
        .query-hint {
            font-size: 0.75rem; color: var(--cyan-dim);
            font-style: italic; opacity: 0.7;
            margin: 0 0 0.2rem; font-family: 'Raleway', sans-serif;
        }
        .score-info {
            cursor: help; color: rgba(var(--ink-rgb, 140, 184, 204), 0.6);
            font-size: 0.65rem; position: relative;
        }
        .score-info:hover .score-tooltip { display: block; }
        .score-tooltip {
            display: none; position: absolute; bottom: 1.5em; left: -5rem;
            width: 15rem; background: var(--sea-mid);
            border: 1px solid var(--border-hover); border-radius: 4px;
            padding: 0.5rem 0.65rem; font-size: 0.7rem;
            color: var(--text-primary); line-height: 1.4; z-index: 10;
            font-style: normal; letter-spacing: normal; text-transform: none;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }

        .result {
            background: rgba(var(--panel-rgb, 10, 22, 40), 0.3);
            border: 1px solid rgba(var(--cyan-dim-rgb, 77, 201, 246), 0.05);
            border-radius: 5px;
            padding: 0.55rem 0.75rem;
            margin-bottom: 0.3rem;
            transition: border-color 0.15s;
        }
        .result:hover { border-color: var(--border); }
        .result-row { display: flex; gap: 0.65rem; }
        .result-body { flex: 1; min-width: 0; }
        .result-thumb {
            width: 72px; height: 72px; border-radius: 4px;
            object-fit: cover; flex-shrink: 0;
            background: rgba(var(--panel-rgb, 10, 22, 40), 0.4);
            border: 1px solid rgba(var(--cyan-dim-rgb, 77, 201, 246), 0.06);
        }
        .result-header { display: flex; align-items: baseline; gap: 0.35rem; }
        .result-title {
            font-family: 'JetBrains Mono', monospace; font-weight: 400;
            color: var(--text-primary); font-size: 0.8rem; flex: 1;
        }
        .result-page {
            font-size: 0.55rem; padding: 0.08rem 0.3rem;
            border-radius: 2px; background: rgba(var(--cyan-dim-rgb, 77, 201, 246), 0.05);
            color: var(--muted); white-space: nowrap;
        }
        .result-content {
            color: var(--text-bright); font-size: 0.82rem;
            font-weight: 400;
            margin-top: 0.2rem; line-height: 1.55;
        }
        .result-bar { display: flex; align-items: center; gap: 0.3rem; margin-top: 0.2rem; }
        .result-bar .score-track { flex: 1; height: 2px; background: rgba(var(--panel-rgb, 10, 22, 40),0.4); border-radius: 1px; overflow: hidden; }
        .result-bar .score-fill { height: 100%; border-radius: 1px; background: linear-gradient(90deg, rgba(var(--cyan-dim-rgb, 77, 201, 246),0.1), rgba(var(--cyan-dim-rgb, 77, 201, 246),0.3)); }
        .result-bar .score-num { font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; color: var(--text-primary); min-width: 1.5rem; text-align: right; opacity: 0.7; }

        .show-more-btn {
            width: 100%; background: transparent;
            border: 1px dashed rgba(var(--cyan-dim-rgb, 77, 201, 246),0.08);
            border-radius: 4px; color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem; padding: 0.4rem; cursor: pointer;
            margin-top: 0.15rem; transition: all 0.15s;
        }
        .show-more-btn:hover { border-color: var(--border-hover); color: var(--text-heading); }

        @media (max-width: 500px) {
            body { padding: 1rem 0.8rem 2rem; }
            #searchInput { font-size: 1rem; padding: 0.65rem 2.5rem 0.65rem 0.8rem; }
            #aiAnswer { font-size: 0.92rem; padding: 0.65rem 0.8rem; padding-right: 3rem; }
            .ai-action-btn { opacity: 0.5; }
            .result-content { font-size: 0.8rem; }
            .engine-popover { min-width: 220px; right: -0.5rem; }
        }
    </style>
</head>
<body>

    <div id="cursorSpotlight"></div>

    <a href="#searchInput" class="skip-link">Skip to search</a>

    <nav id="nav" role="navigation" aria-label="Main navigation">
        <div class="nav-inner">
            <jh-nav current="search"></jh-nav>
            <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <main class="search-wrap">
        <div class="search-input-wrap">
            <input type="text" id="searchInput" placeholder="Search, ask, or command..." autofocus aria-label="Search, ask, or command">
            <button id="clearBtn" class="clear-btn" aria-label="Clear search">&times;</button>
        </div>
        <div class="tier-strip-row">
            <div class="pc-controls" id="pcControls"></div>
            <div class="tier-strip" id="tierStrip" role="group" aria-label="Search intelligence tiers"></div>
            <button class="engine-info-btn" id="engineInfoBtn" aria-label="Engine details" title="Engine details">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="engine-popover" id="enginePopover">
                <div class="engine-status-row">
                    <span id="aiDot" class="status-dot off"></span>
                    <span id="engineModelLabel" class="engine-model-label"></span>
                    <span id="engineSourceBadge" class="engine-source-badge none"></span>
                    <label id="aiToggleLabel" style="margin-left:auto;display:flex;align-items:center;gap:0.3rem;cursor:pointer;font-size:0.62rem;color:var(--text-primary);">
                        <input type="checkbox" id="aiToggle" checked style="accent-color:var(--engine-color,var(--cyan-dim));width:12px;height:12px;">
                        <span id="aiToggleText">on</span>
                    </label>
                </div>
                <div id="localModelSection" class="popover-section popover-section--compact" style="--section-color:var(--engine-lmstudio);">
                    <div class="popover-section-header">
                        <span class="popover-radio"></span>
                        <span class="popover-section-name" id="localModelName">Local model</span>
                        <span class="popover-section-badge badge-lmstudio" id="localModelSource"></span>
                        <button id="detectLocalBtn">Detect</button>
                    </div>
                    <div class="popover-section-detail" id="localModelDetail">LMStudio/Ollama · Detect asks your browser for local access</div>
                    <div class="local-picker" id="localPicker"></div>
                </div>
                <div id="browserModelSection" class="popover-section popover-section--compact" style="--section-color:var(--engine-browser);">
                    <div class="popover-section-header">
                        <span class="popover-radio"></span>
                        <span class="popover-section-name">Qwen 3.5</span>
                        <span class="popover-section-badge badge-webgpu" id="webgpuBadge"></span>
                        <button id="enableBtn">Load</button>
                    </div>
                    <div class="popover-section-detail" id="browserModelDetail">0.8B in-browser · WebGPU</div>
                    <div class="cache-hint" id="cacheHint"></div>
                    <div id="progress"></div>
                    <div id="progressBar"><div id="progressFill"></div></div>
                </div>
                <div id="customSection" class="popover-section popover-section--compact" style="--section-color:var(--engine-custom);">
                    <div class="popover-section-header">
                        <span class="popover-radio"></span>
                        <span class="popover-section-name">Custom endpoint</span>
                    </div>
                    <input type="text" class="custom-endpoint-input" id="customEndpoint"
                           placeholder="http://localhost:8080/v1" spellcheck="false" aria-label="Custom endpoint URL">
                </div>
            </div>
        </div>
    </div>

    <div class="ai-answer-wrap">
        <div id="aiAnswer"></div>
        <div class="ai-actions" id="aiActions">
            <button class="ai-action-btn" id="copyBtn" title="Copy answer" aria-label="Copy answer">

            </button>
            <button class="ai-action-btn" id="shareBtn" title="Copy link to this query" aria-label="Copy link to this query">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>

        <div id="searchResults" role="status" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/minisearch@7.1.1/dist/umd/index.min.js"></script>
    <script src="./scripts/search-core.js?v=1.83"></script>

    <script>
        // Shell only — the pipeline lives in scripts/search-core.js (shared
        // with the site-wide overlay). This page keeps just its own popover
        // behavior and the ?q= deep link.
        (async function () {
            const core = JHSearchCore.create({
                el: (name) => document.getElementById(name),
                root: document.documentElement,
                sectionsRoot: document.getElementById('enginePopover'),
                logTag: '[Search]',
                mutedColor: 'var(--muted)',
                updateHistory: true,
            });
            await core.init();
            window.JHSearch = core;   // public handle (debugging, future tool-use tier)

            // Visiting the search page is search intent, so engines are looked
            // at right away — but localhost still only with the remembered
            // opt-in, and the model weights only ever on Load (see core).
            core.checkEngines({ probeLocal: core.localOptedIn() });

            let popoverOpen = false;
            document.getElementById('engineInfoBtn').addEventListener('click', (e) => {
                e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
                popoverOpen = !popoverOpen;
                document.getElementById('enginePopover').classList.toggle('open', popoverOpen);
            });
            document.addEventListener('click', (e) => {
                if (!popoverOpen) return;
                const pop = document.getElementById('enginePopover');
                const btn = document.getElementById('engineInfoBtn');
                if (!pop.contains(e.target) && !btn.contains(e.target)) {
                    popoverOpen = false;
                    pop.classList.remove('open');
                }
            });

            const initialQuery = new URLSearchParams(window.location.search).get('q');
            if (initialQuery) {
                document.getElementById('searchInput').value = initialQuery;
                setTimeout(() => core.runQuery(initialQuery), 500);
            } else {
                core.doSearchOnly('');   // renders the try-these suggestion chips
            }
        })();
    </script>
